# 透网 LucidMesh 配置示例：复制为 config.toml 后修改，或运行 start 脚本通过向导生成
# 环境变量优先：LMESH_<分组>__<名称>，例如 LMESH_SERVER__PORT=9001

# ---- 界面 ----
[ui]
# 界面与 CLI 的默认语言；浏览器里可随时切换  可选：zh-CN / en / pt-BR
language = "zh-CN"
# 配置图、对比、检查与报告的默认显示风格（华为或 Cisco 的叫法与命令写法）；浏览器里可随时切换  可选：huawei / cisco
term_style = "huawei"

# ---- 网络 ----
[server]
# 监听地址：0.0.0.0 局域网可访问，127.0.0.1 只有本机能访问
host = "0.0.0.0"
# 监听端口
port = 9000

# ---- 数据 ----
[database]
# 数据库：留空使用 SQLite（data/lmesh.db）；PostgreSQL 写成 postgresql+psycopg://用户:密码@主机:5432/库名
url = ""

# ---- 数据 ----
[knowledge]
# 运行时知识库目录（首次启动从程序自带的 knowledge/ 复制）
dir = "data/knowledge"

# ---- 安全 ----
[security]
# 远程 API 令牌：请求头 Authorization: Bearer <令牌>；留空时向导自动生成
api_token = ""

# ---- 日志 ----
[log]
# 日志级别  可选：DEBUG / INFO / WARNING
level = "INFO"
# 日志保留天数
keep_days = 14

# ---- AI 接口（可选） ----
[ai]
# AI 接口类型；留空表示不使用 AI，核心功能照常可用  可选："" / anthropic / openai / local
provider = ""
# 接口地址；OpenAI 兼容接口或本地模型（如 http://127.0.0.1:11434/v1）需要填写
base_url = ""
# API Key，加密保存，不写入日志
api_key = ""
# 默认模型名称
model = ""
# 命令卡批量抽取用的模型（便宜快速）；留空用默认模型
model_extract = ""
# 语义归并与映射用的模型（能力更强）；留空用默认模型
model_merge = ""
# 超时（秒）
timeout = 60
# 单次最大 token
max_tokens = 4096
