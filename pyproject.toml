[project]
name = "lmesh"
version = "0.1.1"
description = "透网 LucidMesh：把多厂商路由器配置转换成统一配置图，在图上完成翻译、对比、模板校验与检查"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "pydantic>=2.7",
    "tomli-w>=1.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "networkx>=3.3",
    "ruamel.yaml>=0.18",
    "dulwich>=0.22",
    "cryptography>=42",
    "pdfplumber>=0.11",
    "ttp>=0.9",
]

[project.optional-dependencies]
ai = ["anthropic>=0.40", "openai>=1.40"]

[project.scripts]
lmesh = "lmesh.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-html>=4.1",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "resvg-py>=0.1",
    "pillow>=10.4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lmesh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: core 业务逻辑",
    "cli: 子进程执行 CLI",
    "api: 远程 API",
    "roundtrip: 样本往返回归",
    "docs: 文档与代码一致性",
    "live: 对运行中的实例执行",
    "pg: 需要 PostgreSQL",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# E501：长行由 ruff format 处理，多语言文案不强行折行；B008：FastAPI 的 Depends 写法
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"src/lmesh/core/store/migrations/versions/*" = ["W291"]

[tool.mypy]
python_version = "3.12"
packages = ["lmesh"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
