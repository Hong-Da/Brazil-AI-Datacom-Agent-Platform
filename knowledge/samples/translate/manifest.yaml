# 配置翻译与规范渲染回归（M3-3）：tests/roundtrip/test_translate.py 逐个运行。
#
# canonical：同平台族规范渲染等价——规范渲染 → 再解析 → 建图 → 与原图按有效值对比（含功能域外的原文行），0 差异，
#            且不新增未识别行；include_defaults（含默认值的完整配置）同样要求 0 差异。
#            样本 = samples/manifest.yaml 中 gate: true 的全部样本 + 下面 canonical 列出的样本。
# cases：翻译用例。每个用例：
#   - 译文用目标 Profile 解析，不能有未识别行；
#   - 与源图按有效值对比（跨厂商 + 接口映射），除告警、unsupported 列出的项之外没有差异（verify.unexplained = 0）；
#   - min_rendered：写出的节点 / 要写出的节点 的下限（生成能力退化时报错；知识库补了映射后可以调高，M3 收尾时已按补缺结果调高）；
#   - expect_warnings（可选）：这些告警种类至少出现一次。
# 路径相对本目录；interface_map 是接口映射表文件（{源接口: 目标接口}，子接口按父接口映射）。
canonical:
  - {file: atn-l3vpn-synth.cfg, profile: huawei-atn-v800r025}

cases:
  - id: atn-to-asr920
    src: ../huawei-atn-v800r023/atn-access-01.cfg
    src_profile: huawei-atn-v800r023
    dst_profile: cisco-iosxe-asr920-17.15
    interface_map: atn-to-asr920.ifmap.yaml
    min_rendered: 0.69
    note: 现网 ATN（严格脱敏）→ ASR 920；二层子接口换成父接口下的业务实例（M3 知识库补缺），未映射命令与功能域外原文列为 unsupported。M4-2 起 QoS / 时钟同步进入功能域，分母从 1889 增到 3035，其中华为特有的流行为、HQoS 流队列 / WRED、端口队列、1588 ACR 约 770 个节点在 Cisco 上没有对应结构（报不支持）；原有功能域写不出的节点约 146 个，与 M3 收尾（142）基本相同，没有退步
  - id: asr920-to-atn
    src: ../cisco-iosxe-asr920-synthetic/pe-asr920-01.cfg
    src_profile: cisco-iosxe-asr920-17.15
    dst_profile: huawei-atn-v800r025
    interface_map: asr920-to-atn.ifmap.yaml
    min_rendered: 0.95
    expect_warnings: [inferred_value]
    note: ASR 920 L3VPN PE → ATN；peer-group 的类型（internal）按 remote-as 推出并告警
  - id: atn-l3vpn-to-asr920
    src: atn-l3vpn-synth.cfg
    src_profile: huawei-atn-v800r025
    dst_profile: cisco-iosxe-asr920-17.15
    interface_map: {LoopBack0: Loopback0}
    min_rendered: 0.95
    note: 合成的 ATN L3VPN（接口、VPN 实例、静态路由、BGP、路由策略）
  - id: asr920-igp-mgmt-to-atn
    src: ../cisco-iosxe-asr920-synthetic/pe-asr920-02-igp-mgmt.cfg
    src_profile: cisco-iosxe-asr920-17.15
    dst_profile: huawei-atn-v800r025
    min_rendered: 0.75
    note: OSPF、IS-IS、BFD、管理面
  - id: atn-igp-mgmt-to-asr920
    src: ../huawei-atn-v800r025-synthetic/atn-igp-mgmt-01.cfg
    src_profile: huawei-atn-v800r025
    dst_profile: cisco-iosxe-asr920-17.15
    min_rendered: 0.75
    note: IS-IS、BFD 会话、OSPF、管理面
  - id: asr920-mpls-l2vpn-acl-to-atn
    src: ../cisco-iosxe-asr920-synthetic/pe-asr920-03-mpls-l2vpn-acl.cfg
    src_profile: cisco-iosxe-asr920-17.15
    dst_profile: huawei-atn-v800r025
    min_rendered: 0.85
    note: MPLS / L2VPN / ACL（M3 新功能域；生成知识随命令卡与映射自动得到）
  - id: atn-mpls-l2vpn-acl-to-asr920
    src: ../huawei-atn-v800r025-synthetic/atn-mpls-l2vpn-acl-01.cfg
    src_profile: huawei-atn-v800r025
    dst_profile: cisco-iosxe-asr920-17.15
    min_rendered: 0.8
    note: MPLS / L2VPN / ACL
  - id: batfish-core-to-atn
    src: ../cisco-ios-public/batfish_example_as2core1.txt
    src_profile: cisco-iosxe-asr920-17.15
    dst_profile: huawei-atn-v800r025
    min_rendered: 0.9
    note: 公开的 IOS 配置（OSPF、BGP、路由策略）
  - id: atn-advanced-to-asr920
    src: ../huawei-atn-v800r025-synthetic/atn-advanced-01.cfg
    src_profile: huawei-atn-v800r025
    dst_profile: cisco-iosxe-asr920-17.15
    min_rendered: 0.5
    note: VRRP / SR-MPLS / EVPN / QoS / 时钟同步 / 管理面补充（M4-2）；华为流行为、HQoS 队列与 WRED、端口队列、接口 PTP 在 Cisco 上结构不同，报不支持（122 / 222）
  - id: asr920-advanced-to-atn
    src: ../cisco-iosxe-asr920-synthetic/pe-asr920-04-advanced.cfg
    src_profile: cisco-iosxe-asr920-17.15
    dst_profile: huawei-atn-v800r025
    min_rendered: 0.6
    note: VRRP / SR-MPLS / EVPN / QoS / 时钟同步 / 管理面补充（M4-2）；policy-map 下的动作、connected-prefix-sid-map、PTP clock-port 在华为上结构不同，报不支持（107 / 170）
  # ---------- Nokia 7750 SR（SR OS 25.10 Classic CLI，M7-3）----------
  # 三层接口换结构（render 的 l3_form：Nokia 的路由器逻辑接口 + port ↔ 华为 / Cisco 的端口 / 子接口）；OSPF network 宣告换成接口所在区域；
  # IS-IS 的 area-id（+ system-id，不写时按 Router ID 推出）↔ NET；协议基本实例 0 ↔ 进程 1（render 的 instance_keys）；
  # Nokia 缺省关闭的协议实例、NTP、端口在译文里显式写 no shutdown（Profile 的 assume / 缺省值差异，告警 default_differs）。
  - id: nokia-basic-to-atn
    src: ../nokia-sros-classic-synthetic/classic-pe-basic.cfg
    src_profile: nokia-sros-classic-7750-25.10
    dst_profile: huawei-atn-v800r025
    interface_map: nokia-to-atn.ifmap.yaml
    min_rendered: 0.78
    expect_warnings: [default_differs]
    note: Nokia 端口、LAG、路由器接口（并到端口 / Eth-Trunk）、VRRP、静态路由、OSPF、LDP → ATN（81 / 103）；端口模式与封装、静态路由的 indirect / bfd-enable、syslog 编号与级别等 Nokia 特有节点报不支持
  - id: nokia-routing-mgmt-to-atn
    src: ../nokia-sros-classic-synthetic/classic-pe-routing-mgmt.cfg
    src_profile: nokia-sros-classic-7750-25.10
    dst_profile: huawei-atn-v800r025
    interface_map: nokia-to-atn.ifmap.yaml
    min_rendered: 0.74
    note: 管理面、OSPF（export 策略）、IS-IS（area-id 拼成 NET）、BGP 组与 family（换成地址族视图与 peer enable，M7-5）、路由策略（default-action、from protocol）、MPLS / LDP、SR → ATN（97 / 131）；RSVP-TE 与 Nokia 特有节点报不支持
  - id: nokia-services-to-atn
    src: ../nokia-sros-classic-synthetic/classic-pe-services.cfg
    src_profile: nokia-sros-classic-7750-25.10
    dst_profile: huawei-atn-v800r025
    interface_map: nokia-to-atn.ifmap.yaml
    min_rendered: 0.54
    note: 过滤器、VPRN（VPN 实例、接口 SAP 换成子接口）、VPLS（SAP 换成二层子接口）→ ATN（85 / 155）；客户、SDP、Epipe 的伪线（对端取 SDP）、IES、SAP 的 QoS 策略在华为上没有对应结构，报不支持
  - id: asr920-to-nokia
    src: ../cisco-iosxe-asr920-synthetic/pe-asr920-01.cfg
    src_profile: cisco-iosxe-asr920-17.15
    dst_profile: nokia-sros-classic-7750-25.10
    interface_map: asr920-to-nokia.ifmap.yaml
    min_rendered: 0.70
    expect_warnings: [inferred_value]
    note: ASR 920 L3VPN PE → Nokia（93 / 131）：三层口换成路由器接口 "if-<源接口名>" + port，VRF 换成 VPRN（业务编号按顺序推出、客户 1，告警 inferred_value），channel-group 写成 lag 下的 port；BGP 地址族、业务实例（EFP）、BDI 的桥域、prefix-list 的 ge 在 Nokia 上结构不同，报不支持
  - id: asr920-igp-mgmt-to-nokia
    src: ../cisco-iosxe-asr920-synthetic/pe-asr920-02-igp-mgmt.cfg
    src_profile: cisco-iosxe-asr920-17.15
    dst_profile: nokia-sros-classic-7750-25.10
    interface_map: asr920-to-nokia.ifmap.yaml
    min_rendered: 0.51
    note: OSPF（network 宣告换成区域下的接口）、IS-IS、BFD、管理面 → Nokia（66 / 128）；IS-IS 区域标签（CORE）不是 Nokia 的实例编号、AAA 方法列表、登录线路、TACACS+ 服务器名、SSH 参数在 Nokia 上没有对应写法，报不支持
  # ---------- Nokia 7750 SR MD-CLI（SR OS 25.10，M7-4）----------
  # 同一设备的两种配置格式映射到同一套 Schema：MD-CLI ↔ Classic 几乎全部写出（只差 Classic 没有映射的过滤器名称、
  # MD-CLI 拆成布尔叶子的 BGP 地址族）；对 ATN / ASR 920 的翻译与 Classic 的用例写出比例相当
  - id: nokia-md-services-to-classic
    src: ../nokia-sros-md-synthetic/md-pe-services.cfg
    src_profile: nokia-sros-md-7750-25.10
    dst_profile: nokia-sros-classic-7750-25.10
    min_rendered: 0.99
    note: MD-CLI → Classic（150 / 151）：过滤器、QoS 策略、客户（按名称引用换成编号）、SDP、Epipe（sap 同时建立接入电路）、VPLS、VPRN、IES；Classic 不记过滤器名称（acl.instance.filter_name）
  - id: nokia-md-flat-to-classic
    src: ../nokia-sros-md-synthetic/md-pe-basic-flat.cfg
    src_profile: nokia-sros-md-7750-25.10
    dst_profile: nokia-sros-classic-7750-25.10
    min_rendered: 0.99
    note: MD-CLI info flat 格式 → Classic（103 / 103）：扁平格式建出的图与花括号格式相同
  - id: nokia-classic-routing-mgmt-to-md
    src: ../nokia-sros-classic-synthetic/classic-pe-routing-mgmt.cfg
    src_profile: nokia-sros-classic-7750-25.10
    dst_profile: nokia-sros-md-7750-25.10
    min_rendered: 0.94
    note: Classic → MD-CLI（118 / 125）：管理面、OSPF、IS-IS、BGP、路由策略、MPLS / LDP、SR；BGP family 与用户 access 在 MD-CLI 是逐个布尔叶子，暂不归并，报不支持
  - id: nokia-md-routing-mgmt-to-atn
    src: ../nokia-sros-md-synthetic/md-pe-routing-mgmt.cfg
    src_profile: nokia-sros-md-7750-25.10
    dst_profile: huawei-atn-v800r025
    interface_map: nokia-to-atn.ifmap.yaml
    min_rendered: 0.75
    note: MD-CLI → ATN（91 / 121；MD-CLI 的 BGP family 是逐个布尔叶子、未归并，不换成地址族视图，比 Classic 版少写出 6 个节点）
  - id: nokia-md-services-to-atn
    src: ../nokia-sros-md-synthetic/md-pe-services.cfg
    src_profile: nokia-sros-md-7750-25.10
    dst_profile: huawei-atn-v800r025
    interface_map: nokia-to-atn.ifmap.yaml
    min_rendered: 0.53
    note: MD-CLI → ATN（82 / 152）：VPRN、VPLS、过滤器写出；客户、SDP、Epipe 伪线、IES、SAP 的 QoS 策略在华为上没有对应结构，报不支持
  - id: asr920-to-nokia-md
    src: ../cisco-iosxe-asr920-synthetic/pe-asr920-01.cfg
    src_profile: cisco-iosxe-asr920-17.15
    dst_profile: nokia-sros-md-7750-25.10
    interface_map: asr920-to-nokia.ifmap.yaml
    min_rendered: 0.68
    expect_warnings: [inferred_value]
    note: ASR 920 L3VPN PE → MD-CLI（90 / 131）：三层口换成路由器接口 + port、VRF 换成 VPRN（业务编号推出、客户 1）；BGP 地址族、业务实例、桥域报不支持
