# 配置翻译与规范渲染回归（M3-3）：tests/roundtrip/test_translate.py 逐个运行。
#
# canonical：同平台族规范渲染等价——规范渲染 → 再解析 → 建图 → 与原图按有效值对比（含功能域外的原文行），0 差异，
#            且不新增未识别行；include_defaults（含默认值的完整配置）同样要求 0 差异。
#            样本 = samples/manifest.yaml 中 gate: true 的全部样本 + 下面 canonical 列出的样本。
# cases：翻译用例。每个用例：
#   - 译文用目标 Profile 解析，不能有未识别行；
#   - 与源图按有效值对比（跨厂商 + 接口映射），除告警、unsupported 列出的项之外没有差异（verify.unexplained = 0）；
#   - min_rendered：写出的节点 / 要写出的节点 的下限（生成能力退化时报错；知识库补了映射后可以调高，M3 收尾时已按补缺结果调高）；
#   - expect_warnings（可选）：这些告警种类至少出现一次。
# 路径相对本目录；interface_map 是接口映射表文件（{源接口: 目标接口}，子接口按父接口映射）。
canonical:
  - {file: atn-l3vpn-synth.cfg, profile: huawei-atn-v800r025}

cases:
  - id: atn-to-asr920
    src: ../huawei-atn-v800r023/atn-access-01.cfg
    src_profile: huawei-atn-v800r023
    dst_profile: cisco-iosxe-asr920-17.15
    interface_map: atn-to-asr920.ifmap.yaml
    min_rendered: 0.9
    note: 现网 ATN（严格脱敏）→ ASR 920；二层子接口换成父接口下的业务实例（M3 知识库补缺），未映射命令与功能域外原文列为 unsupported
  - id: asr920-to-atn
    src: ../cisco-iosxe-asr920-synthetic/pe-asr920-01.cfg
    src_profile: cisco-iosxe-asr920-17.15
    dst_profile: huawei-atn-v800r025
    interface_map: asr920-to-atn.ifmap.yaml
    min_rendered: 0.95
    expect_warnings: [inferred_value]
    note: ASR 920 L3VPN PE → ATN；peer-group 的类型（internal）按 remote-as 推出并告警
  - id: atn-l3vpn-to-asr920
    src: atn-l3vpn-synth.cfg
    src_profile: huawei-atn-v800r025
    dst_profile: cisco-iosxe-asr920-17.15
    interface_map: {LoopBack0: Loopback0}
    min_rendered: 0.95
    note: 合成的 ATN L3VPN（接口、VPN 实例、静态路由、BGP、路由策略）
  - id: asr920-igp-mgmt-to-atn
    src: ../cisco-iosxe-asr920-synthetic/pe-asr920-02-igp-mgmt.cfg
    src_profile: cisco-iosxe-asr920-17.15
    dst_profile: huawei-atn-v800r025
    min_rendered: 0.75
    note: OSPF、IS-IS、BFD、管理面
  - id: atn-igp-mgmt-to-asr920
    src: ../huawei-atn-v800r025-synthetic/atn-igp-mgmt-01.cfg
    src_profile: huawei-atn-v800r025
    dst_profile: cisco-iosxe-asr920-17.15
    min_rendered: 0.75
    note: IS-IS、BFD 会话、OSPF、管理面
  - id: asr920-mpls-l2vpn-acl-to-atn
    src: ../cisco-iosxe-asr920-synthetic/pe-asr920-03-mpls-l2vpn-acl.cfg
    src_profile: cisco-iosxe-asr920-17.15
    dst_profile: huawei-atn-v800r025
    min_rendered: 0.85
    note: MPLS / L2VPN / ACL（M3 新功能域；生成知识随命令卡与映射自动得到）
  - id: atn-mpls-l2vpn-acl-to-asr920
    src: ../huawei-atn-v800r025-synthetic/atn-mpls-l2vpn-acl-01.cfg
    src_profile: huawei-atn-v800r025
    dst_profile: cisco-iosxe-asr920-17.15
    min_rendered: 0.8
    note: MPLS / L2VPN / ACL
  - id: batfish-core-to-atn
    src: ../cisco-ios-public/batfish_example_as2core1.txt
    src_profile: cisco-iosxe-asr920-17.15
    dst_profile: huawei-atn-v800r025
    min_rendered: 0.9
    note: 公开的 IOS 配置（OSPF、BGP、路由策略）
