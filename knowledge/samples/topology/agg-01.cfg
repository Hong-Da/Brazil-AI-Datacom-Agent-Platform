!
! 合成样本（透网 LucidMesh 0.4.0 拓扑还原与跨设备一致性）：汇聚 ASR 920，地址与名称均为虚构
!
version 17.15
!
hostname TOPO-AGG-01
!
mpls label protocol ldp
mpls ldp router-id Loopback0 force
mpls ldp neighbor 10.255.1.11 targeted ldp
!
interface Loopback0
 ip address 10.255.1.21 255.255.255.255
 ip router isis CORE
!
interface GigabitEthernet0/0/1
 description to-TOPO-ATN-A1
 mtu 9216
 ip address 10.10.11.2 255.255.255.252
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 mpls ip
!
interface GigabitEthernet0/0/2
 description to-TOPO-AGG-02
 mtu 9216
 ip address 10.20.12.1 255.255.255.252
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2-only
 mpls ip
 bfd interval 100 min_rx 100 multiplier 3
!
interface GigabitEthernet0/0/3
 description to-TOPO-RR-01
 mtu 9216
 ip address 10.20.1.1 255.255.255.252
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2-only
 mpls ip
!
interface GigabitEthernet0/0/5
 description vpws-to-atn-a1
 no ip address
 service instance 100 ethernet
  encapsulation dot1q 100
  rewrite ingress tag pop 1 symmetric
  xconnect 10.255.1.11 1100 encapsulation mpls
!
router ospf 10
 router-id 10.255.1.21
 network 10.10.11.0 0.0.0.3 area 10
!
router isis CORE
 net 49.0001.0102.5500.1021.00
 is-type level-2-only
 metric-style wide
 passive-interface Loopback0
!
router bgp 64512
 bgp router-id 10.255.1.21
 bgp log-neighbor-changes
 neighbor 10.255.1.1 remote-as 64512
 neighbor 10.255.1.1 update-source Loopback0
 !
 address-family ipv4
  neighbor 10.255.1.1 activate
 exit-address-family
 !
 address-family vpnv4
  neighbor 10.255.1.1 activate
  neighbor 10.255.1.1 send-community extended
 exit-address-family
!
end
