!
! 合成样本（透网 LucidMesh 0.4.0 拓扑还原与跨设备一致性）：路由反射器 ASR 920，地址与名称均为虚构
!
version 17.15
!
hostname TOPO-RR-01
!
mpls label protocol ldp
mpls ldp router-id Loopback0 force
!
interface Loopback0
 ip address 10.255.1.1 255.255.255.255
 ip router isis CORE
!
interface GigabitEthernet0/0/1
 description to-TOPO-AGG-01
 mtu 9216
 ip address 10.20.1.2 255.255.255.252
 ip router isis CORE
 isis circuit-type level-2-only
 mpls ip
!
interface GigabitEthernet0/0/2
 description to-TOPO-AGG-02
 mtu 9216
 ip address 10.20.2.2 255.255.255.248
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2-only
 mpls ip
!
router isis CORE
 net 49.0001.0102.5500.1001.00
 is-type level-2-only
 metric-style wide
 passive-interface Loopback0
!
router bgp 64512
 bgp router-id 10.255.1.1
 bgp log-neighbor-changes
 neighbor 10.255.1.11 remote-as 64512
 neighbor 10.255.1.11 update-source Loopback0
 neighbor 10.255.1.12 remote-as 64512
 neighbor 10.255.1.12 update-source Loopback0
 neighbor 10.255.1.21 remote-as 64512
 neighbor 10.255.1.21 update-source Loopback0
 neighbor 10.255.1.21 password LMESH-SECRET-EXAMPLE
 neighbor 10.255.1.22 remote-as 64512
 neighbor 10.255.1.22 update-source Loopback0
 !
 address-family ipv4
  neighbor 10.255.1.11 activate
  neighbor 10.255.1.11 route-reflector-client
  neighbor 10.255.1.12 activate
  neighbor 10.255.1.12 route-reflector-client
  neighbor 10.255.1.21 activate
  neighbor 10.255.1.21 route-reflector-client
  neighbor 10.255.1.22 activate
  neighbor 10.255.1.22 route-reflector-client
 exit-address-family
 !
 address-family vpnv4
  neighbor 10.255.1.11 activate
  neighbor 10.255.1.11 send-community extended
  neighbor 10.255.1.11 route-reflector-client
  neighbor 10.255.1.12 activate
  neighbor 10.255.1.12 send-community extended
  neighbor 10.255.1.12 route-reflector-client
  neighbor 10.255.1.21 activate
  neighbor 10.255.1.21 send-community extended
  neighbor 10.255.1.21 route-reflector-client
  neighbor 10.255.1.22 activate
  neighbor 10.255.1.22 send-community extended
  neighbor 10.255.1.22 route-reflector-client
 exit-address-family
!
end
