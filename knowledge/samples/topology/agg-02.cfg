!
! 合成样本（透网 LucidMesh 0.4.0 拓扑还原与跨设备一致性）：汇聚 ASR 920，地址与名称均为虚构
!
version 17.15
!
hostname TOPO-AGG-02
!
mpls label protocol ldp
mpls ldp router-id Loopback0 force
!
interface Loopback0
 ip address 10.255.1.22 255.255.255.255
 ip router isis CORE
!
interface GigabitEthernet0/0/1
 description to-TOPO-ATN-A2
 ip address 10.10.22.2 255.255.255.252
 ip ospf network point-to-point
 mpls ip
!
interface GigabitEthernet0/0/2
 description to-TOPO-AGG-01
 mtu 9216
 ip address 10.20.12.2 255.255.255.252
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2-only
 bfd interval 50 min_rx 50 multiplier 3
!
interface GigabitEthernet0/0/3
 description to-TOPO-RR-01
 mtu 9216
 ip address 10.20.2.1 255.255.255.252
 ip router isis CORE
 isis network point-to-point
 isis circuit-type level-2-only
 mpls ip
!
interface GigabitEthernet0/0/5
 description vpws-to-atn-a2
 no ip address
 service instance 200 ethernet
  encapsulation dot1q 200
  rewrite ingress tag pop 1 symmetric
  xconnect 10.255.1.12 1201 encapsulation mpls
!
router ospf 10
 router-id 10.255.1.22
 network 10.10.22.0 0.0.0.3 area 20
!
router isis CORE
 net 49.0001.0102.5500.1022.00
 is-type level-2-only
 metric-style wide
 passive-interface Loopback0
!
router bgp 64512
 bgp router-id 10.255.1.22
 bgp log-neighbor-changes
 neighbor 10.255.1.1 remote-as 64512
 neighbor 10.255.1.1 update-source Loopback0
 !
 address-family ipv4
  neighbor 10.255.1.1 activate
 exit-address-family
!
end
