!
! 合成样本（透网 LucidMesh M4-3 增量变更回归的目标配置：删除邻居 10.255.0.2（BGP 视图与各地址族））：按 ASR 920 IOS-XE 17.15 的常见写法编写，地址与名称均为虚构，不是现网配置
!
version 17.15
!
hostname PE-CHANGE-01
!
vrf definition MGMT
 rd 64512:10
 !
 address-family ipv4
  route-target export 64512:10
  route-target import 64512:10
 exit-address-family
!
vrf definition RAN-2G
 rd 64512:101
 !
 address-family ipv4
  route-target export 64512:101
  route-target import 64512:101
 exit-address-family
!
interface Loopback0
 ip address 10.255.0.21 255.255.255.255
!
interface GigabitEthernet0/0/0
 description UPLINK-TO-AGG-01
 mtu 9216
 ip address 10.1.0.2 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 100
 negotiation auto
!
interface GigabitEthernet0/0/2
 description OAM-LINK
 ip address 10.3.0.2 255.255.255.252
 negotiation auto
!
interface BDI101
 description RAN-2G-SITE-001
 vrf forwarding RAN-2G
 ip address 172.16.101.1 255.255.255.0
!
router ospf 10
 router-id 10.255.0.21
 auto-cost reference-bandwidth 100000
 network 10.1.0.0 0.0.0.3 area 0
 network 10.255.0.21 0.0.0.0 area 0
!
router bgp 64512
 bgp router-id 10.255.0.21
 bgp log-neighbor-changes
 neighbor RR peer-group
 neighbor RR remote-as 64512
 neighbor RR update-source Loopback0
 neighbor 10.255.0.1 peer-group RR
 !
 address-family ipv4
  neighbor RR send-community
  neighbor RR next-hop-self
  neighbor RR route-map EXPORT-LOOPBACK out
  neighbor 10.255.0.1 activate
 exit-address-family
 !
 address-family vpnv4
  neighbor RR send-community extended
  neighbor 10.255.0.1 activate
 exit-address-family
 !
 address-family ipv4 vrf RAN-2G
  redistribute connected
  redistribute static
 exit-address-family
!
ip prefix-list LOOPBACKS seq 10 permit 10.255.0.0/16 ge 32
ip community-list standard RAN-COMM permit 64512:100
!
ip access-list extended INFRA-IN
 10 permit tcp 10.90.0.0 0.0.0.255 host 10.255.0.21 eq 22
 20 permit udp any any eq 646
 30 permit ip 10.91.0.0 0.0.0.255 any
!
route-map EXPORT-LOOPBACK permit 10
 match ip address prefix-list LOOPBACKS
 set community 64512:100 additive
!
route-map EXPORT-LOOPBACK deny 20
!
route-map IMPORT-RAN permit 10
 match community RAN-COMM
 set local-preference 200
!
ip route vrf RAN-2G 172.20.0.0 255.255.0.0 172.16.101.10
ip route 0.0.0.0 0.0.0.0 10.1.0.1
!
end
