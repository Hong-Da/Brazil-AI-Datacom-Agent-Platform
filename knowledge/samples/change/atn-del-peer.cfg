!Software Version V800R025C00SPC500
!合成样本（透网 LucidMesh M4-3 增量变更回归的目标配置：删除对等体 10.255.0.102（BGP 视图与各地址族））：按 ATN V800R025 的常见写法编写，地址与名称均为虚构，不是现网配置
#
sysname ATN-CHANGE-01
#
ip vpn-instance RAN
 ipv4-family
  route-distinguisher 65000:100
  vpn-target 65000:100 export-extcommunity
  vpn-target 65000:100 import-extcommunity
#
ip vpn-instance OAM
 ipv4-family
  route-distinguisher 65000:200
  vpn-target 65000:200 export-extcommunity
  vpn-target 65000:200 import-extcommunity
#
acl number 3001
 rule 5 permit tcp source 10.90.0.0 0.0.0.255 destination 10.255.0.1 0 destination-port eq 22
 rule 10 permit ip source 10.91.0.0 0.0.0.255 destination any
 rule 20 deny ip
#
interface GigabitEthernet0/2/0
 description UPLINK-TO-AGG
 mtu 9000
 ip address 10.1.0.1 255.255.255.252
 ospf network-type p2p
 ospf cost 100
#
interface GigabitEthernet0/2/1
 undo shutdown
 description RAN-SITE
#
interface GigabitEthernet0/2/1.101
 vlan-type dot1q 101
 ip binding vpn-instance RAN
 ip address 172.16.1.1 255.255.255.0
#
interface GigabitEthernet0/2/2
 description OAM-LINK
 ip address 10.3.0.1 255.255.255.252
#
interface LoopBack0
 ip address 10.255.0.1 255.255.255.255
#
ip ip-prefix LOOPBACKS index 10 permit 10.255.0.0 16 greater-equal 32 less-equal 32
#
ip community-filter advanced RAN-COMM index 10 permit 65000:100
#
route-policy EXPORT-LOOPBACK permit node 10
 if-match ip-prefix LOOPBACKS
 apply community 65000:100 additive
#
route-policy EXPORT-LOOPBACK deny node 20
#
route-policy IMPORT-RAN permit node 10
 if-match community-filter RAN-COMM
 apply local-preference 200
#
ospf 1 router-id 10.255.0.1
 bandwidth-reference 100000
 area 0.0.0.0
  network 10.1.0.0 0.0.0.3
  network 10.255.0.1 0.0.0.0
#
bgp 65000
 router-id 10.255.0.1
 group RR internal
 peer RR as-number 65000
 peer RR connect-interface LoopBack0
 peer 10.255.0.101 as-number 65000
 peer 10.255.0.101 group RR
 #
 ipv4-family unicast
  network 10.255.0.1 255.255.255.255
  peer RR enable
  peer RR route-policy EXPORT-LOOPBACK export
  peer RR next-hop-local
  peer RR advertise-community
  peer 10.255.0.101 enable
 #
 ipv4-family vpnv4
  peer RR enable
  peer RR route-policy IMPORT-RAN import
  peer 10.255.0.101 enable
 #
 ipv4-family vpn-instance RAN
  import-route direct
  import-route static
#
ip route-static 0.0.0.0 0.0.0.0 10.1.0.2
ip route-static vpn-instance RAN 172.20.0.0 255.255.0.0 172.16.1.10 preference 70 tag 100
#
return
