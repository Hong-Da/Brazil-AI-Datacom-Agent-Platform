!
! 合成样本（透网 LucidMesh 0.2.0）：ASR 920 上的 OSPF、IS-IS、BFD 与管理面，地址与名称均为虚构
!
version 17.15
service timestamps debug datetime msec
service timestamps log datetime msec localtime show-timezone
!
hostname PE-ASR920-02
!
vrf definition Mgmt-intf
 !
 address-family ipv4
 exit-address-family
!
logging buffered 64000 informational
logging console warnings
!
aaa new-model
aaa authentication login default group tacacs+ local
aaa authentication login CONSOLE local
aaa authorization exec default group tacacs+ local
aaa accounting exec default start-stop group tacacs+
aaa session-id common
!
clock timezone BRT -3 0
!
username netops privilege 15 secret 9 $9$EXAMPLEHASHONLY$abcdefghijklmnopqrstuvwxyz
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip ssh source-interface Loopback0
!
bfd-template single-hop BFD-100MS
!
interface Loopback0
 description Router-ID
 ip address 10.255.0.2 255.255.255.255
 ip router isis CORE
!
interface GigabitEthernet0/0/1
 description to-PE-ASR920-01
 mtu 9216
 ip address 10.1.12.2 255.255.255.252
 ip ospf network point-to-point
 ip ospf cost 100
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf bfd
 ip router isis CORE
 isis network point-to-point
 isis metric 100
 isis circuit-type level-2-only
 bfd interval 100 min_rx 100 multiplier 3
!
interface GigabitEthernet0/0/2
 description to-AGG-01
 ip address 10.1.23.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 7 0822455D0A16
 ip ospf priority 0
!
router ospf 10
 router-id 10.255.0.2
 auto-cost reference-bandwidth 100000
 log-adjacency-changes detail
 bfd all-interfaces
 passive-interface default
 no passive-interface GigabitEthernet0/0/1
 no passive-interface GigabitEthernet0/0/2
 area 10 stub
 network 10.1.12.0 0.0.0.3 area 0
 network 10.1.23.0 0.0.0.3 area 10
 network 10.255.0.2 0.0.0.0 area 0
 default-information originate always
!
router isis CORE
 net 49.0001.0102.5500.0002.00
 is-type level-2-only
 metric-style wide
 log-adjacency-changes all
 passive-interface Loopback0
 bfd all-interfaces
!
ip tacacs source-interface Loopback0 vrf Mgmt-intf
!
logging trap notifications
logging source-interface Loopback0
logging host 10.90.0.10
logging host 10.90.0.11 vrf Mgmt-intf
!
snmp-server community LMESH-RO-EXAMPLE RO 90
snmp-server location DC-EXAMPLE-RACK-12
snmp-server contact noc@example.net
snmp-server trap-source Loopback0
snmp-server enable traps snmp linkdown linkup
snmp-server host 10.90.0.20 version 2c LMESH-RO-EXAMPLE
!
tacacs server TAC-1
 address ipv6 2001:db8::10
 key 7 0822455D0A16
!
ntp authentication-key 1 md5 0822455D0A16 7
ntp authenticate
ntp trusted-key 1
ntp source Loopback0
ntp server 10.90.0.1 key 1 prefer
ntp server 10.90.0.2 key 1
ntp update-calendar
!
line con 0
 exec-timeout 15 0
 logging synchronous
 login authentication CONSOLE
line vty 0 4
 access-class 90 in
 exec-timeout 10 0
 privilege level 15
 transport input ssh
line vty 5 15
 access-class 90 in
 transport input none
!
end
