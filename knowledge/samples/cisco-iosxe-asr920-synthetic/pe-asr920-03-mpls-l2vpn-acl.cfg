!
! 合成样本：按 ASR 920 IOS-XE 17.15 的常见写法编写，用于往返测试（MPLS LDP、L3VPN、VPWS / VPLS、ACL，0.3.0），不是现网配置
!
version 17.15
!
hostname PE-ASR920-03
!
vrf definition RAN
 rd 64512:100
 !
 address-family ipv4
  route-target export 64512:100
  route-target import 64512:100
  import map RAN-IMPORT
  maximum routes 2000 80
 exit-address-family
!
mpls label protocol ldp
mpls label mode vrf RAN protocol bgp-vpnv4 per-vrf
mpls ldp router-id Loopback0 force
mpls ldp graceful-restart
mpls ldp session protection
mpls ldp discovery targeted-hello accept
mpls ldp igp sync holddown 10000
mpls ldp neighbor 10.255.0.1 password LMESH-SECRET-9C8B7A
mpls ldp neighbor 10.255.0.1 targeted ldp
mpls ldp logging neighbor-changes
!
l2vpn
!
pseudowire-class PW-CW
 encapsulation mpls
 control-word
!
l2vpn vfi context VPLS-BIZ
 vpn id 3001
 member 10.255.0.1 encapsulation mpls
 member 10.255.0.2 3001 template PW-CW
!
l2vpn xconnect context XC-SITE-B
 member GigabitEthernet0/0/6 service-instance 400
 member 10.255.0.2 1400 encapsulation mpls
!
bridge-domain 300
 member vfi VPLS-BIZ
 member GigabitEthernet0/0/7 service-instance 300
!
interface Loopback0
 ip address 10.255.0.23 255.255.255.255
!
interface GigabitEthernet0/0/0
 description UPLINK-TO-AGG-01
 mtu 9216
 ip address 10.3.13.2 255.255.255.252
 ip access-group INFRA-IN in
 mpls ip
 mpls mtu 9100
 mpls ldp discovery transport-address interface
 mpls ldp igp sync delay 5
!
interface GigabitEthernet0/0/1
 no ip address
!
interface GigabitEthernet0/0/1.10
 encapsulation dot1Q 10
 vrf forwarding RAN
 ip address 10.110.0.1 255.255.255.252
!
interface GigabitEthernet0/0/5
 description VPWS-SITE-A
 no ip address
 service instance 100 ethernet
  encapsulation dot1q 100
  rewrite ingress tag pop 1 symmetric
  xconnect 10.255.0.1 1100 encapsulation mpls
   backup peer 10.255.0.2 1100
 !
 service instance 200 ethernet
  encapsulation dot1q 200
  rewrite ingress tag pop 1 symmetric
  xconnect 10.255.0.1 1200 pw-class PW-CW
!
interface GigabitEthernet0/0/6
 no ip address
 service instance 400 ethernet
  encapsulation dot1q 400
!
interface GigabitEthernet0/0/7
 no ip address
 service instance 300 ethernet
  encapsulation dot1q 300
  rewrite ingress tag pop 1 symmetric
!
ip access-list standard VTY-IN
 10 permit 10.90.0.0 0.0.255.255
 20 deny   any
ip access-list extended INFRA-IN
 10 permit tcp 10.90.0.0 0.0.0.255 host 10.255.0.23 eq 22
 20 permit udp any any eq 646
 30 permit ip 10.91.0.0 0.0.0.255 any
 40 remark drop-the-rest
 50 deny   ip any any log
ip access-list extended RAN-PREFIX
 10 permit ip 10.100.0.0 0.0.255.255 any
ip access-list extended UNUSED-ACL
 10 permit ip 192.0.2.0 0.0.0.255 any
!
access-list 10 permit 10.90.0.0 0.0.0.255
access-list 10 permit host 10.90.1.10
access-list 10 deny   any
access-list 110 remark legacy-numbered-extended
access-list 110 permit icmp any any echo
access-list 110 deny   tcp any any eq telnet
!
route-map RAN-IMPORT permit 10
 match ip address RAN-PREFIX
!
snmp-server community LMESH-RO-EXAMPLE RO 10
!
line vty 0 4
 access-class VTY-IN in
 transport input ssh
!
end
