!
! 合成样本：按 ASR 920 IOS-XE 17.15 的常见写法编写，用于往返测试（VRRP、SR-MPLS、EVPN、QoS、时钟同步与管理面补充，0.4.0），不是现网配置
!
version 17.15
!
hostname PE-ASR920-04
!
aaa new-model
aaa authentication login default group radius local
!
fhrp version vrrp v3
!
network-clock synchronization automatic
network-clock synchronization mode QL-enabled
network-clock input-source 1 interface GigabitEthernet0/0/1
network-clock input-source 2 ptp domain 24
network-clock wait-to-restore 300 global
esmc process
!
ip ssh version 2
ip ssh server algorithm encryption aes256-gcm aes128-gcm aes256-ctr aes128-cbc
ip ssh server algorithm mac hmac-sha2-512 hmac-sha2-256 hmac-sha1
ip ssh server algorithm kex ecdh-sha2-nistp256 diffie-hellman-group14-sha1
!
radius server RAD-NMS
 address ipv4 10.10.0.21 auth-port 1812 acct-port 1813
 key 7 0822455D0A16
!
snmp-server group NMS v3 priv access 10
snmp-server group LEGACY v3 auth
!
track 1 interface GigabitEthernet0/0/1 line-protocol
!
l2vpn evpn
 replication-type ingress
 router-id Loopback0
!
l2vpn evpn instance 10 vlan-based
 route-distinguisher 10.255.0.9:10
 route-target both 65000:10
 no auto-route-target
!
segment-routing mpls
 !
 set-attributes
  address-family ipv4
   sr-label-preferred
  exit-address-family
 !
 global-block 16000 23999
 !
 connected-prefix-sid-map
  address-family ipv4
   10.255.0.9/32 index 9 range 1
  exit-address-family
 !
!
class-map match-any CM-VOICE
 match dscp ef
 match mpls experimental topmost 5
class-map match-all CM-DATA
 match dscp af21 af22
!
policy-map PM-CHILD
 class CM-VOICE
  priority level 1
  police cir 20000000
 class CM-DATA
  bandwidth remaining percent 40
  queue-limit 2000 us
 class class-default
  random-detect
policy-map PM-OUT
 class class-default
  shape average 500000000
  service-policy PM-CHILD
policy-map PM-IN
 class CM-VOICE
  set mpls experimental imposition 5
  set qos-group 5
 class CM-DATA
  set dscp af21
  police cir 50000000 bc 1562500 conform-action transmit exceed-action drop
!
interface Loopback0
 ip address 10.255.0.9 255.255.255.255
!
interface GigabitEthernet0/0/1
 description TO-ATN-04
 ip address 10.4.1.2 255.255.255.252
 ip router isis CORE
 synchronous mode
 service-policy input PM-IN
 service-policy output PM-OUT
!
interface GigabitEthernet0/0/3
 description TO-EVPN-CE
 no ip address
 service instance 10 ethernet
  encapsulation dot1q 10
  rewrite ingress tag pop 1 symmetric
 !
!
interface GigabitEthernet0/0/5
 description TO-LAN
 ip address 10.20.1.3 255.255.255.0
 vrrp 10 address-family ipv4
  priority 110
  preempt delay minimum 30
  timers advertise 2
  address 10.20.1.1 primary
  track 1 decrement 30
 exit-vrrp
!
interface GigabitEthernet0/0/6
 ip address 10.20.2.3 255.255.255.0
 vrrp 20 ip 10.20.2.1
 vrrp 20 priority 90
 no vrrp 20 preempt
!
bridge-domain 10
 member GigabitEthernet0/0/3 service-instance 10
 member evpn-instance 10
!
router isis CORE
 net 49.0001.0100.0000.0009.00
 metric-style wide
 segment-routing mpls
 fast-reroute per-prefix level-2 all
 fast-reroute ti-lfa level-2
 microloop avoidance segment-routing
 passive-interface Loopback0
!
router bgp 65000
 bgp router-id 10.255.0.9
 neighbor 10.255.0.4 remote-as 65000
 neighbor 10.255.0.4 update-source Loopback0
 !
 address-family l2vpn evpn
  neighbor 10.255.0.4 activate
  neighbor 10.255.0.4 send-community both
 exit-address-family
!
ptp clock ordinary domain 24 hybrid
 clock-port SLAVE1 slave profile g8275.1
  transport ipv4 unicast interface Loopback0 negotiation
  clock source 10.255.0.100
!
access-list 10 permit 10.10.0.0 0.0.0.255
!
line vty 0 4
 access-class 10 in
 exec-timeout 10 0
 transport input ssh
!
end
