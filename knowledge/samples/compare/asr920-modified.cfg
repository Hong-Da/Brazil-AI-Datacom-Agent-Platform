!
! 合成样本：按 ASR 920 IOS-XE 17.15 的常见写法编写，用于往返测试（业务实例 + BDI + VRF + VPNv4），不是现网配置
!
version 17.15
service timestamps debug datetime msec
service timestamps log datetime msec
no platform punt-keepalive disable-kernel-core
platform bfd-debug-trace 1
!
hostname PE-ASR920-01
!
boot-start-marker
boot-end-marker
!
vrf definition MGMT
 rd 64512:10
 !
 address-family ipv4
  route-target export 64512:10
  route-target import 64512:10
 exit-address-family
!
vrf definition RAN-2G
 rd 64512:101
 !
 address-family ipv4
  route-target export 64512:101
  route-target import 64512:101
  route-target import 64512:2
 exit-address-family
!
no aaa new-model
!
interface Loopback0
 ip address 10.255.0.21 255.255.255.255
!
interface GigabitEthernet0/0/0
 description UPLINK-TO-AGG-01 (ligação principal)
 mtu 9000
 ip address 10.1.0.2 255.255.255.252
 mpls ip
 negotiation auto
!
interface GigabitEthernet0/0/1
 description RAN-SITE-001
 no ip address
 negotiation auto
 service instance 101 ethernet
  description 2G-ABIS
  encapsulation dot1q 101
  rewrite ingress tag pop 1 symmetric
  bridge-domain 101
 !
 service instance 102 ethernet
  encapsulation dot1q 102
  rewrite ingress tag pop 1 symmetric
  bridge-domain 102
 !
!
interface GigabitEthernet0/0/2
 no ip address
 shutdown
 negotiation auto
!
interface GigabitEthernet0/0/3
 channel-group 1 mode active
!
interface Port-channel1
 description LAG-TO-AGG-02
 mtu 9216
 ip address 10.1.0.6 255.255.255.252
!
interface BDI101
 description RAN-2G-SITE-001
 vrf forwarding RAN-2G
 ip address 172.16.101.1 255.255.255.0
!
interface BDI102
 vrf forwarding MGMT
 ip address 172.17.102.1 255.255.255.0
!
router bgp 64512
 bgp router-id 10.255.0.21
 bgp log-neighbor-changes
 neighbor RR peer-group
 neighbor RR remote-as 64512
 neighbor RR update-source Loopback0
 neighbor 10.255.0.1 peer-group RR
 !
 address-family ipv4
  neighbor RR send-community
  neighbor RR next-hop-self
  neighbor RR route-map EXPORT-LO out
  neighbor 10.255.0.1 activate
 exit-address-family
 !
 address-family vpnv4
  neighbor RR send-community extended
  neighbor 10.255.0.1 activate
 exit-address-family
 !
 address-family ipv4 vrf MGMT
  redistribute connected
 exit-address-family
 !
 address-family ipv4 vrf RAN-2G
  redistribute connected
  redistribute static
 exit-address-family
!
ip prefix-list LOOPBACK-V4 seq 10 permit 10.255.0.0/16 ge 32
ip community-list standard RAN-COMM permit 64512:100
!
route-map EXPORT-LO permit 10
 match ip address prefix-list LOOPBACK-V4
 set community 64512:100 additive
!
route-map EXPORT-LO deny 20
!
ip route vrf RAN-2G 172.20.0.0 255.255.0.0 172.16.101.10
ip route 0.0.0.0 0.0.0.0 10.1.0.1
!
end
