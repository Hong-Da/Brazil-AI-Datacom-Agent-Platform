# Nokia SR OS Classic CLI 的规范渲染书写习惯（core/canon.py 读取；字段说明见 cisco-iosxe.yaml）。M7-3（REQ-037）。
# 生成命令仍由命令卡 + 映射规则反推；这里是 Classic CLI 特有的块结构（admin display-config 的写法）：
#   exit_all       每个视图块以与入口同列的 exit 结束（views.yaml 的 block: exit）
#   root_depth     configure 下的命令缩进 1 级（4 个空格）
#   prologue / epilogue  整份配置以 exit all、configure 开头，exit all 结尾（取代华为 # / Cisco ! 分隔符与 return / end）
#   section_frame  每个段落前的三行（{echo} 换成段落名）；sections 段落顺序与归属：顶层块按开头一路进入的视图
#                  （router → static-route-entry）由深到浅找第一个列出该视图的段落；lines 按原文块的第一个词归属；
#                  default: true 的段落收留其余的块。段落内相邻的同一容器（router Base、system）合并成一个块
#   containers     容器视图的入口写法（router 的 Base 实例）；没列出的容器按容器卡语法与 ctx:参数 生成（static-route-entry <前缀>）
#   quote_params   这些参数的取值总写成引号字符串（名称、描述；参数名正则）；取值含空格时总加引号
#   create         新建对象的入口行带 create（customer、sdp、业务、SAP、过滤器条目…，卡上有可选的 create 时）
#   l3_form        三层接口的形态：logical（路由器接口是逻辑接口，用 port 绑定端口或 SAP）；华为 / Cisco 没写即 physical
#                  （三层接口就是端口或子接口）。两边不同时翻译换结构（core/translate.py: reshape_l3）
family: nokia-sros-classic
nested_separator: false
exit_all: exit
root_depth: 1
prologue: [exit all, configure]
epilogue: [exit all]
section_frame: ["#--------------------------------------------------", 'echo "{echo}"', "#--------------------------------------------------"]
sections:
  - {echo: System Configuration, views: [system, system-time, system-ntp, system-snmp, login-control]}
  - {echo: System Security Configuration, views: [system-security, security-snmp, security-ssh, security-user, security-tacplus, security-radius, security-maf, security-password]}
  - {echo: Log Configuration, views: [log, log-syslog, log-id]}
  - {echo: Filter Configuration, views: [filter, ip-filter, ip-filter-entry]}
  - {echo: QoS Policy Configuration, views: [qos, qos-sap-ingress, qos-sap-egress]}
  - {echo: Card Configuration, lines: [card]}
  - {echo: Port Configuration, views: [port, port-ethernet]}
  - {echo: LAG Configuration, views: [lag]}
  - {echo: Router (Network Side) Configuration, views: [router, router-if, router-if-vrrp]}
  - {echo: Static Route Configuration, views: [static-route-entry, static-nh, static-indirect, static-bh]}
  - {echo: Service Configuration, views: [service, customer, sdp, epipe, vpls, vprn, ies]}
  - {echo: MPLS Label Range Configuration, views: [mpls-labels]}
  - {echo: OSPFv2 Configuration, views: [ospf, ospf-area, ospf-if, ospf-sr]}
  - {echo: ISIS Configuration, views: [isis, isis-if, isis-level, isis-sr]}
  - {echo: MPLS Configuration, views: [mpls, mpls-if, mpls-path, mpls-lsp]}
  - {echo: RSVP Configuration, views: [rsvp]}
  - {echo: LDP Configuration, views: [ldp, ldp-if-params, ldp-if, ldp-targeted]}
  - {echo: Policy Configuration, views: [policy-options, prefix-list, policy-statement]}
  - {echo: BGP Configuration, views: [bgp, bgp-group, bgp-neighbor]}
  - {echo: Other Configuration, default: true}
containers:
  router: router Base
  # IS-IS 级别：图中不区分级别（wide-metrics-only 记为 metric_style），规范渲染写在 level 2 下
  isis-level: level 2
quote_params: '((?<!port)-name|^name|description-string|location|contact-name|community-string|plcy-or-long-expr|plcy-or-expr|authentication-key|hash-key|secret)$'
create: true
# 进入这些视图后先写、退出前再写的命令：路由策略要在 begin … commit 之间修改才生效
wrap:
  policy-options: [begin, commit]
exits: {}
# LAG 也能被 port <port-id> 写出（端口类型包含 lag-1）：接口优先用 lag <编号>（只有 lag- 开头的接口写得出）
prefer: {interface: [nokia-sros-classic.lag]}
# 带密文的命令不反推（生成的写法会丢掉 hash2 等密文标记）：同平台族按原文写回，跨平台族本来就不写密码
avoid: [nokia-sros-classic.password~2, nokia-sros-classic.authentication-key@bgp, nokia-sros-classic.authentication-key@bgp-group, nokia-sros-classic.authentication-key@bgp-neighbor]
no_declare: []
# 推导（翻译成 Nokia 时，入口行必须给出、源配置没有的取值；告警 inferred_value）：seq 按出现顺序编号，value 固定取值
#   业务编号（vprn / vpls / epipe <编号>）、所属客户（Nokia 缺省就有客户 1）、日志目标编号（syslog <编号>）；
#   write: true 的取值即使语法上可选也写出（设备新建业务时要求给出 customer）
infer:
  - {node: vrf.instance.service_id, seq: 1001}
  - {node: vrf.instance.customer, value: 1, write: true}
  - {node: l2vpn.vsi.service_id, seq: 2001}
  - {node: l2vpn.vsi.customer, value: 1, write: true}
  - {node: l2vpn.xconnect.service_id, seq: 3001}
  - {node: l2vpn.xconnect.customer, value: 1, write: true}
  - {node: mgmt.syslog.host.target_id, seq: 1}
# Nokia 的端口名是 槽/子卡/端口（1/1/1）、lag-<编号>，路由器接口名任意：不按接口类型检查
interface_types: []
# 接入点（SAP）是端口下的对象，编号为 SAP 的封装（端口:1001 → 1001），与 Cisco 的业务实例同一形态
access_form: instance
l3_form: logical
# 协议实例编号的对应：Nokia 的基本实例（ospf 0、isis 0）对应华为 / Cisco 缺省的进程 1（翻译时改编号，含接口上引用的进程号）
instance_keys:
  ospf.process: {"0": "1"}
  isis.process: {"0": "1"}
