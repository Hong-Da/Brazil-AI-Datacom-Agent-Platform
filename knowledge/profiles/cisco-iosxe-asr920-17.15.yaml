# Cisco ASR 920，IOS-XE 17.15.x（ASR 920 的最后一条版本线）。命令卡来自 Cisco 公开命令参考。
profile: cisco-iosxe-asr920-17.15
title: Cisco ASR 920 IOS-XE 17.15
vendor: cisco
family: cisco-iosxe
platform: ASR 920
software: 17.15.x
match:
  vendor: cisco
  version: ^17\.15
  fallback: "true"
# 被引用即隐式存在的对象：业务实例里的 bridge-domain <编号> 会自动创建桥域，不需要单独声明
implicit: [bridge_domain]
# entries 由命令卡汇总生成（lmesh kb map）；人工补充的条目标 manual: true，汇总时保留
entries:
