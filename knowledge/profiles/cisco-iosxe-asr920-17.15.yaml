# Cisco ASR 920，IOS-XE 17.15.x（ASR 920 的最后一条版本线）。命令卡来自 Cisco 公开命令参考。
profile: cisco-iosxe-asr920-17.15
title: Cisco ASR 920 IOS-XE 17.15
vendor: cisco
family: cisco-iosxe
platform: ASR 920
software: 17.15.x
match:
  vendor: cisco
  version: ^17\.15
  fallback: "true"
# 被引用即隐式存在的对象：业务实例里的 bridge-domain <编号> 会自动创建桥域，不需要单独声明
implicit: [bridge_domain]
# 副作用：接口执行 vrf forwarding（绑定或解绑 VRF）时设备会删除接口上已有的 IPv4 地址，变更脚本需要在绑定后补发（M4-2 从变更知识移入）
side_effects:
  - {from: interface.vrf, to: interface.ipv4, note: {zh-CN: Cisco 接口 vrf forwarding 会删除接口 IP，需在绑定后补发, en: 'On Cisco, "vrf forwarding" on an interface removes its IP address; reapply the address after binding', pt-BR: 'No Cisco, "vrf forwarding" na interface remove o endereço IP; reaplique o endereço após a vinculação'}}
