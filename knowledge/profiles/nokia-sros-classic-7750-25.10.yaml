# Nokia 7750 SR，SR OS 25.10.R1，Classic CLI（M7-3，REQ-037）。命令卡来自 Nokia 公开的 Classic CLI Command Reference 25.10.R1。
# 缺省值取自命令参考各命令的 Default 小节（verified: doc）；其他软件版本以后用继承 Profile 只写差异。
profile: nokia-sros-classic-7750-25.10
title: Nokia 7750 SR SR OS 25.10（Classic CLI）
vendor: nokia
family: nokia-sros-classic
platform: 7750 SR
software: 25.10.R1
match:
  vendor: nokia
  version: ^25\.10
  fallback: "true"
# 被引用即隐式存在的对象：没有（VPLS 下的 SAP 直接绑定 VSI，见 interface.access.vsi）
implicit: []
side_effects: []
# entries 由命令卡汇总生成（lmesh kb map --family nokia-sros-classic）；人工补充的条目标 manual: true，汇总时保留。
# when.else（M7-3）：条件不满足时的缺省值——端口与 LAG 缺省 shutdown，路由器逻辑接口缺省 no shutdown。
# assume（M7-3）：其他平台族没有这个节点（华为 / Cisco 的协议实例与 NTP 没有管理状态，配置即启用）时按这个取值理解；
#   翻译成 Nokia 时，目标缺省值与它不同（或没有登记缺省值）就显式写出并告警（core/translate.py）。
