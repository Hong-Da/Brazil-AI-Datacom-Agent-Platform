# 华为 ATN V800R025C00SPC500：以产品文档为准的主 Profile。
profile: huawei-atn-v800r025
title: 华为 ATN V800R025
vendor: huawei
family: huawei-vrp8
platform: ATN 910C-K / 910C-M / 910D / 950D / 980C
software: V800R025C00SPC500
match:
  vendor: huawei
  version: V800R025
  fallback: "true"   # 识别不出版本的华为配置也用它
# 副作用：接口绑定 vpn-instance 时，设备会删除接口上已有的 IPv4 地址；变更脚本需要在绑定后补发地址
side_effects:
  - {from: interface.vrf, to: interface.ipv4, note: 华为接口绑定 vpn-instance 会删除接口 IP，需在绑定后补发}
