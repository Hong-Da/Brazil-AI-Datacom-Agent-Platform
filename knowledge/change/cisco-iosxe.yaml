# 增量变更脚本（core/change.py，M4-3）在 Cisco IOS-XE 上的下发习惯与变更知识（字段说明见 huawei-vrp8.yaml）。
family: cisco-iosxe
begin: [configure terminal]
finish: [end]
exit: exit
comment: "!"
# 副作用都写在 Profile 的 side_effects 中（vrf forwarding 删除接口 IP 已在 M4-2 移入 cisco-iosxe-asr920-17.15）；这里只放 Profile 之外的补充
side_effects: []
# 命名 ACL 中已存在的序号不能直接覆盖（% Duplicate sequence number），修改规则要先 no 序号再重配
undo_first: [acl.instance.rule]
replace_first: [interface.ipv4]
risk_high:
  - interface.vrf
  - interface.ipv4
  - interface.shutdown
  - interface.l2
  - interface.access
  - interface.mtu
  - vrf.instance
  - bgp.instance
  - bgp.peer
  - bgp.peer_group
  - bgp.af.peer.enabled
  - bridge_domain
  - mpls.ldp
  - isis.process
  - ospf.process
# 命令卡取消语法之外的取消写法（{命令卡: [语法]}，键可以用 * 结尾匹配一组卡）。M4-2 已把按键删除的写法并入命令卡的 undo
# （no interface <接口>、no neighbor <地址>、ACL 条目 no <序号>），这里留空；以后发现命令卡缺的写法应补到抽取修正文件
undo_extra: {}
