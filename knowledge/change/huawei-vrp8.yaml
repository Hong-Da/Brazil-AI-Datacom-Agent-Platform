# 增量变更脚本（core/change.py，M4-3）在华为 VRP8 上的下发习惯与变更知识。
# 命令本身由规范渲染器（命令卡 + 映射规则）生成、取消命令由命令卡的 undo 语法生成；这里只放命令卡里没有的“怎么下发”的知识。
#   begin / finish   脚本开头与结尾的命令（VRP8 两阶段提交：最后 commit 才生效）
#   exit             离开一层视图的命令
#   comment          脚本中说明行的前缀
#   side_effects     Profile 之外补充的副作用（from 节点变化时设备会删除同一对象下的 to 节点，变更后要补发）
#   undo_first       修改这些对象入口行上的取值时不能直接覆盖，要先删除对象再重建（例如 route-policy 节点的 permit / deny）
#   replace_first    同一父对象下这类对象一删一增时，先删旧再加新（例如接口主地址：新地址会顶替旧地址，之后再删旧地址会失败）
#   risk_high        修改或删除这些 Schema 节点（及其下的节点）视为高风险（可能中断业务）
family: huawei-vrp8
begin: [system-view]
finish: [commit, return]
exit: quit
comment: "#"
side_effects: []
undo_first: [rp.policy.node]
replace_first: [interface.ipv4]
risk_high:
  - interface.vrf
  - interface.ipv4
  - interface.shutdown
  - interface.l2
  - interface.access
  - interface.mtu
  - vrf.instance
  - bgp.instance
  - bgp.peer
  - bgp.peer_group
  - bgp.af.peer.enabled
  - bridge_domain
  - mpls.ldp
  - isis.process
  - ospf.process
# 命令卡取消语法之外的取消写法（{命令卡: [语法]}）：产品文档中单独列出、抽取时没有并入命令卡的 undo 形式。
# 删除对象时优先用只写出对象键的最短写法。知识库补缺时并入命令卡的 undo 后可删除这里的条目。
undo_extra:
  huawei-vrp8.rule: ["undo rule <rule-id>"]
