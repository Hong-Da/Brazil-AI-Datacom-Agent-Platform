    cisco: {name: {zh-CN: 序号条目, en: Sequence, pt-BR: Sequência}, label: ["seq {seq}"]}
  rp.prefix_list:
    huawei: {name: {zh-CN: IP 前缀列表, en: IP prefix list, pt-BR: Lista de prefixos IP}, label: ["ip ip-prefix {name}"]}
    cisco: {name: {zh-CN: 前缀列表, en: Prefix list, pt-BR: Lista de prefixos}, label: ["ip prefix-list {name}"]}
  rp.prefix_list.entry:
    huawei: {name: {zh-CN: 前缀列表规则, en: Prefix list entry, pt-BR: Entrada da lista de prefixos}, label: ["index {seq}"]}
    cisco: {name: {zh-CN: 前缀列表规则, en: Prefix list entry, pt-BR: Entrada da lista de prefixos}, label: ["seq {seq}"]}
  rp.community_list:
    huawei: {name: {zh-CN: 团体属性过滤器, en: Community filter, pt-BR: Filtro de comunidade}, label: ["ip community-filter {name}"]}
    cisco: {name: {zh-CN: 团体属性列表, en: Community list, pt-BR: Lista de comunidades}, label: ["ip community-list {name}"]}
  rp.community_list.entry:
    huawei: {name: {zh-CN: 团体过滤规则, en: Community filter entry, pt-BR: Entrada do filtro}, label: ["index {seq}"]}
    cisco: {name: {zh-CN: 团体列表规则, en: Community list entry, pt-BR: Entrada da lista}, label: ["seq {seq}"]}
  # ---------- OSPF / IS-IS / BFD ----------
  ospf.process:
    huawei: {name: {zh-CN: OSPF 进程, en: OSPF process, pt-BR: Processo OSPF}, label: ["ospf {id}"]}
    cisco: {name: {zh-CN: OSPF 进程, en: OSPF process, pt-BR: Processo OSPF}, label: ["router ospf {id}"]}
  ospf.process.area:
    huawei: {name: {zh-CN: OSPF 区域, en: OSPF area, pt-BR: Área OSPF}, label: ["area {id}"]}
    cisco: {name: {zh-CN: OSPF 区域, en: OSPF area, pt-BR: Área OSPF}, label: ["area {id}"]}
  ospf.process.area.network:
    huawei: {name: {zh-CN: 宣告网段, en: Network, pt-BR: Rede}, label: ["network {prefix}"]}
    cisco: {name: {zh-CN: 宣告网段, en: Network, pt-BR: Rede}, label: ["network {prefix} area"]}
  ospf.process.passive:
    huawei: {name: {zh-CN: 静默接口, en: Silent interface, pt-BR: Interface silenciosa}, label: ["silent-interface {interface}"]}
    cisco: {name: {zh-CN: 被动接口, en: Passive interface, pt-BR: Interface passiva}, label: ["passive-interface {interface}"]}
  ospf.process.redistribute:
    huawei: {name: {zh-CN: 引入路由, en: Route import, pt-BR: Importação de rotas}, label: ["import-route {protocol}"]}
    cisco: {name: {zh-CN: 重分发, en: Redistribution, pt-BR: Redistribuição}, label: ["redistribute {protocol}"]}
  isis.process:
