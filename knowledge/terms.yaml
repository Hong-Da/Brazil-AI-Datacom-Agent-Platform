contexts:
  nokia:
    - {schema: '^interface$', key: '^(\d+/\d+/|esat-|pxc-)', path: [port]}
    - {schema: '^interface$', key: '^lag-', path: [lag]}
    - {schema: '^interface$', attr: vrf, path: [service, 'vprn {vrf}']}
    - {schema: '^interface$', attr: ies, path: [service, 'ies {ies}']}
    - {schema: '^interface$', path: [router Base]}
    - {schema: '^static\.route$', attr: vrf, path: [service, 'vprn {vrf}']}
    - {schema: '^(static|bgp|ospf|isis|mpls|sr|bfd|vrrp)\.', path: [router Base]}
    - {schema: '^rp\.', path: [router Base, policy-options]}
    - {schema: '^(service|l2vpn|vrf|evpn|bridge_domain|tunnel_policy)(\.|$)', path: [service]}
    - {schema: '^acl\.', path: [filter]}
    - {schema: '^qos\.', path: [qos]}
    - {schema: '^mgmt\.syslog', path: [log]}
    - {schema: '^(mgmt|clock)\.', path: [system]}
