  mgmt.ntp:
    huawei: {name: {zh-CN: NTP 服务, en: NTP, pt-BR: NTP}, label: ["ntp-service"]}
    cisco: {name: {zh-CN: NTP 服务, en: NTP, pt-BR: NTP}, label: ["ntp"]}
  mgmt.ntp.server:
    huawei: {name: {zh-CN: NTP 服务器, en: NTP server, pt-BR: Servidor NTP}, label: ["ntp-service unicast-server {address}"]}
    cisco: {name: {zh-CN: NTP 服务器, en: NTP server, pt-BR: Servidor NTP}, label: ["ntp server {address}"]}
  mgmt.ntp.access:
    huawei: {name: {zh-CN: NTP 访问控制, en: NTP access control, pt-BR: Controle de acesso NTP}, label: ["ntp-service access {kind}"]}
    cisco: {name: {zh-CN: NTP 访问控制, en: NTP access control, pt-BR: Controle de acesso NTP}, label: ["ntp access-group {kind}"]}
  mgmt.snmp:
    huawei: {name: {zh-CN: SNMP 代理, en: SNMP agent, pt-BR: Agente SNMP}, label: ["snmp-agent"]}
    cisco: {name: {zh-CN: SNMP 服务, en: SNMP server, pt-BR: Servidor SNMP}, label: ["snmp-server"]}
  mgmt.snmp.community:
    huawei: {name: {zh-CN: 团体字, en: Community, pt-BR: Comunidade}, label: ["snmp-agent community {name}"]}
    cisco: {name: {zh-CN: 团体字, en: Community, pt-BR: Comunidade}, label: ["snmp-server community {name}"]}
  mgmt.snmp.host:
