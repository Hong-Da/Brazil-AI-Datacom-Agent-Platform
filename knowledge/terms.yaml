# 显示风格（REQ-026）：同一张配置图可以按华为或 Cisco 的叫法与视图层级显示，界面上随时切换（默认华为）。
#
# objects：每类对象在两种风格下的
#   name    对象的叫法（zh-CN / en / pt-BR；缺省时用 en，再缺省用 Schema 的 semantic）
#   label   节点上显示的命令写法，模板里的 {字段} 取对象的键；可以给多个候选，写成 “模板 ? 字段1,字段2”，
#           这些字段都有值时才用这一条，否则试下一条（最后一条通常不带条件）
#   values  键值的改写，例如华为地址族 ipv4 写成 unicast
# attrs：属性在两种风格下的命令关键字（只列与 Schema 名称明显不同、需要对照的）
# Schema 的结构与默认叫法以华为为基准（Cisco 映射到华为的结构上）；这里只决定怎么显示，不影响解析、对比、检查的结果。
# nokia（M7-3 加入，M7-5 补齐，REQ-037）：第三种风格，每类对象都要登记（core/terms.py 的 REQUIRED_STYLES）。
#   写法以 Nokia SR OS Classic CLI 为准；MD-CLI 的元素名与 Classic 相同，层级用花括号（vprn "X" { … }），
#   差异大的在 name 里说明。Nokia 没有对应对象的（HQoS 模板、1588 ACR 等）写成带全角括号的说明。
#   属性没有登记 nokia 关键字时按华为写法显示。
# contexts（M7-5）：配置图“按视图层级”显示时，顶层对象按该风格的配置上下文分组（Nokia：port、lag、router Base、
#   service、filter、qos、log、system），与 Nokia 的视图树一致；华为 / Cisco 不分组（按对象自身的父子层级）。
#   每条：schema（对象编号正则）、key（对象键正则，可省）、attr（对象有这个属性时才用，可省；path 里的 {属性} 取它的值）、
#   path（上下文路径）；按顺序第一条命中生效，都不命中时放在设备下。
styles:
  huawei: {zh-CN: 华为风格, en: Huawei style, pt-BR: Estilo Huawei}
  cisco: {zh-CN: Cisco 风格, en: Cisco style, pt-BR: Estilo Cisco}
  nokia: {zh-CN: Nokia 风格, en: Nokia style, pt-BR: Estilo Nokia}
default: huawei

