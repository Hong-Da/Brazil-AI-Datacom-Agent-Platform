    cisco: {name: {zh-CN: IS-IS 进程, en: IS-IS process, pt-BR: Processo IS-IS}, label: ["router isis {id}"]}
  isis.process.net:
    huawei: {name: {zh-CN: 网络实体名称, en: Network entity title, pt-BR: NET}, label: ["network-entity {value}"]}
    cisco: {name: {zh-CN: 网络实体名称, en: Network entity title, pt-BR: NET}, label: ["net {value}"]}
  bfd.global:
    huawei: {name: {zh-CN: BFD 全局使能, en: BFD global, pt-BR: BFD global}, label: ["bfd"]}
    cisco: {name: {zh-CN: BFD（无全局开关）, en: BFD (no global switch), pt-BR: BFD (sem chave global)}, label: ["bfd"]}
  bfd.session:
    huawei: {name: {zh-CN: 静态 BFD 会话, en: Static BFD session, pt-BR: Sessão BFD estática}, label: ["bfd {name} bind"]}
    cisco: {name: {zh-CN: 静态 BFD 会话, en: Static BFD session, pt-BR: Sessão BFD estática}, label: ["bfd {name}"]}
