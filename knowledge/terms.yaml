# 显示风格（REQ-026）：同一张配置图可以按华为或 Cisco 的叫法与视图层级显示，界面上随时切换（默认华为）。
#
# objects：每类对象在两种风格下的
#   name    对象的叫法（zh-CN / en / pt-BR；缺省时用 en，再缺省用 Schema 的 semantic）
#   label   节点上显示的命令写法，模板里的 {字段} 取对象的键；可以给多个候选，写成 “模板 ? 字段1,字段2”，
#           这些字段都有值时才用这一条，否则试下一条（最后一条通常不带条件）
#   values  键值的改写，例如华为地址族 ipv4 写成 unicast
# attrs：属性在两种风格下的命令关键字（只列与 Schema 名称明显不同、需要对照的）
# Schema 的结构与默认叫法以华为为基准（Cisco 映射到华为的结构上）；这里只决定怎么显示，不影响解析、对比、检查的结果。
styles:
  huawei: {zh-CN: 华为风格, en: Huawei style, pt-BR: Estilo Huawei}
  cisco: {zh-CN: Cisco 风格, en: Cisco style, pt-BR: Estilo Cisco}
default: huawei

objects:
  # ---------- 接口 ----------
  interface:
    huawei: {name: {zh-CN: 接口, en: Interface, pt-BR: Interface}, label: ["interface {name}"]}
    cisco: {name: {zh-CN: 接口, en: Interface, pt-BR: Interface}, label: ["interface {name}"]}
  interface.ipv4:
    huawei: {name: {zh-CN: IPv4 地址, en: IPv4 address, pt-BR: Endereço IPv4}, label: ["ip address {address}"]}
    cisco: {name: {zh-CN: IPv4 地址, en: IPv4 address, pt-BR: Endereço IPv4}, label: ["ip address {address}"]}
  interface.access:
    huawei: {name: {zh-CN: 二层子接口接入, en: Layer-2 sub-interface access, pt-BR: Acesso de subinterface L2}, label: ["encapsulation (l2 sub-interface)"]}
    cisco: {name: {zh-CN: 业务实例（EFP）, en: Service instance (EFP), pt-BR: Instância de serviço (EFP)}, label: ["service instance {id} ethernet ? id", "service instance"]}
  interface.ospf:
    huawei: {name: {zh-CN: 接口 OSPF 参数, en: Interface OSPF settings, pt-BR: Parâmetros OSPF da interface}, label: ["ospf"]}
    cisco: {name: {zh-CN: 接口 OSPF 参数, en: Interface OSPF settings, pt-BR: Parâmetros OSPF da interface}, label: ["ip ospf"]}
  interface.isis:
    huawei: {name: {zh-CN: 接口 IS-IS 参数, en: Interface IS-IS settings, pt-BR: Parâmetros IS-IS da interface}, label: ["isis"]}
    cisco: {name: {zh-CN: 接口 IS-IS 参数, en: Interface IS-IS settings, pt-BR: Parâmetros IS-IS da interface}, label: ["ip router isis"]}
  interface.bfd:
    huawei: {name: {zh-CN: 接口 BFD 参数, en: Interface BFD settings, pt-BR: Parâmetros BFD da interface}, label: ["bfd"]}
    cisco: {name: {zh-CN: 接口 BFD 参数, en: Interface BFD settings, pt-BR: Parâmetros BFD da interface}, label: ["bfd interval"]}
  bridge_domain:
    huawei: {name: {zh-CN: 桥域, en: Bridge domain, pt-BR: Domínio de bridge}, label: ["bridge-domain {id}"]}
    cisco: {name: {zh-CN: 桥域, en: Bridge domain, pt-BR: Domínio de bridge}, label: ["bridge-domain {id}"]}
  # ---------- VRF ----------
  vrf.instance:
    huawei: {name: {zh-CN: VPN 实例, en: VPN instance, pt-BR: Instância VPN}, label: ["ip vpn-instance {name}"]}
    cisco: {name: {zh-CN: VRF, en: VRF, pt-BR: VRF}, label: ["vrf definition {name}"]}
  vrf.instance.af:
    huawei:
      name: {zh-CN: VPN 实例地址族, en: VPN instance address family, pt-BR: Família de endereços da instância VPN}
      label: ["{afi}-family"]
    cisco:
      name: {zh-CN: VRF 地址族, en: VRF address family, pt-BR: Família de endereços da VRF}
      label: ["address-family {afi}"]
  vrf.instance.af.rt:
    huawei:
      name: {zh-CN: VPN Target, en: VPN target, pt-BR: VPN target}
      label: ["vpn-target {value} {direction}"]
      values: {direction: {import: import-extcommunity, export: export-extcommunity, both: both}}
    cisco:
      name: {zh-CN: Route Target, en: Route target, pt-BR: Route target}
      label: ["route-target {direction} {value}"]
  # ---------- 静态路由 ----------
  static.route:
    huawei:
      name: {zh-CN: 静态路由, en: Static route, pt-BR: Rota estática}
      label: ["ip route-static vpn-instance {vrf} {prefix} {nexthop} ? vrf", "ip route-static {prefix} {nexthop}"]
    cisco:
      name: {zh-CN: 静态路由, en: Static route, pt-BR: Rota estática}
      label: ["ip route vrf {vrf} {prefix} {nexthop} ? vrf", "ip route {prefix} {nexthop}"]
  # ---------- BGP ----------
  bgp.instance:
    huawei: {name: {zh-CN: BGP 进程, en: BGP process, pt-BR: Processo BGP}, label: ["bgp {asn}"]}
    cisco: {name: {zh-CN: BGP 进程, en: BGP process, pt-BR: Processo BGP}, label: ["router bgp {asn}"]}
  bgp.peer:
    huawei: {name: {zh-CN: BGP 对等体, en: BGP peer, pt-BR: Par BGP}, label: ["peer {address}"]}
    cisco: {name: {zh-CN: BGP 邻居, en: BGP neighbor, pt-BR: Vizinho BGP}, label: ["neighbor {address}"]}
  bgp.peer_group:
    huawei: {name: {zh-CN: 对等体组, en: Peer group, pt-BR: Grupo de pares}, label: ["group {name}"]}
    cisco: {name: {zh-CN: 邻居组（peer-group）, en: Peer group, pt-BR: Grupo de pares}, label: ["neighbor {name} peer-group"]}
  bgp.af:
    huawei:
      name: {zh-CN: BGP 地址族, en: BGP address family, pt-BR: Família de endereços BGP}
      label: ["ipv4-family vpn-instance {vrf} ? vrf", "ipv4-family {afi}"]
      values: {afi: {ipv4: unicast}}
    cisco:
      name: {zh-CN: BGP 地址族, en: BGP address family, pt-BR: Família de endereços BGP}
      label: ["address-family ipv4 vrf {vrf} ? vrf", "address-family {afi}"]
  bgp.af.peer:
    huawei: {name: {zh-CN: 地址族内的对等体, en: Peer in address family, pt-BR: Par na família de endereços}, label: ["peer {peer}"]}
    cisco: {name: {zh-CN: 地址族内的邻居, en: Neighbor in address family, pt-BR: Vizinho na família de endereços}, label: ["neighbor {peer}"]}
  bgp.af.network:
    huawei: {name: {zh-CN: 宣告的网段, en: Network, pt-BR: Rede anunciada}, label: ["network {prefix}"]}
    cisco: {name: {zh-CN: 宣告的网段, en: Network, pt-BR: Rede anunciada}, label: ["network {prefix}"]}
  bgp.af.redistribute:
    huawei: {name: {zh-CN: 引入路由, en: Route import, pt-BR: Importação de rotas}, label: ["import-route {protocol}"]}
    cisco: {name: {zh-CN: 重分发, en: Redistribution, pt-BR: Redistribuição}, label: ["redistribute {protocol}"]}
  # ---------- 路由策略 ----------
  rp.policy:
    huawei: {name: {zh-CN: 路由策略, en: Route policy, pt-BR: Política de rotas}, label: ["route-policy {name}"]}
    cisco: {name: {zh-CN: 路由映射（route-map）, en: Route map, pt-BR: Route map}, label: ["route-map {name}"]}
