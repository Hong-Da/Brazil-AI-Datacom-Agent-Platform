# 透网 LucidMesh 知识库
# 版本规则：删除节点或修改语义升主版本；新增节点升次版本；修正默认值或渲染模板升修订号。
# 发布用 lmesh kb release（先跑校验与往返回归测试）。
kb_version: 0.0.0
domains:
  - interface       # 物理接口、子接口、Eth-Trunk / Port-channel、Loopback、BDI、业务接入点
  - vrf             # vpn-instance / vrf、RD、RT
  - static-route
  - bgp             # BGP IPv4 与 VPNv4 邻居和地址族
  - routing-policy  # route-policy / route-map、ip-prefix / prefix-list、community
  - ospf            # 0.2.0：OSPF 进程、区域、network、接口参数、FRR
  - isis            # 0.2.0：IS-IS 进程、NET、接口参数
  - bfd             # 0.2.0：BFD 全局与会话
  - mgmt            # 0.2.0：NTP、SNMP、Syslog、SSH / Telnet、AAA 与本地用户、VTY / Console
  - mpls            # 0.3.0：MPLS 全局与 LSR-ID、LDP（全局、远端对等体、认证）、接口 MPLS / LDP 与同步
  - l2vpn           # 0.3.0：VPWS（mpls l2vc / xconnect、PW 模板）、VPLS（VSI / VFI、桥域绑定）
  - acl             # 0.3.0：基本 / 高级 ACL 与规则；接口、VTY、SNMP、NTP 对 ACL 的引用
  - vrrp            # 0.4.0（M4-2）：接口 VRRP 组、虚拟地址、优先级、抢占、跟踪
  - qos             # 0.4.0（M4-2）：流分类 / 流行为 / 流策略（class-map / policy-map）、接口应用、HQoS 队列与 WRED、DiffServ 域
  - sr              # 0.4.0（M4-2）：SR-MPLS（全局使能、SRGB / SRLB、IGP 下的 SR 使能、前缀 SID、TI-LFA）
  - evpn            # 0.4.0（M4-2）：EVPN 实例（BD / VPWS）、RD / RT、桥域与接口绑定、BGP l2vpn evpn 地址族
  - clock           # 0.4.0（M4-2）：时钟同步（PTP / 1588v2、1588 ACR、同步以太时钟源与 SSM）
