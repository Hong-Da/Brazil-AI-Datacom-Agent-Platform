# 参数说明的取值范围写作 “Values 1 to 255”；按顺序第一条命中生效（ipv6 要在 ipv4 之前）
param_types:
  - {name: 'virtual-router-id$', type: integer}
  # M7-2：取值说明里有 “Values 0.0.0.0 to …”（点分或整数两种写法）、MAC 形式、长度范围的参数不能按整数检查
  - {name: '^(area-id|system-id|length1-length2)$', type: word}
  # M7-2：端口与 SAP 类型（路由器接口的 port 写作 端口[:封装]，按 SAP 检查）
  - {name: '^(port-id)$', type: port}
  - {name: '^(sap-id|port-name)$', type: sap}
  - {name: '(ipv6|ip-int-name|interface-name|port-name|port-id|sap-id|lag-id|aps-id|connector-port-id)', type: word}
  - {name: '(ip-prefix/prefix-length|ip-address/mask|ip-prefix/mask)$', type: prefix}
  - {name: 'netmask$|^mask$', type: mask}
  - {name: '(ip-address|next-hop|router-id)$', type: ipv4}
  - {name: '(description-string|description)$', type: text}
  - {value: 'Values\s+(-?\d+)\s+to\s+(\d+)', type: integer, range_groups: [1, 2]}
  - {value: '\bValues\s+\d+\b', type: integer}

domains:
  interface:
    - {path: 'configure_port.md'}
    - {path: 'configure_port_*.md'}
    - {path: 'configure_lag.md'}
    - {path: 'configure_lag_*.md'}
    - {path: 'configure_router.md'}
    - {path: 'configure_router_interface.md'}
  static-route:
    - {path: 'configure_router_static-route-entry.md'}
  # ---- M7-2 ----
  # 系统与管理面：configure system 下的单条命令（name、contact、location…）各成一个文件，用通配；
  # 时钟同步（sync-if-timing、ptp）的子上下文不在范围，只抽进入它们的那条命令（进入 opaque）
  mgmt:
    - {path: 'configure_system_*.md'}
    - {path: 'configure_log.md'}
    - {path: 'configure_log_*.md'}
  ospf:
    - path: 'configure_router_ospf.md'
      views_map: [{match: '^configure router ospf segment-routing$', view: null}]
  isis:
    - path: 'configure_router_isis.md'
      views_map: [{match: '^configure router isis segment-routing$', view: null}]
  bgp:
    - {path: 'configure_router_bgp.md'}
    # 路由器级别的 AS 号与 Router ID（BGP / OSPF 共用；放在 BGP 功能域，映射在 M7-3 定）
    - {path: 'configure_router_autonomous-system.md'}
    - {path: 'configure_router_router-id.md'}
    - {path: 'configure_router_confederation.md'}
  routing-policy:
    - {path: 'configure_router_policy-options.md'}
  mpls:
    - {path: 'configure_router_mpls.md'}
    - {path: 'configure_router_rsvp.md'}
    - {path: 'configure_router_ldp.md'}
  # SR：标签范围（mpls-labels 的 sr-labels）与 OSPF / IS-IS 下的 segment-routing 上下文；
  # 同一文件的其他视图在本功能域丢弃（最后一条 '.' 命中即停，不落到全局映射）
  sr:
    - {path: 'configure_router_mpls-labels.md'}
    - path: 'configure_router_ospf.md'
      views_map: [{match: '^configure router ospf segment-routing$', view: ospf-sr}, {match: '.', view: null}]
    - path: 'configure_router_isis.md'
      views_map: [{match: '^configure router isis segment-routing$', view: isis-sr}, {match: '.', view: null}]

syntax_rewrites:
  # 前缀 / 掩码：文档写作 *ip-prefix***/***prefix-length*（斜杠是粗体），转换后成了 <ip-prefix> / <prefix-length>；
  # 配置里是一个词（10.0.0.0/24），合成一个参数
  - pattern: '<ip-prefix> / <prefix-length>'
    replace: '<ip-prefix/prefix-length>'
    params: {ip-prefix/prefix-length: {type: prefix}}
  - pattern: '<ip-address> / <mask>'
    replace: '<ip-address/mask>'
    params: {ip-address/mask: {type: prefix}}
  - pattern: '<ipv6-prefix> / <prefix-length>'
    replace: '<ipv6-prefix/prefix-length>'
    params: {ipv6-prefix/prefix-length: {type: word}}
  # 文档排版把关键字拆开了（**c ommunity**）
  - pattern: '^c ommunity\b'
    replace: 'community'
  # ---- M7-2 ----
  # 多个策略名：文档写作嵌套的同名参数（[ <p> [ <p> ] ]），同名参数在匹配记录里会互相覆盖；改成重复组（BGP 最多 15 个、IGP 最多 5 个）
  - pattern: '^(import|export|vrf-import|vrf-export) <plcy-or-long-expr> \[ <plcy-or-expr> \[ <plcy-or-expr> \]( \])?$'
    replace: '\1 <plcy-or-long-expr> [ <plcy-or-expr> ] &<1-14>'
  - pattern: '^(import|export) <policy-name> \[ <policy-name> \]$'
    replace: '\1 <policy-name> [ <policy-name> ] &<1-4>'
  - pattern: '^route-target-list <comm-id> \[ <comm-id> \] \]$'
    replace: 'route-target-list <comm-id> [ <comm-id> ] &<1-14>'
  # 文档里括号不配对
  - pattern: '^attempts <count> \[ time <minutes1> \[ lockout <minutes2> \]$'
    replace: 'attempts <count> [ time <minutes1> [ lockout <minutes2> ] ]'
  - pattern: '^lsp-refresh-interval \[ <seconds> \] \[ half-lifetime \{ enable \| disable \}$'
    replace: 'lsp-refresh-interval [ <seconds> ] [ half-lifetime { enable | disable } ]'
  - pattern: '^cluster <cluster-id> orr-location <location-id> \[ allow-local-fallback \] \]$'
    replace: 'cluster <cluster-id> orr-location <location-id> [ allow-local-fallback ]'
  # “命令 <值> | <参数名>” 少了花括号
  - pattern: '^(\S+) (<[^<>]+>) \| (<[^<>]+>)$'
    replace: '\1 { \2 | \3 }'
  - pattern: '^lsp-template <template-name> pce-init-p2p-srte template-id default \| <template-id>$'
    replace: 'lsp-template <template-name> pce-init-p2p-srte template-id { default | <template-id> }'
  # 文档的参数名带空格（*ebgp preference*），转换后拆成了两个参数；同名参数表示两种含义的改成不同的名字
  - pattern: '\[ ebgp <ebgp> <label> <preference> \] \[ ibgp <ibgp> <label> <preference> \]'
    replace: '[ ebgp <ebgp-label-preference> ] [ ibgp <ibgp-label-preference> ]'
    params: {ebgp-label-preference: {type: integer, range: [1, 255]}, ibgp-label-preference: {type: integer, range: [1, 255]}}
  - pattern: '\[ ebgp <ebgp> <preference> \] \[ ibgp <ibgp> <preference> \]'
    replace: '[ ebgp <ebgp-preference> ] [ ibgp <ibgp-preference> ]'
    params: {ebgp-preference: {type: integer, range: [1, 255]}, ibgp-preference: {type: integer, range: [1, 255]}}
  - pattern: '^hold-time <seconds> \[ min <seconds> \]$'
    replace: 'hold-time <seconds> [ min <min-seconds> ]'
    params: {min-seconds: {type: integer, range: [0, 65535]}}
  # “[ <名称> ...(up to 5 max) ]” 与 “<名称> [ <名称> ]”（列表）：改成重复组，每个取值单独记录
  - pattern: '\[ <([^<>]+)> \.\.\.\(up to \d+ max\) \]'
    replace: '[ <\1> ] &<1-31>'
  - pattern: '<([^<>]+)> \[ <\1> \](?! &)'
    replace: '<\1> [ <\1> ] &<1-31>'
  # 转换留下的排版痕迹：[no] 前缀、拆开的关键字、语法里带了完整上下文、斜体的 |、带括号的列表说明
  - pattern: '^\[no\] '
    replace: ''
  - pattern: '^configure system security ssh '
    replace: ''
  - pattern: '\bs ecurity-level\b'
    replace: 'security-level'
  - pattern: '\bp refix -match\b'
    replace: 'prefix-match'
  - pattern: '^n o view '
    replace: 'view '
  - pattern: ' <\|> '
    replace: ' | '
  - pattern: '<:mm>'
    replace: '<mm>'
  - pattern: '^to \[ <ip-address> \| node-id \[ <a\.b\.c\.d> \| <1\.\.\.4294967295> \] \]$'
    replace: 'to { <ip-address> | node-id <node-id> }'
    params: {ip-address: {type: ipv4}, node-id: {type: word}}
  - pattern: '\[ <([^<>]+)> \) \]'
    replace: '[ <\1> ] &<1-4>'
  - pattern: '\[ <([^<>]+)> \(up to \d+ max\) \]'
    replace: '[ <\1> ] &<1-4>'
  - pattern: '^snmp-trap-group <log-id> \| <log-name> '
    replace: 'snmp-trap-group { <log-id> | <log-name> } '
  - pattern: '<ip-prefix> / <mask>'
    replace: '<ip-prefix/mask>'
    params: {ip-prefix/mask: {type: prefix}}
  - pattern: '^(default-metric|default-ipv6-unicast-metric) <(ipv4|ipv6)> <metric>$'
    replace: '\1 <\2-metric>'
    params: {ipv4-metric: {type: integer, range: [1, 16777214]}, ipv6-metric: {type: integer, range: [1, 16777214]}}
