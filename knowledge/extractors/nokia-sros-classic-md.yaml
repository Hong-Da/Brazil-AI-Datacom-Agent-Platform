  # ---- 范围外的子上下文（命令本身在范围内的视图里，但它下面的命令还没有抽取）：进入 opaque 视图，块内按原文保留，
  # 块尾的 exit 也只退出这一层。名单由“命令的完整上下文又是别的命令的视图路径”自动得出（D-0170；M7-2 用 tmp/m72_views.py 重新生成）。
  # 解析器（block: exit）对没有进入视图、下面又有更深缩进子行的命令同样按原文块处理，这份名单只是让卡上标明“进入范围外上下文”
