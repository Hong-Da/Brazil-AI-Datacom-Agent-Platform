# 参数说明的取值范围写作 “Values 1 to 255”；按顺序第一条命中生效（ipv6 要在 ipv4 之前）
param_types:
  - {name: 'virtual-router-id$', type: integer}
  # M7-2：取值说明里有 “Values 0.0.0.0 to …”（点分或整数两种写法）、MAC 形式、长度范围的参数不能按整数检查
  - {name: '^(area-id|system-id|length1-length2)$', type: word}
  # M7-3：VPRN 的 route-distinguisher <rd>（64500:3001 / 10.0.0.1:1）
  - {name: '^rd$', type: rd}
  - {name: '^ipv4-address-mask$', type: mask}
  # M7-2：端口与 SAP 类型（路由器接口的 port 写作 端口[:封装]，按 SAP 检查）
  - {name: '^(port-id)$', type: port}
  - {name: '^(sap-id|port-name)$', type: sap}
  - {name: '(ipv6|ip-int-name|interface-name|port-name|port-id|sap-id|lag-id|aps-id|connector-port-id)', type: word}
  - {name: '(ip-prefix/prefix-length|ip-address/mask|ip-prefix/mask)$', type: prefix}
  - {name: 'netmask$|^mask$', type: mask}
  - {name: '(ip-address|next-hop|router-id)$', type: ipv4}
  - {name: '(description-string|description)$', type: text}
  - {value: 'Values\s+(-?\d+)\s+to\s+(\d+)', type: integer, range_groups: [1, 2]}
  - {value: '\bValues\s+\d+\b', type: integer}

domains:
  interface:
    - {path: 'configure_port.md'}
    - {path: 'configure_port_*.md'}
    - {path: 'configure_lag.md'}
    - {path: 'configure_lag_*.md'}
    - {path: 'configure_router.md'}
    # M7-3：路由器接口下的 vrrp 上下文归 vrrp 功能域（进入 vrrp 的那条命令仍在本域）
    - path: 'configure_router_interface.md'
      views_map: [{match: '^configure router interface vrrp$', view: null}]
  static-route:
    - {path: 'configure_router_static-route-entry.md'}
  # ---- M7-2 ----
  # 系统与管理面：configure system 下的单条命令（name、contact、location…）各成一个文件，用通配；
  # 时钟同步（sync-if-timing、ptp）的子上下文不在范围，只抽进入它们的那条命令（进入 opaque）
  mgmt:
    - {path: 'configure_system_*.md'}
    - {path: 'configure_log.md'}
    - {path: 'configure_log_*.md'}
  ospf:
    - path: 'configure_router_ospf.md'
      views_map: [{match: '^configure router ospf segment-routing$', view: null}]
  isis:
    - path: 'configure_router_isis.md'
      views_map: [{match: '^configure router isis segment-routing$', view: null}]
  bgp:
    - {path: 'configure_router_bgp.md'}
    # 路由器级别的 AS 号与 Router ID（BGP / OSPF 共用；放在 BGP 功能域，映射在 M7-3 定）
    - {path: 'configure_router_autonomous-system.md'}
    - {path: 'configure_router_router-id.md'}
    - {path: 'configure_router_confederation.md'}
  routing-policy:
    - {path: 'configure_router_policy-options.md'}
  mpls:
    - {path: 'configure_router_mpls.md'}
    - {path: 'configure_router_rsvp.md'}
    - {path: 'configure_router_ldp.md'}
  # SR：标签范围（mpls-labels 的 sr-labels）与 OSPF / IS-IS 下的 segment-routing 上下文；
  # 同一文件的其他视图在本功能域丢弃（最后一条 '.' 命中即停，不落到全局映射）
  sr:
    - {path: 'configure_router_mpls-labels.md'}
    - path: 'configure_router_ospf.md'
      views_map: [{match: '^configure router ospf segment-routing$', view: ospf-sr}, {match: '.', view: null}]
    - path: 'configure_router_isis.md'
      views_map: [{match: '^configure router isis segment-routing$', view: isis-sr}, {match: '.', view: null}]
  # ---- M7-3 ----
  # 业务：configure service 下的客户、SDP、Epipe、VPLS、VPRN、IES（子命令按 4 个词的完整上下文分文件，用通配）；
  # VPRN 下的 bgp / ospf / isis 等协议上下文这次不抽（文件里只有进入它们的那条命令落在 vprn 视图，进入 opaque）
  service:
    - {path: 'configure_service_customer*.md'}
    - {path: 'configure_service_sdp.md'}
    - {path: 'configure_service_sdp_*.md'}
    - {path: 'configure_service_epipe*.md'}
    - {path: 'configure_service_vpls*.md'}
    - {path: 'configure_service_vprn*.md'}
    - {path: 'configure_service_ies*.md'}
  # 过滤器（ACL）：只抽 IPv4 的 ip-filter
  acl:
    - {path: 'configure_filter_ip-filter.md'}
  # VRRP：路由器接口下的 vrrp 上下文（进入 vrrp 的命令在 interface 域）
  vrrp:
    - path: 'configure_router_interface.md'
      views_map: [{match: '^configure router interface vrrp$', view: router-if-vrrp}, {match: '.', view: null}]
  # QoS：只抽 SAP 入 / 出方向策略的进入命令与 description，其余子上下文（queue、fc、policer…）按原文保留
  qos:
    - path: 'configure_qos_sap-ingress.md'
      sections: [sap-ingress, description]
      views_map: [{match: '^configure qos$', view: qos}, {match: '^configure qos sap-ingress$', view: qos-sap-ingress}, {match: '.', view: null}]
    - path: 'configure_qos_sap-egress.md'
      sections: [sap-egress, description]
      views_map: [{match: '^configure qos$', view: qos}, {match: '^configure qos sap-egress$', view: qos-sap-egress}, {match: '.', view: null}]

syntax_rewrites:
  # 前缀 / 掩码：文档写作 *ip-prefix***/***prefix-length*（斜杠是粗体），转换后成了 <ip-prefix> / <prefix-length>；
  # 配置里是一个词（10.0.0.0/24），合成一个参数
  - pattern: '<ip-prefix> / <prefix-length>'
    replace: '<ip-prefix/prefix-length>'
    params: {ip-prefix/prefix-length: {type: prefix}}
  - pattern: '<ip-address> / <mask>'
    replace: '<ip-address/mask>'
    params: {ip-address/mask: {type: prefix}}
  - pattern: '<ipv6-prefix> / <prefix-length>'
    replace: '<ipv6-prefix/prefix-length>'
    params: {ipv6-prefix/prefix-length: {type: word}}
  # 文档排版把关键字拆开了（**c ommunity**）
  - pattern: '^c ommunity\b'
    replace: 'community'
  # ---- M7-2 ----
  # 多个策略名：文档写作嵌套的同名参数（[ <p> [ <p> ] ]），同名参数在匹配记录里会互相覆盖；改成重复组（BGP 最多 15 个、IGP 最多 5 个）
  - pattern: '^(import|export|vrf-import|vrf-export) <plcy-or-long-expr> \[ <plcy-or-expr> \[ <plcy-or-expr> \]( \])?$'
    replace: '\1 <plcy-or-long-expr> [ <plcy-or-expr> ] &<1-14>'
  - pattern: '^(import|export) <policy-name> \[ <policy-name> \]$'
    replace: '\1 <policy-name> [ <policy-name> ] &<1-4>'
  - pattern: '^route-target-list <comm-id> \[ <comm-id> \] \]$'
    replace: 'route-target-list <comm-id> [ <comm-id> ] &<1-14>'
  # 文档里括号不配对
  - pattern: '^attempts <count> \[ time <minutes1> \[ lockout <minutes2> \]$'
    replace: 'attempts <count> [ time <minutes1> [ lockout <minutes2> ] ]'
  - pattern: '^lsp-refresh-interval \[ <seconds> \] \[ half-lifetime \{ enable \| disable \}$'
    replace: 'lsp-refresh-interval [ <seconds> ] [ half-lifetime { enable | disable } ]'
  - pattern: '^cluster <cluster-id> orr-location <location-id> \[ allow-local-fallback \] \]$'
    replace: 'cluster <cluster-id> orr-location <location-id> [ allow-local-fallback ]'
  # “命令 <值> | <参数名>” 少了花括号
  - pattern: '^(\S+) (<[^<>]+>) \| (<[^<>]+>)$'
    replace: '\1 { \2 | \3 }'
  - pattern: '^lsp-template <template-name> pce-init-p2p-srte template-id default \| <template-id>$'
    replace: 'lsp-template <template-name> pce-init-p2p-srte template-id { default | <template-id> }'
  # 文档的参数名带空格（*ebgp preference*），转换后拆成了两个参数；同名参数表示两种含义的改成不同的名字
  - pattern: '\[ ebgp <ebgp> <label> <preference> \] \[ ibgp <ibgp> <label> <preference> \]'
    replace: '[ ebgp <ebgp-label-preference> ] [ ibgp <ibgp-label-preference> ]'
    params: {ebgp-label-preference: {type: integer, range: [1, 255]}, ibgp-label-preference: {type: integer, range: [1, 255]}}
  - pattern: '\[ ebgp <ebgp> <preference> \] \[ ibgp <ibgp> <preference> \]'
    replace: '[ ebgp <ebgp-preference> ] [ ibgp <ibgp-preference> ]'
    params: {ebgp-preference: {type: integer, range: [1, 255]}, ibgp-preference: {type: integer, range: [1, 255]}}
  - pattern: '^hold-time <seconds> \[ min <seconds> \]$'
    replace: 'hold-time <seconds> [ min <min-seconds> ]'
    params: {min-seconds: {type: integer, range: [0, 65535]}}
  # “[ <名称> ...(up to 5 max) ]” 与 “<名称> [ <名称> ]”（列表）：改成重复组，每个取值单独记录
  - pattern: '\[ <([^<>]+)> \.\.\.\(up to \d+ max\) \]'
    replace: '[ <\1> ] &<1-31>'
  - pattern: '<([^<>]+)> \[ <\1> \](?! &)'
    replace: '<\1> [ <\1> ] &<1-31>'
  # 转换留下的排版痕迹：[no] 前缀、拆开的关键字、语法里带了完整上下文、斜体的 |、带括号的列表说明
  - pattern: '^\[no\] '
    replace: ''
  - pattern: '^configure system security ssh '
    replace: ''
  - pattern: '\bs ecurity-level\b'
    replace: 'security-level'
  - pattern: '\bp refix -match\b'
    replace: 'prefix-match'
  - pattern: '^n o view '
    replace: 'view '
  - pattern: ' <\|> '
    replace: ' | '
  - pattern: '<:mm>'
    replace: '<mm>'
  - pattern: '^to \[ <ip-address> \| node-id \[ <a\.b\.c\.d> \| <1\.\.\.4294967295> \] \]$'
    replace: 'to { <ip-address> | node-id <node-id> }'
    params: {ip-address: {type: ipv4}, node-id: {type: word}}
  - pattern: '\[ <([^<>]+)> \) \]'
    replace: '[ <\1> ] &<1-4>'
  - pattern: '\[ <([^<>]+)> \(up to \d+ max\) \]'
    replace: '[ <\1> ] &<1-4>'
  - pattern: '^snmp-trap-group <log-id> \| <log-name> '
    replace: 'snmp-trap-group { <log-id> | <log-name> } '
  - pattern: '<ip-prefix> / <mask>'
    replace: '<ip-prefix/mask>'
    params: {ip-prefix/mask: {type: prefix}}
  - pattern: '^(default-metric|default-ipv6-unicast-metric) <(ipv4|ipv6)> <metric>$'
    replace: '\1 <\2-metric>'
    params: {ipv4-metric: {type: integer, range: [1, 16777214]}, ipv6-metric: {type: integer, range: [1, 16777214]}}
  # ---- M7-3：业务、过滤器、VRRP；以及 M7-2 留下的同名参数 ----
  # 业务对象的进入命令：文档语法的可选项顺序与 display-config 不同（display-config 写作 epipe 1001 name "x" customer 100 create），
  # 按 display-config 的顺序改写；名称参数统一叫 <name>
  - pattern: '^customer <customer-id> \[ create \] \[ name <name> \]$'
    replace: 'customer <customer-id> [ name <name> ] [ create ]'
    params: {customer-id: {type: integer, range: [1, 2147483647]}, name: {type: word}}
  - pattern: '^epipe <service-id> (customer <customer-id> \[ vpn <vpn-id> \] \[ vc-switching \] \[ create \] name \[ <name> \]|\[ test \] \[ create \] \[ name <name> \]) \[ flexible-cross-connect \]$'
    replace: 'epipe <service-id> [ name <name> ] [ customer <customer-id> ] [ vpn <vpn-id> ] [ vc-switching ] [ test ] [ create ] [ flexible-cross-connect ]'
    params: {customer-id: {type: integer, range: [1, 2147483647]}, vpn-id: {type: integer, range: [1, 2147483647]}, name: {type: word}}
  - pattern: '^vpls <service-id> \[ customer <customer-id> \] \[ create \] \[ vpn <vpn-id> \] \[ m-vpls \] \[ b-vpls \| i-vpls \] \[ etree \] \[ name <name> \]$'
    replace: 'vpls <service-id> [ name <name> ] [ customer <customer-id> ] [ vpn <vpn-id> ] [ m-vpls ] [ b-vpls | i-vpls ] [ etree ] [ create ]'
  - pattern: '^ies <service-id> \[ customer <customer-id> \] \[ create \] \[ vpn <vpn-id> \] \[ name <name> \]$'
    replace: 'ies <service-id> [ name <name> ] [ customer <customer-id> ] [ vpn <vpn-id> ] [ create ]'
  - pattern: '^(sap-ingress|sap-egress) \{ <policy-id> \| <policy-name> \} \[ create \] \[ name <name> \]$'
    replace: '\1 <policy-id> [ name <name> ] [ create ]'
    params: {policy-id: {type: integer, range: [1, 65535]}, name: {type: word}}
  - pattern: '^ip-filter <filter-id> \[ name \] \[ create \]$'
    replace: 'ip-filter <filter-id> [ name <name> ] [ create ]'
    params: {filter-id: {type: integer, range: [1, 65535]}, name: {type: word}}
  # SDP 的封装类型（取值见参数表），写成关键字多选一（否则 sdp 12 create 的 create 会被当成封装类型）
  - pattern: '^sdp <sdp-id> \[ <delivery-type> \] \[ create \]$'
    replace: 'sdp <sdp-id> [ { gre | mpls | l2tpv3 | eth-gre-bridged } ] [ create ]'
  # spoke-sdp / mesh-sdp 的 <sdp-id>[:<vc-id>]（配置里是一个词 12:1001）合成一个参数
  - pattern: '<sdp-id> \[ (: <vc-id>|<:vc-id>) \]'
    replace: '<sdp-id:vc-id>'
    params: {'sdp-id:vc-id': {type: word}}
  # 文档排版：拆开的关键字、花括号紧贴关键字
  - pattern: '\[ capture- sap \]'
    replace: '[ capture-sap ]'
  - pattern: '\{all-ones \| host-ones\}'
    replace: '{ all-ones | host-ones }'
  - pattern: '\{ <ip-address> \| <ip-int-name> \| <ipv6> <address> \}'
    replace: '{ <ip-address> | <ip-int-name> | <ipv6-address> }'
    params: {ipv6-address: {type: word}}
  # 过滤器：IPv4: / IPv6: 是文档里区分地址族的小标题，不是命令的一部分；单独一行的小标题改成空语法（按语法错误跳过）
  - pattern: '^IPv[46]: '
    replace: ''
  - pattern: '^IPv[46]:$'
    replace: ''
  # VPRN 下已废弃（25.x 改到 bgp-ipvpn mpls 下）的桩命令：命令参考只剩关键字，按旧版本的写法补全参数（旧版本的配置仍这样写）
  - pattern: '^route-distinguisher$'
    replace: 'route-distinguisher <rd>'
    params: {rd: {type: rd}}
  - pattern: '^vrf-target$'
    replace: 'vrf-target { <ext-community> | export <ext-community> | import <ext-community> | export <ext-community> import <ext-community> }'
  - pattern: '^(vrf-import|vrf-export)$'
    replace: '\1 <plcy-or-long-expr> [ <plcy-or-expr> ] &<1-14>'
    params: {plcy-or-long-expr: {type: word}, plcy-or-expr: {type: word}}
  - pattern: '^resolution$'
    replace: 'resolution { disabled | any | filter }'
  - pattern: '^ecmp$'
    replace: 'ecmp <max-ecmp-routes>'
    params: {max-ecmp-routes: {type: integer, range: [1, 64]}}
  # vrf-target 的“export 与 import 同时写”分支里两个同名参数：按方向改名（团体值 target:64500:3001 按 word）
  - pattern: '^vrf-target \{ <ext-community> \| export <ext-community> \| import <ext-community> \| export <ext-community> import <ext-community> \}$'
    replace: 'vrf-target { <ext-community> | export <export-community> | import <import-community> | export <export-community> import <import-community> }'
    params: {ext-community: {type: word}, export-community: {type: word}, import-community: {type: word}}
  # 同名参数（取值会互相覆盖）：第二个改成不同的名字
  - pattern: 'range <([^<>]+)> <\1>'
    replace: 'range <\1> <\1-end>'
    params:
      dst-port-number-end: {type: word}
      src-port-number-end: {type: word}
      port-number-end: {type: word}
      packet-length-value-end: {type: integer, range: [0, 65535]}
      ttl-value-end: {type: integer, range: [0, 255]}
  - pattern: 'service-sid <ipv6-address>'
    replace: 'service-sid <service-sid>'
    params: {service-sid: {type: word}}
  - pattern: '^bgp-shared-queue \[ cir <rate> \] \[ pir <rate> \]$'
    replace: 'bgp-shared-queue [ cir <cir-rate> ] [ pir <pir-rate> ]'
    params: {cir-rate: {type: word}, pir-rate: {type: word}}
  - pattern: '\| hold-excess <percentage> \]'
    replace: '| hold-excess <hold-excess-percentage> ]'
    params: {hold-excess-percentage: {type: word}}
  - pattern: 'egress-port-redirect-group <queue-group-name> egress-instance <instance-id> ingress-fp-redirect-group <queue-group-name> ingress-instance <instance-id>'
    replace: 'egress-port-redirect-group <egress-queue-group-name> egress-instance <egress-instance-id> ingress-fp-redirect-group <ingress-queue-group-name> ingress-instance <ingress-instance-id>'
    params:
      egress-queue-group-name: {type: word}
      ingress-queue-group-name: {type: word}
      egress-instance-id: {type: integer, range: [1, 16384]}
      ingress-instance-id: {type: integer, range: [1, 16384]}
  - pattern: 'advertise-unreachable \[ match-route-tag <tag> \] \[ advertise-route-tag <tag> \]'
    replace: 'advertise-unreachable [ match-route-tag <match-tag> ] [ advertise-route-tag <advertise-tag> ]'
    params: {match-tag: {type: integer, range: [1, 4294967295]}, advertise-tag: {type: integer, range: [1, 4294967295]}}
  - pattern: '^home-directory <url-prefix> \[ <directory> \] \[ <directory> / <directory> \]$'
    replace: 'home-directory <url-prefix> [ <directory> ] [ <directory-path> ]'
    params: {directory-path: {type: word}}
  - pattern: '^snmp-trap-group \{ <log-id> \| <log-name> \} \[ name <log-name> \]$'
    replace: 'snmp-trap-group { <log-id> | <log-name> } [ name <name> ]'
    params: {name: {type: word}}
  - pattern: 'ct([0-7]) <%-link-bandwidth>'
    replace: 'ct\1 <ct\1-percent>'
    params:
      ct0-percent: {type: integer, range: [0, 100]}
      ct1-percent: {type: integer, range: [0, 100]}
      ct2-percent: {type: integer, range: [0, 100]}
      ct3-percent: {type: integer, range: [0, 100]}
      ct4-percent: {type: integer, range: [0, 100]}
      ct5-percent: {type: integer, range: [0, 100]}
      ct6-percent: {type: integer, range: [0, 100]}
      ct7-percent: {type: integer, range: [0, 100]}
  - pattern: '^((no )?prefix <ip-prefix/prefix-length> \[ exact \| longer \| through <length> \| prefix-length-range <length1-length2> \|) to <ip-prefix/prefix-length> \|'
    replace: '\1 to <to-prefix> |'
    params: {to-prefix: {type: prefix}}
  - pattern: '^renumber from <entry-id> to <entry-id>$'
    replace: 'renumber from <old-entry-id> to <new-entry-id>'
    params: {old-entry-id: {type: integer, range: [1, 4294967295]}, new-entry-id: {type: integer, range: [1, 4294967295]}}
  # 业务接口与 SAP 下的文档括号错误（与路由器接口下的同名命令写法对齐）
  - pattern: '^secondary <ip-address\[/mask\]> .*$'
    replace: 'secondary { <ip-address/mask> | <ip-address> <netmask> } [ broadcast { all-ones | host-ones } ] [ igp-inhibit ] [ track-srrp <srrp-instance> ]'
    params: {ip-address/mask: {type: prefix}, ip-address: {type: ipv4}, netmask: {type: mask}, srrp-instance: {type: integer, range: [1, 4294967295]}}
  - pattern: '^secondary <ip-address> \[ / <mask> \] \[ <netmask> \] '
    replace: 'secondary { <ip-address/mask> | <ip-address> <netmask> } '
    params: {ip-address/mask: {type: prefix}, ip-address: {type: ipv4}, netmask: {type: mask}}
  - pattern: '\[ multiplier <multiplier> \[ echo-receive <echo-interval> \] \[ type cpm-np \]$'
    replace: '[ multiplier <multiplier> ] [ echo-receive <echo-interval> ] [ type cpm-np ]'
  - pattern: '\[ indirect <ip-address> \] \[ local-preference <local-pref> \] \] \[ description'
    replace: '[ indirect <ip-address> ] [ local-preference <local-pref> ] [ description'
  - pattern: '^cpu-protection <policy-id> \[ mac-monitoring \] \| \[ eth-cfm-monitoring \[ aggregate \] \[ car \] \]( \| \[ ip-src-monitoring \])?$'
    replace: 'cpu-protection <policy-id> [ { mac-monitoring | eth-cfm-monitoring [ aggregate ] [ car ] | ip-src-monitoring } ]'
  # 斜体 *global-field*:*local-field* 转换后被冒号拆开；配置里是一个词（64500:1）
  - pattern: '<global-field> : <local-field>'
    replace: '<global-field:local-field>'
    params: {'global-field:local-field': {type: word}}
