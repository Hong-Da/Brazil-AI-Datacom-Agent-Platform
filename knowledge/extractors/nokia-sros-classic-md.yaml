# Nokia SR OS Classic CLI Command Reference（25.10.R1）的命令卡抽取规则（M7-1 起步，M7-2 补管理面、OSPF、IS-IS、BGP、路由策略、MPLS / RSVP / LDP、SR）。
# 文档先由 DevelopDocs/设备产品文档/Nokia/tools/nokia_classic_to_md.py 从 HTML 转成 Markdown：
#   文件 = 完整上下文的前 3 个词（configure service … 取 4 个），例如 configure_router_static-route-entry.md；
#   每条命令一个 `## 命令名`，小节：### Syntax / Context / Full Context / View path / Description / Default / Parameters / Platforms。
#   View path 是 Full Context 去掉最后一个词（命令所在视图的路径），一条命令有多个上下文时每行一个。
name: nokia-sros-classic-md
family: nokia-sros-classic

sections:
  syntax: [Syntax]
  params: [Parameters]
  views: [View path]
  default: [Default]
  function: [Description]

negative_prefix: "no"
exclude_titles: '^(info|show|clear|debug|tools|monitor|admin)$'

# View path 每行一个，按行拆即可；这里给一个不会出现的分隔符，避免把路径里的空格当成分隔
views_split: '\x00'
views_map:
  - {match: '^configure$', view: configure}
  - {match: '^configure port$', view: port}
  - {match: '^configure port ethernet$', view: port-ethernet}
  - {match: '^configure lag$', view: lag}
  - {match: '^configure router$', view: router}
  - {match: '^configure router interface$', view: router-if}
  - {match: '^configure router static-route-entry$', view: static-route-entry}
  - {match: '^configure router static-route-entry next-hop$', view: static-nh}
  - {match: '^configure router static-route-entry indirect$', view: static-indirect}
  - {match: '^configure router static-route-entry black-hole$', view: static-bh}
  - {match: '^configure system$', view: system}
  - {match: '^configure system time$', view: system-time}
  - {match: '^configure system time ntp$', view: system-ntp}
  - {match: '^configure system security$', view: system-security}
  - {match: '^configure system snmp$', view: system-snmp}
  - {match: '^configure system security snmp$', view: security-snmp}
  - {match: '^configure system security ssh$', view: security-ssh}
  - {match: '^configure system security user$', view: security-user}
  - {match: '^configure system security tacplus$', view: security-tacplus}
  - {match: '^configure system security radius$', view: security-radius}
  - {match: '^configure system security management-access-filter$', view: security-maf}
  - {match: '^configure system security password$', view: security-password}
  - {match: '^configure system login-control$', view: login-control}
  - {match: '^configure log$', view: log}
  - {match: '^configure log syslog$', view: log-syslog}
  - {match: '^configure log log-id$', view: log-id}
  - {match: '^configure router ospf$', view: ospf}
  - {match: '^configure router ospf area$', view: ospf-area}
  - {match: '^configure router ospf area interface$', view: ospf-if}
  - {match: '^configure router isis$', view: isis}
  - {match: '^configure router isis interface$', view: isis-if}
  - {match: '^configure router isis level$', view: isis-level}
  - {match: '^configure router isis interface level$', view: isis-if-level}
  - {match: '^configure router bgp$', view: bgp}
  - {match: '^configure router bgp group$', view: bgp-group}
  - {match: '^configure router bgp group neighbor$', view: bgp-neighbor}
  - {match: '^configure router policy-options$', view: policy-options}
  - {match: '^configure router policy-options prefix-list$', view: prefix-list}
  - {match: '^configure router policy-options policy-statement$', view: policy-statement}
  - {match: '^configure router policy-options policy-statement entry$', view: policy-entry}
  - {match: '^configure router policy-options policy-statement entry from$', view: policy-from}
  - {match: '^configure router policy-options policy-statement entry action$', view: policy-action}
  - {match: '^configure router policy-options policy-statement default-action$', view: policy-default}
  - {match: '^configure router mpls$', view: mpls}
  - {match: '^configure router mpls interface$', view: mpls-if}
  - {match: '^configure router mpls path$', view: mpls-path}
  - {match: '^configure router mpls lsp$', view: mpls-lsp}
  - {match: '^configure router mpls lsp primary$', view: mpls-lsp-primary}
  - {match: '^configure router mpls lsp secondary$', view: mpls-lsp-secondary}
  - {match: '^configure router rsvp$', view: rsvp}
  - {match: '^configure router rsvp interface$', view: rsvp-if}
  - {match: '^configure router ldp$', view: ldp}
  - {match: '^configure router ldp interface-parameters$', view: ldp-if-params}
  - {match: '^configure router ldp interface-parameters interface$', view: ldp-if}
  - {match: '^configure router ldp interface-parameters interface ipv4$', view: ldp-if-ipv4}
  - {match: '^configure router ldp targeted-session$', view: ldp-targeted}
  - {match: '^configure router ldp targeted-session peer$', view: ldp-targeted-peer}
  - {match: '^configure router mpls-labels$', view: mpls-labels}
  - {match: '^configure router ospf segment-routing$', view: ospf-sr}
  - {match: '^configure router isis segment-routing$', view: isis-sr}

