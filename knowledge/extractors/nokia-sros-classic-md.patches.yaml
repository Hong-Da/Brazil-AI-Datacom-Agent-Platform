# Nokia SR OS Classic CLI Command Reference（25.10.R1）中的文档错误修正（每次抽取都会应用；被修正的卡在来源中注明 patched）
patches:
  - id: nokia-sros-classic.mode
    reason: 原文 port ethernet 的 mode 只列了 network | hybrid；7750 SR 的接入口写作 mode access（配置指南 Interface Configuration Guide 的端口举例与合成样本），补上 access
    set:
      syntax: mode { access | network | hybrid }
  - id: nokia-sros-classic.lacp
    reason: 原文把取值参数 mode 标成了关键字（参数表写明取值为 active / passive），运行配置写作 lacp active administrative-key 32768
    set:
      syntax: lacp [ { active | passive } ] [ administrative-key <admin-key> ] [ system-id <system-id> ] [ system-priority <priority> ]
      params: {admin-key: {type: integer, range: [1, 65535]}, system-id: {type: word}, priority: {type: integer, range: [0, 65535]}}
  # ---- M7-2 ----
  - id: nokia-sros-classic.system
    reason: 命令参考没有单列 configure 下进入 system 上下文的命令（system 下各命令的完整上下文都以 configure system 开头）；display-config 写作 system，块尾 exit
    add:
      id: nokia-sros-classic.system
      domain: mgmt
      view: configure
      syntax: system
      enters_view: system
  - id: nokia-sros-classic.ospf.1
    reason: 原文 ospf-instance 为必选、取值 1 to 31；基本实例 0 可以省略或写作 0（配置指南的举例有 ospf、ospf 0、ospf 0 10.20.1.6 三种写法）
    set:
      syntax: ospf [ <ospf-instance> [ <router-id> ] ]
      undo: no ospf [ <ospf-instance> ]
      params: {ospf-instance: {type: integer, range: [0, 31]}, router-id: {type: ipv4}}
  - id: nokia-sros-classic.shutdown@ospf-if
    reason: 命令参考 OSPF 的 shutdown 条目只列了 ospf3 的 area interface，漏了 OSPFv2 的 configure router ospf area interface（display-config 在每个 OSPF 接口下写 no shutdown）
    add:
      id: nokia-sros-classic.shutdown@ospf-if
      domain: ospf
      view: ospf-if
      syntax: shutdown
      undo: no shutdown
      default: no shutdown
  - id: nokia-sros-classic.cspf@mpls-lsp
    reason: 命令参考 25.10 没有收录 configure router mpls lsp 下的 cspf（MPLS Guide 的 LSP 配置举例有 cspf；写法 cspf [ use-te-metric ]）
    add:
      id: nokia-sros-classic.cspf@mpls-lsp
      domain: mpls
      view: mpls-lsp
      syntax: cspf [ use-te-metric ]
      undo: no cspf
      default: no cspf
  - id: nokia-sros-classic.begin
    reason: 原文写作 begin {exclusive}（花括号只有一项，等于必选）；exclusive 是可选的，display-config 在 policy-options 下写 begin
    set:
      syntax: begin [ exclusive ]
  # ---- M7-3 ----
  - id: nokia-sros-classic.service@configure
    reason: 命令参考没有单列 configure 下进入 service 上下文的命令（service 下各命令的完整上下文都以 configure service 开头）；display-config 写作 service，块尾 exit
    add:
      id: nokia-sros-classic.service@configure
      domain: service
      view: configure
      syntax: service
      enters_view: service
  - id: nokia-sros-classic.filter@configure
    reason: 命令参考没有单列 configure 下进入 filter 上下文的命令（完整上下文都以 configure filter 开头）；display-config 写作 filter，块尾 exit
    add:
      id: nokia-sros-classic.filter@configure
      domain: acl
      view: configure
      syntax: filter
      enters_view: filter
  - id: nokia-sros-classic.qos@configure
    reason: 命令参考没有单列 configure 下进入 qos 上下文的命令（完整上下文都以 configure qos 开头）；display-config 写作 qos，块尾 exit
    add:
      id: nokia-sros-classic.qos@configure
      domain: qos
      view: configure
      syntax: qos
      enters_view: qos
  - id: nokia-sros-classic.action.inline@ip-filter-entry
    reason: 命令参考 25.10 的 action 是上下文（action 下再写 drop / forward）；较早版本与配置指南的举例写作单行 action drop / action forward（Layer 2 Services and EVPN Guide 的 mac-filter 举例），两种写法都识别
    add:
      id: nokia-sros-classic.action.inline@ip-filter-entry
      domain: acl
      view: ip-filter-entry
      syntax: action { drop | forward }
      undo: no action
  - id: nokia-sros-classic.rsvp@vprn-abt-rf
    reason: vprn 下直接写的 auto-bind-tunnel 是旧版本写法（25.10 命令参考标为已废弃），其 resolution-filter 的条目里漏了 rsvp（bgp-ipvpn mpls 下的同名上下文有 rsvp）；旧版本配置常写 resolution-filter > rsvp
    add:
      id: nokia-sros-classic.rsvp@vprn-abt-rf
      domain: service
      view: vprn-abt-rf
      syntax: rsvp
      undo: no rsvp
  - id: nokia-sros-classic.src-ip@ip-filter-match
    reason: 命令参考的 src-ip 条目只列了 ipv6-filter / ip-exception / ipv6-exception 的完整上下文，漏了 configure filter ip-filter entry match（dst-ip 条目有；Router Configuration Guide 的 ip-filter entry 举例写 src-ip 192.168.1.1/32）；按 dst-ip 的 IPv4 写法补
    add:
      id: nokia-sros-classic.src-ip@ip-filter-match
      domain: acl
      view: ip-filter-match
      syntax: src-ip { <ip-address/mask> | <ip-address> <ipv4-address-mask> | ip-prefix-list <prefix-list-name> }
      undo: no src-ip
      params: {ip-address/mask: {type: prefix}, ip-address: {type: ipv4}, ipv4-address-mask: {type: mask}, prefix-list-name: {type: word}}
  # ---- M7-3（主 agent，增量变更）----
  - id: nokia-sros-classic.next-hop
    reason: 命令参考的 static-route-entry next-hop 条目（Base 路由器与 VPRN，各自批次里的编号都是 next-hop）没有列取消写法；增量变更删除静态路由要用 no next-hop <下一跳>
    set:
      undo: no next-hop { <ip-address> | <ip-int-name> | <ipv6-address> }
