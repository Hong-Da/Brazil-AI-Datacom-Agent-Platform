# 华为 VRP8 产品文档（Markdown 版）的命令卡抽取规则。
# 文档结构：每条命令一个标题，下面有 Function / Format / Parameters / Views / Default Level / Usage Guidelines / Example 小节。
# BGP 一章是每条命令一个文件；其余章节是整章一个文件，命令是其中的二级或三级标题。抽取器按“带 Format 小节的标题”识别命令。
name: huawei-vrp8-md
family: huawei-vrp8
doc_root_hint: 12_Reference/01_Command Reference/06_Command Reference

sections:
  syntax: [Format]
  params: [Parameters]
  views: [Views]
  function: [Function]
  default: []
  usage: [Usage Guidelines]
  example: [Example]

# Function 小节里“By default, …”那一句作为缺省值说明
default_regex: '(?:By default|The default (?:value|setting|configuration)[^.]*?is)[^.]*\.'
negative_prefix: undo

# 只要配置命令：排除查看、复位、调试、测试类命令
exclude_titles: '^(display|reset|debugging|undo debugging|terminal|ping|tracert|refresh|clear|save|compare|check|test|dir|cd|copy|delete|startup|schedule|quit|return|commit|abort|end)\b'

views_split: ',\s*|;\s*|\s+and\s+|/'

# 视图名 → views.yaml 中的视图编号（第一条命中生效；映射不上的视图丢弃，例如 IPv6 与多实例视图不在 0.1.0 范围内）
views_map:
  - {match: '^System view$', view: system}
  - {match: '^BGP view$', view: bgp}
  - {match: '^BGP-IPv4 unicast address family view$', view: bgp-af-ipv4}
  - {match: '^BGP-VPNv4 address family view$', view: bgp-af-vpnv4}
  - {match: '^BGP-VPN instance view$', view: bgp-vpn-instance}
  - {match: '^BGP-VPN instance IPv4 address family view$', view: bgp-af-vpn-instance-ipv4}
  - {match: '^VPN instance view$', view: vpn-instance}
  - {match: '^VPN instance IPv4 address family view$', view: vpn-instance-af-ipv4}
  - {match: '^Route-policy view$', view: route-policy}
  # 0.2.0：IGP、BFD、管理面
  - {match: '^OSPF view$', view: ospf}
  - {match: '^OSPF area view$', view: ospf-area}
  - {match: '^OSPF FRR view$', view: ospf-frr}
  - {match: '^IS-IS view$', view: isis}
  - {match: '^IS-IS FRR view$', view: isis-frr}
  - {match: '^BFD view$', view: bfd}
  - {match: '^BFD session view$', view: bfd-session}
  - {match: '^AAA view$', view: aaa}
  - {match: '^Authentication scheme view$', view: aaa-authentication}
  - {match: '^Authorization scheme view$', view: aaa-authorization}
  - {match: '^Accounting scheme view$', view: aaa-accounting}
  - {match: '^AAA domain view$', view: aaa-domain}
  - {match: '^Recording scheme view$', view: aaa-recording}
  - {match: '^HWTACACS server template view$', view: hwtacacs}
  - {match: '^RADIUS server group view$', view: radius}
  - {match: '^Local AAA server view$', view: local-aaa-server}
  - {match: '^VTY-type user interface view$', view: user-interface-vty}
  - {match: '^CONSOLE-type user interface view$', view: user-interface-con}
  # 0.3.0：MPLS LDP、L2VPN（VPWS / VPLS）、ACL、隧道策略、桥域
  - {match: '^MPLS view$', view: mpls}
  - {match: '^MPLS-LDP view$', view: mpls-ldp}
  - {match: '^MPLS-LDP-IPv4 view$', view: mpls-ldp-ipv4}
  - {match: '^Remote MPLS LDP peer view$', view: mpls-ldp-remote-peer}
  - {match: '^MPLS-L2VPN view$', view: mpls-l2vpn}
  - {match: '^PW template view$', view: pw-template}
  - {match: '^VSI(-AUTO|-BD|-DEFAULT|-STATIC)? view$', view: vsi}
  - {match: '^VSI-LDP view$', view: vsi-ldp}
  - {match: '^VSI-LDP-PW view$', view: vsi-ldp-pw}
  - {match: '^(Basic|Advanced) ACL view$', view: acl}
  - {match: '^Tunnel policy view$', view: tunnel-policy}
  - {match: '^Bridge domain view$', view: bridge-domain}
  # 各类接口视图（GE / 10GE / 50|100GE / Eth-Trunk / Loopback / 子接口 / 二层接口等）都归到通用的接口视图
  - {match: '(?i)^(?!.*(tunnel|mtunnel|cpos|serial|mp-group|global-ve|pw-ve|ve sub)).*(interface|sub-interface|-L2) view$', view: interface}

# 进入子视图的命令
enters:
  # 0.3.0 收紧为 interface 后跟空格：系统视图的 interface-mtu check-mode 等命令不进入接口视图
  - {view: system, syntax: '^interface( |$)', enters: interface}
  - {view: system, syntax: '^bgp\b', enters: bgp}
  - {view: system, syntax: '^ip vpn-instance\b', enters: vpn-instance}
  - {view: system, syntax: '^route-policy\b', enters: route-policy}
  - {view: vpn-instance, syntax: '^ipv4-family\b', enters: vpn-instance-af-ipv4}
  - {view: vpn-instance, syntax: '^ipv6-family\b', enters: vpn-instance-af-ipv6}
  - {view: bgp, syntax: '^ipv4-family unicast\b', enters: bgp-af-ipv4}
  - {view: bgp, syntax: '^ipv4-family vpnv4\b', enters: bgp-af-vpnv4}
  - {view: bgp, syntax: '^ipv4-family vpn-instance\b', enters: bgp-af-vpn-instance-ipv4}
  - {view: bgp, syntax: '^vpn-instance\b', enters: bgp-vpn-instance}
  # 其余 BGP 地址族（MVPN、VPNv6、EVPN 等，不在当前范围）：进入一个没有命令卡的视图，块内按原文保留，不会被算到 IPv4 单播里
  - {view: bgp, syntax: '^(ipv4-family|ipv6-family|l2vpn-ad-family|evpn|link-state-family|rpd-family)\b', enters: bgp-af-unsupported}
  - {view: system, syntax: '^ospf (<|\[)', enters: ospf}
  - {view: ospf, syntax: '^area\b', enters: ospf-area}
  - {view: ospf, syntax: '^frr$', enters: ospf-frr}
  - {view: system, syntax: '^isis (<|\[)', enters: isis}
  - {view: isis, syntax: '^frr$', enters: isis-frr}
  - {view: system, syntax: '^bfd$', enters: bfd}
  - {view: system, syntax: '^bfd <[^>]+> bind\b', enters: bfd-session}
  - {view: system, syntax: '^aaa$', enters: aaa}
  - {view: aaa, syntax: '^authentication-scheme\b', enters: aaa-authentication}
  - {view: aaa, syntax: '^authorization-scheme\b', enters: aaa-authorization}
  - {view: aaa, syntax: '^accounting-scheme\b', enters: aaa-accounting}
  - {view: aaa, syntax: '^domain <', enters: aaa-domain}
  - {view: aaa, syntax: '^recording-scheme\b', enters: aaa-recording}
  - {view: system, syntax: '^hwtacacs-server template\b', enters: hwtacacs}
  - {view: system, syntax: '^radius-server group\b', enters: radius}
  - {view: system, syntax: '^local-aaa-server$', enters: local-aaa-server}
  - {view: system, syntax: '^user-interface vty <', enters: user-interface-vty}
  - {view: system, syntax: '^user-interface con(sole)?\b', enters: user-interface-con}
  # 0.3.0
  - {view: system, syntax: '^mpls$', enters: mpls}
  - {view: system, syntax: '^mpls ldp$', enters: mpls-ldp}
  - {view: mpls-ldp, syntax: '^ipv4-family$', enters: mpls-ldp-ipv4}
  - {view: system, syntax: '^mpls ldp remote-peer ', enters: mpls-ldp-remote-peer}
  - {view: system, syntax: '^mpls l2vpn$', enters: mpls-l2vpn}
  - {view: system, syntax: '^pw-template <', enters: pw-template}
  - {view: system, syntax: '^vsi <', enters: vsi}
  - {view: vsi, syntax: '^pwsignal ldp$', enters: vsi-ldp}
  - {view: vsi-ldp, syntax: '^pw <', enters: vsi-ldp-pw}
  # acl ip-pool / acl port-pool 进入的是地址池视图（不在范围），只收紧到 acl [ number ] … 与 acl name …
  - {view: system, syntax: '^acl (\[ number \]|name) ', enters: acl}
  - {view: system, syntax: '^tunnel-policy <', enters: tunnel-policy}
  - {view: system, syntax: '^bridge-domain <', enters: bridge-domain}

# 参数类型推断：先按参数名，再按取值说明；第一条命中生效
param_types:
  - {name: '(mask-length|prefix-length|masklen)$', type: mask-length}
  - {name: 'wildcard', type: wildcard}
  - {name: '(^|-)mask$', type: mask}
  - {name: '(as-number|as-num|asn)$', type: asn}
  - {name: '(route-distinguisher|^rd$)', type: rd}
  - {name: '(vpn-target|vpn-target-value)$', type: rd}
  - {name: '(extcommunity|community-number|cmntyValue|community-value)$', type: community}
  - {name: '^(interface-type|interface-name|interface-type interface-number)$', type: word}
  - {name: '^interface-number$', type: word}
  - {name: '(ipv4-address|ip-address|peer-address|nexthop-address|next-hop|router-id|destination-address|source-address|ipv4)$', type: ipv4}
  - {name: '(description|desc-text|text|alias)$', type: text}
  - {value: 'integer[^.]*?(?:ranging from|ranges from|in the range of|in the range from|from)\s*(\d+)\s*(?:to|-)\s*(\d+)', type: integer, range_groups: [1, 2]}
  - {value: 'dotted decimal notation', type: ipv4}
  - {value: '\binteger\b', type: integer}

# 功能域 → 文件（路径相对上面的文档根，支持 * 通配；sections 只取这些章节）
domains:
  bgp:
    - {path: '09_IP Routing Commands/01_BGP Configuration Commands/*.md'}
  routing-policy:
    - {path: '09_IP Routing Commands/08_IP Routing Policy Configuration Commands.md'}
  static-route:
    - {path: '09_IP Routing Commands/12_IPv4 and IPv6 Static Route Configuration Commands.md'}
  vrf:
    - {path: '16_VPN Commands/03_BGP_MPLS IP VPN Configuration Commands.md'}
    - {path: '16_VPN Commands/05_VPN Tunnel Management Configuration Commands.md'}
    # IPv6 VPN 不在范围：只取 VPN 实例视图下进入 IPv6 地址族的命令，块内按原文保留
    - path: '16_VPN Commands/04_BGP_MPLS IPv6 VPN Configuration Commands.md'
      views_map: [{match: '^VPN instance view$', view: vpn-instance}, {match: '.', view: null}]
  interface:
    - path: '05_Interface and Data Link Commands.md'
      sections: [Ethernet Interface Configuration Commands, Basic Interface Configuration Commands]
    - {path: '08_IP Services Commands/14_IPv4 Basic Configuration Commands.md'}
    - path: '06_LAN Access and MAN Access Commands.md'
      sections: [Eth-Trunk Interface Configuration Commands, QinQ Configuration Commands, VLAN Configuration Commands, EVC Configuration Commands]
  # 0.2.0：IGP、BFD、管理面
  ospf:
    - {path: '09_IP Routing Commands/05_OSPF Configuration Commands.md'}
  isis:
    - {path: '09_IP Routing Commands/04_IS-IS Configuration Commands.md'}
  bfd:
    - path: '04_Network Reliability Commands.md'
      sections: [BFD Configuration Commands]
  mgmt:
    - {path: '02_System Management Commands/11_NTP Configuration Commands.md'}
    - {path: '02_System Management Commands/12_SNMP Configuration Commands.md'}
    - {path: '02_System Management Commands/10_Information Management Commands.md'}
    - {path: '18_Security Commands/19_SSH Configuration Commands.md'}
    - {path: '18_Security Commands/11_AAA and User Management Configuration Commands (Administrative User).md'}
    - path: '01_Basic Configurations Commands.md'
      sections: [Configuring User Login Commands, Configuring User Interface Commands]
  # 0.3.0：MPLS LDP（MPLS 一章中 MPLS TE / RSVP-TE 不在范围）、VPWS / VPLS、ACL；隧道策略属于 L3VPN 完善，归 vrf
  mpls:
    - path: '11_MPLS Commands.md'
      sections: [MPLS LDP Configuration Commands]
  l2vpn:
    - {path: '16_VPN Commands/01_VPWS Configuration Commands.md'}
    - {path: '16_VPN Commands/07_VPLS Configuration Commands.md'}
  acl:
    - {path: '08_IP Services Commands/17_ACL Configuration Commands.md'}

# 枚举类型参数：取值说明里列出的每一项（“- deny: …”）作为可选值
enum_marker: enumerated type
enum_item: '(?:^|\s)-\s*([\w\-]+)\s*:'
