      undo: "undo rule { <rule-id> [ to <end-rule-id> ] | [ name <rule-name> ] { permit | deny } { zero | <protocol> | gre | igmp | ip | ipinip | ospf | <7-16> | <18-255> } [ [ dscp { <dscp> | af11 | af12 | af13 | af21 | af22 | af23 | af31 | af32 | af33 | af41 | af42 | af43 | cs1 | cs2 | cs3 | cs4 | cs5 | cs6 | cs7 | default | ef } | [ tos { <value> | max-reliability | max-throughput | min-delay | min-monetary-cost | normal } | precedence { <precedence> | critical | flash | flash-override | immediate | internet | network | priority | routine } ] &<1-9> ] | { destination { <destination-ip-address> { <destination-wildcard> | 0 | <des-netmask> } | any } | destination-pool <destination-pool-name> } | [ fragment-type { fragment | fragment-subseq | non-fragment | non-subseq | fragment-spe-first } ] | { source { <source-ip-address> { <source-wildcard> | 0 | <src-netmask> } | any } | source-pool <source-pool-name> } | time-range <time-name> | [ vpn-instance <vpn-instance-name> | vpn-instance-any ] | packet-length { { gt | lt | eq | neq } <begin-pktlen> | range <begin-pktlen> <end-pktlen> } | ttl { { gt | lt | eq | neq } <ttl-value> | range <ttl-value> <ttl-value> } ] &<1-9> }"
