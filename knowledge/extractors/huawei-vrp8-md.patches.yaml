# 华为 ATN V800R025 命令参考中的文档错误修正（每次抽取都会应用；被修正的卡在来源中注明 patched）
patches:
  - id: huawei-vrp8.user-interface
    reason: 原文语法 “user-interface { ui-type | console first-ui-number }” 把类型与编号写乱了；运行配置中是 user-interface con 0
    set:
      syntax: user-interface { con | console } <first-ui-number>
      params: {first-ui-number: {type: integer, range: [0, 0]}}
      enters_view: user-interface-con
  - id: huawei-vrp8.interface-l2
    reason: 原文语法 “interface … { mode l2 }” 把关键字 mode 排成了参数（<mode>），规范渲染与翻译写不出 mode l2；运行配置中是 interface GigabitEthernet0/2/1.101 mode l2
    set:
      syntax: interface { <interface-name> | <interface-type> <interface-number> } mode l2
      params: {interface-name: {type: word}, interface-type: {type: word}, interface-number: {type: word}}
  - id: huawei-vrp8.rule~3
    reason: 原文的源端口与目的端口条件用了同名参数 port-number（端口名还是关键字），映射分不开源 / 目的端口；改成各自的运算符与端口参数（端口取值可以是数字或端口名）。取消写法并入文档另列的 undo rule <rule-id> [ to <end-rule-id> ]（M4-2，变更脚本按编号删除规则）
    set:
      syntax: "rule [ <rule-id> ] [ name <rule-name> ] { permit | deny } { tcp | <6> } [ [ dscp { <dscp> | af11 | af12 | af13 | af21 | af22 | af23 | af31 | af32 | af33 | af41 | af42 | af43 | cs1 | cs2 | cs3 | cs4 | cs5 | cs6 | cs7 | default | ef } | [ precedence { <precedence> | critical | flash | flash-override | immediate | internet | network | priority | routine } | tos { <tos> | max-reliability | max-throughput | min-delay | min-monetary-cost | normal } ] &<1-9> ] | { destination { <destination-ip-address> { <destination-wildcard> | 0 | <des-netmask> } | any } | destination-pool <destination-pool-name> } | { destination-port { range <dst-port-begin> <dst-port-end> | <dst-port-op> <dst-port> } | destination-port-pool <destination-port-pool-name> } | [ fragment-type { fragment | fragment-subseq | non-fragment | non-subseq | fragment-spe-first } ] | { source { <source-ip-address> { <source-wildcard> | 0 | <src-netmask> } | any } | source-pool <source-pool-name> } | { source-port { range <src-port-begin> <src-port-end> | <src-port-op> <src-port> } | source-port-pool <source-port-pool-name> } | { syn-flag | tcp-flag } { <tcp-flag> [ mask <mask-value> ] | established | { ack [ fin | psh | rst | syn | urg ] &<1-9> } | { fin [ ack | psh | rst | syn | urg ] &<1-9> } | { psh [ fin | ack | rst | syn | urg ] &<1-9> } | { rst [ fin | psh | ack | syn | urg ] &<1-9> } | { syn [ fin | psh | rst | ack | urg ] &<1-9> } | { urg [ fin | psh | rst | syn | ack ] &<1-9> } } | [ vpn-instance <vpn-instance-name> | vpn-instance-any ] | time-range <time-name> | packet-length { { gt | lt | eq | neq } <begin-pktlen> | range <begin-pktlen> <end-pktlen> } | ttl { { gt | lt | eq | neq } <ttl-value> | range <ttl-value> <ttl-value> } ] &<1-9>"
      undo: "undo rule { <rule-id> [ to <end-rule-id> ] | [ name <rule-name> ] { permit | deny } { tcp | <6> } [ [ dscp { <dscp> | af11 | af12 | af13 | af21 | af22 | af23 | af31 | af32 | af33 | af41 | af42 | af43 | cs1 | cs2 | cs3 | cs4 | cs5 | cs6 | cs7 | default | ef } | [ precedence { <precedence> | critical | flash | flash-override | immediate | internet | network | priority | routine } | tos { <tos> | max-reliability | max-throughput | min-delay | min-monetary-cost | normal } ] &<1-9> ] | { destination { <destination-ip-address> { <destination-wildcard> | 0 | <des-netmask> } | any } | destination-pool <destination-pool-name> } | { destination-port { range <dst-port-begin> <dst-port-end> | <dst-port-op> <dst-port> } | destination-port-pool <destination-port-pool-name> } | [ fragment-type { fragment | fragment-subseq | non-fragment | non-subseq | fragment-spe-first } ] | { source { <source-ip-address> { <source-wildcard> | 0 | <src-netmask> } | any } | source-pool <source-pool-name> } | { source-port { range <src-port-begin> <src-port-end> | <src-port-op> <src-port> } | source-port-pool <source-port-pool-name> } | tcp-flag { <tcp-flag> [ mask <mask-value> ] | established | { ack [ fin | psh | rst | syn | urg ] &<1-9> } | { fin [ ack | psh | rst | syn | urg ] &<1-9> } | { psh [ fin | ack | rst | syn | urg ] &<1-9> } | { rst [ fin | psh | ack | syn | urg ] &<1-9> } | { syn [ fin | psh | rst | ack | urg ] &<1-9> } | { urg [ fin | psh | rst | syn | ack ] &<1-9> } } | [ vpn-instance <vpn-instance-name> | vpn-instance-any ] | time-range <time-name> | packet-length { { gt | lt | eq | neq } <begin-pktlen> | range <begin-pktlen> <end-pktlen> } | ttl { { gt | lt | eq | neq } <ttl-value> | range <ttl-value> <ttl-value> } ] &<1-9> }"
      params: {"rule-id": {"type": "integer", "range": [0, 4294967294]}, "rule-name": {"type": "word"}, "6": {"type": "word"}, "dscp": {"type": "integer", "range": [0, 63]}, "precedence": {"type": "integer", "range": [0, 7]}, "tos": {"type": "integer", "range": [0, 15]}, "destination-ip-address": {"type": "ipv4"}, "destination-wildcard": {"type": "wildcard"}, "des-netmask": {"type": "integer", "range": [1, 32]}, "destination-pool-name": {"type": "word"}, "destination-port-pool-name": {"type": "word"}, "source-ip-address": {"type": "ipv4"}, "source-wildcard": {"type": "wildcard"}, "src-netmask": {"type": "integer", "range": [1, 32]}, "source-pool-name": {"type": "word"}, "source-port-pool-name": {"type": "word"}, "tcp-flag": {"type": "integer", "range": [0, 63]}, "mask-value": {"type": "integer", "range": [0, 63]}, "vpn-instance-name": {"type": "word"}, "time-name": {"type": "word"}, "begin-pktlen": {"type": "integer", "range": [0, 65535]}, "end-pktlen": {"type": "integer", "range": [0, 65535]}, "ttl-value": {"type": "integer", "range": [1, 255]}, "src-port-op": {"type": "enum", "choices": ["gt", "lt", "eq", "neq"]}, "src-port": {"type": "word"}, "src-port-begin": {"type": "word"}, "src-port-end": {"type": "word"}, "dst-port-op": {"type": "enum", "choices": ["gt", "lt", "eq", "neq"]}, "dst-port": {"type": "word"}, "dst-port-begin": {"type": "word"}, "dst-port-end": {"type": "word"}, "end-rule-id": {"type": "integer", "range": [0, 4294967294]}}
