# Cisco IOS / IOS XE 公开命令参考（整理成 Markdown，每条命令一个文件）的命令卡抽取规则。
# 文件结构：# 命令名 / ## Syntax / ## Syntax Description / ## Command Default / ## Command Modes / ## Usage Guidelines / ## Examples
name: cisco-iosxe-md
family: cisco-iosxe

sections:
  syntax: [Syntax]
  params: [Syntax Description]
  views: [Command Modes]
  default: [Command Default]
  function: [Description]
  usage: [Usage Guidelines]
  example: [Examples]

negative_prefix: "no"
exclude_titles: '^(show|clear|debug|undebug|ping|traceroute|copy|write|reload|terminal)\b'

# Command Modes 例如 “Router configuration (config-router)”，按括号里的模式名映射
views_split: ',\s*|;\s*|\s+and\s+|/|\s+or\s+'
views_map:
  - {match: '\(config\)', view: system}
  - {match: '\(config-(if|subif)\)', view: interface}
  - {match: '\(config-if-s(rv|vc)\)', view: service-instance}
  - {match: '\(config-vrf\)', view: vrf}
  - {match: '\(config-vrf-af\)', view: vrf-af}
  - {match: '\(config-router\)', view: router-bgp}
  - {match: '\(config-(router-)?af\)', view: bgp-af}
  - {match: '\(config-route-map\)', view: route-map}
  # 0.2.0：管理面的配置模式（OSPF / IS-IS 的路由器模式在功能域的 views_map 里按功能域映射）
  - {match: '\(config-line\)|^Line configuration', view: line}
  - {match: '\(config-server-tacacs\)|^TACACS\+ server configuration', view: tacacs-server}
  - {match: '\(config-radius-server\)|^RADIUS server configuration', view: radius-server}
  - {match: '\(config-sg-tacacs\+\)|^TACACS\+ group server configuration', view: sg-tacacs}
  - {match: '^Global configuration', view: system}
  - {match: '^Interface configuration', view: interface}
  - {match: '^Router configuration', view: router-bgp}
  - {match: '^Address family configuration', view: bgp-af}
  - {match: '^Route-map configuration', view: route-map}

# 视图别名：BGP 的 neighbor 等命令在路由器模式与地址族模式下都有效，文档往往只列了一个
view_aliases:
  router-bgp: [bgp-af]

enters:
  - {view: system, syntax: '^interface\b', enters: interface}
  - {view: interface, syntax: '^service instance\b', enters: service-instance}
  - {view: system, syntax: '^vrf definition\b', enters: vrf}
  - {view: vrf, syntax: '^address-family\b', enters: vrf-af}
  - {view: system, syntax: '^router bgp\b', enters: router-bgp}
  - {view: router-bgp, syntax: '^address-family\b', enters: bgp-af}
  - {view: system, syntax: '^route-map\b', enters: route-map}
  - {view: system, syntax: '^router ospf\b', enters: router-ospf}
  - {view: system, syntax: '^router isis\b', enters: router-isis}
  - {view: system, syntax: '^line\b', enters: line}
  - {view: system, syntax: '^tacacs server\b', enters: tacacs-server}
  - {view: system, syntax: '^radius server\b', enters: radius-server}
  - {view: system, syntax: '^aaa group server tacacs\+', enters: sg-tacacs}

param_types:
  - {name: '(mask-length|prefix-length|length)$', type: mask-length}
  - {name: 'wildcard', type: wildcard}
  - {name: '(^|-)mask$|^mask$', type: mask}
  - {name: '(autonomous-system|as-number|asn)', type: asn}
  - {name: '(route-distinguisher|^rd$)', type: rd}
  - {name: '(ip-address|ipv4-address|address|prefix|next-hop|router-id)$', type: ipv4}
  - {name: '(text|string|description|line)$', type: text}
  - {value: 'range (?:is |from )?(\d+)\s*(?:to|-|through)\s*(\d+)', type: integer, range_groups: [1, 2]}
  - {value: '\binteger\b', type: integer}

domains:
  bgp:
    - {path: 'bgp/*.md'}
  routing-policy:
    - {path: 'routing-policy/*.md'}
  static-route:
    - {path: 'static-route/*.md'}
  vrf:
    - {path: 'vrf/*.md'}
  interface:
    - {path: 'interface/*.md'}
    - {path: 'carrier-ethernet/*.md'}
  # 0.2.0：IGP、BFD、管理面（协议无关的 passive-interface、bfd all-interfaces、mpls ldp sync 两个 IGP 各抽一份）
  ospf:
    - {path: 'ospf/*.md', views_map: [{match: '\(config[- ]router\)|^Router configuration', view: router-ospf}]}
    - {path: 'bfd/bfd all-interfaces.md', views_map: [{match: '\(config[- ]router\)|^Router configuration', view: router-ospf}]}
  isis:
    - {path: 'isis/*.md', views_map: [{match: '\(config[- ]router\)|^Router configuration', view: router-isis}]}
    - {path: 'ospf/passive-interface.md', views_map: [{match: '\(config[- ]router\)|^Router configuration', view: router-isis}]}
    - {path: 'ospf/mpls ldp sync.md', views_map: [{match: '\(config[- ]router\)|^Router configuration', view: router-isis}]}
    - {path: 'bfd/bfd all-interfaces.md', views_map: [{match: '\(config[- ]router\)|^Router configuration', view: router-isis}]}
  bfd:
    - {path: 'bfd/bfd.md'}
    - {path: 'bfd/bfd template.md'}
    - {path: 'bfd/bfd-template.md'}
    - {path: 'bfd/bfd echo.md'}
  mgmt:
    - {path: 'mgmt/*.md'}

# 统一改写：运行配置中接口名、前缀都是一个词，文档把它们拆成了两个参数
syntax_rewrites:
  - pattern: '<interface-type> <interface-number>'
    replace: '<interface>'
    params: {interface: {type: interface}}
  - pattern: '<interface> <interface-number>'
    replace: '<interface>'
    params: {interface: {type: interface}}
  - pattern: '^interface <type> <number>$'
    replace: 'interface <interface>'
    params: {interface: {type: interface}}
  - pattern: '<network> / <length>'
    replace: '<prefix>'
    params: {prefix: {type: prefix}}
