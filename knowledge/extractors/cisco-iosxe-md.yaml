# Cisco IOS / IOS XE 公开命令参考（整理成 Markdown，每条命令一个文件）的命令卡抽取规则。
# 文件结构：# 命令名 / ## Syntax / ## Syntax Description / ## Command Default / ## Command Modes / ## Usage Guidelines / ## Examples
name: cisco-iosxe-md
family: cisco-iosxe

sections:
  syntax: [Syntax]
  params: [Syntax Description]
  views: [Command Modes]
  default: [Command Default]
  function: [Description]
  usage: [Usage Guidelines]
  example: [Examples]

negative_prefix: "no"
exclude_titles: '^(show|clear|debug|undebug|ping|traceroute|copy|write|reload|terminal)\b'

# Command Modes 例如 “Router configuration (config-router)”，按括号里的模式名映射
views_split: ',\s*|;\s*|\s+and\s+|/|\s+or\s+'
views_map:
  - {match: '\(config\)', view: system}
  - {match: '\(config-(if|subif)\)', view: interface}
  - {match: '\(config-if-s(rv|vc)\)', view: service-instance}
  - {match: '\(config-vrf\)', view: vrf}
  - {match: '\(config-vrf-af\)', view: vrf-af}
  - {match: '\(config-router\)', view: router-bgp}
  - {match: '\(config-(router-)?af\)', view: bgp-af}
  - {match: '\(config-route-map\)', view: route-map}
  # 0.2.0：管理面的配置模式（OSPF / IS-IS 的路由器模式在功能域的 views_map 里按功能域映射）
  - {match: '\(config-line\)|^Line configuration', view: line}
  - {match: '\(config-server-tacacs\)|^TACACS\+ server configuration', view: tacacs-server}
  - {match: '\(config-radius-server\)|^RADIUS server configuration', view: radius-server}
  - {match: '\(config-sg-tacacs\+\)|^TACACS\+ group server configuration', view: sg-tacacs}
  - {match: '^Global configuration', view: system}
  - {match: '^Interface configuration', view: interface}
  - {match: '^Router configuration', view: router-bgp}
  - {match: '^Address family configuration', view: bgp-af}
  - {match: '^Route-map configuration', view: route-map}

# 视图别名：BGP 的 neighbor 等命令在路由器模式与地址族模式下都有效，文档往往只列了一个
view_aliases:
  router-bgp: [bgp-af]

enters:
  - {view: system, syntax: '^interface\b', enters: interface}
  - {view: interface, syntax: '^service instance\b', enters: service-instance}
  - {view: system, syntax: '^vrf definition\b', enters: vrf}
  - {view: vrf, syntax: '^address-family\b', enters: vrf-af}
  - {view: system, syntax: '^router bgp\b', enters: router-bgp}
  - {view: router-bgp, syntax: '^address-family\b', enters: bgp-af}
  - {view: system, syntax: '^route-map\b', enters: route-map}
  - {view: system, syntax: '^router ospf\b', enters: router-ospf}
  - {view: system, syntax: '^router isis\b', enters: router-isis}
  - {view: system, syntax: '^line\b', enters: line}
  - {view: system, syntax: '^tacacs server\b', enters: tacacs-server}
  - {view: system, syntax: '^radius server\b', enters: radius-server}
  - {view: system, syntax: '^aaa group server tacacs\+', enters: sg-tacacs}
  # 0.3.0：L2VPN（VPWS / VPLS）与 ACL
  - {view: system, syntax: '^pseudowire-class <', enters: pseudowire-class}
  - {view: interface, syntax: '^xconnect <', enters: xconnect}
  - {view: service-instance, syntax: '^xconnect <', enters: xconnect}
  - {view: system, syntax: '^l2vpn xconnect context <', enters: l2vpn-xconnect}
  - {view: system, syntax: '^l2vpn vfi context <', enters: vfi}
  - {view: system, syntax: '^l2 vfi <[^>]+> manual', enters: vfi}
  - {view: system, syntax: '^bridge-domain \{ <bridge-id>', enters: bridge-domain}
  - {view: system, syntax: '^l2vpn$', enters: l2vpn}
  - {view: system, syntax: '^ip access-list \{', enters: acl}
  - {view: interface, syntax: '^vrrp <[^>]+> address-family', enters: vrrp}
  - {view: system, syntax: '^class-map\b', enters: class-map}
  - {view: system, syntax: '^policy-map\b', enters: policy-map}
  - {view: policy-map, syntax: '^class\b', enters: policy-map-class}
  - {view: system, syntax: '^ptp clock\b', enters: ptp-clock}
  - {view: ptp-clock, syntax: '^clock-port\b', enters: ptp-port}

param_types:
  - {name: '(mask-length|prefix-length|length)$', type: mask-length}
  - {name: 'wildcard', type: wildcard}
  - {name: '(^|-)mask$|^mask$', type: mask}
  - {name: '(autonomous-system|as-number|asn)', type: asn}
  - {name: '(route-distinguisher|^rd$)', type: rd}
  - {name: '(ip-address|ipv4-address|address|prefix|next-hop|router-id)$', type: ipv4}
  - {name: '(text|string|description|line)$', type: text}
  - {value: 'range (?:is |from )?(\d+)\s*(?:to|-|through)\s*(\d+)', type: integer, range_groups: [1, 2]}
  - {value: '\binteger\b', type: integer}

domains:
  bgp:
    - {path: 'bgp/*.md'}
  routing-policy:
    - {path: 'routing-policy/*.md'}
  static-route:
    - {path: 'static-route/*.md'}
  vrf:
    - {path: 'vrf/*.md'}
  interface:
    - {path: 'interface/*.md'}
    - {path: 'carrier-ethernet/*.md'}
  # 0.2.0：IGP、BFD、管理面（协议无关的 passive-interface、bfd all-interfaces、mpls ldp sync 两个 IGP 各抽一份）
  ospf:
    - {path: 'ospf/*.md', views_map: [{match: '\(config[- ]router\)|^Router configuration', view: router-ospf}]}
    - {path: 'bfd/bfd all-interfaces.md', views_map: [{match: '\(config[- ]router\)|^Router configuration', view: router-ospf}]}
  isis:
    - {path: 'isis/*.md', views_map: [{match: '\(config[- ]router\)|^Router configuration', view: router-isis}]}
    - {path: 'ospf/passive-interface.md', views_map: [{match: '\(config[- ]router\)|^Router configuration', view: router-isis}]}
    - {path: 'ospf/mpls ldp sync.md', views_map: [{match: '\(config[- ]router\)|^Router configuration', view: router-isis}]}
    - {path: 'bfd/bfd all-interfaces.md', views_map: [{match: '\(config[- ]router\)|^Router configuration', view: router-isis}]}
  bfd:
    - {path: 'bfd/bfd.md'}
    - {path: 'bfd/bfd template.md'}
    - {path: 'bfd/bfd-template.md'}
    - {path: 'bfd/bfd echo.md'}
  mgmt:
    - {path: 'mgmt/*.md'}
  # 0.3.0：MPLS LDP、L2VPN（VPWS / VPLS）、ACL（L3VPN 完善的 mpls label mode、maximum routes 在 vrf/ 目录，随 vrf 功能域）
  mpls:
    - {path: 'mpls/*.md'}
  l2vpn:
    # 同一页同时列了接口模式与 pw-class / 模板模式的命令（encapsulation、preferred-path），只取 pw-class 模式
    - path: 'l2vpn/encapsulation (pseudowire).md'
      views_map: [{match: '\(config-pw-class\)', view: pseudowire-class}, {match: '.', view: null}]
    - path: 'l2vpn/preferred-path.md'
      views_map: [{match: '\(config-pw-class\)', view: pseudowire-class}, {match: '.', view: null}]
    # 其余页面（signaling protocol 只用于 interface pseudowire，不收）
    - path: 'l2vpn/backup peer.md'
      views_map: &l2vpn_views
        - {match: '\(config-pw-class\)', view: pseudowire-class}
        - {match: '\(config-if-xconn\)', view: xconnect}
        - {match: '\(config-xconnect\)', view: l2vpn-xconnect}
        - {match: '\(config-vfi\)', view: vfi}
        - {match: '\(config-bdomain\)', view: bridge-domain}
        - {match: '\(config-conn\)|\(xconnect-conn-config\)|\(config-template\)', view: null}
    - {path: 'l2vpn/control-word.md', views_map: *l2vpn_views}
    - {path: 'l2vpn/description (l2 vfi).md', views_map: *l2vpn_views}
    - {path: 'l2vpn/l2 vfi manual.md', views_map: *l2vpn_views}
    - {path: 'l2vpn/l2vpn vfi context.md', views_map: *l2vpn_views}
    - {path: 'l2vpn/l2vpn xconnect context.md', views_map: *l2vpn_views}
    - {path: 'l2vpn/l2vpn.md', views_map: *l2vpn_views}
    - {path: 'l2vpn/member (bridge-domain).md', views_map: *l2vpn_views}
    - {path: 'l2vpn/member (l2vpn vfi).md', views_map: *l2vpn_views}
    - {path: 'l2vpn/member (xconnect).md', views_map: *l2vpn_views}
    - {path: 'l2vpn/neighbor (VPLS).md', views_map: *l2vpn_views}
    - {path: 'l2vpn/pseudowire-class.md', views_map: *l2vpn_views}
    - {path: 'l2vpn/vpn id (mpls).md', views_map: *l2vpn_views}
    - {path: 'l2vpn/xconnect.md', views_map: *l2vpn_views}
  acl:
    - path: 'acl/*.md'
      views_map: [{match: 'access.list configuration|\(config-(std|ext)-nacl\)', view: acl}]
  # 0.4.0（M4-2）：QoS（MQC：class-map / policy-map / class / 动作，接口与 class 下的 service-policy）
  qos:
    - path: 'qos/*.md'
      views_map:
        - {match: '\(config-cmap\)|^(QoS )?[Cc]lass-map configuration', view: class-map}
        - {match: '\(config-pmap-c\)|^(QoS )?[Pp]olicy-map class( configuration)?$|^QoS p ?olicy-map class', view: policy-map-class}
        - {match: '\(config-pmap\)|^Policy-map configuration', view: policy-map}
        - {match: '\(config-pmap-c-police\)|\(config-if-spolicy-inline\)|[Pp]olicy inline|ATM|config-if-srv|Ethernet service', view: null}
  # 0.4.0（M4-2）：SR-MPLS（公开命令参考只有 IS-IS 书的 microloop avoidance；其余命令按 ASR 920 SR 配置指南由修正文件补充）
  sr:
    - {path: 'segment-routing/*.md', views_map: [{match: '\(router-config\)|\(config[- ]router\)|^Router configuration', view: router-isis}]}
  # 0.4.0（M4-2）：EVPN（公开命令参考只有 BGP 书的 address-family l2vpn；其余按 ASR 920 EVPN 配置指南由修正文件补充）
  evpn:
    - path: 'evpn/*.md'
      views_map: [{match: '\(config-router\)|^Router configuration', view: router-bgp}]
  # 0.4.0（M4-2）：时钟同步（PTP、同步以太 network-clock / ESMC）
  clock:
    - path: 'timing/*.md'
      views_map:
        - {match: '\(config-ptp-port\)|PTP (clock[- ])?port configuration', view: ptp-port}
        - {match: '\(config-ptp-clk\)|PTP clock configuration', view: ptp-clock}
  # 0.4.0（M4-2）：VRRP（VRRPv2 接口模式写法与 VRRPv3 的 vrrp <组> address-family 子模式）
  vrrp:
    - path: 'vrrp/*.md'
      views_map: [{match: '\(config-if-vrrp\)|^VRRP configuration', view: vrrp}]

# 统一改写：运行配置中接口名、前缀都是一个词，文档把它们拆成了两个参数
syntax_rewrites:
  - pattern: '<interface-type> <interface-number>'
    replace: '<interface>'
    params: {interface: {type: interface}}
  - pattern: '<interface> <interface-number>'
    replace: '<interface>'
    params: {interface: {type: interface}}
  - pattern: '^interface <type> <number>$'
    replace: 'interface <interface>'
    params: {interface: {type: interface}}
  - pattern: '<network> / <length>'
    replace: '<prefix>'
    params: {prefix: {type: prefix}}
