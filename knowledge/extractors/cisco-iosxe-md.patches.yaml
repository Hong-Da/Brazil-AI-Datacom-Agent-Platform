# Cisco 公开命令参考中的文档错误修正（每次抽取都会应用；被修正的卡在来源中注明 patched）
patches:
  - id: cisco-iosxe.route-map
    reason: 原文把 ordering-seq 写成了必选；运行配置中是 route-map 名称 permit|deny 序号
    set:
      syntax: route-map <map-tag> [ permit | deny ] [ <sequence-number> ]
      params: {map-tag: {type: word}, sequence-number: {type: integer, range: [0, 65535]}}
      undo: no route-map <map-tag> { permit | deny } [ <sequence-number> ]
  - id: cisco-iosxe.mtu
    reason: 原文语法行混入了说明文字（mtu command）
    set:
      syntax: mtu <bytes>
      params: {bytes: {type: integer, range: [64, 9216]}}
  - id: cisco-iosxe.rewrite-ingress-tag.1
    reason: 原文第一条语法的分隔符错乱，按 Syntax Description 与配置举例改写
    set:
      syntax: rewrite ingress tag { pop { 1 | 2 } | push dot1q <vlan-id> [ second-dot1q <second-vlan-id> ] | translate 1-to-1 dot1q <vlan-id> } [ symmetric ]
      params: {vlan-id: {type: integer, range: [1, 4094]}, second-vlan-id: {type: integer, range: [1, 4094]}}
  - id: cisco-iosxe.channel-group.1
    reason: IOS 运行配置中可以只有组号（公开样本 Batfish 如此），mode 改为可选
    set:
      syntax: channel-group <channel-group-number> [ mode { active | on | passive } ]
      params: {channel-group-number: {type: integer, range: [1, 64]}}
  - id: cisco-iosxe.match-ip-address
    reason: 原文用 “. . .” 表示可重复，改成 &<1-32> 重复写法
    set:
      syntax: match ip address { prefix-list { <prefix-list-name> } &<1-32> | { <access-list> } &<1-32> }
      params: {prefix-list-name: {type: word}, access-list: {type: word}}
  - id: cisco-iosxe.set-extcommunity-rt
    reason: 原文用 “. . .” 表示可重复，且 additive 拼写为 additiive
    set:
      syntax: set extcommunity rt { { <extended-community-value> } &<1-32> | range <start-range-value> <end-range-value> } [ additive ]
      params: {extended-community-value: {type: rd}, start-range-value: {type: rd}, end-range-value: {type: rd}}
  - id: cisco-iosxe.address-family-vpnv4
    reason: 原文把可选的 multicast | unicast 写成了连续的关键字
    set:
      syntax: address-family vpnv4 [ multicast | unicast ]
      enters_view: bgp-af
  # 以下是文档中缺失、按 Cisco 配置指南与运行配置写法补充的命令卡
  - reason: vrf/address-family 页面错误（内容是 VPN-IPv4），VRF 下的 IPv4 地址族按 IOS-XE 运行配置补充
    add:
      id: cisco-iosxe.vrf-address-family-ipv4
      domain: vrf
      view: vrf
      syntax: address-family { ipv4 | ipv6 } [ unicast ]
      enters_view: vrf-af
      undo: no address-family { ipv4 | ipv6 } [ unicast ]
  - reason: 公开命令参考没有业务实例模式下的 description 页面，按 ASR 920 配置指南补充
    add:
      id: cisco-iosxe.service-instance-description
      domain: interface
      view: service-instance
      syntax: description <text>
      params: {text: {type: text}}
  - reason: Command Modes 写成 config-if-svc 的旧写法之外，ASR 920 运行配置中 bridge-domain 只带编号
    add:
      id: cisco-iosxe.service-instance-bridge-domain
      domain: interface
      view: service-instance
      syntax: bridge-domain <bridge-id> [ split-horizon [ group <group-id> ] ]
      params: {bridge-id: {type: integer, range: [1, 16000]}, group-id: {type: integer}}
  - reason: 公开命令参考中的 redistribute 页面是 IS-IS 写法（level 必选）；补充 BGP 下常用的写法
    add:
      id: cisco-iosxe.bgp-redistribute
      domain: bgp
      view: bgp-af
      syntax: redistribute { connected | static | ospf <process-id> [ match { internal | external [ 1 | 2 ] | nssa-external [ 1 | 2 ] } &<1-6> ] | eigrp <eigrp-as> | isis [ <area-tag> ] } [ metric <metric-value> ] [ route-map <map-tag> ]
      undo: no redistribute { connected | static | ospf <process-id> | eigrp <eigrp-as> | isis [ <area-tag> ] }
      params: {process-id: {type: integer, range: [1, 65535]}, eigrp-as: {type: integer, range: [1, 65535]}, metric-value: {type: integer}, map-tag: {type: word}, area-tag: {type: word}}
  - id: cisco-iosxe.neighbor-weight
    reason: 原文把权重值 number 写成了关键字
    set:
      syntax: neighbor { <ip-address> | <peer-group-name> } weight <number>
      params: {ip-address: {type: ipv4}, peer-group-name: {type: word}, number: {type: integer, range: [0, 65535]}}
  - reason: 公开命令参考缺少 BGP Additional Paths 的 neighbor 命令，按 IOS-XE BGP 配置指南补充
    add:
      id: cisco-iosxe.neighbor-advertise-additional-paths
      domain: bgp
      view: bgp-af
      syntax: neighbor { <ip-address> | <peer-group-name> } advertise additional-paths { all | best <number> | group-best } &<1-3>
      params: {ip-address: {type: ipv4}, peer-group-name: {type: word}, number: {type: integer, range: [2, 3]}}
  - reason: 公开命令参考缺少 neighbor log-neighbor-changes，按 IOS-XE BGP 配置指南补充
    add:
      id: cisco-iosxe.neighbor-log-neighbor-changes
      domain: bgp
      view: bgp-af
      syntax: neighbor { <ip-address> | <peer-group-name> } log-neighbor-changes [ disable ]
      params: {ip-address: {type: ipv4}, peer-group-name: {type: word}}
  - reason: 公开命令参考缺少 neighbor fall-over，按 IOS-XE BGP 配置指南补充
    add:
      id: cisco-iosxe.neighbor-fall-over
      domain: bgp
      view: router-bgp
      syntax: neighbor { <ip-address> | <peer-group-name> } fall-over [ bfd [ single-hop | multi-hop ] | route-map <map-name> ]
      params: {ip-address: {type: ipv4}, peer-group-name: {type: word}, map-name: {type: word}}
  - reason: 同上，地址族模式下也可出现（show running-config all 的写法）
    add:
      id: cisco-iosxe.neighbor-fall-over@bgp-af
      domain: bgp
      view: bgp-af
      syntax: neighbor { <ip-address> | <peer-group-name> } fall-over [ bfd [ single-hop | multi-hop ] | route-map <map-name> ]
      params: {ip-address: {type: ipv4}, peer-group-name: {type: word}, map-name: {type: word}}
  - reason: 公开命令参考缺少 bgp default ipv6-nexthop 与 bgp default route-target filter，按 IOS-XE BGP 命令参考补充
    add:
      id: cisco-iosxe.bgp-default-misc
      domain: bgp
      view: router-bgp
      syntax: bgp default { ipv6-nexthop | route-target filter }
  # ---------- 0.2.0：管理面 ----------
  - id: cisco-iosxe.exec-timeout
    reason: 原文 “exec-timeout minutes [seconds]” 把 seconds 写成了关键字；运行配置中是 exec-timeout 0 0
    set:
      syntax: exec-timeout <minutes> [ <seconds> ]
      params: {minutes: {type: integer, range: [0, 35791]}, seconds: {type: integer, range: [0, 2147483]}}
  - id: cisco-iosxe.aaa-authentication-login
    reason: 原文方法列表写成 “method1 [method2...]”；按运行配置改为最多 4 个方法
    set:
      syntax: aaa authentication login { default | <list-name> } <method1> [ <method2> [ <method3> [ <method4> ] ] ]
  - id: cisco-iosxe.ip-ssh
    reason: 原文关键字写作 timeout，设备上是 time-out；两个参数各自独立成行
    set:
      syntax: ip ssh { time-out <seconds> | authentication-retries <retries> }
      params: {seconds: {type: integer, range: [1, 120]}, retries: {type: integer, range: [0, 5]}}
  - add:
      id: cisco-iosxe.aaa-authentication-login-privilege-mode
      domain: mgmt
      view: system
      syntax: aaa authentication login privilege-mode
      undo: no aaa authentication login privilege-mode
    reason: 公开命令参考没有单列这条命令（Batfish 公开样本中出现）；登录后直接进入用户的特权级别
  - add:
      id: cisco-iosxe.username-secret
      domain: mgmt
      view: system
      syntax: username <name> [ privilege <level> ] { secret | password } [ <encryption-type> ] <secret>
      undo: no username <name>
      params: {name: {type: word}, level: {type: integer, range: [0, 15]}, encryption-type: {type: integer, range: [0, 9]}, secret: {type: word}}
    reason: 原文 username 拆成了 20 多条只带一个可选项的语法；运行配置中最常见的是 username 名称 [privilege 级别] secret 类型 密文
  - add:
      id: cisco-iosxe.username-privilege
      domain: mgmt
      view: system
      syntax: username <name> privilege <level>
      undo: no username <name>
      params: {name: {type: word}, level: {type: integer, range: [0, 15]}}
    reason: 同上；只设置级别的写法
  - add:
      id: cisco-iosxe.ip-ssh-rsa-keypair-name
      domain: mgmt
      view: system
      syntax: ip ssh rsa keypair-name <keypair-name>
      undo: no ip ssh rsa keypair-name
      params: {keypair-name: {type: word}}
    reason: 公开命令参考的 ip ssh 页没有列出 rsa keypair-name 写法（Batfish 公开样本中出现）
  # ---------- 0.2.0：OSPF / IS-IS ----------
  - id: cisco-iosxe.area-authentication
    reason: 原文语法行混入了 HTML 残留文字 “area authentication command”
    set:
      syntax: area <area-id> authentication [ message-digest ]
      undo: no area <area-id> authentication [ message-digest ]
  - id: cisco-iosxe.area-nssa
    reason: 原文语法行混入了 HTML 残留文字 “area nssa command”
    set:
      syntax: area <area-id> nssa [ no-redistribution ] [ default-information-originate ] [ no-summary ]
      undo: no area <area-id> nssa [ no-redistribution ] [ default-information-originate ] [ no-summary ]
  - id: cisco-iosxe.area-stub
    reason: 原文语法行混入了 HTML 残留文字 “area stub command”
    set:
      syntax: area <area-id> stub [ no-summary ]
      undo: no area <area-id> stub [ no-summary ]
  - id: cisco-iosxe.auto-cost
    reason: 原文语法行混入了 HTML 残留文字 “auto-cost command”
    set:
      syntax: auto-cost reference-bandwidth <mbps>
      undo: no auto-cost reference-bandwidth
      params: {mbps: {type: integer, range: [1, 4294967]}}
  - id: cisco-iosxe.passive-interface
    reason: 原文语法行混入了 HTML 残留文字，接口参数被拆成 “i nterface-type”
    set:
      syntax: passive-interface { default | <interface> }
      undo: no passive-interface { default | <interface> }
      params: {interface: {type: interface}}
  - id: cisco-iosxe.passive-interface~2
    reason: 同上（IS-IS 下的同一条命令）
    set:
      syntax: passive-interface { default | <interface> }
      undo: no passive-interface { default | <interface> }
      params: {interface: {type: interface}}
  - id: cisco-iosxe.router-isis
    reason: 原文把可选的区域标签写成了关键字 area-tag
    set:
      syntax: router isis [ <area-tag> ]
      undo: no router isis [ <area-tag> ]
      params: {area-tag: {type: word}}
  # ---------- 0.2.0：管理面 ----------
  - id: cisco-iosxe.logging-source-interface
    reason: 原文语法 “{interface-name number vrf vrf-name}” 写乱了
    set:
      syntax: logging source-interface <interface> [ vrf <vrf-name> ]
      undo: no logging source-interface <interface> [ vrf <vrf-name> ]
      params: {interface: {type: interface}, vrf-name: {type: word}}
  - add:
      id: cisco-iosxe.logging-host
      domain: mgmt
      view: system
      syntax: logging host <host> [ vrf <vrf-name> ]
      undo: no logging host <host> [ vrf <vrf-name> ]
      params: {host: {type: word}, vrf-name: {type: word}}
    reason: 原文 logging host 的语法行有多余的括号，语法解析失败；按运行配置常见写法补充
  - add:
      id: cisco-iosxe.snmp-server-enable-traps
      domain: mgmt
      view: system
      syntax: snmp-server enable traps [ <notification-types> ]
      undo: no snmp-server enable traps [ <notification-types> ]
      params: {notification-types: {type: text}}
    reason: 原文 snmp-server enable traps 的语法行有多余的括号，语法解析失败
  - add:
      id: cisco-iosxe.transport-input
      domain: mgmt
      view: line
      syntax: transport input { all | none | ssh | telnet | telnet ssh | ssh telnet }
      undo: no transport input
    reason: 原文第一条语法行没有格式标记且把 udptn 写成 updtn；运行配置中常见写法是 all / none / ssh / telnet
  - id: cisco-iosxe.ip-router-isis
    reason: 区域标签可省（没有标签的 router isis 进程）
    set:
      syntax: ip router isis [ <area-tag> ]
      undo: no ip router isis [ <area-tag> ]
      params: {area-tag: {type: word}}
  - id: cisco-iosxe.ip-ospf-message-digest-key-md5
    reason: 原文把加密类型写在 md5 之前；运行配置中是 message-digest-key 编号 md5 [类型] 密钥
    set:
      syntax: ip ospf message-digest-key <key-id> md5 [ <encryption-type> ] <key>
      undo: no ip ospf message-digest-key <key-id>
      params: {key-id: {type: integer, range: [1, 255]}, encryption-type: {type: integer, range: [0, 7]}, key: {type: word}}
  - id: cisco-iosxe.logging-console
    reason: 原文把 severity-level 写成了关键字；运行配置中是 logging console 级别
    set:
      syntax: logging console [ <severity-level> ]
      undo: no logging console
      params: {severity-level: {type: word}}
  - id: cisco-iosxe.aaa-authorization
    reason: 原文类型列表很长且方法列表写成 “method1 [method2...]”；按运行配置整理
    set:
      syntax: aaa authorization { exec | commands <level> | network | config-commands | console } { default | <list-name> } [ <method1> [ <method2> [ <method3> [ <method4> ] ] ] ]
      undo: no aaa authorization { exec | commands <level> | network | config-commands | console } { default | <list-name> }
      params: {level: {type: integer, range: [0, 15]}, list-name: {type: word}, method1: {type: word}, method2: {type: word}, method3: {type: word}, method4: {type: word}}
  - id: cisco-iosxe.clock-timezone
    reason: 原文把 minutes-offset 写成了关键字；小时偏移可以是负数
    set:
      syntax: clock timezone <zone> <hours-offset> [ <minutes-offset> ]
      undo: no clock timezone
      params: {zone: {type: word}, hours-offset: {type: word}, minutes-offset: {type: integer, range: [0, 59]}}
  - id: cisco-iosxe.address-ipv6
    reason: 参数是 IPv6 地址，按参数名推断成了 IPv4
    set:
      params: {ipv6-address: {type: word}}
  - id: cisco-iosxe.ntp-authentication-key
    reason: 原文把加密类型写成了关键字并带重复标记；运行配置中是 ntp authentication-key 编号 md5 密钥 [类型]
    set:
      syntax: ntp authentication-key <number> md5 <key> [ <encryption-type> ]
      undo: no ntp authentication-key <number>
      params: {number: {type: integer, range: [1, 4294967295]}, key: {type: word}, encryption-type: {type: integer, range: [0, 7]}}
  - id: cisco-iosxe.snmp-server-community
    reason: 团体字参数名为 string，按参数名推断成了吃掉行尾的 text 类型
    set:
      params: {string: {type: word}, view-name: {type: word}, access-list-number: {type: word}, access-list-name: {type: word}}
  # ---------- 0.3.0：MPLS LDP、L2VPN、ACL ----------
  - id: cisco-iosxe.mpls-ldp-discovery
    reason: 原文把 accept 写成与 hello / targeted-hello 并列；运行配置中是 mpls ldp discovery targeted-hello accept [ from <acl> ]
    set:
      syntax: mpls ldp discovery { hello { holdtime | interval } <seconds> | targeted-hello { { holdtime | interval } <seconds> | accept [ from <acl> ] } }
      undo: no mpls ldp discovery { hello { holdtime | interval } | targeted-hello { holdtime | interval | accept } }
      params: {seconds: {type: integer, range: [1, 65535]}, acl: {type: word}}
  - id: cisco-iosxe.xconnect.2
    reason: 原文把可选的 pw-type 写成 “*[pw-type]*”，转换后成了重复组
    set:
      syntax: xconnect <peer-ip-address> <vc-id> encapsulation mpls [ <pw-type> ]
      params: {peer-ip-address: {type: ipv4}, vc-id: {type: integer, range: [1, 4294967295]}, pw-type: {type: integer}}
  - reason: xconnect 页的 Command Modes 没有列出业务实例模式；ASR 920 的 EVC 配置指南中伪线接在 service instance 下（xconnect 对端 VC 编号 encapsulation mpls）
    add:
      id: cisco-iosxe.service-instance-xconnect
      domain: l2vpn
      view: service-instance
      syntax: xconnect <peer-ip-address> <vc-id> { encapsulation mpls [ manual ] | pw-class <pw-class-name> } [ pw-class <pw-class-name> ]
      undo: no xconnect
      enters_view: xconnect
      params: {peer-ip-address: {type: ipv4}, vc-id: {type: integer, range: [1, 4294967295]}, pw-class-name: {type: word}}
      source: {doc: cisco-iosxe-md, file: l2vpn/xconnect.md, title: xconnect, version: '17.15'}
  - reason: member (bridge-domain) 页只有业务实例成员；VPLS 的 VFI 成员 member vfi <名称> 按 ASR 920 配置指南（VPLS）补充
    add:
      id: cisco-iosxe.bridge-domain-member-vfi
      domain: l2vpn
      view: bridge-domain
      syntax: member vfi <vfi-name>
      undo: no member vfi <vfi-name>
      params: {vfi-name: {type: word}}
      source: {doc: cisco-iosxe-md, file: l2vpn/member (bridge-domain).md, title: member (bridge-domain), version: '17.15'}
  - id: cisco-iosxe.member
    reason: 接口名参数按名称推断成了普通词；接口名是一个词（GigabitEthernet0/0/1）
    set:
      params: {interface-type-number: {type: interface}, service-id: {type: integer, range: [1, 8000]}, group-id: {type: integer}}
  # ACL：原文的序号写成 “*[sequence-number]*”，标准与扩展格式混在一页，any / host 只写在参数说明里；按运行配置整理成一条标准、
  # 一条通用扩展、一条 TCP / UDP 端口格式（端口操作符作为参数，便于区分源端口与目的端口）
  - id: cisco-iosxe.permit.1
    reason: 原文序号写成 *[sequence-number]*、any / host 只写在参数说明里；标准 ACL 条目按运行配置整理
    set:
      syntax: '[ <sequence-number> ] permit { <source> [ <source-wildcard> ] | host <source-host> | any } [ log ]'
      undo: no permit { <source> [ <source-wildcard> ] | host <source-host> | any }
      params: &std_params {sequence-number: {type: integer, range: [1, 2147483647]}, source: {type: ipv4}, source-wildcard: {type: wildcard}, source-host: {type: ipv4}}
  - id: cisco-iosxe.deny.1
    reason: 同 permit.1
    set:
      syntax: '[ <sequence-number> ] deny { <source> [ <source-wildcard> ] | host <source-host> | any } [ log ]'
      undo: no deny { <source> [ <source-wildcard> ] | host <source-host> | any }
      params: *std_params
  - id: cisco-iosxe.permit.4
    reason: 原文通用扩展格式（第 2 条语法）有多余的括号、转换失败，这张卡原为 IGMP 格式；按运行配置整理为通用扩展格式（协议为名称或编号）
    set:
      syntax: '[ <sequence-number> ] permit <protocol> { <source> <source-wildcard> | host <source-host> | any } { <destination> <destination-wildcard> | host <destination-host> | any } [ fragments ] [ log ]'
      undo: no permit <protocol> { <source> <source-wildcard> | host <source-host> | any } { <destination> <destination-wildcard> | host <destination-host> | any }
      params: &ext_params {sequence-number: {type: integer, range: [1, 2147483647]}, protocol: {type: word}, source: {type: ipv4}, source-wildcard: {type: wildcard}, source-host: {type: ipv4}, destination: {type: ipv4}, destination-wildcard: {type: wildcard}, destination-host: {type: ipv4}}
  - id: cisco-iosxe.deny.4
    reason: 同 permit.4
    set:
      syntax: '[ <sequence-number> ] deny <protocol> { <source> <source-wildcard> | host <source-host> | any } { <destination> <destination-wildcard> | host <destination-host> | any } [ fragments ] [ log ]'
      undo: no deny <protocol> { <source> <source-wildcard> | host <source-host> | any } { <destination> <destination-wildcard> | host <destination-host> | any }
      params: *ext_params
  - id: cisco-iosxe.permit.5
    reason: 原文 TCP 格式的端口参数写成 *[port]*；按运行配置整理为 TCP / UDP 端口格式
    set:
      syntax: '[ <sequence-number> ] permit { tcp | udp } { <source> <source-wildcard> | host <source-host> | any } [ <source-port-op> <source-port> [ <source-port-end> ] ] { <destination> <destination-wildcard> | host <destination-host> | any } [ <destination-port-op> <destination-port> [ <destination-port-end> ] ] [ established ] [ log ]'
      undo: no permit { tcp | udp } { <source> <source-wildcard> | host <source-host> | any } [ <source-port-op> <source-port> [ <source-port-end> ] ] { <destination> <destination-wildcard> | host <destination-host> | any } [ <destination-port-op> <destination-port> [ <destination-port-end> ] ]
      params: &port_params {sequence-number: {type: integer, range: [1, 2147483647]}, source: {type: ipv4}, source-wildcard: {type: wildcard}, source-host: {type: ipv4}, destination: {type: ipv4}, destination-wildcard: {type: wildcard}, destination-host: {type: ipv4}, source-port-op: {type: enum, choices: [eq, gt, lt, neq, range]}, source-port: {type: word}, source-port-end: {type: word}, destination-port-op: {type: enum, choices: [eq, gt, lt, neq, range]}, destination-port: {type: word}, destination-port-end: {type: word}}
  - id: cisco-iosxe.deny.5
    reason: 同 permit.5
    set:
      syntax: '[ <sequence-number> ] deny { tcp | udp } { <source> <source-wildcard> | host <source-host> | any } [ <source-port-op> <source-port> [ <source-port-end> ] ] { <destination> <destination-wildcard> | host <destination-host> | any } [ <destination-port-op> <destination-port> [ <destination-port-end> ] ] [ established ] [ log ]'
      undo: no deny { tcp | udp } { <source> <source-wildcard> | host <source-host> | any } [ <source-port-op> <source-port> [ <source-port-end> ] ] { <destination> <destination-wildcard> | host <destination-host> | any } [ <destination-port-op> <destination-port> [ <destination-port-end> ] ]
      params: *port_params
  - id: cisco-iosxe.remark
    reason: 命名 ACL 中的说明行在 IOS XE 运行配置里可以带序号；说明文字可含空格
    set:
      syntax: '[ <sequence-number> ] remark <remark>'
      params: {sequence-number: {type: integer, range: [1, 2147483647]}, remark: {type: text}}
  - id: cisco-iosxe.access-list.1
    reason: 原文 dynamic / log 部分有多余的括号；按运行配置整理编号扩展 ACL 的通用格式（any / host 只写在参数说明里）
    set:
      syntax: access-list <access-list-number> { deny | permit } <protocol> { <source> <source-wildcard> | host <source-host> | any } { <destination> <destination-wildcard> | host <destination-host> | any } [ fragments ] [ log ]
      undo: no access-list <access-list-number>
      params: {access-list-number: {type: integer}, protocol: {type: word}, source: {type: ipv4}, source-wildcard: {type: wildcard}, source-host: {type: ipv4}, destination: {type: ipv4}, destination-wildcard: {type: wildcard}, destination-host: {type: ipv4}}
  - id: cisco-iosxe.access-list.4
    reason: 原文 TCP 格式的端口参数写成 *[port]*；按运行配置整理为编号扩展 ACL 的 TCP / UDP 端口格式
    set:
      syntax: access-list <access-list-number> { deny | permit } { tcp | udp } { <source> <source-wildcard> | host <source-host> | any } [ <source-port-op> <source-port> [ <source-port-end> ] ] { <destination> <destination-wildcard> | host <destination-host> | any } [ <destination-port-op> <destination-port> [ <destination-port-end> ] ] [ established ] [ log ]
      undo: no access-list <access-list-number>
      params: {access-list-number: {type: integer}, source: {type: ipv4}, source-wildcard: {type: wildcard}, source-host: {type: ipv4}, destination: {type: ipv4}, destination-wildcard: {type: wildcard}, destination-host: {type: ipv4}, source-port-op: {type: enum, choices: [eq, gt, lt, neq, range]}, source-port: {type: word}, source-port-end: {type: word}, destination-port-op: {type: enum, choices: [eq, gt, lt, neq, range]}, destination-port: {type: word}, destination-port-end: {type: word}}
  - id: cisco-iosxe.access-list.5
    reason: 原文 UDP 格式已并入 access-list.4；这一张整理为 ICMP 格式（原文 ICMP 语法括号多余、转换失败）
    set:
      syntax: access-list <access-list-number> { deny | permit } icmp { <source> <source-wildcard> | host <source-host> | any } { <destination> <destination-wildcard> | host <destination-host> | any } [ <icmp-type> [ <icmp-code> ] ] [ log ]
      undo: no access-list <access-list-number>
      params: {access-list-number: {type: integer}, source: {type: ipv4}, source-wildcard: {type: wildcard}, source-host: {type: ipv4}, destination: {type: ipv4}, destination-wildcard: {type: wildcard}, destination-host: {type: ipv4}, icmp-type: {type: word}, icmp-code: {type: integer, range: [0, 255]}}
  - reason: access-list (IP standard) 页的语法行把可选的 source-wildcard 写在斜体里，转换失败；按运行配置补充编号标准 ACL
    add:
      id: cisco-iosxe.access-list-standard
      domain: acl
      view: system
      syntax: access-list <access-list-number> { deny | permit } { <source> [ <source-wildcard> ] | host <source-host> | any } [ log ]
      undo: no access-list <access-list-number>
      params: {access-list-number: {type: integer}, source: {type: ipv4}, source-wildcard: {type: wildcard}, source-host: {type: ipv4}}
      source: {doc: cisco-iosxe-md, file: acl/access-list (IP standard).md, title: access-list (IP standard), version: '17.15'}
  - id: cisco-iosxe.access-list-remark
    reason: 原文写成 *[line]*；说明文字可含空格
    set:
      syntax: access-list <access-list-number> remark <line>
      undo: no access-list <access-list-number> remark <line>
      params: {access-list-number: {type: integer}, line: {type: text}}
  - id: cisco-iosxe.member.3
    reason: 原文把接口类型写成关键字、编号另起；运行配置中接口名是一个词（member GigabitEthernet0/0/1 service-instance 100）
    set:
      syntax: member <interface> [ service-instance <id> ] [ group <group-name> [ priority <number> ] ]
      undo: no member <interface> [ service-instance <id> ]
      params: {interface: {type: interface}, id: {type: integer, range: [1, 8000]}, group-name: {type: word}, number: {type: integer}}
  # M3 知识库补缺：子接口终结单层 VLAN（三层子接口、子接口上的 xconnect），对应华为 vlan-type dot1q
  - reason: 公开命令参考的 encapsulation dot1q 页只列了 QinQ（second-dot1q）写法，模式写成 config-ifsub（不在视图映射中）；子接口终结单层 VLAN 的写法按 IOS-XE 运行配置补充（encapsulation dot1Q 10）
    add:
      id: cisco-iosxe.subif-encapsulation-dot1q
      domain: interface
      view: interface
      syntax: encapsulation dot1q <vlan-id> [ native ]
      undo: no encapsulation dot1q
      params: {vlan-id: {type: integer, range: [1, 4094]}}
  - id: cisco-iosxe.set-community
    reason: 原文把团体值写成单个参数（community-number [ additive ] [ well-known-community ]）；运行配置中一行可以写多个团体值（set community 65082:3 65082:2 additive），改成重复写法，公认团体（no-export 等）也按团体值取
    set:
      syntax: set community { { <community-number> } &<1-32> [ additive ] | none }
      params: {community-number: {type: community}}
  - id: cisco-iosxe.neighbor-timers@router-bgp
    reason: 原文排版把 peer-group-name 拆成了 <p> <eer-group-name>，且邻居是必选的；运行配置中是 neighbor <地址或对等体组> timers <keepalive> <hold>
    set:
      syntax: neighbor { <ip-address> | <peer-group-name> } timers <keepalive> <holdtime> [ <min-holdtime> ]
      undo: no neighbor { <ip-address> | <peer-group-name> } timers
      params: {ip-address: {type: ipv4}, peer-group-name: {type: word}, keepalive: {type: integer, range: [0, 65535]}, holdtime: {type: integer, range: [0, 65535]}, min-holdtime: {type: integer, range: [0, 65535]}}
  - id: cisco-iosxe.neighbor-timers@bgp-af
    reason: 同上（地址族模式下的同一命令）。原文排版把 peer-group-name 拆成了 <p> <eer-group-name>，且邻居是必选的；运行配置中是 neighbor <地址或对等体组> timers <keepalive> <hold>
    set:
      syntax: neighbor { <ip-address> | <peer-group-name> } timers <keepalive> <holdtime> [ <min-holdtime> ]
      undo: no neighbor { <ip-address> | <peer-group-name> } timers
      params: {ip-address: {type: ipv4}, peer-group-name: {type: word}, keepalive: {type: integer, range: [0, 65535]}, holdtime: {type: integer, range: [0, 65535]}, min-holdtime: {type: integer, range: [0, 65535]}}
  - reason: ip access-list 页只列了带 standard / extended 的写法；运行配置与部分 IOS-XE 版本可以只写名称（ip access-list <名称>，进入扩展命名 ACL 模式），按运行配置补充
    add:
      id: cisco-iosxe.ip-access-list-name
      domain: acl
      view: system
      syntax: ip access-list <access-list-name>
      enters_view: acl
      undo: no ip access-list <access-list-name>
      params: {access-list-name: {type: word}}
