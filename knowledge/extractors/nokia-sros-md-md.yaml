# Nokia SR OS MD-CLI Command Reference（25.10.R1）的命令卡抽取规则（M7-4，REQ-037）。
# 文档先由 DevelopDocs/设备产品文档/Nokia/tools/nokia_md_to_md.py 从 HTML 配置树转成 Markdown（范围 tools/md-scope.txt）：
#   每个 YANG 元素一条命令，标题 = 去掉 configure 与键的完整路径（命令卡编号由它生成，同名元素在不同上下文不会撞号）；
#   小节 ### Syntax（**元素** *参数* / **delete** **元素**）/ View path（元素所在上下文，去掉键）/ Parameters（type=YANG 类型；
#   Options / Range / Max. instances / quoted）/ Description / Default / Notes。
#   文件 = 元素路径按功能归组（router.interface、router.ospf、service.vprn…）。
# views_map 与 enters 由转换脚本生成（tmp 片段贴在下面的标记之间），视图编号 = 去掉 configure 与键的路径用 . 连接。
name: nokia-sros-md-md
family: nokia-sros-md

sections:
  syntax: [Syntax]
  params: [Parameters]
  views: [View path]
  default: [Default]
  function: [Description]

negative_prefix: delete
exclude_titles: '^$'
views_split: '\x00'

# 取值列：Options（keyword / boolean 的选项）→ 枚举；叶子列表（Max. instances）→ leaflist（[ "a" "b" ] 整段一个参数）；
# number + Range → 带范围的整数；quoted（字符串类：名称、描述、引用）→ string（规范渲染加引号）；其余 word
enum_marker: 'Options:'
enum_item: '(?:Options:|,)\s*([\w\-./]+)'
param_types:
  - {value: 'Max\. instances', type: leaflist}
  # 端口与 SAP（configure port 1/1/1、lag 下的 port 1/1/2、sap 1/1/4:100）：不加引号，按 Nokia 的端口 / SAP 写法检查
  - {value: '^type=port(;|$)', type: port}
  - {name: '^port-id$', type: port}
  - {value: '^type=sap(;|$)', type: sap}
  - {value: '^type=number\b.*Range (\d+) to (\d+)', type: integer, range_groups: [1, 2]}
  - {value: '^type=number(;|$)', type: integer}
  - {value: '; quoted', type: string}
  - {type: word}

domains:
  interface:
    - {path: port.md}
    - {path: lag.md}
    - {path: router.md}
    - {path: router.interface.md}
  vrrp:
    - {path: router.vrrp.md}
  static-route:
    - {path: router.static-routes.md}
  ospf:
    - {path: router.ospf.md}
  isis:
    - {path: router.isis.md}
  sr:
    - {path: router.sr.md}
    - {path: router.mpls-labels.md}
  bgp:
    - {path: router.bgp.md}
    - {path: router.autonomous-system.md}
    - {path: router.router-id.md}
    - {path: router.confederation.md}
  routing-policy:
    - {path: policy-options.md}
  mpls:
    - {path: router.mpls.md}
    - {path: router.rsvp.md}
    - {path: router.ldp.md}
  mgmt:
    - {path: 'system*.md'}
    - {path: 'log*.md'}
  service:
    - {path: 'service*.md'}
  acl:
    - {path: filter.md}
  qos:
    - {path: qos.md}

