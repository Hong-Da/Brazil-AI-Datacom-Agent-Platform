# 内置 AI skill 的功能分组（REQ-033 评审修改，用户 2026-10-19）：组名三语只在这里定义，顺序即界面上的顺序。
# 每个 skill 在自己的 <编号>.yaml 里用 group 字段引用这里的编号；没有写或写错的归入 other。
# M8（REQ-041）新增的 skill 按功能放进已有的组（日常分析、变更与割接、规范与合规、知识库构建、报告）。
groups:
  - id: qa
    title: {zh-CN: 问答, en: Q&A, pt-BR: Perguntas e respostas}
  - id: generate
    title: {zh-CN: 配置生成, en: Configuration generation, pt-BR: Geração de configuração}
  - id: analysis
    title: {zh-CN: 日常分析, en: Daily analysis, pt-BR: Análise do dia a dia}
  - id: change
    title: {zh-CN: 变更与割接, en: Changes and cutovers, pt-BR: Mudanças e migrações}
  - id: compliance
    title: {zh-CN: 规范与合规, en: Standards and compliance, pt-BR: Padrões e conformidade}
  - id: kb
    title: {zh-CN: 知识库构建, en: Knowledge base building, pt-BR: Construção da base de conhecimento}
  - id: report
    title: {zh-CN: 报告, en: Reports, pt-BR: Relatórios}
  - id: evolve
    title: {zh-CN: skill 进化, en: Skill evolution, pt-BR: Evolução de skills}
