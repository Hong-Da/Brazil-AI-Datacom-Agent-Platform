# 内置 AI skill（只读）：割接方案文档（M8-4，REQ-041）：按割接迁移的结果起草割接步骤、检查点、回退条件与时间窗口，中英双语。
# 管理员修改后的版本保存在 data/ai-skills/cutover-plan/，可回滚或恢复为本文件的内置版本。
# 提示词中的 {变量} 由代码填入，{{ 与 }} 表示字面的花括号。命令一律由代码生成（割接步骤 s1、s2……），AI 只能用 [[s3]] 引用；
# 直接写出命令的段落一律拒绝（core/ai_suggest_change.py）。
id: cutover-plan
version: 1
title: {zh-CN: 割接方案文档, en: Cutover plan document, pt-BR: Documento do plano de migração}
description: {zh-CN: 按割接迁移的结果（代码生成的步骤与命令）起草概述、时间窗口、步骤说明、检查点与回退条件，中英双语，可导出。命令只能引用代码生成的步骤，直接写出命令的段落拒绝。, en: 'Drafts the overview, maintenance window, step notes, checkpoints and rollback criteria from the cutover result (steps and commands generated by code), in Chinese and English, ready to export. Commands may only reference the generated steps; passages that type commands are rejected.', pt-BR: 'Rascunha visão geral, janela de manutenção, notas dos passos, pontos de verificação e critérios de reversão a partir do resultado da migração (passos e comandos gerados pelo código), em chinês e inglês, pronto para exportar. Comandos só podem referenciar os passos gerados; trechos que digitam comandos são rejeitados.'}
task: ask
used_by: ai_suggest
group: change
enabled: true
system: |-
  You write the prose of a router cutover plan, in BOTH Simplified Chinese and English. Code has already produced the steps and every command; you never write a command.
  Rules:
  - Refer to devices and steps ONLY as [[id]] with the ids given (d1 old device, d2 new device, s1, s2 ... steps). Commands are taken from the steps by code, so never type a CLI command, keyword sequence or code block.
  - Write every count ONLY as <<key>> with the fact keys given. Do not type interface names, addresses or other numbers.
  - One suggestion per section; section is one of: overview, window, steps, checks, rollback, risks.
  - "zh" is the Chinese text, "en" the English text of the same meaning. For steps and rollback, list the steps you describe in "steps" with the step id, a short action and a checkpoint in both languages.
  Reply with JSON only: {{"suggestions": [{{"category": "plan_section", "kind": "<section>", "title": "<short title in {lang}>", "content": {{"section": "<section>", "zh": "<Chinese>", "en": "<English>", "steps": [{{"step": "s3", "zh": "...", "en": "...", "check_zh": "...", "check_en": "..."}}]}}, "refs": [{{"id": "s3"}}]}}]}}
prompt: |-
  Devices:
  {devices}

  Steps generated by code (id | phase | where | action | commands):
  {steps}

  Facts (key = value):
  {facts}
templates:
  retry: |-
    Your previous reply could not be used: {error}
    Reply again with JSON only, in the required format, citing only the given ids and keys and writing no commands.
variables:
  - name: lang
    in: system
    desc: {zh-CN: 标题的语言（按界面语言）, en: Title language (from the UI language), pt-BR: Idioma do título (do idioma da interface)}
  - name: devices
    in: prompt
    desc: {zh-CN: 旧设备 d1 与新设备 d2（名称、Profile）, en: 'Old device d1 and new device d2 (name, profile)', pt-BR: 'Dispositivo antigo d1 e novo d2 (nome, perfil)'}
  - name: steps
    in: prompt
    desc: {zh-CN: 代码生成的割接步骤（编号、阶段、在哪台设备、操作、命令行数）, en: 'Cutover steps generated by code (id, phase, where, action, command lines)', pt-BR: 'Passos gerados pelo código (id, fase, onde, ação, linhas de comando)'}
  - name: facts
    in: prompt
    desc: {zh-CN: 代码算好的数字（键 = 值）, en: Numbers computed by code (key = value), pt-BR: Números calculados pelo código (chave = valor)}
  - name: error
    in: retry
    desc: {zh-CN: 上次回复不能用的原因, en: Why the previous reply could not be used, pt-BR: Por que a resposta anterior não pôde ser usada}
examples: []
tools:
  - sanitize
output:
  format: json
  schema: '{"suggestions": [{"category": "plan_section", "kind": "overview", "title": "...", "content": {"section": "overview", "zh": "...", "en": "...", "steps": []}, "refs": [{"id": "d1"}]}]}'
checks:
  - suggest.refs_exist
  - suggest.plan_section
samples:
  - title: {zh-CN: 中英双语、引用步骤（通过）, en: Bilingual and citing steps (passes), pt-BR: Bilíngue e citando passos (aprovado)}
    input:
      vars:
        lang: English
        devices: "d1 | old device ATN-OLD | profile=huawei-atn-v800r025\nd2 | new device ASR920 | profile=cisco-iosxe-asr920-17.15"
        steps: "s1 | precheck | old | Record interfaces, routes and neighbors | 3 command lines\ns2 | prepare | new | Apply the new configuration | 0 command lines"
        facts: "steps = 2\ninterfaces = 4"
      facts:
        objects:
          d1: {type: device, label: ATN-OLD}
          d2: {type: new_device, label: ASR920}
          s1: {type: step, label: 'Record interfaces, routes and neighbors', phase: precheck}
          s2: {type: step, label: Apply the new configuration, phase: prepare}
        numbers: {steps: 2, interfaces: 4}
        lines: {d1: 50}
        names: [ATN-OLD, ASR920]
        families: [huawei-vrp8, cisco-iosxe]
        steps:
          - {ref: s1, no: 1, phase: precheck, device: old, commands: [display interface brief], labels: {zh-CN: 记录接口、路由与邻居, en: 'Record interfaces, routes and neighbors'}}
          - {ref: s2, no: 2, phase: prepare, device: new, commands: [], labels: {zh-CN: 在新设备上加载新配置, en: Apply the new configuration}}
    reply: '{"suggestions": [{"category": "plan_section", "kind": "overview", "title": "Overview", "content": {"section": "overview", "zh": "本次割接把 [[d1]] 换成 [[d2]]，共 <<steps>> 步，迁移 <<interfaces>> 个接口。", "en": "This cutover replaces [[d1]] with [[d2]] in <<steps>> steps, moving <<interfaces>> interfaces.", "steps": [{"step": "s1", "zh": "割接前记录现状", "en": "Record the state before the cutover", "check_zh": "记录完整", "check_en": "Records are complete"}]}, "refs": [{"id": "s1"}]}]}'
  - title: {zh-CN: 直接写出命令、只有一种语言（演示拒绝）, en: Types a command and has one language only (shows a rejection), pt-BR: Digita um comando e tem só um idioma (mostra a rejeição)}
    input:
      vars:
        lang: English
        devices: "d1 | old device ATN-OLD | profile=huawei-atn-v800r025\nd2 | new device ASR920 | profile=cisco-iosxe-asr920-17.15"
        steps: "s1 | precheck | old | Record interfaces, routes and neighbors | 3 command lines"
        facts: "steps = 1"
      facts:
        objects:
          d1: {type: device, label: ATN-OLD}
          d2: {type: new_device, label: ASR920}
          s1: {type: step, label: 'Record interfaces, routes and neighbors', phase: precheck}
        numbers: {steps: 1}
        lines: {d1: 50}
        names: [ATN-OLD, ASR920]
        families: [huawei-vrp8, cisco-iosxe]
        steps:
          - {ref: s1, no: 1, phase: precheck, device: old, commands: [display interface brief], labels: {zh-CN: 记录接口、路由与邻居, en: 'Record interfaces, routes and neighbors'}}
    reply: '{"suggestions": [{"category": "plan_section", "kind": "steps", "title": "Extra step", "content": {"section": "steps", "zh": "割接前在 [[d1]] 上执行 reset bgp all。", "en": "Before the cutover run reset bgp all on [[d1]].", "steps": [{"step": "s9", "zh": "清除 BGP", "en": "Clear BGP"}]}, "refs": [{"id": "d1"}]}]}'
