# 内置 AI skill（只读）：拓扑整理（M8-3）：设备角色、站点 / 区域分组、分层，以及未解析对端的推测。
# 管理员修改后的版本保存在 data/ai-skills/topology-roles/，可回滚或恢复为本文件的内置版本。
# 提示词中的 {变量} 由代码填入，{{ 与 }} 表示字面的花括号。AI 只能引用代码给出的编号（d1 设备、u1 未解析对端）。
id: topology-roles
version: 2
title: {zh-CN: 拓扑整理, en: Topology tidy-up, pt-BR: Organizar topologia}
description: {zh-CN: 按设备名、接口描述、链路与 AS 等特征推断设备角色（核心 / 汇聚 / 接入 / PE / P / CE），按站点或区域分组、分层，并推测未解析的对端。只影响拓扑显示；推测的对端由代码核对两端接口地址同网段后才连线，否则拒绝。采纳后写入项目的视图标注，可撤销；手工标注优先。, en: 'Infers device roles (core / aggregation / access / PE / P / CE) from names, interface descriptions, links and AS numbers, groups devices by site or region, assigns layers and guesses unresolved peers. Display only: a guessed peer is linked only after code confirms the two interfaces share a subnet, otherwise it is rejected. Adopting writes a project view annotation that can be reverted; manual annotations win.', pt-BR: 'Deduz o papel de cada dispositivo (core / agregação / acesso / PE / P / CE) por nomes, descrições de interface, enlaces e AS, agrupa por site ou região, define camadas e estima pares não resolvidos. Só afeta a exibição: um par estimado só é ligado depois que o código confirma que as duas interfaces compartilham uma sub-rede; caso contrário é rejeitado. Adotar grava uma anotação de visualização do projeto, reversível; anotações manuais prevalecem.'}
task: ask
used_by: ai_suggest
group: analysis
enabled: true
system: |-
  You tidy up the topology view of one network, for display only. Allowed roles: {roles}.
  You may suggest:
  - a role:  {{"category": "view_hint", "kind": "role", "content": {{"target": "d1", "key": "role", "value": "pe", "reason": "..."}}}}
  - a group (site / region, a short name):  {{"category": "view_hint", "kind": "group", "content": {{"target": "d1", "key": "group", "value": "West POP", "reason": "..."}}}}
  - a layer (0 = external, 1 = core, 2 = aggregation, 3 = access, 4 = customer):  {{"category": "view_hint", "kind": "layer", "content": {{"target": "d1", "key": "layer", "value": 2, "reason": "..."}}}}
  - a guessed link for an unresolved peer u* or between two devices:  {{"category": "peer_link", "kind": "peer", "content": {{"a": "d1", "b": "u1", "a_interface": "<interface of d1>", "external": true, "label": "<short label>", "reason": "..."}}}}
    Code draws the link only if the interface addresses of both ends share a subnet; otherwise the guess is rejected.
  Rules:
  - Refer to devices and peers ONLY by the ids given (d1, u1 ...). Do not invent devices.
  - Suggest something only when the names, interface descriptions, addresses, links or AS numbers support it. Do not repeat values that are already set by hand.
  - The reason is one sentence in {lang}; mention devices in it only as [[id]].
  Reply with JSON only: {{"suggestions": [{{"category": "view_hint", "kind": "role", "title": "<device id>: <value>", "content": {{...}}, "refs": [{{"id": "d1"}}]}}]}}
prompt: |-
  Devices (id | name | family | profile | links | interfaces | asn | loopbacks | interface descriptions):
  {devices}

  Links (id:interface <-> id:interface (type)):
  {links}

  Unresolved peers (id | type | address | referenced by):
  {unresolved}

  Current annotations:
  {annotations}
templates:
  retry: |-
    Your previous reply could not be used: {error}
    Reply again with JSON only, in the required format, citing only the given device and peer ids.
variables:
  - name: roles
    in: system
    desc: {zh-CN: 允许的角色取值, en: Allowed role values, pt-BR: Valores de papel permitidos}
  - name: lang
    in: system
    desc: {zh-CN: 回复语言（按界面语言）, en: Reply language (from the UI language), pt-BR: Idioma da resposta (do idioma da interface)}
  - name: devices
    in: prompt
    desc: {zh-CN: 设备表（编号、名称、平台、链路数、环回地址、接口描述……）, en: 'Device table (id, name, platform, links, loopbacks, interface descriptions…)', pt-BR: 'Tabela de dispositivos (id, nome, plataforma, enlaces, loopbacks, descrições…)'}
  - name: links
    in: prompt
    desc: {zh-CN: 代码还原的链路, en: Links restored by code, pt-BR: Enlaces reconstruídos pelo código}
  - name: unresolved
    in: prompt
    desc: {zh-CN: 未解析的对端（编号 u1……，地址与引用它的设备）, en: 'Unresolved peers (ids u1…, address and the device that references it)', pt-BR: 'Pares não resolvidos (ids u1…, endereço e dispositivo que o referencia)'}
  - name: annotations
    in: prompt
    desc: {zh-CN: 当前的视图标注（手工或已采纳的 AI 建议）, en: Current view annotations (manual or adopted AI suggestions), pt-BR: Anotações atuais (manuais ou sugestões adotadas)}
  - name: error
    in: retry
    desc: {zh-CN: 上次回复不能用的原因, en: Why the previous reply could not be used, pt-BR: Por que a resposta anterior não pôde ser usada}
examples: []
tools:
  - gquery
  - sanitize
output:
  format: json
  schema: '{"suggestions": [{"category": "view_hint | peer_link", "kind": "role | group | layer | peer", "title": "...", "content": {"target": "d1", "key": "role", "value": "pe", "reason": "..."}, "refs": [{"id": "d1"}]}]}'
checks:
  - suggest.refs_exist
  - suggest.view_hint
  - suggest.peer_link
samples:
  - title: {zh-CN: 角色、分组与推测对端, en: 'Roles, a group and a guessed peer', pt-BR: 'Papéis, um grupo e um par estimado'}
    input:
      vars:
        roles: 'core, aggregation, access, pe, p, ce'
        lang: English
        devices: "d1 | ATN-CHANGE-01 | family=huawei-vrp8 | links=1 | descriptions: UPLINK-TO-AGG\nd2 | AGG-01 | family=cisco-iosxe | links=1 | descriptions: TO-ATN"
        links: 'd1:GigabitEthernet0/2/0 <-> d2:GigabitEthernet0/0/1 (subnet)'
        unresolved: 'u1 | bgp peer 10.20.255.9 referenced by d2'
        annotations: '(none)'
      facts:
        objects:
          d1: {type: device, label: ATN-CHANGE-01, device_id: 1, ifaces: [[GigabitEthernet0/2/0, 10.1.1.1/30, '', false]]}
          d2: {type: device, label: AGG-01, device_id: 2, ifaces: [[GigabitEthernet0/0/1, 10.1.1.2/30, '', false], [GigabitEthernet0/0/9, 10.20.255.10/30, '', false]]}
          u1: {type: peer, label: 10.20.255.9, device: d2, address: 10.20.255.9}
        numbers: {devices: 2, links: 1}
        lines: {}
        names: [ATN-CHANGE-01, AGG-01, UPLINK-TO-AGG, TO-ATN, 10.20.255.9, 10.20.255.10, GigabitEthernet0/0/9]
        linked: [[d1, GigabitEthernet0/2/0, d2, GigabitEthernet0/0/1]]
    reply: '{"suggestions": [{"category": "view_hint", "kind": "role", "title": "d1: access", "content": {"target": "d1", "key": "role", "value": "access", "reason": "[[d1]] has a single uplink described UPLINK-TO-AGG towards [[d2]]."}, "refs": [{"id": "d1"}, {"id": "d2"}]}, {"category": "view_hint", "kind": "group", "title": "d1: East POP", "content": {"target": "d1", "key": "group", "value": "East POP", "reason": "[[d1]] hangs off [[d2]]."}, "refs": [{"id": "d1"}]}, {"category": "peer_link", "kind": "peer", "title": "u1: external edge router", "content": {"a": "d2", "b": "u1", "a_interface": "GigabitEthernet0/0/9", "external": true, "label": "external edge", "reason": "[[d2]] peers with [[u1]] over a directly connected subnet."}, "refs": [{"id": "d2"}, {"id": "u1"}]}]}'
  - title: {zh-CN: 编造设备、错误角色与连不上的对端（演示拒绝）, en: 'Invented device, wrong role and an unlinkable peer (shows rejections)', pt-BR: 'Dispositivo inventado, papel errado e par impossível (mostra as rejeições)'}
    input:
      vars:
        roles: 'core, aggregation, access, pe, p, ce'
        lang: English
        devices: "d1 | ATN-CHANGE-01 | family=huawei-vrp8 | links=0\nd2 | AGG-01 | family=cisco-iosxe | links=0"
        links: '(none)'
        unresolved: '(none)'
        annotations: '(none)'
      facts:
        objects:
          d1: {type: device, label: ATN-CHANGE-01, device_id: 1, ifaces: [[GigabitEthernet0/2/0, 10.1.1.1/30, '', false]]}
          d2: {type: device, label: AGG-01, device_id: 2, ifaces: [[GigabitEthernet0/0/1, 10.9.9.2/30, '', false]]}
        numbers: {devices: 2, links: 0}
        lines: {}
        names: [ATN-CHANGE-01, AGG-01]
        linked: []
    reply: '{"suggestions": [{"category": "view_hint", "kind": "role", "title": "d9: core", "content": {"target": "d9", "key": "role", "value": "core", "reason": "Big box."}, "refs": [{"id": "d9"}]}, {"category": "view_hint", "kind": "role", "title": "d1: firewall", "content": {"target": "d1", "key": "role", "value": "firewall"}, "refs": [{"id": "d1"}]}, {"category": "peer_link", "kind": "peer", "title": "Link d1 to d2", "content": {"a": "d1", "b": "d2", "reason": "Names look related."}, "refs": [{"id": "d1"}, {"id": "d2"}]}]}'
