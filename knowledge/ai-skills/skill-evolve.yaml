# 内置 AI skill（只读）：skill 进化（元 skill）：根据失败案例与用户更正提出改进的候选版本；候选版本要经回归集对比打分并由管理员批准才发布。
# 管理员修改后的版本保存在 data/ai-skills/skill-evolve/，可回滚或恢复为本文件的内置版本。
# 提示词中的 {变量} 由代码填入，{{ 与 }} 表示字面的花括号。
id: skill-evolve
version: 1
title: {zh-CN: skill 进化, en: Skill evolution, pt-BR: Evolução de skills}
description: {zh-CN: 管理员发起进化时使用：根据某个 skill 的失败案例与用户更正，提出改进的系统提示词、提示模板与示例。代码检查候选保留了全部变量，再用回归集分别运行新旧版本打分；管理员批准后才发布，不自动上线。, en: "Used when an admin starts an evolution: proposes an improved system prompt, prompt template and examples from a skill's failed cases and user corrections. Code checks the candidate keeps every variable, then scores old and new versions on the regression set; it is published only after admin approval.", pt-BR: 'Usada quando o administrador inicia uma evolução: propõe prompt de sistema, modelo e exemplos melhores a partir dos casos com falha e correções. O código confere que o candidato mantém todas as variáveis e pontua as versões antiga e nova no conjunto de regressão; só é publicado após aprovação.'}
task: merge
used_by: evolve
group: evolve
enabled: true
system: 'You improve the prompts of an AI skill used inside LucidMesh, a network configuration tool. Every output of the skill is checked by code; the failed cases below show where the current prompts led to outputs the code rejected or users corrected. Keep the task, output format and every {{placeholder}} of the current templates unchanged (placeholders are filled by code), keep the prompts concise, and add at most 3 short examples when they help. Reply with JSON only: {{"system": "...", "prompt": "...", "templates": {{"<name>": "..."}}, "examples": [{{"input": "...", "output": "...", "note": "..."}}], "rationale": "<what you changed and why>"}}'
prompt: |-
  Skill: {skill} ({title})
  Output must pass these code checks: {checks}

  Current system prompt:
  {system}

  Current prompt template:
  {prompt}

  Other templates:
  {templates}

  Current examples:
  {examples}

  Failed cases (sanitised):
  {cases}
templates: {}
variables:
  - name: skill
    in: prompt
    desc: {zh-CN: 要改进的 skill 编号, en: Id of the skill to improve, pt-BR: Id da skill a melhorar}
  - name: title
    in: prompt
    desc: {zh-CN: skill 名称, en: Skill name, pt-BR: Nome da skill}
  - name: checks
    in: prompt
    desc: {zh-CN: 输出必须通过的代码校验, en: Code checks its output must pass, pt-BR: Verificações de código da saída}
  - name: system
    in: prompt
    desc: {zh-CN: 当前系统提示词, en: Current system prompt, pt-BR: Prompt de sistema atual}
  - name: prompt
    in: prompt
    desc: {zh-CN: 当前提示模板, en: Current prompt template, pt-BR: Modelo de prompt atual}
  - name: templates
    in: prompt
    desc: {zh-CN: 其他模板（JSON）, en: Other templates (JSON), pt-BR: Outros modelos (JSON)}
  - name: examples
    in: prompt
    desc: {zh-CN: 当前示例（JSON）, en: Current examples (JSON), pt-BR: Exemplos atuais (JSON)}
  - name: cases
    in: prompt
    desc: {zh-CN: 失败案例：输入、AI 的回复、代码校验结果、用户更正（脱敏后）, en: 'Failed cases: input, AI reply, code check, user correction (sanitised)', pt-BR: 'Casos com falha: entrada, resposta, verificação, correção (anonimizados)'}
examples: []
tools:
  - sanitize
output:
  format: json
  schema: '{"system": "...", "prompt": "...", "templates": {}, "examples": [], "rationale": "..."}'
checks:
  - evolve.placeholders
samples: []
