# VRF 功能域：华为 ip vpn-instance / Cisco vrf definition。
# RD 在华为写在 ipv4-family 下、在 Cisco 写在 vrf 下；语义上都是“这个 VRF 的 IPv4 RD”，统一挂在 vrf.instance.af 下。
domain: vrf
nodes:
  vrf.instance:
    type: object
    key: [name]
    semantic: {zh-CN: VRF（VPN 实例）, en: VRF instance}
    status: reviewed
  vrf.instance.description:
    parent: vrf.instance
    type: text
    semantic: {zh-CN: VRF 描述, en: VRF description}
  vrf.instance.af:
    parent: vrf.instance
    type: object
    key: [afi]
    semantic: {zh-CN: VRF 地址族（ipv4 / ipv6）, en: VRF address family}
  vrf.instance.af.rd:
    parent: vrf.instance.af
    type: rd
    semantic: {zh-CN: 路由区分符 RD, en: Route distinguisher}
  vrf.instance.af.rt:
    parent: vrf.instance.af
    type: object
    key: [value, direction]
    semantic: {zh-CN: 路由目标 RT（值 + 方向 import / export）, en: Route target}
  vrf.instance.af.rt.value:
    parent: vrf.instance.af.rt
    type: rd
    semantic: {zh-CN: RT 值, en: RT value}
  vrf.instance.af.rt.direction:
    parent: vrf.instance.af.rt
    type: enum
    choices: [import, export, both]
    semantic: {zh-CN: RT 方向（both 表示同时 import 与 export）, en: RT direction}
  vrf.instance.af.label_mode:
    parent: vrf.instance.af
    type: enum
    choices: [per-instance, per-route, per-nexthop]
    semantic: {zh-CN: VPN 标签分配方式, en: Label allocation mode}
  vrf.instance.af.import_policy:
    parent: vrf.instance.af
    type: ref
    ref: rp.policy
    semantic: {zh-CN: 引入路由时应用的路由策略, en: Import route policy}
  vrf.instance.af.export_policy:
    parent: vrf.instance.af
    type: ref
    ref: rp.policy
    semantic: {zh-CN: 发布路由时应用的路由策略, en: Export route policy}
  # ---------- 0.3.0 L3VPN 完善：隧道策略、路由数量限制、VPN FRR ----------
  vrf.instance.af.tunnel_policy:
    parent: vrf.instance.af
    type: ref
    ref: tunnel_policy
    semantic: {zh-CN: VPN 路由迭代隧道时使用的隧道策略（华为 tnl-policy；Cisco 没有对应命令，缺省用 LDP LSP）, en: Tunnel policy}
  vrf.instance.af.prefix_limit:
    parent: vrf.instance.af
    type: integer
    semantic: {zh-CN: VRF 路由数量上限（华为 prefix limit；Cisco maximum routes）, en: Maximum routes}
  vrf.instance.af.prefix_limit_threshold:
    parent: vrf.instance.af
    type: integer
    semantic: {zh-CN: 告警阈值（百分比；华为 alert-percent；Cisco warn-threshold）, en: Warning threshold (%)}
  vrf.instance.af.prefix_limit_warn_only:
    parent: vrf.instance.af
    type: boolean
    semantic: {zh-CN: 超过上限只告警、不丢弃（华为 simply-alert；Cisco warning-only）, en: Warning only}
  vrf.instance.af.vpn_frr:
    parent: vrf.instance.af
    type: boolean
    semantic: {zh-CN: VPN FRR（华为 vpn frr）, en: VPN FRR}
  tunnel_policy:
    type: object
    key: [name]
    semantic: {zh-CN: 隧道策略（华为 tunnel-policy；L3VPN / VPWS / VPLS 按它选择隧道；Cisco 没有对应对象）, en: Tunnel policy}
    status: reviewed
  tunnel_policy.description:
    parent: tunnel_policy
    type: text
    semantic: {zh-CN: 描述, en: Description}
  tunnel_policy.select_seq:
    parent: tunnel_policy
    type: string
    semantic: {zh-CN: 隧道选择顺序（华为 tunnel select-seq 后的隧道类型，按出现顺序，如 "lsp" "cr-lsp lsp"）, en: Tunnel selection sequence}
  tunnel_policy.load_balance:
    parent: tunnel_policy
    type: integer
    semantic: {zh-CN: 参与负载分担的隧道数（load-balance-number）, en: Load-balance number}
deps:
  - {kind: reference, from: vrf.instance.af.import_policy, to: rp.policy}
  - {kind: reference, from: vrf.instance.af.export_policy, to: rp.policy}
  - {kind: reference, from: vrf.instance.af.tunnel_policy, to: tunnel_policy, note: {zh-CN: VPN 实例引用隧道策略, en: 'VPN instance references the tunnel policy', pt-BR: 'A instância VPN referencia a política de túnel'}}
