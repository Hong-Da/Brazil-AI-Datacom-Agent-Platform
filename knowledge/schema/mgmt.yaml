# 管理面功能域（0.2.0）：NTP、SNMP、Syslog、SSH / Telnet、AAA 与本地用户、TACACS+ / HWTACACS、登录线路（VTY / Console）。
# 单例对象（每台设备只有一个，如 SNMP 代理、SSH 服务）编号固定为 "_"。
domain: mgmt
nodes:
  # ---------- NTP ----------
  mgmt.ntp:
    type: object
    key: [id]
    semantic: {zh-CN: NTP 服务, en: NTP}
    status: reviewed
  mgmt.ntp.server:
    parent: mgmt.ntp
    type: object
    key: [address]
    semantic: {zh-CN: NTP 服务器（华为 unicast-server / Cisco ntp server）, en: NTP server}
  mgmt.ntp.server.source_interface:
    parent: mgmt.ntp.server
    type: interface
    semantic: {zh-CN: 源接口, en: Source interface}
  mgmt.ntp.server.vrf:
    parent: mgmt.ntp.server
    type: ref
    ref: vrf.instance
    semantic: {zh-CN: 所属 VRF, en: VRF}
  mgmt.ntp.server.prefer:
    parent: mgmt.ntp.server
    type: boolean
    semantic: {zh-CN: 首选服务器, en: Preferred}
  mgmt.ntp.server.key:
    parent: mgmt.ntp.server
    type: integer
    semantic: {zh-CN: 认证密钥编号, en: Authentication key id}
  mgmt.ntp.authentication:
    parent: mgmt.ntp
    type: boolean
    semantic: {zh-CN: 启用 NTP 认证, en: NTP authentication}
  mgmt.ntp.server_disabled:
    parent: mgmt.ntp
    type: boolean
    semantic: {zh-CN: 关闭本机的 NTP 服务端功能, en: NTP server function disabled}
  mgmt.ntp.access:
    parent: mgmt.ntp
    type: object
    key: [kind]
    semantic: {zh-CN: NTP 访问控制（peer / server / query / synchronization）, en: NTP access control}
  mgmt.ntp.access.acl:
    parent: mgmt.ntp.access
    type: ref
    ref: acl.instance
    semantic: {zh-CN: 引用的 ACL, en: ACL}
  mgmt.ntp.source_interface:
    parent: mgmt.ntp
    type: interface
    semantic: {zh-CN: 全局源接口（Cisco ntp source）, en: Source interface}
  # ---------- SNMP ----------
  mgmt.snmp:
    type: object
    key: [id]
    semantic: {zh-CN: SNMP 代理, en: SNMP agent}
    status: reviewed
  mgmt.snmp.enabled:
    parent: mgmt.snmp
    type: boolean
    semantic: {zh-CN: 启用 SNMP 代理, en: Enabled}
  mgmt.snmp.community:
    parent: mgmt.snmp
    type: object
    key: [name]
    semantic: {zh-CN: 团体字（按名称或别名区分；华为密文团体字按别名）, en: Community}
    secret: true
  mgmt.snmp.community.access:
    parent: mgmt.snmp.community
    type: enum
    choices: [read, write]
    semantic: {zh-CN: 读写权限（Cisco RO 记为 read、RW 记为 write）, en: Access}
  mgmt.snmp.community.acl:
    parent: mgmt.snmp.community
    type: ref
    ref: acl.instance
    semantic: {zh-CN: 限制访问的 ACL, en: ACL}
  mgmt.snmp.location:
    parent: mgmt.snmp
    type: text
    semantic: {zh-CN: 设备位置, en: Location}
  mgmt.snmp.contact:
    parent: mgmt.snmp
    type: text
    semantic: {zh-CN: 联系人, en: Contact}
  mgmt.snmp.versions:
    parent: mgmt.snmp
    type: string
    semantic: {zh-CN: 启用的协议版本, en: Enabled versions}
  mgmt.snmp.trap_enable:
    parent: mgmt.snmp
    type: boolean
    semantic: {zh-CN: 启用告警（Trap）, en: Traps enabled}
  mgmt.snmp.trap_source:
    parent: mgmt.snmp
    type: interface
    semantic: {zh-CN: 告警源接口, en: Trap source interface}
  mgmt.snmp.host:
    parent: mgmt.snmp
    type: object
    key: [address]
    semantic: {zh-CN: 告警接收主机, en: Trap host}
  mgmt.snmp.host.version:
    parent: mgmt.snmp.host
    type: enum
    choices: [v1, v2c, v3]
    semantic: {zh-CN: 告警使用的版本, en: Version}
  mgmt.snmp.host.source_interface:
    parent: mgmt.snmp.host
    type: interface
    semantic: {zh-CN: 源接口, en: Source interface}
  # SNMPv3（M4-2）：组与 USM 用户。安全级别统一为 noauth / auth / priv（华为 noauthentication / authentication / privacy）
  mgmt.snmp.group:
    parent: mgmt.snmp
    type: object
    key: [name]
    semantic: {zh-CN: SNMP 组（华为 snmp-agent group / Cisco snmp-server group）, en: SNMP group}
  mgmt.snmp.group.version:
    parent: mgmt.snmp.group
    type: enum
    choices: [v1, v2c, v3]
    semantic: {zh-CN: 版本, en: Version}
  mgmt.snmp.group.security_level:
    parent: mgmt.snmp.group
    type: enum
    choices: [noauth, auth, priv]
    semantic: {zh-CN: 安全级别（不认证 / 认证 / 认证加加密）, en: Security level}
  mgmt.snmp.group.read_view:
    parent: mgmt.snmp.group
    type: string
    semantic: {zh-CN: 读视图, en: Read view}
  mgmt.snmp.group.write_view:
    parent: mgmt.snmp.group
    type: string
    semantic: {zh-CN: 写视图, en: Write view}
  mgmt.snmp.group.notify_view:
    parent: mgmt.snmp.group
    type: string
    semantic: {zh-CN: 通知视图, en: Notify view}
  mgmt.snmp.group.acl:
    parent: mgmt.snmp.group
    type: ref
    ref: acl.instance
    semantic: {zh-CN: 限制访问的 ACL, en: ACL}
  mgmt.snmp.user:
    parent: mgmt.snmp
    type: object
    key: [name]
    semantic: {zh-CN: SNMPv3 用户（华为 usm-user / Cisco snmp-server user）, en: SNMPv3 user}
  mgmt.snmp.user.group:
    parent: mgmt.snmp.user
    type: ref
    ref: mgmt.snmp.group
    semantic: {zh-CN: 所属组, en: Group}
  mgmt.snmp.user.version:
    parent: mgmt.snmp.user
    type: enum
    choices: [v1, v2c, v3]
    semantic: {zh-CN: 版本, en: Version}
  mgmt.snmp.user.auth_protocol:
    parent: mgmt.snmp.user
    type: string
    semantic: {zh-CN: 认证算法（md5、sha、sha2-256 等，按设备写法）, en: Authentication protocol}
  mgmt.snmp.user.priv_protocol:
    parent: mgmt.snmp.user
    type: string
    semantic: {zh-CN: 加密算法（des、3des、aes128 等，按设备写法）, en: Privacy protocol}
  mgmt.snmp.user.acl:
    parent: mgmt.snmp.user
    type: ref
    ref: acl.instance
    semantic: {zh-CN: 限制访问的 ACL, en: ACL}
  # ---------- Syslog ----------
  mgmt.syslog:
    type: object
    key: [id]
    semantic: {zh-CN: 日志（华为信息中心 / Cisco logging）, en: Syslog}
  mgmt.syslog.host:
    parent: mgmt.syslog
    type: object
    key: [address]
    semantic: {zh-CN: 日志服务器, en: Log host}
  mgmt.syslog.host.vrf:
    parent: mgmt.syslog.host
    type: ref
    ref: vrf.instance
    semantic: {zh-CN: 所属 VRF, en: VRF}
  mgmt.syslog.host.facility:
    parent: mgmt.syslog.host
    type: string
    semantic: {zh-CN: 日志设施, en: Facility}
  mgmt.syslog.source_interface:
    parent: mgmt.syslog
    type: interface
    semantic: {zh-CN: 日志源接口, en: Source interface}
  mgmt.syslog.level:
    parent: mgmt.syslog
    type: string
    semantic: {zh-CN: 发送到日志服务器的最低级别, en: Trap level}
  mgmt.syslog.buffered:
    parent: mgmt.syslog
    type: boolean
    semantic: {zh-CN: 本地缓存日志, en: Buffered logging}
  # ---------- SSH / Telnet / FTP ----------
  mgmt.ssh:
    type: object
    key: [id]
    semantic: {zh-CN: SSH 服务, en: SSH server}
    status: reviewed
  mgmt.ssh.enabled:
    parent: mgmt.ssh
    type: boolean
    semantic: {zh-CN: 启用 SSH 服务（华为 stelnet server enable）, en: Enabled}
  # M4-2：改为字符串，取值 1 / 2 / 1.99（Cisco 不写 ip ssh version 时为兼容模式 1.99）
  mgmt.ssh.version:
    parent: mgmt.ssh
    type: string
    choices: ["1", "2", "1.99"]
    semantic: {zh-CN: 协议版本（1、2，或兼容模式 1.99：同时接受 v1 与 v2）, en: "Version (1, 2, or 1.99 compatibility mode accepting v1 and v2)"}
  mgmt.ssh.timeout:
    parent: mgmt.ssh
    type: integer
    semantic: {zh-CN: 认证超时（秒）, en: Authentication timeout}
  mgmt.ssh.retries:
    parent: mgmt.ssh
    type: integer
    semantic: {zh-CN: 认证重试次数, en: Authentication retries}
  mgmt.ssh.source_all:
    parent: mgmt.ssh
    type: boolean
    semantic: {zh-CN: 所有接口都可作为服务源, en: All interfaces as source}
  mgmt.ssh.sftp:
    parent: mgmt.ssh
    type: boolean
    semantic: {zh-CN: 启用 SFTP 服务, en: SFTP server}
  # M4-2：SSH 服务端算法与 SSHv1 兼容（安全基线用）。算法按设备写法原样记录、空格分隔（华为 aes128_ctr、Cisco aes128-ctr）
  mgmt.ssh.compat_v1:
    parent: mgmt.ssh
    type: boolean
    semantic: {zh-CN: 兼容 SSHv1（华为 ssh server compatible-ssh1x enable）, en: SSHv1 compatibility}
  mgmt.ssh.ciphers:
    parent: mgmt.ssh
    type: string
    semantic: {zh-CN: 服务端允许的加密算法（华为 ssh server cipher / Cisco ip ssh server algorithm encryption）, en: Server encryption algorithms}
  mgmt.ssh.hmacs:
    parent: mgmt.ssh
    type: string
    semantic: {zh-CN: 服务端允许的 HMAC 算法（华为 ssh server hmac / Cisco ip ssh server algorithm mac）, en: Server MAC algorithms}
  mgmt.ssh.kex:
    parent: mgmt.ssh
    type: string
    semantic: {zh-CN: 服务端允许的密钥交换算法（华为 ssh server key-exchange / Cisco ip ssh server algorithm kex）, en: Server key exchange algorithms}
  mgmt.ssh.rsa_keypair:
    parent: mgmt.ssh
    type: string
    semantic: {zh-CN: SSH 使用的 RSA 密钥对名称（Cisco ip ssh rsa keypair-name）, en: RSA key pair name}
  mgmt.ssh.user:
    parent: mgmt.ssh
    type: object
    key: [name]
    semantic: {zh-CN: SSH 用户, en: SSH user}
  mgmt.ssh.user.auth_type:
    parent: mgmt.ssh.user
    type: string
    semantic: {zh-CN: 认证方式, en: Authentication type}
  mgmt.ssh.user.service_type:
    parent: mgmt.ssh.user
    type: string
    semantic: {zh-CN: 服务类型, en: Service type}
  mgmt.telnet:
    type: object
    key: [id]
    semantic: {zh-CN: Telnet 服务, en: Telnet server}
  mgmt.telnet.enabled:
    parent: mgmt.telnet
    type: boolean
    semantic: {zh-CN: 启用 Telnet 服务（安全基线建议关闭）, en: Enabled}
  mgmt.telnet.source_all:
    parent: mgmt.telnet
    type: boolean
    semantic: {zh-CN: 所有接口都可作为服务源, en: All interfaces as source}
  mgmt.ftp:
    type: object
    key: [id]
    semantic: {zh-CN: FTP 服务, en: FTP server}
  mgmt.ftp.enabled:
    parent: mgmt.ftp
    type: boolean
    semantic: {zh-CN: 启用 FTP 服务, en: Enabled}
  mgmt.ftp.source_all:
    parent: mgmt.ftp
    type: boolean
    semantic: {zh-CN: 所有接口都可作为服务源, en: All interfaces as source}
  # ---------- AAA ----------
  mgmt.aaa:
    type: object
    key: [id]
    semantic: {zh-CN: AAA（华为 aaa 视图 / Cisco aaa new-model）, en: AAA}
    status: reviewed
  # M4-2：Cisco no aaa new-model 记为 enabled = false（原来只建了 mgmt.aaa 对象，看不出是否开启）；华为 AAA 恒开启（Profile 缺省 true）
  mgmt.aaa.enabled:
    parent: mgmt.aaa
    type: boolean
    semantic: {zh-CN: 启用 AAA（Cisco aaa new-model；华为恒开启）, en: AAA enabled (Cisco aaa new-model)}
  mgmt.aaa.user:
    parent: mgmt.aaa
    type: object
    key: [name]
    semantic: {zh-CN: 本地用户（华为 local-user / Cisco username）, en: Local user}
  mgmt.aaa.user.password_set:
    parent: mgmt.aaa.user
    type: boolean
    semantic: {zh-CN: 已设置密码（只记录是否设置，不记录密文）, en: Password set}
  mgmt.aaa.user.level:
    parent: mgmt.aaa.user
    type: integer
    range: [0, 15]
    semantic: {zh-CN: 用户级别 / 特权级别, en: Privilege level}
  mgmt.aaa.user.service_type:
    parent: mgmt.aaa.user
    type: string
    semantic: {zh-CN: 允许的服务类型, en: Service types}
  mgmt.aaa.user.state:
    parent: mgmt.aaa.user
    type: string
    semantic: {zh-CN: 状态与锁定策略, en: State}
  mgmt.aaa.scheme:
    parent: mgmt.aaa
    type: object
    key: [kind, name]
    semantic: {zh-CN: 认证 / 授权 / 计费方案（Cisco 方法列表）, en: AAA scheme / method list}
  mgmt.aaa.scheme.methods:
    parent: mgmt.aaa.scheme
    type: string
    semantic: {zh-CN: 方法顺序，例如 "hwtacacs local", en: Methods in order}
  mgmt.aaa.domain:
    parent: mgmt.aaa
    type: object
    key: [name]
    semantic: {zh-CN: AAA 域（华为）, en: AAA domain}
  mgmt.aaa.domain.authentication:
    parent: mgmt.aaa.domain
    type: string
    semantic: {zh-CN: 引用的认证方案, en: Authentication scheme}
  mgmt.aaa.domain.authorization:
    parent: mgmt.aaa.domain
    type: string
    semantic: {zh-CN: 引用的授权方案, en: Authorization scheme}
  mgmt.aaa.domain.accounting:
    parent: mgmt.aaa.domain
    type: string
    semantic: {zh-CN: 引用的计费方案, en: Accounting scheme}
  mgmt.aaa.domain.tacacs:
    parent: mgmt.aaa.domain
    type: ref
    ref: mgmt.tacacs
    semantic: {zh-CN: 引用的 TACACS+ 服务器模板, en: TACACS+ server template}
  mgmt.aaa.domain.radius:
    parent: mgmt.aaa.domain
    type: ref
    ref: mgmt.radius
    semantic: {zh-CN: 引用的 RADIUS 服务器组（M4-2）, en: RADIUS server group}
  mgmt.tacacs:
    type: object
    key: [name]
    semantic: {zh-CN: TACACS+ 服务器（华为 HWTACACS 模板 / Cisco tacacs server）, en: TACACS+ server template}
  mgmt.tacacs.server:
    parent: mgmt.tacacs
    type: object
    key: [role, address]
    semantic: {zh-CN: 服务器地址（role：authentication / authorization / accounting / all）, en: Server address}
  mgmt.tacacs.server.secondary:
    parent: mgmt.tacacs.server
    type: boolean
    semantic: {zh-CN: 备用服务器, en: Secondary}
  mgmt.tacacs.source:
    parent: mgmt.tacacs
    type: string
    semantic: {zh-CN: 源地址或源接口, en: Source address or interface}
  mgmt.tacacs.key_set:
    parent: mgmt.tacacs
    type: boolean
    semantic: {zh-CN: 已设置共享密钥, en: Shared key set}
  mgmt.tacacs.timeout:
    parent: mgmt.tacacs
    type: integer
    semantic: {zh-CN: 响应超时（秒）, en: Response timeout}
  # ---------- RADIUS（M4-2） ----------
  mgmt.radius:
    type: object
    key: [name]
    semantic: {zh-CN: RADIUS 服务器组 / 模板（华为 radius-server group；Cisco radius server <名称>，旧写法 radius-server host 归到 "_"）, en: RADIUS server group / template}
  mgmt.radius.server:
    parent: mgmt.radius
    type: object
    key: [role, address]
    semantic: {zh-CN: 服务器地址（role：authentication / accounting / all）, en: RADIUS server address}
  mgmt.radius.server.port:
    parent: mgmt.radius.server
    type: integer
    semantic: {zh-CN: 端口, en: Port}
  mgmt.radius.server.vrf:
    parent: mgmt.radius.server
    type: ref
    ref: vrf.instance
    semantic: {zh-CN: 所属 VRF, en: VRF}
  mgmt.radius.key_set:
    parent: mgmt.radius
    type: boolean
    semantic: {zh-CN: 已设置共享密钥（只记录是否设置）, en: Shared key set}
  mgmt.radius.source:
    parent: mgmt.radius
    type: string
    semantic: {zh-CN: 源接口或源地址, en: Source interface or address}
  mgmt.radius.timeout:
    parent: mgmt.radius
    type: integer
    semantic: {zh-CN: 响应超时（秒）, en: Response timeout}
  mgmt.radius.retransmit:
    parent: mgmt.radius
    type: integer
    semantic: {zh-CN: 重传次数, en: Retransmissions}
  # ---------- 登录线路 ----------
  mgmt.line:
    type: object
    key: [type, range]
    semantic: {zh-CN: 登录线路（type：vty / console；range 如 "0 20"）, en: Login line}
  mgmt.line.acl_in:
    parent: mgmt.line
    type: ref
    ref: acl.instance
    semantic: {zh-CN: 入方向访问控制（华为 acl … inbound / Cisco access-class … in）, en: Inbound ACL}
  # M3 知识库补缺：原来华为的认证方式与 Cisco 的方法列表名都记在 auth 上（图上相等但含义不同），拆成方式与列表名两个节点
  mgmt.line.auth:
    parent: mgmt.line
    type: enum
    choices: [aaa, password, none, local, tacacs]
    semantic: {zh-CN: 登录认证方式（华为 authentication-mode aaa / password / none；Cisco login authentication 为 aaa，login 为 password，login local 为 local）, en: Login authentication mode}
  mgmt.line.auth_list:
    parent: mgmt.line
    type: string
    semantic: {zh-CN: AAA 登录认证方法列表名（Cisco login authentication <列表>；华为用 AAA 域的认证方案，没有线路级的列表名）, en: AAA login authentication list name}
  mgmt.line.privilege:
    parent: mgmt.line
    type: integer
    range: [0, 15]
    semantic: {zh-CN: 用户级别, en: Privilege level}
  mgmt.line.idle_timeout:
    parent: mgmt.line
    type: string
    semantic: {zh-CN: 空闲超时（分 秒）, en: Idle timeout (min sec)}
  mgmt.line.protocols:
    parent: mgmt.line
    type: string
    semantic: {zh-CN: 允许的登录协议（华为 protocol inbound / Cisco transport input）, en: Inbound protocols}
  # ---------- M7-3（Nokia SR OS）：系统名称、全局 Router ID ----------
  mgmt.system:
    type: object
    key: [id]
    semantic: {zh-CN: 系统（编号固定为 "_"；主机名、全局 Router ID 等设备级设置）, en: System, pt-BR: Sistema}
    status: reviewed
  mgmt.system.name:
    parent: mgmt.system
    type: text
    semantic: {zh-CN: 主机名（Nokia system name；华为 sysname、Cisco hostname 有对应写法，为保持现有基准未归并）, en: Host name, pt-BR: Nome do host}
  mgmt.system.router_id:
    parent: mgmt.system
    type: ipv4
    semantic: {zh-CN: 全局 Router ID（Nokia router Base 下的 router-id；华为 router id 有对应写法，未归并；Cisco 没有全局命令）, en: Global router ID, pt-BR: Router ID global}
  # ---------- M7-3（Nokia SR OS）：管理状态 ----------
  mgmt.syslog.host.target_id:
    parent: mgmt.syslog.host
    type: integer
    semantic: {zh-CN: 日志目标编号（Nokia log syslog <编号>；华为 / Cisco 没有，平台特有）, en: Syslog target ID (Nokia), pt-BR: ID do destino syslog (Nokia)}
  mgmt.syslog.host.level:
    parent: mgmt.syslog.host
    type: string
    semantic: {zh-CN: 发送到该服务器的最低级别（Nokia log syslog 下的 level；华为 info-center loghost … level 有对应写法，未归并）, en: Minimum severity sent to this server, pt-BR: Severidade mínima enviada a este servidor}
  mgmt.ntp.shutdown:
    parent: mgmt.ntp
    type: boolean
    semantic: {zh-CN: NTP 管理关闭（Nokia 缺省关闭）（Nokia shutdown / no shutdown；华为 / Cisco 配置了服务器即启用，平台特有）, en: NTP administratively down, pt-BR: NTP desativado administrativamente}
deps:
  - {kind: reference, from: mgmt.aaa.domain.tacacs, to: mgmt.tacacs}
  - {kind: reference, from: mgmt.ntp.server.vrf, to: vrf.instance}
  - {kind: reference, from: mgmt.syslog.host.vrf, to: vrf.instance}
  - {kind: reference, from: mgmt.radius.server.vrf, to: vrf.instance}
  - {kind: reference, from: mgmt.aaa.domain.radius, to: mgmt.radius}
  - {kind: reference, from: mgmt.snmp.user.group, to: mgmt.snmp.group}
