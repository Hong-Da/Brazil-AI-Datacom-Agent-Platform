# IS-IS 功能域（0.2.0）：华为 isis <进程> / Cisco router isis [标签]；NET、级别、开销类型、接口参数。
domain: isis
nodes:
  isis.process:
    type: object
    key: [id]
    semantic: {zh-CN: IS-IS 进程（Cisco 为区域标签，没有标签时为 "_"）, en: IS-IS process}
    status: reviewed
  isis.process.net:
    parent: isis.process
    type: object
    key: [value]
    semantic: {zh-CN: 网络实体名称 NET, en: Network entity title}
  isis.process.level:
    parent: isis.process
    type: enum
    choices: [level-1, level-2, level-1-2]
    semantic: {zh-CN: 路由器级别, en: IS type}
  isis.process.metric_style:
    parent: isis.process
    type: enum
    choices: [narrow, wide, compatible, transition]
    semantic: {zh-CN: 开销类型（华为 cost-style / Cisco metric-style）, en: Metric style}
  isis.process.vrf:
    parent: isis.process
    type: ref
    ref: vrf.instance
    semantic: {zh-CN: 所属 VRF, en: VRF}
  isis.process.log_adjacency:
    parent: isis.process
    type: boolean
    semantic: {zh-CN: 记录邻接关系变化, en: Log adjacency changes}
  isis.process.bfd_all:
    parent: isis.process
    type: boolean
    semantic: {zh-CN: 在所有 IS-IS 接口上启用 BFD, en: BFD on all interfaces}
  isis.process.frr:
    parent: isis.process
    type: boolean
    semantic: {zh-CN: 启用 IS-IS 快速重路由, en: Fast reroute}
  # M4-2：Cisco passive-interface 写在 IS-IS 进程下（与 OSPF 的 ospf.process.passive 同样的写法；华为在接口下 isis silent）
  isis.process.passive_default:
    parent: isis.process
    type: boolean
    semantic: {zh-CN: 默认所有接口为被动接口（Cisco passive-interface default）, en: Passive by default}
  isis.process.passive:
    parent: isis.process
    type: object
    key: [interface]
    semantic: {zh-CN: 进程下单个接口的被动设置（Cisco passive-interface <接口>；取值为 false 表示在默认被动时取消）, en: Per-interface passive setting}
  isis.process.passive.enabled:
    parent: isis.process.passive
    type: boolean
    semantic: {zh-CN: 被动, en: Passive}
  interface.isis:
    parent: interface
    type: object
    key: [id]
    semantic: {zh-CN: 接口上的 IS-IS 参数（每个接口一个，编号固定为 "_"）, en: Interface IS-IS}
  interface.isis.process:
    parent: interface.isis
    type: string
    semantic: {zh-CN: 接口启用的进程（华为不写时为 1；Cisco IS-IS 没有标签时为 "_"）, en: Process}
  interface.isis.metric:
    parent: interface.isis
    type: integer
    semantic: {zh-CN: 接口开销, en: Metric}
  interface.isis.circuit_type:
    parent: interface.isis
    type: enum
    choices: [level-1, level-2, level-1-2, p2p]
    semantic: {zh-CN: 接口级别 / 电路类型, en: Circuit type}
  interface.isis.p2p:
    parent: interface.isis
    type: boolean
    semantic: {zh-CN: 点到点网络类型, en: Point-to-point}
  interface.isis.passive:
    parent: interface.isis
    type: boolean
    semantic: {zh-CN: 被动接口（只发布网段不建邻居）, en: Passive}
  interface.isis.bfd:
    parent: interface.isis
    type: boolean
    semantic: {zh-CN: 接口启用 IS-IS BFD, en: BFD}
  # ---------- M7-3（Nokia SR OS）----------
  isis.process.area_id:
    parent: isis.process
    type: string
    semantic: {zh-CN: 区域地址（Nokia area-id；华为 / Cisco 写在 NET 里，翻译时与系统 ID 拼成 NET）, en: Area address (Nokia area-id; part of the NET elsewhere), pt-BR: Endereço de área (Nokia area-id; parte do NET nos demais)}
  isis.process.system_id:
    parent: isis.process
    type: string
    semantic: {zh-CN: 系统 ID（Nokia system-id，不写时由 router-id 推出；华为 / Cisco 写在 NET 里）, en: System ID (Nokia), pt-BR: ID do sistema (Nokia)}
  isis.process.export_policy:
    parent: isis.process
    type: ref
    ref: rp.policy
    semantic: {zh-CN: 发布路由时应用的路由策略（Nokia export；华为 / Cisco 用 import-route / redistribute，平台特有）, en: Export policy (Nokia), pt-BR: Política de exportação (Nokia)}
  isis.process.te:
    parent: isis.process
    type: boolean
    semantic: {zh-CN: 流量工程扩展（Nokia traffic-engineering；华为 traffic-eng、Cisco mpls traffic-eng 有对应写法，未归并）, en: Traffic engineering extensions, pt-BR: Extensões de engenharia de tráfego}
  interface.isis.level:
    parent: interface.isis
    type: object
    key: [level]
    semantic: {zh-CN: 接口按级别的参数（Nokia interface 下的 level 1 / level 2；华为 isis cost … level-2 等有对应写法，未归并）, en: Per-level interface settings, pt-BR: Parâmetros da interface por nível}
  interface.isis.level.metric:
    parent: interface.isis.level
    type: integer
    semantic: {zh-CN: 该级别的接口开销, en: Metric for the level, pt-BR: Métrica do nível}
  # ---------- M7-3（Nokia SR OS）：管理状态 ----------
  isis.process.shutdown:
    parent: isis.process
    type: boolean
    semantic: {zh-CN: IS-IS 实例管理关闭（Nokia 缺省关闭）（Nokia shutdown / no shutdown；Cisco router isis 下的 shutdown 有对应写法，未归并；华为没有对应）, en: IS-IS instance administratively down, pt-BR: Instância IS-IS desativada administrativamente}
  interface.isis.shutdown:
    parent: interface.isis
    type: boolean
    semantic: {zh-CN: 接口上的 IS-IS 管理关闭（Nokia shutdown / no shutdown；华为 / Cisco 没有对应，平台特有）, en: IS-IS on the interface administratively down, pt-BR: IS-IS na interface desativado administrativamente}
deps:
  - {kind: reference, from: interface.isis.process, to: isis.process, note: {zh-CN: 接口启用的 IS-IS 进程应已创建, en: 'The IS-IS process enabled on the interface must already exist', pt-BR: 'O processo IS-IS habilitado na interface já deve existir'}}
  - {kind: reference, from: isis.process.vrf, to: vrf.instance}
