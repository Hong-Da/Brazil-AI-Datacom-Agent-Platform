  - id: nokia-sros-classic.filter@configure
    syntax: filter
    view: configure
    enters_view: filter
    source:
      patched: 命令参考没有单列 configure 下进入 filter 上下文的命令（完整上下文都以 configure filter 开头）；display-config 写作 filter，块尾 exit
      added_by_patch: true
    status: draft
    maps:
      '@container': ''
  - id: nokia-sros-classic.action.inline@ip-filter-entry
    syntax: action { drop | forward }
    view: ip-filter-entry
    undo: no action
    source:
      patched: 命令参考 25.10 的 action 是上下文（action 下再写 drop / forward）；较早版本与配置指南的举例写作单行 action drop / action forward（Layer 2 Services and EVPN Guide 的 mac-filter 举例），两种写法都识别
      added_by_patch: true
    status: draft
    maps:
      acl.instance.rule.action: kw:drop=deny|forward=permit
  - id: nokia-sros-classic.src-ip@ip-filter-match
    syntax: src-ip { <ip-address/mask> | <ip-address> <ipv4-address-mask> | ip-prefix-list <prefix-list-name> }
    view: ip-filter-match
    undo: no src-ip
    params:
      ip-address/mask:
        type: prefix
      ip-address:
        type: ipv4
      ipv4-address-mask:
        type: mask
      prefix-list-name:
        type: word
    source:
      patched: 命令参考的 src-ip 条目只列了 ipv6-filter / ip-exception / ipv6-exception 的完整上下文，漏了 configure filter ip-filter entry match（dst-ip 条目有；Router Configuration Guide 的 ip-filter entry 举例写 src-ip 192.168.1.1/32）；按 dst-ip 的 IPv4 写法补
      added_by_patch: true
    status: draft
    maps:
      acl.instance.rule.source_ip: pfx:addr:$ip-address/mask||$ip-address
      acl.instance.rule.source_wildcard: pfx:wild:$ip-address/mask
