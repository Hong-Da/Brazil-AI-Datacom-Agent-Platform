  - id: nokia-sros-classic.authentication-key~4
    syntax: authentication-key { <authentication-key> | <hash-key> } [ { hash | hash2 | custom } ]
    view: router-if-vrrp
    undo: no authentication-key
    params:
      authentication-key:
        type: word
      hash-key:
        type: word
    default: no authentication-key — The authentication key value is the null string.
    source:
      doc: nokia-sros-classic-md
      file: configure_router_interface.md
      title: authentication-key
      line: 566
      version: 25.10.R1
    status: draft
  - id: nokia-sros-classic.backup
