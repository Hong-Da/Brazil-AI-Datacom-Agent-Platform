    view: router-if-vrrp
    undo: no backup <ip-address>
    params:
      ip-address:
        type: ipv4
    default: no backup — No virtual router IP address is assigned.
    source:
      doc: nokia-sros-classic-md
      file: configure_router_interface.md
      title: backup
      line: 690
      version: 25.10.R1
    status: draft
    maps:
      interface.vrrp.virtual_ip: $ip-address
