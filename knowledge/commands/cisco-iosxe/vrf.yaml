  - id: cisco-iosxe.mpls-label-mode
    syntax: mpls label mode { vrf <vrf-name> | all-vrfs } protocol bgp-vpnv4 { per-prefix | per-vrf | per-ce | vrf-conn-aggr }
    view: system
    undo: no mpls label mode { vrf <vrf-name> | all-vrfs } protocol bgp-vpnv4 { per-prefix | per-vrf | per-ce | vrf-conn-aggr }
    params:
      vrf-name:
        type: word
    default: Per-vrf label mode is the default for connected routes and BGP aggregate routes on the Cisco 6500 routers. Per-prefix label mode is the default for all other local routes.
    source:
      doc: cisco-iosxe-md
      file: vrf/mpls label mode.md
      title: mpls label mode
      line: 5
      version: '17.15'
    status: draft
    maps:
      vrf.instance: $vrf-name
      vrf.instance.af{afi=ipv4}.label_mode: if:$vrf-name:kw:per-prefix=per-route|per-vrf=per-instance|per-ce=per-nexthop|vrf-conn-aggr
