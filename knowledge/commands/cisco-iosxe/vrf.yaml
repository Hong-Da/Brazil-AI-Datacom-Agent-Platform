  - id: cisco-iosxe.vrf-address-family-ipv4
    syntax: address-family { ipv4 | ipv6 } [ unicast ]
    view: vrf
    enters_view: vrf-af
    undo: no address-family { ipv4 | ipv6 } [ unicast ]
    source:
      patched: vrf/address-family 页面错误（内容是 VPN-IPv4），VRF 下的 IPv4 地址族按 IOS-XE 运行配置补充
      added_by_patch: true
    status: draft
    maps:
      vrf.instance.af: kw:ipv4|ipv6
  - id: cisco-iosxe.maximum-routes@vrf-af
    syntax: maximum routes <limit> { warning-only | <warn-threshold> [ reinstall <reinstall-threshold> ] }
    view: vrf-af
    undo: no maximum routes
    params: &id005
      limit:
        type: integer
        range:
          - 1
          - 4294967295
      warn-threshold:
        type: word
      reinstall-threshold:
        type: word
    default: No limit is set on the maximum number of routes allowed.
    source:
      doc: cisco-iosxe-md
      file: vrf/maximum routes.md
      title: maximum routes
      line: 5
      version: '17.15'
    status: draft
    maps:
      vrf.instance.af{afi=ipv4}.prefix_limit: $limit
      vrf.instance.af{afi=ipv4}.prefix_limit_threshold: $warn-threshold
      vrf.instance.af{afi=ipv4}.prefix_limit_warn_only: if:warning-only:true
  - id: cisco-iosxe.maximum-routes@vrf
    syntax: maximum routes <limit> { warning-only | <warn-threshold> [ reinstall <reinstall-threshold> ] }
