# Cisco IOS-XE（ASR 920）的书写习惯与 0.1.0 功能域涉及的配置模式。
vendor: cisco
separator: "!"
end: end
indent: 1
negative: "no"
root_view: system
views:
  system:
    title: 全局配置模式 (config)
  interface:
    parent: system
    title: 接口配置模式 (config-if)
  service-instance:
    parent: interface
    title: 业务实例模式 (config-if-srv)
    exit: [exit]
  vrf:
    parent: system
    title: VRF 配置模式 (config-vrf)
  vrf-af:
    parent: vrf
    title: VRF 地址族模式 (config-vrf-af)
    exit: [exit-address-family]
  router-bgp:
    parent: system
    title: BGP 配置模式 (config-router)
  bgp-af:
    parent: router-bgp
    title: BGP 地址族模式 (config-router-af)
    exit: [exit-address-family]
  route-map:
    parent: system
    title: Route-map 配置模式 (config-route-map)
  # 0.2.0：IGP、BFD、管理面
  router-ospf: {parent: system, title: OSPF 路由器模式 (config-router)}
  router-isis: {parent: system, title: IS-IS 路由器模式 (config-router)}
  line: {parent: system, title: 线路配置模式 (config-line)}
  tacacs-server: {parent: system, title: TACACS+ 服务器模式 (config-server-tacacs)}
  radius-server: {parent: system, title: RADIUS 服务器模式 (config-radius-server)}
  sg-tacacs: {parent: system, title: TACACS+ 服务器组模式 (config-sg-tacacs+)}
  # 0.3.0：L2VPN（VPWS / VPLS）与 ACL
  pseudowire-class: {parent: system, title: 伪线类模式 (config-pw-class)}
  xconnect: {parent: interface, title: Xconnect 子模式 (config-if-xconn)}
  l2vpn-xconnect: {parent: system, title: L2VPN Xconnect 上下文模式 (config-xconnect)}
  vfi: {parent: system, title: L2 VFI 模式 (config-vfi)}
  bridge-domain: {parent: system, title: 桥域模式 (config-bdomain)}
  l2vpn: {parent: system, title: L2VPN 全局模式 (config-l2vpn)}
  acl: {parent: system, title: 命名 ACL 模式 (config-std-nacl / config-ext-nacl)}
