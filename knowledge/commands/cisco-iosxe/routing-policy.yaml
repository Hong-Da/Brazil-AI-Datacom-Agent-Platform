  - id: cisco-iosxe.set-metric
    syntax: set metric <metric-value>
    view: route-map
    undo: no set metric <metric-value>
    params:
      metric-value:
        type: integer
    default: The dynamically learned metric value.
    source:
      doc: cisco-iosxe-md
      file: routing-policy/set metric (BGP-OSPF-RIP).md
      title: set metric (BGP-OSPF-RIP)
      line: 5
      version: '17.15'
    status: draft
    maps:
      rp.policy.node.set_metric: $metric-value
  - id: cisco-iosxe.set-origin
    syntax: set origin { igp | egp <autonomous-system-number> | incomplete }
    view: route-map
    undo: no set origin { igp | egp <autonomous-system-number> | incomplete }
    params:
      autonomous-system-number:
        type: asn
    default: The origin of the route is based on the path information of the route in the main IP routing table.
    source:
      doc: cisco-iosxe-md
      file: routing-policy/set origin (BGP).md
      title: set origin (BGP)
      line: 5
      version: '17.15'
