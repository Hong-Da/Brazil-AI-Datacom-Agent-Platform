  - id: cisco-iosxe.set-weight
    syntax: set weight <number>
    view: route-map
    undo: no set weight <number>
    params:
      number:
        type: integer
    default: The weight is not changed by the specified route map.
    source:
      doc: cisco-iosxe-md
      file: routing-policy/set weight.md
      title: set weight
      line: 5
      version: '17.15'
    status: draft
