    params: *id001
    default: There are no specific conditions under which a packet passes the named access list.
    source:
      doc: cisco-iosxe-md
      file: acl/permit (IP).md
      title: permit (IP)
      line: 5
      version: '17.15'
      patched: 原文序号写成 *[sequence-number]*、any / host 只写在参数说明里；标准 ACL 条目按运行配置整理
    status: draft
    maps:
