    syntax: '[ <sequence-number> ] remark <remark>'
    view: acl
    undo: no remark <remark>
    params:
      sequence-number:
        type: integer
        range:
          - 1
          - 2147483647
      remark:
        type: text
    default: The access-list entries have no remarks.
    source:
      doc: cisco-iosxe-md
      file: acl/remark.md
      title: remark
      line: 5
      version: '17.15'
      patched: 命名 ACL 中的说明行在 IOS XE 运行配置里可以带序号；说明文字可含空格
    status: draft
    maps:
      acl.instance.rule: $sequence-number
      acl.instance.rule.description: $remark
