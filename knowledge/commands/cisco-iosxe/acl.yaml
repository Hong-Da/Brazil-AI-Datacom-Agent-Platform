  - id: cisco-iosxe.ip-access-group
    syntax: ip access-group { <access-list-name> | <access-list-number> } { in | out }
    view: interface
    undo: no ip access-group { <access-list-number> | <access-list-name> } { in | out }
    params:
      access-list-name:
        type: word
      access-list-number:
        type: integer
    default: An access list is not applied.
    source:
      doc: cisco-iosxe-md
      file: acl/ip access-group.md
      title: ip access-group
      line: 5
      version: '17.15'
    status: draft
    maps:
      interface.acl_in: if:in:$access-list-name||if:in:$access-list-number
      interface.acl_out: if:out:$access-list-name||if:out:$access-list-number
  - id: cisco-iosxe.ip-access-list
    syntax: ip access-list { { standard | extended } { <access-list-name> | <access-list-number> } | helper egress check }
    view: system
    enters_view: acl
    undo: no ip access-list { { standard | extended } { <access-list-name> | <access-list-number> } | helper egress check }
    params:
      access-list-name:
        type: word
      access-list-number:
        type: word
    default: No IP access list or object-group ACL is defined, and outbound ACLs do not match and filter IP helper relayed traffic.
    source:
      doc: cisco-iosxe-md
      file: acl/ip access-list.md
      title: ip access-list
      line: 5
      version: '17.15'
    status: draft
    maps:
      acl.instance: $access-list-name||$access-list-number
      acl.instance.type: kw:standard=basic|extended=advanced
