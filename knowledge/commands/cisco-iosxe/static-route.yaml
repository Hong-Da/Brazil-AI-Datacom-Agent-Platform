    syntax: ip route [ vrf <vrf-name> ] <prefix> <mask> { <ip-address> | <interface-type> <interface-number> [ <ip-address> ] } [ dhcp ] [ global ] [ <distance> ] [ multicast ] [ name <next-hop-name> ] [ permanent | track <number> ] [ tag <tag> ]
