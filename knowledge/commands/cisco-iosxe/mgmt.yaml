      mgmt.tacacs.key_set: flag
  - id: cisco-iosxe.line
    syntax: line [ aux | console | tty | vty ] <line-number> [ <ending-line-number> ]
    view: system
    enters_view: line
    params:
      line-number:
        type: word
      ending-line-number:
        type: word
    default: There is no default line.
    source:
      doc: cisco-iosxe-md
      file: mgmt/line.md
      title: line
      line: 5
      version: '17.15'
    status: draft
    maps:
      mgmt.line: tail:line
  - id: cisco-iosxe.logging-buffered.1
    syntax: logging buffered [ discriminator <discriminator-name> ] <[buffer-size]> <&<1-9>> [ severity-level ] &<1-9>
    view: system
    undo: no logging buffered
    params:
      discriminator-name:
        type: word
      '[buffer-size]':
        type: word
    default: Varies by platform. For most platforms, logging to the buffer is disabled by default.
    source:
      doc: cisco-iosxe-md
      file: mgmt/logging buffered.md
      title: logging buffered
      line: 5
      version: '17.15'
    status: draft
    maps:
      mgmt.syslog: _
      mgmt.syslog.buffered: flag
  - id: cisco-iosxe.logging-buffered.2
    syntax: default logging buffered
    view: system
    default: Varies by platform. For most platforms, logging to the buffer is disabled by default.
    source:
      doc: cisco-iosxe-md
      file: mgmt/logging buffered.md
      title: logging buffered
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.logging-console
    syntax: logging console [ <severity-level> ]
    view: system
    undo: no logging console
    params:
      severity-level:
        type: word
    default: The default varies by platform. In general, the default is to log all messages.
    source:
      doc: cisco-iosxe-md
      file: mgmt/logging console.md
      title: logging console
      line: 5
      version: '17.15'
      patched: 原文把 severity-level 写成了关键字；运行配置中是 logging console 级别
    status: draft
  - id: cisco-iosxe.logging-facility
    syntax: logging facility <facility-type>
    view: system
    undo: no logging facility
    params:
      facility-type:
        type: word
    default: local7
    source:
      doc: cisco-iosxe-md
      file: mgmt/logging facility.md
      title: logging facility
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.logging-source-interface
    syntax: logging source-interface <interface> [ vrf <vrf-name> ]
    view: system
    undo: no logging source-interface <interface> [ vrf <vrf-name> ]
    params:
      interface:
        type: interface
      vrf-name:
        type: word
    default: The wildcard interface address is used.
    source:
      doc: cisco-iosxe-md
      file: mgmt/logging source-interface.md
      title: logging source-interface
      line: 5
      version: '17.15'
      patched: 原文语法 “{interface-name number vrf vrf-name}” 写乱了
    status: draft
    maps:
      mgmt.syslog: _
      mgmt.syslog.source_interface: $interface
  - id: cisco-iosxe.logging-synchronous
    syntax: logging synchronous [ level <severity-level> | all ] [ limit <number-of-lines> ]
    view: line
    undo: no logging synchronous [ level <severity-level> | all ] [ limit <number-of-lines> ]
    params:
      severity-level:
        type: word
      number-of-lines:
        type: word
    default: This command is disabled. If you do not specify a severity level, the default value of 2 is assumed. If you do not specify the maximum number of buffers to be queued, the default value of 20 is assumed.
    source:
      doc: cisco-iosxe-md
      file: mgmt/logging synchronous.md
      title: logging synchronous
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.logging-trap
    syntax: logging trap <level>
    view: system
    undo: no logging trap
    params:
      level:
        type: word
    default: Syslog messages at level 0 to level 6 are generated, but will only be sent to a remote host if the logging host command is configured.
    source:
      doc: cisco-iosxe-md
      file: mgmt/logging trap.md
      title: logging trap
      line: 5
      version: '17.15'
    status: draft
    maps:
      mgmt.syslog: _
      mgmt.syslog.level: $level
  - id: cisco-iosxe.login
    syntax: login [ local | tacacs ]
    view: line
    undo: no login
    default: Virtual terminals require a password. If you do not set a password for a virtual terminal, it responds to attempted connections by displaying an error message and closing the connection.
    source:
      doc: cisco-iosxe-md
      file: mgmt/login (line).md
      title: login (line)
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.login-authentication
    syntax: login authentication { default | <list-name> }
    view: line
    undo: no login authentication { default | <list-name> }
    params:
      list-name:
        type: word
    default: Uses the default set with aaa authentication login .
