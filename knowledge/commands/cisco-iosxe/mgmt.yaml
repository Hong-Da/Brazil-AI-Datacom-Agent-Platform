  - id: cisco-iosxe.ntp-access-group
    syntax: ntp access-group [ ipv4 | ipv6 ] { peer | query-only | serve | serve-only } { <access-list-number> | <access-list-number-expanded> | <access-list-name> } [ kod ]
    view: system
    undo: no ntp access-group [ ipv4 | ipv6 ] { peer | query-only | serve | serve-only }
    params:
      access-list-number:
        type: word
      access-list-number-expanded:
        type: word
      access-list-name:
        type: word
    default: By default, there is no access control. Full access is granted to all systems.
    source:
      doc: cisco-iosxe-md
      file: mgmt/ntp access-group.md
      title: ntp access-group
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.ntp-authenticate
    syntax: ntp authenticate
    view: system
    undo: no ntp [ authenticate ]
    default: By default, NTP authentication is not enabled.
    source:
      doc: cisco-iosxe-md
      file: mgmt/ntp authenticate.md
      title: ntp authenticate
      line: 5
      version: '17.15'
    status: draft
    maps:
      mgmt.ntp: _
      mgmt.ntp.authentication: flag
  - id: cisco-iosxe.ntp-authentication-key
    syntax: ntp authentication-key <number> md5 <key> [ <encryption-type> ]
    view: system
    undo: no ntp authentication-key <number>
    params:
      number:
        type: integer
        range:
          - 1
          - 4294967295
      key:
        type: word
      encryption-type:
        type: integer
        range:
          - 0
          - 7
    default: No authentication key is defined for NTP.
    source:
      doc: cisco-iosxe-md
      file: mgmt/ntp authentication-key.md
      title: ntp authentication-key
      line: 5
      version: '17.15'
      patched: 原文把加密类型写成了关键字并带重复标记；运行配置中是 ntp authentication-key 编号 md5 密钥 [类型]
    status: draft
  - id: cisco-iosxe.ntp-master
    syntax: ntp master [ stratum ] &<1-9>
    view: system
    undo: no ntp [ master ]
    default: By default, this function is disabled. When enabled, the default stratum is 8.
    source:
      doc: cisco-iosxe-md
      file: mgmt/ntp master.md
      title: ntp master
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.ntp-peer
    syntax: ntp peer [ vrf <vrf-name> ] { <ip-address> | <ipv6-address> | [ ip | ipv6 ] <hostname> } [ normal-sync ] [ version <number> ] [ key <key-id> ] [ source <interface> ] [ prefer ] [ maxpoll <number> ] [ minpoll <number> ] [ burst ] [ iburst ]
    view: system
    undo: no ntp [ peer [ vrf <vrf-name> ] { <ip-address> | <ipv6-address> | [ ip | ipv6 ] <hostname> } ]
    params:
      vrf-name:
        type: word
      ip-address:
        type: ipv4
      ipv6-address:
        type: ipv4
      hostname:
        type: word
      number:
        type: word
      key-id:
        type: word
      interface:
        type: interface
    default: The software clock on a router is not configured to synchronize with the NTP peer.
    source:
      doc: cisco-iosxe-md
      file: mgmt/ntp peer.md
      title: ntp peer
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.ntp-server
    syntax: ntp server [ vrf <vrf-name> ] { <ip-address> | <ipv6-address> | [ ip | ipv6 ] <hostname> } [ normal-sync ] [ version <number> ] [ key <key-id> ] [ source <interface> ] [ prefer ] [ maxpoll <number> ] [ minpoll <number> ] [ burst ] [ iburst ]
    view: system
    undo: no ntp [ server [ vrf <vrf-name> ] { <ip-address> | <ipv6-address> | [ ip | ipv6 ] <hostname> } ]
    params:
      vrf-name:
        type: word
      ip-address:
        type: ipv4
      ipv6-address:
        type: ipv4
      hostname:
        type: word
      number:
        type: word
      key-id:
        type: word
      interface:
        type: interface
    default: No servers are configured by default. When a server is configured, the default NTP version number is 3, an authentication key is not used, and the source IPv4 or IPv6 address is taken from the outgoing interface. Effective with Cisco IOS Release 15.2(1)S1, the burst and the iburst keywords are enabled by default.
    source:
      doc: cisco-iosxe-md
      file: mgmt/ntp server.md
      title: ntp server
      line: 5
      version: '17.15'
    status: draft
    maps:
      mgmt.ntp: _
      mgmt.ntp.server: $ip-address||$hostname
      mgmt.ntp.server.vrf: $vrf-name
      mgmt.ntp.server.key: $key-id
      mgmt.ntp.server.prefer: if:prefer:flag
  - id: cisco-iosxe.ntp-source
    syntax: ntp source <interface>
    view: system
    undo: no ntp [ source ]
    params:
      interface:
        type: interface
    default: Source address is determined by the outgoing interface.
    source:
      doc: cisco-iosxe-md
      file: mgmt/ntp source.md
      title: ntp source
      line: 5
      version: '17.15'
    status: draft
    maps:
