# 命令卡（由 lmesh kb ingest 按抽取规则生成；审核通过后 status 为 reviewed）。手工修改后运行 lmesh kb validate 检查。
domain: mgmt
cards:
  - id: cisco-iosxe.aaa-accounting
    syntax: aaa accounting { auth-proxy | system | network | exec | connection | commands <level> | dot1x } { default | <list-name> | guarantee-first } [ vrf <vrf-name> ] { start-stop | stop-only | none } [ broadcast ] { radius | group <group-name> }
    view: system
    undo: no aaa accounting { auth-proxy | system | network | exec | connection | commands <level> | dot1x } { default | <list-name> | guarantee-first } [ vrf <vrf-name> ] { start-stop | stop-only | none } [ broadcast ] { radius | group <group-name> }
    params:
      level:
        type: word
      list-name:
        type: word
      vrf-name:
        type: word
      group-name:
        type: word
    default: AAA accounting is disabled.
    source:
      doc: cisco-iosxe-md
      file: mgmt/aaa accounting.md
      title: aaa accounting
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.aaa-authentication-login
    syntax: aaa authentication login { default | <list-name> } <method1> [ <method2> [ <method3> [ <method4> ] ] ]
    view: system
    undo: no aaa authentication login { default | <list-name> } <method1> [ <method2> . . . ]
    params:
      list-name:
        type: word
      method1:
        type: word
      method2:
        type: word
    default: AAA authentication at login is disabled.
    source:
      doc: cisco-iosxe-md
      file: mgmt/aaa authentication login.md
      title: aaa authentication login
      line: 5
      version: '17.15'
      patched: 原文方法列表写成 “method1 [method2...]”；按运行配置改为最多 4 个方法
    status: draft
    maps:
      mgmt.aaa: _
      mgmt.aaa.scheme: kw:default=authentication default||fmt:authentication {list-name}
      mgmt.aaa.scheme.methods: fmt:{method1} {method2} {method3} {method4}
  - id: cisco-iosxe.aaa-authorization
    syntax: aaa authorization { exec | commands <level> | network | config-commands | console } { default | <list-name> } [ <method1> [ <method2> [ <method3> [ <method4> ] ] ] ]
    view: system
    undo: no aaa authorization { exec | commands <level> | network | config-commands | console } { default | <list-name> }
    params:
      level:
        type: integer
        range:
          - 0
          - 15
      list-name:
        type: word
      method1:
        type: word
      method2:
        type: word
      method3:
        type: word
      method4:
        type: word
    default: Authorization is disabled for all actions (equivalent to the method keyword none ).
    source:
      doc: cisco-iosxe-md
      file: mgmt/aaa authorization.md
      title: aaa authorization
      line: 5
      version: '17.15'
      patched: 原文类型列表很长且方法列表写成 “method1 [method2...]”；按运行配置整理
    status: draft
    maps:
      mgmt.aaa: _
      mgmt.aaa.scheme: kw:default=authorization default||fmt:authorization {list-name}
      mgmt.aaa.scheme.methods: fmt:{method1} {method2} {method3} {method4}
  - id: cisco-iosxe.aaa-group-server-radius
    syntax: aaa group server radius <group-name>
    view: system
    undo: no aaa group server radius <group-name>
    params:
      group-name:
        type: word
    default: No default behavior or values.
    source:
      doc: cisco-iosxe-md
      file: mgmt/aaa group server radius.md
      title: aaa group server radius
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.aaa-group-server-tacacs
    syntax: aaa group server tacacs + <group-name>
    view: system
    undo: no aaa group server tacacs + <group-name>
    params:
      group-name:
        type: word
    default: No default behavior or values.
    source:
      doc: cisco-iosxe-md
      file: mgmt/aaa group server tacacs+.md
      title: aaa group server tacacs+
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.aaa-new-model
    syntax: aaa new-model
    view: system
    undo: no aaa new-model
    default: AAA is not enabled.
    source:
      doc: cisco-iosxe-md
      file: mgmt/aaa new-model.md
      title: aaa new-model
      line: 5
      version: '17.15'
    status: draft
    maps:
      mgmt.aaa: _
  - id: cisco-iosxe.aaa-session-id
    syntax: aaa session-id [ common | unique ]
    view: system
    undo: no aaa session-id [ unique ]
    default: The common keyword is enabled.
    source:
      doc: cisco-iosxe-md
      file: mgmt/aaa session-id.md
      title: aaa session-id
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.access-class
    syntax: access-class <access-list-number> { in [ vrf-also ] | out }
    view: line
    undo: no access-class <access-list-number> { in | out }
    params:
      access-list-number:
        type: word
    default: No access lists are defined.
    source:
      doc: cisco-iosxe-md
      file: mgmt/access-class.md
      title: access-class
      line: 5
      version: '17.15'
    status: draft
    maps:
      mgmt.line.acl_in: if:in:$access-list-number
  - id: cisco-iosxe.address-ipv4
    syntax: address ipv4 { <hostname> | <ipv4address> } [ acct-port <port> | alias { <hostname> | <ipv4address> } | auth-port <port> [ acct-port <port> ] ]
    view: radius-server
    undo: no address ipv4 { <hostname> | <ipv4address> } [ acct-port <port> | alias { <hostname> | <ipv4address> } | auth-port <port> [ acct-port <port> ] ]
    params:
      hostname:
        type: word
      ipv4address:
        type: ipv4
      port:
        type: word
    default: The RADIUS server accounting and authentication parameters are not configured.
    source:
      doc: cisco-iosxe-md
      file: mgmt/address ipv4 (config-radius-server).md
      title: address ipv4 (config-radius-server)
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.address-ipv6
    syntax: address ipv6 <ipv6-address>
    view: tacacs-server
    undo: no address ipv6 <ipv6-address>
    params:
      ipv6-address:
        type: word
    default: No TACACS+ server is configured.
    source:
      doc: cisco-iosxe-md
      file: mgmt/address ipv6 (TACACS+).md
      title: address ipv6 (TACACS+)
      line: 5
      version: '17.15'
      patched: 参数是 IPv6 地址，按参数名推断成了 IPv4
    status: draft
    maps:
      mgmt.tacacs.server: fmt:all {ipv6-address}
  - id: cisco-iosxe.clock-timezone
    syntax: clock timezone <zone> <hours-offset> [ <minutes-offset> ]
    view: system
    undo: no clock timezone
    params:
      zone:
        type: word
      hours-offset:
        type: word
      minutes-offset:
        type: integer
        range:
          - 0
          - 59
    default: UTC
    source:
      doc: cisco-iosxe-md
      file: mgmt/clock timezone.md
      title: clock timezone
      line: 5
      version: '17.15'
      patched: 原文把 minutes-offset 写成了关键字；小时偏移可以是负数
    status: draft
  - id: cisco-iosxe.crypto-key-generate-rsa
    syntax: 'crypto key generate rsa [ general-keys | usage-keys | signature | encryption ] [ label <key-label> ] [ exportable ] [ modulus <modulus-size> ] [ storage <devicename> : ] [ redundancy ] [ on <devicename> : ]'
    view: system
    params:
      key-label:
        type: word
      modulus-size:
        type: word
      devicename:
        type: word
    default: RSA key pairs do not exist.
    source:
      doc: cisco-iosxe-md
      file: mgmt/crypto key generate rsa.md
      title: crypto key generate rsa
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.exec-timeout
    syntax: exec-timeout <minutes> [ <seconds> ]
    view: line
    undo: no exec-timeout
    params:
      minutes:
        type: integer
        range:
          - 0
          - 35791
      seconds:
        type: integer
        range:
          - 0
          - 2147483
    default: 10 minutes
    source:
      doc: cisco-iosxe-md
      file: mgmt/exec-timeout.md
      title: exec-timeout
      line: 5
      version: '17.15'
      patched: 原文 “exec-timeout minutes [seconds]” 把 seconds 写成了关键字；运行配置中是 exec-timeout 0 0
    status: draft
    maps:
      mgmt.line.idle_timeout: fmt:{minutes} {seconds}
  - id: cisco-iosxe.ip-radius-source-interface
    syntax: ip radius source-interface <subinterface-name> [ vrf <vrf-name> ]
    view: system
    undo: no ip radius source-interface
    params:
      subinterface-name:
        type: word
      vrf-name:
        type: word
    default: No default behavior or values.
    source:
      doc: cisco-iosxe-md
      file: mgmt/ip radius source-interface.md
      title: ip radius source-interface
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.ip-ssh-source-interface
    syntax: ip ssh source-interface <interface>
    view: system
    undo: no ip ssh source-interface <interface>
    params:
      interface:
        type: word
    default: The address of the closest interface to the destination is used as the source address (the closest interface is the output interface through which the SSH packet is sent).
    source:
      doc: cisco-iosxe-md
      file: mgmt/ip ssh source-interface.md
      title: ip ssh source-interface
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.ip-ssh-version
    syntax: ip ssh version [ 1 | 2 ]
    view: system
    undo: no ip ssh version [ 1 | 2 ]
    default: If this command is not configured, SSH operates in compatibility mode, that is, Version 1 and Version 2 are both supported.
    source:
      doc: cisco-iosxe-md
      file: mgmt/ip ssh version.md
      title: ip ssh version
      line: 5
      version: '17.15'
    status: draft
    maps:
      mgmt.ssh: _
      mgmt.ssh.version: kw:2|1
  - id: cisco-iosxe.ip-ssh
    syntax: ip ssh { time-out <seconds> | authentication-retries <retries> }
    view: system
    undo: no ip ssh [ timeout <seconds> | authentication-retries <integer> ]
    params:
      seconds:
        type: integer
        range:
          - 1
          - 120
      retries:
        type: integer
        range:
          - 0
          - 5
    default: SSH control parameters are set to default router values.
    source:
      doc: cisco-iosxe-md
      file: mgmt/ip ssh.md
      title: ip ssh
      line: 5
      version: '17.15'
      patched: 原文关键字写作 timeout，设备上是 time-out；两个参数各自独立成行
    status: draft
    maps:
      mgmt.ssh: _
      mgmt.ssh.timeout: $seconds
      mgmt.ssh.retries: $retries
  - id: cisco-iosxe.ip-tacacs-source-interface
    syntax: ip tacacs source-interface <subinterface-name> vrf <vrf-name>
    view: system
    undo: no ip tacacs source-interface
    params:
      subinterface-name:
        type: word
      vrf-name:
        type: word
    default: None
    source:
      doc: cisco-iosxe-md
      file: mgmt/ip tacacs source-interface.md
      title: ip tacacs source-interface
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.key
    syntax: key { 0 <string> | 6 <string> | 7 <string> } <string>
    view: radius-server
    undo: no key
    params:
      string:
        type: text
    default: The authentication and encryption key is disabled.
    source:
      doc: cisco-iosxe-md
      file: mgmt/key (config-radius-server).md
      title: key (config-radius-server)
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.key~2
    syntax: key [ 0 | 6 | 7 ] <key-string>
    view: tacacs-server
    undo: no key [ 0 | 6 | 7 ] <key-string>
    params:
      key-string:
        type: text
    default: No TACACS+ encryption key is configured.
    source:
      doc: cisco-iosxe-md
      file: mgmt/key (TACACS+).md
      title: key (TACACS+)
      line: 5
      version: '17.15'
    status: draft
