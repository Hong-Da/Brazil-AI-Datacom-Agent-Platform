      name:
        type: word
      level:
        type: integer
        range:
          - 0
          - 15
      encryption-type:
        type: integer
        range:
          - 0
          - 9
      secret:
        type: word
    source:
      patched: 原文 username 拆成了 20 多条只带一个可选项的语法；运行配置中最常见的是 username 名称 [privilege 级别] secret 类型 密文
      added_by_patch: true
    status: draft
    maps:
      mgmt.aaa: _
      mgmt.aaa.user: $name
      mgmt.aaa.user.level: $level
      mgmt.aaa.user.password_set: flag
