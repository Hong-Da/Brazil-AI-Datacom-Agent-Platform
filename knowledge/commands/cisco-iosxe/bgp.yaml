# 命令卡（由 lmesh kb ingest 按抽取规则生成；审核通过后 status 为 reviewed）。手工修改后运行 lmesh kb validate 检查。
domain: bgp
cards:
  - id: cisco-iosxe.address-family-ipv4.1
    syntax: Syntax Available Under Router Configuration Mode
    view: router-bgp
    default: IPv4 address prefixes are not enabled.
    source:
      doc: cisco-iosxe-md
      file: bgp/address-family ipv4 (BGP).md
      title: address-family ipv4 (BGP)
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.address-family-ipv4.2
    syntax: address-family ipv4 [ mdt | tunnel | { multicast | unicast } [ vrf <vrf-name> ] | vrf <vrf-name> ]
    view: router-bgp
    enters_view: bgp-af
    undo: no address-family ipv4 [ mdt | tunnel | { multicast | unicast } [ vrf <vrf-name> ] | vrf <vrf-name> ]
    params:
      vrf-name:
        type: word
    default: IPv4 address prefixes are not enabled.
    source:
      doc: cisco-iosxe-md
      file: bgp/address-family ipv4 (BGP).md
      title: address-family ipv4 (BGP)
      line: 5
      version: '17.15'
    status: draft
    maps:
      bgp.af: &id027
        afi: ipv4
        vrf: $vrf-name||
  - id: cisco-iosxe.address-family-ipv4.3
    syntax: Syntax Available Under Router Scope Configuration Mode
    view: router-bgp
    default: IPv4 address prefixes are not enabled.
    source:
      doc: cisco-iosxe-md
      file: bgp/address-family ipv4 (BGP).md
      title: address-family ipv4 (BGP)
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.address-family-ipv4.4
    syntax: address-family ipv4 [ mdt | multicast | unicast ]
    view: router-bgp
    enters_view: bgp-af
    undo: no address-family ipv4 [ mdt | multicast | unicast ]
    default: IPv4 address prefixes are not enabled.
    source:
      doc: cisco-iosxe-md
      file: bgp/address-family ipv4 (BGP).md
      title: address-family ipv4 (BGP)
      line: 5
      version: '17.15'
    status: draft
    maps: {}
  - id: cisco-iosxe.address-family-vpnv4
    syntax: address-family vpnv4 [ multicast | unicast ]
    view: router-bgp
    enters_view: bgp-af
    undo: no address-family vpnv4 multicast unicast
    default: Unicast prefix support is enabled by default when this command is entered without any optional keywords. | | | |---|---| | Note | Routing information for address family IPv4 is advertised by default for each Border Gateway Protocol (BGP) routing session configured with the neighbor remote-as command unless you configure the no bgp default ipv4-unicast command before configuring the neighbor remote-as command. |
    source:
      doc: cisco-iosxe-md
      file: bgp/address-family vpnv4.md
      title: address-family vpnv4
      line: 5
      version: '17.15'
      patched: 原文把可选的 multicast | unicast 写成了连续的关键字
    status: draft
    maps:
      bgp.af: &id029
        afi: vpnv4
        vrf: ''
  - id: cisco-iosxe.aggregate-address
    syntax: aggregate-address <address> <mask> [ as-set ] [ as-confed-set ] [ summary-only ] [ suppress-map <map-name> ] [ advertise-map <map-name> ] [ attribute-map <map-name> ]
    view: router-bgp
    undo: no aggregate-address <address> <mask> [ as-set ] [ as-confed-set ] [ summary-only ] [ suppress-map <map-name> ] [ advertise-map <map-name> ] [ attribute-map <map-name> ]
    params:
      address:
        type: ipv4
      mask:
        type: mask
      map-name:
        type: word
    default: The atomic aggregate attribute is set automatically when an aggregate route is created with this command unless the as-set keyword is specified.
    source:
      doc: cisco-iosxe-md
      file: bgp/aggregate-address.md
      title: aggregate-address
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.bgp-default-ipv4-unicast
    syntax: bgp default ipv4-unicast
    view: router-bgp
    undo: no bgp default ipv4-unicast
    default: IPv4 address family routing information is advertised by default for each BGP routing session configured with the neighbor remote-as command, unless you first configure the no bgp default ipv4-unicast command before configuring the neighbor remote-as command.
    source:
      doc: cisco-iosxe-md
      file: bgp/bgp default ipv4-unicast.md
      title: bgp default ipv4-unicast
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.bgp-default-local-preference
    syntax: bgp default local-preference <number>
    view: router-bgp
    undo: no bgp default local-preference <number>
    params:
      number:
        type: word
    default: Cisco IOS software applies a local preference value of 100 if this command is not enabled or if the no form of this command is entered.
    source:
      doc: cisco-iosxe-md
      file: bgp/bgp default local-preference.md
      title: bgp default local-preference
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.bgp-graceful-restart
    syntax: bgp graceful-restart [ extended | restart-time <seconds> | stalepath-time <seconds> ] [ all ]
    view: router-bgp
    undo: no bgp graceful-restart
    params:
      seconds:
        type: word
    default: 'The following default values are used when this command is entered without any keywords or arguments: restart-time : 120 seconds stalepath-time : 360 seconds | | | |---|---| | Note | Changing the restart and stalepath timer values is not required to enable the BGP graceful restart capability. The default values are optimal for most network deployments, and these values should be adjusted only by an experienced network operator. |'
    source:
      doc: cisco-iosxe-md
      file: bgp/bgp graceful-restart.md
      title: bgp graceful-restart
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.bgp-log-neighbor-changes
    syntax: bgp log-neighbor-changes
    view: router-bgp
    undo: no bgp log-neighbor-changes
    default: Logging of BGP neighbor resets is not enabled.
    source:
      doc: cisco-iosxe-md
      file: bgp/bgp log-neighbor-changes.md
      title: bgp log-neighbor-changes
      line: 5
      version: '17.15'
    status: draft
    maps:
      bgp.instance.log_neighbor_changes: flag
  - id: cisco-iosxe.bgp-router-id.1
    syntax: Router Configuration
    view: router-bgp
    default: 'The following behavior determines local router ID selection when this command is not enabled: - If a loopback interface is configured, the router ID is set to the IP address of the loopback interface. If multiple loopback interfaces are configured, the router ID is set to the IP address of the loopback interface with the highest IP address. - If no loopback interface is configured, the router ID is set to the highest IP address on a physical interface.'
    source:
      doc: cisco-iosxe-md
      file: bgp/bgp router-id.md
      title: bgp router-id
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.bgp-router-id.2
    syntax: bgp router-id { <ip-address> | vrf auto-assign }
    view: router-bgp
    undo: no bgp router-id [ vrf auto-assign ]
    params:
      ip-address: &id001
        type: ipv4
    default: 'The following behavior determines local router ID selection when this command is not enabled: - If a loopback interface is configured, the router ID is set to the IP address of the loopback interface. If multiple loopback interfaces are configured, the router ID is set to the IP address of the loopback interface with the highest IP address. - If no loopback interface is configured, the router ID is set to the highest IP address on a physical interface.'
    source:
      doc: cisco-iosxe-md
      file: bgp/bgp router-id.md
      title: bgp router-id
      line: 5
      version: '17.15'
    status: draft
    maps:
      bgp.instance.router_id: $ip-address
  - id: cisco-iosxe.bgp-router-id.3
    syntax: Address Family Configuration
    view: router-bgp
    default: 'The following behavior determines local router ID selection when this command is not enabled: - If a loopback interface is configured, the router ID is set to the IP address of the loopback interface. If multiple loopback interfaces are configured, the router ID is set to the IP address of the loopback interface with the highest IP address. - If no loopback interface is configured, the router ID is set to the highest IP address on a physical interface.'
    source:
      doc: cisco-iosxe-md
      file: bgp/bgp router-id.md
      title: bgp router-id
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.bgp-router-id.4
    syntax: bgp router-id { <ip-address> | auto-assign }
    view: router-bgp
    undo: no bgp router-id [ vrf auto-assign ]
    params:
      ip-address: *id001
    default: 'The following behavior determines local router ID selection when this command is not enabled: - If a loopback interface is configured, the router ID is set to the IP address of the loopback interface. If multiple loopback interfaces are configured, the router ID is set to the IP address of the loopback interface with the highest IP address. - If no loopback interface is configured, the router ID is set to the highest IP address on a physical interface.'
