  - id: cisco-iosxe.bgp-redistribute
    syntax: redistribute { connected | static | ospf <process-id> [ match { internal | external [ 1 | 2 ] | nssa-external [ 1 | 2 ] } &<1-6> ] | eigrp <eigrp-as> | isis [ <area-tag> ] } [ metric <metric-value> ] [ route-map <map-tag> ]
