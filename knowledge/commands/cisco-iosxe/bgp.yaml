  - id: cisco-iosxe.neighbor-activate
    syntax: neighbor { <ip-address> | <peer-group-name> | <ipv6-address> % } activate
    view: router-bgp
    undo: no neighbor { <ip-address> | <peer-group-name> | <ipv6-address> % } activate
    params:
      ip-address:
        type: ipv4
      peer-group-name:
        type: word
      ipv6-address:
        type: ipv4
    default: The exchange of addresses with BGP neighbors is enabled for the IPv4 address family. Enabling address exchange for all other address families is disabled. | | | |---|---| | Note | Address exchange for address family IPv4 is enabled by default for each BGP routing session configured with the neighbor remote-as command unless you configure the no bgp default ipv4-activate command before configuring the neighbor remote-as command, or you disable address exchange for address family IPv4 with a specific neighbor by using the no neighbor activate command. |
    source:
      doc: cisco-iosxe-md
      file: bgp/neighbor activate.md
      title: neighbor activate
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.neighbor-allowas-in
