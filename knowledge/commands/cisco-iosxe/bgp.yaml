    view: router-bgp
    undo: no bgp graceful-restart
    params:
      seconds:
        type: word
    default: 'The following default values are used when this command is entered without any keywords or arguments: restart-time : 120 seconds stalepath-time : 360 seconds | | | |---|---| | Note | Changing the restart and stalepath timer values is not required to enable the BGP graceful restart capability. The default values are optimal for most network deployments, and these values should be adjusted only by an experienced network operator. |'
