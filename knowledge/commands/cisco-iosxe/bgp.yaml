  - id: cisco-iosxe.bgp-router-id.1
    syntax: Router Configuration
    view: router-bgp
    default: 'The following behavior determines local router ID selection when this command is not enabled: - If a loopback interface is configured, the router ID is set to the IP address of the loopback interface. If multiple loopback interfaces are configured, the router ID is set to the IP address of the loopback interface with the highest IP address. - If no loopback interface is configured, the router ID is set to the highest IP address on a physical interface.'
    source:
      doc: cisco-iosxe-md
      file: bgp/bgp router-id.md
      title: bgp router-id
      line: 5
      version: '17.15'
    status: draft
