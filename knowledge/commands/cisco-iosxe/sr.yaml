  - id: cisco-iosxe.microloop-avoidance-rib-update-delay
    syntax: microloop avoidance [ rib-update-delay <delay-time> ]
    view: router-isis
    undo: no microloop avoidance [ rib-update-delay ]
    params:
      delay-time:
        type: word
    default: A RIB update delay value is not configured.
    source:
      doc: cisco-iosxe-md
      file: segment-routing/microloop avoidance rib-update-delay.md
      title: microloop avoidance rib-update-delay
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.microloop-avoidance
    syntax: microloop avoidance [ disable | protected ]
    view: router-isis
    undo: no microloop avoidance [ disable | protected ]
