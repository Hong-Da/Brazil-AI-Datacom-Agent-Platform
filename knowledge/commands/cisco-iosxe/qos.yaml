      line: 5
      version: '17.15'
      patched: 三个动作用了同名参数 action，且没有 cir percent 写法；按运行配置整理（police cir <速率> | percent <百分比> [ bc … ] [ pir … ] [ be … ] [ conform-action … ] …）
    status: draft
    maps:
      qos.policy.rule.police_cir: $cir
      qos.policy.rule.police_pir: $pir
