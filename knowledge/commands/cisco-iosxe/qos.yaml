  - id: cisco-iosxe.police
    syntax: police cir { <cir> | percent <cir-percent> } [ bc <conform-burst> ] [ pir <pir> ] [ be <peak-burst> ] [ conform-action <conform-action> [ exceed-action <exceed-action> [ violate-action <violate-action> ] ] ]
