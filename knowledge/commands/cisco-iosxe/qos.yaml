  - id: cisco-iosxe.queue-limit.1
    syntax: queue-limit <queue-limit-size> [ bytes | ms | us | packets ]
    view: policy-map-class
    undo: no queue-limit
    params:
      queue-limit-size: &id007
        type: word
    default: 'The default behavior of the queue-limit command for class queues with and without Weighted Random Early Detection (WRED) is as follows: - Class queues with WRED—The device uses the default queue limit of two times the largest WRED maximum threshold value, rounded to the nearest power of 2. Note ; For Cisco IOS Release 12.2(16)BX, the device does not round the value to the nearest power of 2. - Priority queues and class queues without WRED—The device has buffers for up to 50 ms of 256-byte packets at line rate, but not fewer than 32 packets.'
    source:
      doc: cisco-iosxe-md
      file: qos/queue-limit.md
      title: queue-limit
      line: 5
      version: '17.15'
    status: draft
    maps:
      qos.policy.rule.queue_limit: tail:queue-limit
