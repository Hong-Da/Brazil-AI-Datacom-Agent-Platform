# 命令卡（由 lmesh kb ingest 按抽取规则生成；审核通过后 status 为 reviewed）。手工修改后运行 lmesh kb validate 检查。
domain: qos
cards:
  - id: cisco-iosxe.bandwidth.1
    syntax: bandwidth { <kbps> | [ remaining ] percent <percentage> } [ account { qinq | dot1q } aal5 <subscriber-encapsulation> ]
    view: policy-map-class
    undo: no bandwidth
    params:
      kbps: &id001
        type: word
      percentage: &id002
        type: integer
        range:
          - 1
          - 100
      subscriber-encapsulation: &id003
        type: word
    default: No bandwidth is specified. ATM overhead accounting is disabled.
    source:
      doc: cisco-iosxe-md
      file: qos/bandwidth (policy-map class).md
      title: bandwidth (policy-map class)
      line: 5
      version: '17.15'
    status: draft
    maps:
      qos.policy.rule.bandwidth_pct: unless:remaining:$percentage
      qos.policy.rule.bandwidth_remaining_pct: if:remaining:$percentage
  - id: cisco-iosxe.bandwidth.2
    syntax: bandwidth { <kbps> | [ remaining ] percent <percentage> } account { qinq | dot1q } { aal5 | aal3 } <subscriber-encapsulation> user-defined <offset> [ atm ]
    view: policy-map-class
    undo: no bandwidth
    params:
      kbps: *id001
      percentage: *id002
      subscriber-encapsulation: *id003
      offset:
        type: word
    default: No bandwidth is specified. ATM overhead accounting is disabled.
    source:
      doc: cisco-iosxe-md
      file: qos/bandwidth (policy-map class).md
      title: bandwidth (policy-map class)
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.bandwidth-remaining-ratio.1
    syntax: bandwidth remaining ratio <ratio>
    view: policy-map-class
    undo: no bandwidth remaining ratio <ratio>
    params:
      ratio: &id004
        type: word
    default: For most platforms, the default bandwidth ratio is 1. When you use default bandwidth-remaining ratios at the subinterface level, the Cisco 10000 series router distinguishes between interface types. At the subinterface level, the default bandwidth-remaining ratio is 1 for VLAN subinterfaces and Frame Relay Data Link Connection Identifiers (DLCI). For ATM subinterfaces, the router computes the default bandwidth-remaining ratio based on the subinterface speed. When you use default bandwidth-remaining ratios at the class level, the Cisco 10000 series router makes no distinction between interface types. At the class level, the default bandwidth-remaining ratio is 1.
    source:
      doc: cisco-iosxe-md
      file: qos/bandwidth remaining ratio.md
      title: bandwidth remaining ratio
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.bandwidth-remaining-ratio.2
    syntax: bandwidth remaining ratio <ratio> [ account { qinq | dot1q } [ aal5 ] { <subscriber-encapsulation> | user-defined <offset> } ]
    view: policy-map-class
    undo: no bandwidth remaining ratio <ratio> [ account { qinq | dot1q } [ aal5 ] { <subscriber-encapsulation> | user-defined <offset> } ]
    params:
      ratio: *id004
      subscriber-encapsulation:
        type: word
      offset:
        type: word
    default: For most platforms, the default bandwidth ratio is 1. When you use default bandwidth-remaining ratios at the subinterface level, the Cisco 10000 series router distinguishes between interface types. At the subinterface level, the default bandwidth-remaining ratio is 1 for VLAN subinterfaces and Frame Relay Data Link Connection Identifiers (DLCI). For ATM subinterfaces, the router computes the default bandwidth-remaining ratio based on the subinterface speed. When you use default bandwidth-remaining ratios at the class level, the Cisco 10000 series router makes no distinction between interface types. At the class level, the default bandwidth-remaining ratio is 1.
    source:
      doc: cisco-iosxe-md
      file: qos/bandwidth remaining ratio.md
      title: bandwidth remaining ratio
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.class
    syntax: class { class-default | <class-name> }
    view: policy-map
    enters_view: policy-map-class
    undo: no class { class-default | <class-name> }
    params:
      class-name:
        type: word
    default: No class is specified.
    source:
      doc: cisco-iosxe-md
      file: qos/class (policy-map).md
      title: class (policy-map)
      line: 5
      version: '17.15'
      patched: fragment / insert-before / service-fragment 是其他平台的选项，且 class-name 在两处重复；运行配置是 class <名称> 或 class class-default
    status: draft
    maps:
      qos.policy.rule: $class-name||kw:class-default
      qos.policy.rule.classifier: $class-name
  - id: cisco-iosxe.class-map.1
    syntax: class-map [ match-all | match-any ] <class-map-name>
    view: system
    enters_view: class-map
    undo: no class-map [ match-all | match-any ] <class-map-name>
    params:
      class-map-name:
        type: word
    default: A class map is not configured.
    source:
      doc: cisco-iosxe-md
      file: qos/class-map.md
      title: class-map
      line: 5
      version: '17.15'
      patched: 原文的 type 选项（stack / access-control …）是其他平台的写法；ASR 920 运行配置是 class-map [ match-all | match-any ] <名称>
    status: draft
    maps:
      qos.classifier: $class-map-name
      qos.classifier.operator: kw:match-all=and|match-any=or
  - id: cisco-iosxe.class-map.2
    syntax: class-map <class-map-name> [ match-all | match-any ]
    view: system
    enters_view: class-map
    undo: no class-map <class-map-name> [ match-all | match-any ]
    params:
      class-map-name: &id005
        type: word
    default: A class map is not configured.
    source:
      doc: cisco-iosxe-md
      file: qos/class-map.md
      title: class-map
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.class-map.3
    syntax: class-map <class-map-name>
    view: system
    enters_view: class-map
    undo: no class-map [ type { stack | access-control | port-filter | queue-threshold | logging <log-class> } ] [ match-all | match-any ] <class-map-name>
    params:
      class-map-name: *id005
    default: A class map is not configured.
    source:
      doc: cisco-iosxe-md
      file: qos/class-map.md
      title: class-map
      line: 5
      version: '17.15'
    status: draft
  - id: cisco-iosxe.match-access-group
    syntax: match access-group { <access-group> | name <access-group-name> }
    view: class-map
    undo: no match access-group { <access-group> | name <access-group-name> }
    params:
      access-group:
        type: word
      access-group-name:
        type: word
    default: No match criteria are configured.
    source:
      doc: cisco-iosxe-md
      file: qos/match access-group.md
      title: match access-group
      line: 5
      version: '17.15'
      patched: 取消写法少了 access-group 关键字
    status: draft
    maps:
      qos.classifier.match:
        field: acl
        value: $access-group||$access-group-name
      qos.classifier.match.acl: $access-group||$access-group-name
  - id: cisco-iosxe.match-any
    syntax: match any
    view: class-map
    undo: no match any
    default: No match criteria are specified.
    source:
      doc: cisco-iosxe-md
      file: qos/match any.md
      title: match any
      line: 5
      version: '17.15'
    status: draft
    maps:
      qos.classifier.match:
        field: any
        value: ''
  - id: cisco-iosxe.match-cos
    syntax: match cos { <cos-value> } &<1-4>
    view: class-map
    undo: no match cos { <cos-value> } &<1-4>
    params:
      cos-value:
        type: integer
        range:
          - 0
          - 7
    default: Packets are not matched on the basis of a Layer 2 CoS/ISL marking.
    source:
      doc: cisco-iosxe-md
      file: qos/match cos.md
      title: match cos
      line: 5
      version: '17.15'
      patched: 原文把参数 cos-value 标成了关键字；改成重复写法
    status: draft
    maps:
      qos.classifier.match:
        field: 8021p
        value: $cos-value
  - id: cisco-iosxe.match-dscp
    syntax: match [ ip ] dscp { <dscp-value> } &<1-8>
    view: class-map
