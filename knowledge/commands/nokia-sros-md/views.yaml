# Nokia SR OS（7750 SR / 7450 ESS / 7950 XRS / VSR）MD-CLI 的书写习惯与视图树（M7-4，REQ-037）。
# 依据：MD-CLI Command Reference Guide 25.10.R1（配置树由 YANG 模型生成），以及 MD-CLI User Guide 的 info / info flat /
#       info full-context / admin show configuration 输出格式（见 docs/project-spec.md “接入 Nokia 7750 SR（REQ-037）（M7-1 分析结果）”）。
#
# 书写习惯：
# - 层级以花括号为准（block: braces）：进入上下文的行以 “ {” 结尾，块由 “}” 关闭；没有子元素的列表项 / 容器写成 “name { }”；
#   缩进只是排版（4 个空格），解析不看缩进。
# - 扁平格式：info flat（相对当前上下文的完整路径，每行一个元素）与 info full-context / admin show configuration full-context
#   （每行以 /configure 开头）；解析器按命令卡逐段消耗路径（进入视图的卡），剩余部分整行匹配，相邻行的公共前缀合并成同一块。
# - 叶子列表写成 [ "a" "b" ]（参数类型 leaflist）；字符串（名称、描述、引用）写成引号字符串；admin-state enable | disable 代替 shutdown。
# - 取消：MD-CLI 的配置输出里没有取消形式；变更时用 delete <元素>（命令卡的 undo），编辑会话 edit-config private … commit。
# - admin show configuration 以 “configure {” 开始、“}” 结束（结构行，进入根视图）；# 开头是注释（文件头、# Finished）。
# 视图编号 = 去掉 configure 与键的路径，用 . 连接（router.interface.ipv4.primary），由
# DevelopDocs/设备产品文档/Nokia/tools/nokia_md_to_md.py 按范围文件 md-scope.txt 生成；opaque 收留范围外的容器（块内按原文保留）。
