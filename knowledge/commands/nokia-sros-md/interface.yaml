# 命令卡（由 lmesh kb ingest 按抽取规则生成；审核通过后 status 为 reviewed）。手工修改后运行 lmesh kb validate 检查。
domain: interface
cards:
  - id: nokia-sros-md.port
    syntax: port <port-id>
    view: configure
    enters_view: port
    undo: delete port <port-id>
    params:
      port-id:
        type: port
        pattern: (?!lag-).+
    source:
      doc: nokia-sros-md-md
      file: port.md
      title: port
      line: 5
      version: 25.10.R1
      patched: configure port 的键是物理端口（1/1/1、esat-…、pxc-…），不含 LAG（LAG 在 configure lag "lag-1" 下）；端口类型的写法检查包含 lag-<n>，这里排除，规范渲染才不会把 LAG 写成 port lag-1
    status: draft
    maps:
      interface: $port-id
