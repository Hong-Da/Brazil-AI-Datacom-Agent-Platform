# Nokia SR OS Classic CLI 命令卡 → 统一 Schema 的映射规则（M7-3，REQ-037）。lmesh kb map --family nokia-sros-classic 把规则写进命令卡。
# 写法见 lmesh/core/kb/mapping.py；本平台族另外用到 M7-3 新增的表达式与指令：
#   ctx:<参数>                父上下文行的参数（static-route-entry <前缀> 下的 next-hop、area <区域> 下的 interface、lag <编号> 下的 port）
#   sap:port / vlan / tag:…   拆分 SAP 写法（端口[:外层[.内层]]）；pfx:addr / len:…  拆分 地址/长度
#   !flag                     反向开关（no shutdown → 启用）
#   目标 a{k=$参数}.b         对象键取自参数（lag 下的 port 写到成员口上；OSPF 区域下的 interface 写到该接口的 OSPF 参数上）
#   "@container"              容器卡：只进入视图，不产生节点（system、router Base、static-route-entry <前缀>…）
#   "@share"                  这一行建立的对象对后面的兄弟行可见（router 下的 autonomous-system → bgp 块的 BGP 实例）
# 统一 Schema 以华为为基准；Nokia 特有的节点（端口模式、逻辑接口绑定端口、管理状态等）的说明见 Schema 的 semantic。
family: nokia-sros-classic

_desc: &desc "$long-description-string||$short-description-string||$medium-description-string||$description-string||$description"
_pol: &pol "$plcy-or-long-expr||$policy-name"

rules:
  # ---------- 容器（只进入视图）----------
  - {view: ^configure$, syntax: '^router \[ <router-instance> \]', maps: {"@container": ""}}
  - {view: ^configure$, syntax: '^system$', maps: {"@container": ""}}
  - {view: ^configure$, syntax: '^log$', maps: {"@container": ""}}
  - {view: ^port$, syntax: '^ethernet$', maps: {"@container": ""}}
  - {view: ^router$, syntax: '^static-route-entry ', maps: {"@container": ""}}
  - {view: ^router$, syntax: '^bgp$', maps: {"@container": ""}}
  - {view: ^router$, syntax: '^policy-options$', maps: {"@container": ""}}
  - {view: ^router$, syntax: '^mpls-labels$', maps: {"@container": ""}}
  - {view: ^ldp$, syntax: '^interface-parameters$', maps: {"@container": ""}}
  - {view: ^ldp$, syntax: '^targeted-session$', maps: {"@container": ""}}
  - {view: ^ldp-if$, syntax: '^ipv4$', maps: {"@container": ""}}
  - {view: ^policy-entry$, syntax: '^from$', maps: {"@container": ""}}
  # policy-options 的编辑会话（begin … commit）：不产生节点，规范渲染与变更脚本按 render 的 wrap 写出
  - {view: ^policy-options$, syntax: '^(begin|commit)', maps: {"@frame": ""}}
  - {view: ^system$, syntax: '^(time|security|login-control)$', maps: {"@container": ""}}
  - {view: ^system-security$, syntax: '^snmp$', maps: {"@container": ""}}
  - {view: ^system$, syntax: '^snmp$', maps: {"@container": ""}}
  - {view: ^log$, syntax: '^syslog <', maps: {"@container": ""}}
  - {view: ^(ospf|isis)$, syntax: '^segment-routing$', maps: {"@container": ""}}
  - {view: ^isis$, syntax: '^level \{', maps: {"@container": ""}}

  # ---------- 端口、LAG ----------
  - view: ^configure$
    syntax: '^port \{'
    maps: {interface: $port-id}
  - view: ^configure$
    syntax: '^lag <lag-id>'
    maps: {interface: "fmt:lag-{lag-id}"}
  - view: ^(port|lag)$
    syntax: '^description '
    maps: {interface.description: *desc}
  - view: ^(port|lag|port-ethernet)$
    syntax: '^shutdown$'
    maps: {interface.shutdown: flag}
  - view: ^port-ethernet$
    syntax: '^mode \{'
    maps: {interface.port_mode: "kw:access|network|hybrid"}
  - view: ^lag$
    syntax: '^mode \{'
    maps: {interface.port_mode: "kw:network|hybrid|access"}
  - view: ^(port-ethernet|lag)$
    syntax: '^encap-type '
    maps: {interface.encap_type: "kw:dot1q|null|qinq"}
  - view: ^port-ethernet$
    syntax: '^mtu <mtu-bytes>$'
    maps: {interface.mtu: $mtu-bytes}
  - view: ^port-ethernet$
    syntax: '^speed '
    maps: {interface.speed: "kw:10|100|1000|10000|25000|40000|50000|100000"}
  - view: ^port-ethernet$
    syntax: '^duplex '
    maps: {interface.duplex: "kw:full|half"}
  - view: ^port-ethernet$
    syntax: '^autonegotiate'
    maps: {interface.negotiation: flag}
  # LAG 成员口：Nokia 在 lag 下列成员（方向与华为 eth-trunk / Cisco channel-group 相反），写到成员口的 interface.lag
  - view: ^lag$
    syntax: '^port <port-id> \[ <port-id> \] &'
    maps: {"interface{name=$port-id}.lag": "ctx:lag-id"}
  - view: ^lag$
    syntax: '^lacp \['
    maps: {interface.lag_mode: "kw:active|passive"}

  # ---------- 路由器接口（三层逻辑接口）----------
  - view: ^router$
    syntax: '^interface <interface-name> \[ unnumbered-mpls-tp \]$'
    maps: {interface: $interface-name}
  - view: ^router-if$
    syntax: '^address \{'
    maps:
      interface.ipv4: "pfx:addr:$ip-address/mask||$ip-address"
      interface.ipv4.address: "pfx:addr:$ip-address/mask||$ip-address"
      interface.ipv4.prefix_length: "pfx:len:$ip-address/mask||$netmask"
      interface.ipv4.secondary: "false"
  - view: ^router-if$
    syntax: '^secondary \{'
    maps:
      interface.ipv4: "pfx:addr:$ip-address/mask||$ip-address"
      interface.ipv4.address: "pfx:addr:$ip-address/mask||$ip-address"
      interface.ipv4.prefix_length: "pfx:len:$ip-address/mask||$netmask"
      interface.ipv4.secondary: "true"
  - view: ^router-if$
    syntax: '^description '
    maps: {interface.description: *desc}
  - view: ^router-if$
    syntax: '^shutdown$'
    maps: {interface.shutdown: flag}
  - view: ^router-if$
    syntax: '^loopback$'
    maps: {interface.loopback: flag}
  # port <端口[:VLAN]>：绑定的端口与终结的 VLAN（翻译成华为 / Cisco 时换成端口本身或子接口，见 render 的 l3_form）
  - view: ^router-if$
    syntax: '^port <port-name>$'
    maps:
      interface.bind_port: "sap:port:$port-name"
      interface.dot1q_termination: "sap:vlan:$port-name"
  - view: ^router-if$
    syntax: '^bfd <transmit-interval>'
    maps:
      interface.bfd: "_"
      interface.bfd.min_tx: $transmit-interval
      interface.bfd.min_rx: $receive-interval
      interface.bfd.multiplier: $multiplier

  # ---------- 路由器级：AS 号、全局 Router ID ----------
  - view: ^router$
    syntax: '^autonomous-system <autonomous-system>$'
    maps: {bgp.instance: $autonomous-system, "@share": ""}
  - view: ^router$
    syntax: '^router-id <ip-address>$'
    maps: {mgmt.system: "_", mgmt.system.router_id: $ip-address}

  # ---------- 静态路由：static-route-entry <前缀> 下的 next-hop / indirect / black-hole 各是一条路由 ----------
  - view: ^static-route-entry$
    syntax: '^next-hop \{'
    maps:
      static.route: {vrf: "", prefix: "ctx:ip-prefix/prefix-length", nexthop: "$ip-address||$ip-int-name"}
      static.route.prefix: "ctx:ip-prefix/prefix-length"
      static.route.nexthop: "$ip-address||$ip-int-name"
  - view: ^static-route-entry$
    syntax: '^indirect <ip-address>$'
    maps:
      static.route: {vrf: "", prefix: "ctx:ip-prefix/prefix-length", nexthop: $ip-address}
      static.route.prefix: "ctx:ip-prefix/prefix-length"
      static.route.nexthop: $ip-address
      static.route.recursive: "true"
  - view: ^static-route-entry$
    syntax: '^black-hole$'
    maps:
      static.route: {vrf: "", prefix: "ctx:ip-prefix/prefix-length", nexthop: ""}
      static.route.prefix: "ctx:ip-prefix/prefix-length"
      static.route.interface: "NULL0"
  - view: ^static-(nh|indirect|bh)$
    syntax: '^preference <preference>$'
    maps: {static.route.preference: $preference}
  - view: ^static-(nh|indirect|bh)$
    syntax: '^metric <metric>$'
    maps: {static.route.metric: $metric}
  - view: ^static-(nh|indirect|bh)$
    syntax: '^tag <tag>$'
    maps: {static.route.tag: $tag}
  - view: ^static-(nh|indirect|bh)$
    syntax: '^description '
    maps: {static.route.description: *desc}
  - view: ^static-nh$
    syntax: '^bfd-enable$'
    maps: {static.route.bfd: flag}
  - view: ^static-(nh|indirect|bh)$
    syntax: '^shutdown$'
    maps: {static.route.shutdown: flag}

  # ---------- OSPF ----------
  - view: ^router$
    syntax: '^ospf '
    maps:
      ospf.process: "$ospf-instance||0"
      ospf.process.router_id: $router-id
  - view: ^ospf$
    syntax: '^traffic-engineering$'
    maps: {ospf.process.te: flag}
  - view: ^ospf$
    syntax: '^export <policy-name>'
    maps: {ospf.process.export_policy: $policy-name}
  - view: ^ospf$
    syntax: '^shutdown$'
    maps: {ospf.process.shutdown: flag}
  - view: ^ospf$
    syntax: '^area <area-id>$'
    maps: {ospf.process.area: $area-id}
  # OSPF 区域下的接口：写到该接口的 OSPF 参数上（华为接口下 ospf enable <进程> area <区域>）
  - view: ^ospf-area$
    syntax: '^interface <ip-int-name>'
    maps:
      "interface{name=$ip-int-name}.ospf": "_"
      "interface{name=$ip-int-name}.ospf.process": "ctx:ospf-instance||0"
      "interface{name=$ip-int-name}.ospf.area": "ctx:area-id"
  - view: ^ospf-if$
    syntax: '^interface-type '
    maps: {interface.ospf.network_type: "kw:point-to-point=p2p|broadcast|non-broadcast=nbma|p2mp-nbma=p2mp"}
  - view: ^ospf-if$
    syntax: '^metric <metric>$'
    maps: {interface.ospf.cost: $metric}
  - view: ^ospf-if$
    syntax: '^hello-interval '
    maps: {interface.ospf.hello: $seconds}
  - view: ^ospf-if$
    syntax: '^dead-interval '
    maps: {interface.ospf.dead: $seconds}
  - view: ^ospf-if$
    syntax: '^priority '
    maps: {interface.ospf.priority: $number}
  - view: ^ospf-if$
    syntax: '^bfd-enable \[ remain-down-on-failure \]$'
    maps: {interface.ospf.bfd: flag}
  - view: ^ospf-if$
    syntax: '^passive$'
    maps:
      ospf.process.passive: "ctx:ip-int-name"
      ospf.process.passive.enabled: flag
  - view: ^ospf-if$
    syntax: '^shutdown$'
    maps: {interface.ospf.shutdown: flag}
  - view: ^ospf-if$
    syntax: '^node-sid index <index-value>'
    maps:
      interface.prefix_sid: ospf
      interface.prefix_sid.index: $index-value
      # clear-n-flag：不作为节点 SID（华为 node-disable）
      interface.prefix_sid.node_disable: "kw:clear-n-flag=true:false"

  # ---------- IS-IS ----------
  - view: ^router$
    syntax: '^isis \['
    maps: {isis.process: "$isis-instance||0"}
  - view: ^isis$
    syntax: '^area-id <area-address>$'
    maps: {isis.process.area_id: $area-address}
  - view: ^isis$
    syntax: '^system-id '
    maps: {isis.process.system_id: $isis-system-id}
  - view: ^isis$
    syntax: '^level-capability '
    maps: {isis.process.level: "kw:level-1=level-1|level-2=level-2|level-1/2=level-1-2"}
  - view: ^isis$
    syntax: '^traffic-engineering$'
    maps: {isis.process.te: flag}
  - view: ^isis$
    syntax: '^export <policy-name>'
    maps: {isis.process.export_policy: $policy-name}
  - view: ^isis$
    syntax: '^shutdown$'
    maps: {isis.process.shutdown: flag}
  - view: ^isis-level$
    syntax: '^wide-metrics-only$'
    maps: {isis.process.metric_style: "wide"}
  - view: ^isis$
    syntax: '^interface <ip-int-name>$'
    maps:
      "interface{name=$ip-int-name}.isis": "_"
      "interface{name=$ip-int-name}.isis.process": "ctx:isis-instance||0"
  - view: ^isis-if$
    syntax: '^interface-type '
    maps: {interface.isis.p2p: "kw:point-to-point=true|broadcast=false"}
  - view: ^isis-if$
    syntax: '^passive$'
    maps: {interface.isis.passive: flag}
  - view: ^isis-if$
    syntax: '^level-capability '
    maps: {interface.isis.circuit_type: "kw:level-1=level-1|level-2=level-2|level-1/2=level-1-2"}
  - view: ^isis-if$
    syntax: '^bfd-enable '
    maps: {interface.isis.bfd: flag}
  - view: ^isis-if$
    syntax: '^shutdown$'
    maps: {interface.isis.shutdown: flag}
  - view: ^isis-if$
    syntax: '^level \{'
    maps: {interface.isis.level: "kw:1|2"}
  - view: ^isis-if-level$
    syntax: '^metric <metric>$'
    maps: {interface.isis.level.metric: $metric}
  - view: ^isis-if$
    syntax: '^ipv4-node-sid index <index-value>'
    maps:
      interface.prefix_sid: isis
      interface.prefix_sid.index: $index-value
      # clear-n-flag：不作为节点 SID（华为 node-disable）
      interface.prefix_sid.node_disable: "kw:clear-n-flag=true:false"

  # ---------- BGP（AS 号在 router 下，见上；bgp 是容器）----------
  - view: ^bgp$
    syntax: '^router-id <ip-address>$'
    maps: {bgp.instance.router_id: $ip-address}
  - view: ^bgp$
    syntax: '^family '
    maps: {bgp.instance.family: "tail:family"}
  - view: ^bgp$
    syntax: '^keepalive <seconds>$'
    maps: {bgp.instance.keepalive: $seconds}
  - view: ^bgp$
    syntax: '^hold-time <seconds>'
    maps: {bgp.instance.hold: $seconds}
  - view: ^bgp$
    syntax: '^shutdown$'
    maps: {bgp.instance.shutdown: flag}
  - view: ^bgp$
    syntax: '^group <name>$'
    maps: {bgp.peer_group: $name}
  - view: ^bgp-group$
    syntax: '^description '
    maps: {bgp.peer_group.description: *desc}
  - view: ^bgp-group$
    syntax: '^type \{'
    maps: {bgp.peer_group.type: "kw:internal|external"}
  - view: ^bgp-group$
    syntax: '^peer-as <as-number>$'
    maps: {bgp.peer_group.remote_as: $as-number}
  - view: ^bgp-group$
    syntax: '^local-address '
    maps: {bgp.peer_group.update_source: "$ip-address||$ip-int-name"}
  - view: ^bgp-group$
    syntax: '^family '
    maps: {bgp.peer_group.family: "tail:family"}
  - view: ^bgp-group$
    syntax: '^export <plcy'
    maps: {bgp.peer_group.export_policy: *pol}
  - view: ^bgp-group$
    syntax: '^import <plcy'
    maps: {bgp.peer_group.import_policy: *pol}
  - view: ^bgp-group$
    syntax: '^authentication-key '
    maps: {bgp.peer_group.password: "$authentication-key||$hash-key"}
  - view: ^bgp-group$
    syntax: '^keepalive <seconds>$'
    maps: {bgp.peer_group.keepalive: $seconds}
  - view: ^bgp-group$
    syntax: '^hold-time <seconds>'
    maps: {bgp.peer_group.hold: $seconds}
  - view: ^bgp-group$
    syntax: '^neighbor <ip-address>$'
    maps:
      bgp.peer: $ip-address
      bgp.peer.group: "ctx:name"
  - view: ^bgp-neighbor$
    syntax: '^description '
    maps: {bgp.peer.description: *desc}
  - view: ^bgp-neighbor$
    syntax: '^peer-as <as-number>$'
    maps: {bgp.peer.remote_as: $as-number}
  - view: ^bgp-neighbor$
    syntax: '^local-address '
    maps: {bgp.peer.update_source: "$ip-address||$ip-int-name"}
  - view: ^bgp-neighbor$
    syntax: '^authentication-key '
    maps: {bgp.peer.password: "$authentication-key||$hash-key"}
  - view: ^bgp-neighbor$
    syntax: '^export <plcy'
    maps: {bgp.peer.export_policy: *pol}
  - view: ^bgp-neighbor$
    syntax: '^import <plcy'
    maps: {bgp.peer.import_policy: *pol}
  - view: ^bgp-neighbor$
    syntax: '^keepalive <seconds>$'
    maps: {bgp.peer.keepalive: $seconds}
  - view: ^bgp-neighbor$
    syntax: '^hold-time <seconds>'
    maps: {bgp.peer.hold: $seconds}

  # ---------- 路由策略（policy-options 是容器；begin / commit 是编辑会话，不映射）----------
  - view: ^policy-options$
    syntax: '^prefix-list <name>$'
    maps: {rp.prefix_list: $name}
  # Nokia 前缀列表的条目没有序号与动作：按出现顺序编号（10、20…，与华为 index 的常见写法一致），动作为 permit
  - view: ^prefix-list$
    syntax: '^prefix <ip-prefix/prefix-length>'
    maps:
      rp.prefix_list.entry: auto
      rp.prefix_list.entry.action: permit
      rp.prefix_list.entry.prefix: $ip-prefix/prefix-length
      rp.prefix_list.entry.match_type: "kw:exact|longer|through|prefix-length-range|to"
  - view: ^policy-options$
    syntax: '^policy-statement <name>$'
    maps: {rp.policy: $name}
  - view: ^policy-statement$
    syntax: '^default-action '
    maps: {rp.policy.default_action: "kw:accept|reject|next-entry|next-policy|drop=reject"}
  - view: ^policy-statement$
    syntax: '^entry <entry-id>$'
    maps: {rp.policy.node: $entry-id}
  - view: ^policy-entry$
    syntax: '^action \{'
    maps: {rp.policy.node.action: "kw:accept=permit|reject=deny|drop=deny"}
  - view: ^policy-from$
    syntax: '^prefix-list <name>'
    maps: {rp.policy.node.match_prefix_list: $name}
  - view: ^policy-from$
    syntax: '^protocol <protocol2>'
    maps: {rp.policy.node.match_protocol: $protocol2}
  - view: ^policy-from$
    syntax: '^protocol <protocol> '
    maps: {rp.policy.node.match_protocol: $protocol}
  - view: ^policy-entry$
    syntax: '^local-preference <preference>$'
    maps: {rp.policy.node.set_local_preference: $preference}
  - view: ^policy-action$
    syntax: '^metric set '
    maps: {rp.policy.node.set_metric: $metric-value}

  # ---------- MPLS / LDP / SR ----------
  - view: ^router$
    syntax: '^mpls$'
    maps: {mpls.global: "_"}
  - view: ^mpls$
    syntax: '^shutdown$'
    maps: {mpls.global.shutdown: flag}
  - view: ^mpls$
    syntax: '^interface <ip-int-name>'
    maps: {"interface{name=$ip-int-name}.mpls": "_"}
  - view: ^mpls-if$
    syntax: '^shutdown$'
    maps: {interface.mpls.shutdown: flag}
  - view: ^router$
    syntax: '^ldp$'
    maps: {mpls.ldp: "_"}
  - view: ^ldp$
    syntax: '^shutdown$'
    maps: {mpls.ldp.shutdown: flag}
  # LDP 接口：写到该接口的 MPLS 参数上（华为接口下 mpls ldp、Cisco mpls ip）
  - view: ^ldp-if-params$
    syntax: '^interface <ip-int-name>'
    maps:
      "interface{name=$ip-int-name}.mpls": "_"
      "interface{name=$ip-int-name}.mpls.ldp": "true"
  - view: ^ldp-if(-ipv4)?$
    syntax: '^shutdown$'
    maps: {interface.mpls.ldp: "!flag"}
  - view: ^ldp-if-ipv4$
    syntax: '^transport-address '
    maps: {interface.mpls.ldp_transport_address: "kw:interface|system"}
  # LDP 远端会话的对等体：华为 mpls ldp remote-peer <名称> + remote-ip；Nokia 只有地址，名称与地址相同
  - view: ^ldp-targeted$
    syntax: '^peer <ip-address>$'
    maps:
      mpls.ldp.remote_peer: $ip-address
      mpls.ldp.remote_peer.remote_ip: $ip-address
  - view: ^mpls-labels$
    syntax: '^sr-labels start '
    maps:
      sr.global: "_"
      sr.global.srgb_begin: $start-value
      sr.global.srgb_end: $end-value
  - view: ^ospf-sr$
    syntax: '^shutdown$'
    maps: {ospf.process.sr_mpls: "!flag"}
  - view: ^isis-sr$
    syntax: '^shutdown$'
    maps: {isis.process.sr_mpls: "!flag"}

  # ---------- 系统与管理面（system、time、security 是容器）----------
  - view: ^system$
    syntax: '^name <system-name>$'
    maps: {mgmt.system: "_", mgmt.system.name: $system-name}
  - view: ^system$
    syntax: '^contact <contact-name>$'
    maps: {mgmt.snmp: "_", mgmt.snmp.contact: $contact-name}
  - view: ^system$
    syntax: '^location <location>$'
    maps: {mgmt.snmp: "_", mgmt.snmp.location: $location}
  - view: ^system-snmp$
    syntax: '^shutdown$'
    maps: {mgmt.snmp: "_", mgmt.snmp.enabled: "!flag"}
  - view: ^security-snmp$
    syntax: '^community <community-string>'
    maps:
      mgmt.snmp: "_"
      mgmt.snmp.community: $community-string
      mgmt.snmp.community.access: "kw:r=read|rw=write|rwa=write|mgmt=read|vpls-mgmt=read"
  - view: ^system-time$
    syntax: '^ntp$'
    maps: {mgmt.ntp: "_"}
  - view: ^system-ntp$
    syntax: '^server \['
    maps:
      mgmt.ntp.server: $ip-address
      mgmt.ntp.server.prefer: "if:prefer:flag"
      mgmt.ntp.server.key: $key-id
  - view: ^system-ntp$
    syntax: '^shutdown$'
    maps: {mgmt.ntp.shutdown: flag}
  # M7-5：NTP 认证、管理访问过滤器、口令策略、登录空闲超时（安全基线用）
  - view: ^system-ntp$
    syntax: '^authentication-check$'
    maps: {mgmt.ntp.authentication: flag}
  - view: ^system-security$
    syntax: '^management-access-filter$'
    maps: {mgmt.maf: "_"}
  - view: ^security-maf$
    syntax: '^ip-filter$'
    maps: {mgmt.maf.ipv4: "true"}
  - {view: ^system-security$, syntax: '^password$', maps: {"@container": ""}}
  - view: ^security-password$
    syntax: '^aging <days>$'
    maps: {mgmt.aaa.password_aging: $days}
  - view: ^security-password$
    syntax: '^attempts <count>'
    maps: {mgmt.aaa.login_attempts: $count, mgmt.aaa.lockout_time: $minutes2}
  - view: ^login-control$
    syntax: '^idle-timeout '
    maps: {mgmt.system: "_", mgmt.system.idle_timeout: "$minutes||kw:disable"}
  - view: ^system-security$
    syntax: '^telnet-server$'
    maps: {mgmt.telnet: "_", mgmt.telnet.enabled: flag}
  - view: ^system-security$
    syntax: '^ftp-server$'
    maps: {mgmt.ftp: "_", mgmt.ftp.enabled: flag}
  - view: ^system-security$
    syntax: '^ssh$'
    maps: {mgmt.ssh: "_"}
  - view: ^security-ssh$
    syntax: '^server-shutdown$'
    maps: {mgmt.ssh.enabled: "!flag"}
  - view: ^system-security$
    syntax: '^user <user-name>$'
    maps: {mgmt.aaa.user: $user-name}
  - view: ^security-user$
    syntax: '^password '
    maps: {mgmt.aaa.user.password_set: "true"}
  - view: ^security-user$
    syntax: '^access '
    maps: {mgmt.aaa.user.service_type: "tail:access"}
  - view: ^system-security$
    syntax: '^tacplus$'
    maps: {mgmt.tacacs: "_"}
  - view: ^security-tacplus$
    syntax: '^server <index> address <ip-address>'
    maps:
      mgmt.tacacs.server: {role: all, address: $ip-address}
      mgmt.tacacs.key_set: "true"
  - view: ^security-tacplus$
    syntax: '^timeout <seconds>$'
    maps: {mgmt.tacacs.timeout: $seconds}
  - view: ^system-security$
    syntax: '^radius$'
    maps: {mgmt.radius: "_"}
  # syslog <编号> 是容器；address 建立日志服务器（@share：后面的 facility 写在它上面）
  # syslog <编号> 是容器；address 建立日志服务器（@share：后面的 facility、level 写在它上面），编号记为 target_id
  - view: ^log-syslog$
    syntax: '^address <ip-address>$'
    maps: {mgmt.syslog.host: $ip-address, mgmt.syslog.host.target_id: "ctx:syslog-id", "@share": ""}
  - view: ^log-syslog$
    syntax: '^facility '
    maps: {mgmt.syslog.host.facility: $syslog-facility}
  - view: ^log-syslog$
    syntax: '^level '
    maps: {mgmt.syslog.host.level: $syslog-level}

  # ---------- VRRP（路由器接口下）----------
  - view: ^router-if$
    syntax: '^vrrp <virtual-router-id>'
    maps:
      interface.vrrp: $virtual-router-id
      interface.vrrp.owner: "if:owner:true"
  - view: ^router-if-vrrp$
    syntax: '^backup <ip-address>$'
    maps: {interface.vrrp.virtual_ip: $ip-address}
  - view: ^router-if-vrrp$
    syntax: '^priority <priority>$'
    maps: {interface.vrrp.priority: $priority}
  - view: ^router-if-vrrp$
    syntax: '^message-interval '
    maps:
      interface.vrrp.advertise_interval: $seconds
      interface.vrrp.advertise_msec: $milliseconds
  - view: ^router-if-vrrp$
    syntax: '^description '
    maps: {interface.vrrp.description: *desc}
  - view: ^router-if-vrrp$
    syntax: '^shutdown$'
    maps: {interface.vrrp.shutdown: flag}

  # ---------- 过滤器（ACL）：按编号引用 ----------
  - {view: ^configure$, syntax: '^filter$', maps: {"@container": ""}}
  - {view: ^ip-filter-entry$, syntax: '^action \[ secondary \]$', maps: {"@container": ""}}
  - view: ^filter$
    syntax: '^ip-filter <filter-id>'
    maps:
      acl.instance: $filter-id
      acl.instance.type: advanced
  - view: ^ip-filter$
    syntax: '^default-action '
    maps: {acl.instance.default_action: "kw:forward=permit|drop=deny"}
  - view: ^ip-filter$
    syntax: '^description '
    maps: {acl.instance.description: *desc}
  - view: ^ip-filter$
    syntax: '^entry <entry-id>'
    maps: {acl.instance.rule: $entry-id}
  - view: ^ip-filter-entry$
    syntax: '^description '
    maps: {acl.instance.rule.description: *desc}
  - view: ^ip-filter-entry$
    syntax: '^action \{ drop \| forward \}$'
    maps: {acl.instance.rule.action: "kw:drop=deny|forward=permit"}
  - view: ^ip-filter-action$
    syntax: '^drop$'
    maps: {acl.instance.rule.action: deny}
  - view: ^ip-filter-action$
    syntax: '^forward$'
    maps: {acl.instance.rule.action: permit}
  - view: ^ip-filter-entry$
    syntax: '^match \[ \{ protocol <protocol-id>'
    maps: {acl.instance.rule.protocol: $protocol-id}
  - view: ^ip-filter-match$
    syntax: '^src-ip \{ <ip-address/mask>'
    maps:
      acl.instance.rule.source_ip: "pfx:addr:$ip-address/mask||$ip-address"
      acl.instance.rule.source_wildcard: "pfx:wild:$ip-address/mask"
  - view: ^ip-filter-match$
    syntax: '^dst-ip \{ <ip-address/mask>'
    maps:
      acl.instance.rule.destination_ip: "pfx:addr:$ip-address/mask||$ip-address"
      acl.instance.rule.destination_wildcard: "pfx:wild:$ip-address/mask"
  - view: ^ip-filter-match$
    syntax: '^src-port (range|\{)'
    maps: {acl.instance.rule.source_port: "tail:src-port"}
  - view: ^ip-filter-match$
    syntax: '^dst-port (range|\{)'
    maps: {acl.instance.rule.destination_port: "tail:dst-port"}

  # ---------- QoS：SAP 入 / 出方向策略（只记编号、名称与描述；策略内容按原文保留）----------
  - {view: ^configure$, syntax: '^qos$', maps: {"@container": ""}}
  - view: ^qos$
    syntax: '^sap-ingress <policy-id>'
    maps: {qos.sap_ingress: $policy-id, qos.sap_ingress.name: $name}
  - view: ^qos$
    syntax: '^sap-egress <policy-id>'
    maps: {qos.sap_egress: $policy-id, qos.sap_egress.name: $name}
  - view: ^qos-sap-ingress$
    syntax: '^description '
    maps: {qos.sap_ingress.description: *desc}
  - view: ^qos-sap-egress$
    syntax: '^description '
    maps: {qos.sap_egress.description: *desc}

  # ---------- 业务：客户、SDP ----------
  - {view: ^configure$, syntax: '^service$', maps: {"@container": ""}}
  - view: ^service$
    syntax: '^customer <customer-id>'
    maps: {service.customer: $customer-id, service.customer.name: $name}
  - view: ^customer$
    syntax: '^description '
    maps: {service.customer.description: *desc}
  - view: ^service$
    syntax: '^sdp <sdp-id>'
    maps:
      service.sdp: $sdp-id
      service.sdp.delivery: "kw:mpls|gre|l2tpv3|eth-gre-bridged"
  - view: ^sdp$
    syntax: '^description '
    maps: {service.sdp.description: *desc}
  - view: ^sdp$
    syntax: '^far-end \[ <ip-address>'
    maps: {service.sdp.far_end: $ip-address}
  - view: ^sdp$
    syntax: '^ldp$'
    maps: {service.sdp.ldp: flag}
  - view: ^sdp$
    syntax: '^lsp <lsp-name>$'
    maps: {service.sdp.lsp: $lsp-name}
  - view: ^sdp$
    syntax: '^path-mtu '
    maps: {service.sdp.path_mtu: $bytes}
  - view: ^sdp$
    syntax: '^shutdown$'
    maps: {service.sdp.shutdown: flag}
  - {view: ^sdp$, syntax: '^keep-alive$', maps: {"@container": ""}}
  - view: ^sdp-keep-alive$
    syntax: '^shutdown$'
    maps: {service.sdp.keep_alive: "!flag"}

  # ---------- Epipe → l2vpn.xconnect（SAP → 端口上的接入点 + 接入电路；spoke-sdp → 伪线，对端取 SDP 的 far-end）----------
  - view: ^service$
    syntax: '^epipe <service-id>'
    maps:
      l2vpn.xconnect: "$name||$service-id"
      l2vpn.xconnect.service_id: $service-id
      l2vpn.xconnect.customer: $customer-id
  - view: ^epipe$
    syntax: '^description '
    maps: {l2vpn.xconnect.description: *desc}
  - view: ^epipe$
    syntax: '^service-mtu '
    maps: {l2vpn.xconnect.mtu: $octets}
  - view: ^epipe$
    syntax: '^shutdown$'
    maps: {l2vpn.xconnect.shutdown: flag}
  - view: ^epipe$
    syntax: '^sap <sap-id> \[ create \]'
    maps:
      "interface{name=sap:port:$sap-id}.access": "sap:tag:$sap-id"
      "interface{name=sap:port:$sap-id}.access.encapsulation": "sap:encap:$sap-id"
      "interface{name=sap:port:$sap-id}.access.vlan": "sap:vlan:$sap-id"
      "interface{name=sap:port:$sap-id}.access.inner_vlan": "sap:inner:$sap-id"
      l2vpn.xconnect.ac: {interface: "sap:port:$sap-id", instance: "sap:tag:$sap-id"}
  - view: ^epipe$
    syntax: '^spoke-sdp <sdp-id:vc-id>'
    maps:
      l2vpn.xconnect.pw: {peer: "via:service.sdp:far_end:sap:port:$sdp-id:vc-id", vc_id: "sap:tag:$sdp-id:vc-id"}
      l2vpn.xconnect.pw.sdp: "sap:port:$sdp-id:vc-id"

  # ---------- VPLS → l2vpn.vsi（SAP → 端口上的接入点，绑定该 VSI（华为二层子接口 l2 binding vsi）；mesh / spoke-sdp → 对等体）----------
  - view: ^service$
    syntax: '^vpls <service-id>'
    maps:
      l2vpn.vsi: "$name||$service-id"
      l2vpn.vsi.service_id: $service-id
      l2vpn.vsi.customer: $customer-id
  - view: ^vpls$
    syntax: '^description '
    maps: {l2vpn.vsi.description: *desc}
  - view: ^vpls$
    syntax: '^service-mtu '
    maps: {l2vpn.vsi.mtu: $octets}
  - view: ^vpls$
    syntax: '^shutdown$'
    maps: {l2vpn.vsi.shutdown: flag}
  - view: ^vpls$
    syntax: '^sap <sap-id> \[ split-horizon-group <group-name> \] \[ create \] \[ capture-sap \] \[ eth-ring <ring-index> \]$'
    maps:
      "interface{name=sap:port:$sap-id}.access": "sap:tag:$sap-id"
      "interface{name=sap:port:$sap-id}.access.encapsulation": "sap:encap:$sap-id"
      "interface{name=sap:port:$sap-id}.access.vlan": "sap:vlan:$sap-id"
      "interface{name=sap:port:$sap-id}.access.inner_vlan": "sap:inner:$sap-id"
      "interface{name=sap:port:$sap-id}.access.vsi": "ctx:name||ctx:service-id"
  - view: ^vpls$
    syntax: '^mesh-sdp <sdp-id:vc-id> \[ vc-type \{ ether \| vlan \} \] \[ create \]$'
    maps:
      l2vpn.vsi.peer: "via:service.sdp:far_end:sap:port:$sdp-id:vc-id"
      l2vpn.vsi.peer.vc_id: "sap:tag:$sdp-id:vc-id"
      l2vpn.vsi.peer.role: mesh
      l2vpn.vsi.peer.sdp: "sap:port:$sdp-id:vc-id"
  - view: ^vpls$
    syntax: '^spoke-sdp <sdp-id:vc-id> \[ vc-type \{ ether \| vlan \} \] \[ split-horizon-group <group-name> \] \[ create \] \[ no-endpoint \]$'
    maps:
      l2vpn.vsi.peer: "via:service.sdp:far_end:sap:port:$sdp-id:vc-id"
      l2vpn.vsi.peer.vc_id: "sap:tag:$sdp-id:vc-id"
      l2vpn.vsi.peer.role: spoke
      l2vpn.vsi.peer.sdp: "sap:port:$sdp-id:vc-id"

  # ---------- SAP 下的入 / 出方向（ingress / egress 是容器）：QoS 策略与过滤器 ----------
  - {view: -sap$, syntax: '^(ingress|egress)$', maps: {"@container": ""}}
  - view: ^(epipe|vpls)-sap$
    syntax: '^description '
    maps: {interface.access.description: *desc}
  - view: ^(epipe|vpls)-sap$
    syntax: '^shutdown$'
    maps: {interface.access.shutdown: flag}
  - view: ^(epipe|vpls)-sap-ingress$
    syntax: '^qos <policy-id>'
    maps: {interface.access.qos_in: $policy-id}
  - view: ^(epipe|vpls)-sap-egress$
    syntax: '^qos <policy-id>'
    maps: {interface.access.qos_out: $policy-id}
  - view: ^(epipe|vpls)-sap-ingress$
    syntax: '^filter (\[ )?ip <ip-filter-id>'
    maps: {interface.access.acl_in: $ip-filter-id}
  - view: ^(epipe|vpls)-sap-egress$
    syntax: '^filter (\[ )?ip <ip-filter-id>'
    maps: {interface.access.acl_out: $ip-filter-id}
  - view: ^(vprn|ies)-if-sap-ingress$
    syntax: '^filter ip <ip-filter-id>$'
    maps: {interface.acl_in: $ip-filter-id}
  - view: ^(vprn|ies)-if-sap-egress$
    syntax: '^filter ip <ip-filter-id>$'
    maps: {interface.acl_out: $ip-filter-id}

  # ---------- VPRN → vrf.instance（接口 → 绑定该 VRF 的三层接口；RD / RT 在 IPv4 地址族）----------
  - view: ^service$
    syntax: '^vprn <service-id>'
    maps:
      vrf.instance: "$name||$service-id"
      vrf.instance.service_id: $service-id
      vrf.instance.customer: $customer-id
  - view: ^vprn$
    syntax: '^description '
    maps: {vrf.instance.description: *desc}
  - view: ^vprn$
    syntax: '^shutdown$'
    maps: {vrf.instance.shutdown: flag}
  - {view: ^vprn$, syntax: '^bgp-ipvpn$', maps: {"@container": ""}}
  - {view: ^vprn-bgp-ipvpn$, syntax: '^mpls$', maps: {"@container": ""}}
  - view: ^vprn(-ipvpn-mpls)?$
    syntax: '^route-distinguisher <rd>$'
    maps:
      "vrf.instance.af{afi=ipv4}.rd": $rd
  - view: ^vprn(-ipvpn-mpls)?$
    syntax: '^vrf-target \{'
    maps:
      "vrf.instance.af{afi=ipv4}.rt": {value: "pre:target:$ext-community||pre:target:$export-community||pre:target:$import-community", direction: "if:$ext-community:both||kw:export|import"}
      "vrf.instance.af{afi=ipv4}.rt.value": "pre:target:$ext-community||pre:target:$export-community||pre:target:$import-community"
      "vrf.instance.af{afi=ipv4}.rt.direction": "if:$ext-community:both||kw:export|import"
      # export X import Y（M7-5）：同一行的 import 另建一个 RT 对象（与 MD-CLI 的 import-community 相同）
      "vrf.instance.af{afi=ipv4}.rt{value=pre:target:$import-community,direction=if:$export-community:import}.value": "pre:target:$import-community"
      "vrf.instance.af{afi=ipv4}.rt{value=pre:target:$import-community,direction=if:$export-community:import}.direction": "if:$export-community:import"
  - view: ^vprn(-ipvpn-mpls)?$
    syntax: '^vrf-import <plcy'
    maps:
      "vrf.instance.af{afi=ipv4}.import_policy": *pol
  - view: ^vprn(-ipvpn-mpls)?$
    syntax: '^vrf-export <plcy'
    maps:
      "vrf.instance.af{afi=ipv4}.export_policy": *pol
  - view: ^vprn$
    syntax: '^maximum-routes <number>'
    maps:
      "vrf.instance.af{afi=ipv4}.prefix_limit": $number
      "vrf.instance.af{afi=ipv4}.prefix_limit_threshold": $percentage
      "vrf.instance.af{afi=ipv4}.prefix_limit_warn_only": "if:log-only:true"
  - view: ^vprn$
    syntax: '^interface <ip-int-name> \[ create \]$'
    maps:
      interface: $ip-int-name
      interface.vrf: "ctx:name||ctx:service-id"
  - view: ^vprn$
    syntax: '^static-route-entry '
    maps: {"@container": ""}
  - view: ^vprn-static$
    syntax: '^next-hop \{'
    maps:
      static.route: {vrf: "ctx:name||ctx:service-id", prefix: "ctx:ip-prefix/prefix-length", nexthop: "$ip-address||$ip-int-name"}
      static.route.vrf: "ctx:name||ctx:service-id"
      static.route.prefix: "ctx:ip-prefix/prefix-length"
      static.route.nexthop: "$ip-address||$ip-int-name"
  - view: ^vprn-static-nh$
    syntax: '^description '
    maps: {static.route.description: *desc}
  - view: ^vprn-static-nh$
    syntax: '^shutdown$'
    maps: {static.route.shutdown: flag}

  # ---------- IES → service.ies（接口是公网的三层接口，记所属 IES）----------
  - view: ^service$
    syntax: '^ies <service-id>'
    maps:
      service.ies: "$name||$service-id"
      service.ies.service_id: $service-id
      service.ies.customer: $customer-id
  - view: ^ies$
    syntax: '^description '
    maps: {service.ies.description: *desc}
  - view: ^ies$
    syntax: '^shutdown$'
    maps: {service.ies.shutdown: flag}
  - view: ^ies$
    syntax: '^interface <ip-int-name> \[ create \]$'
    maps:
      interface: $ip-int-name
      interface.ies: "ctx:name||ctx:service-id"

  # ---------- VPRN / IES 接口：地址、描述、SAP（端口与终结的 VLAN）----------
  - view: ^(vprn|ies)-if$
    syntax: '^address \{'
    maps:
      interface.ipv4: "pfx:addr:$ip-address/mask||$ip-address"
      interface.ipv4.address: "pfx:addr:$ip-address/mask||$ip-address"
      interface.ipv4.prefix_length: "pfx:len:$ip-address/mask||$netmask"
      interface.ipv4.secondary: "false"
  - view: ^(vprn|ies)-if$
    syntax: '^secondary \{'
    maps:
      interface.ipv4: "pfx:addr:$ip-address/mask||$ip-address"
      interface.ipv4.address: "pfx:addr:$ip-address/mask||$ip-address"
      interface.ipv4.prefix_length: "pfx:len:$ip-address/mask||$netmask"
      interface.ipv4.secondary: "true"
  - view: ^(vprn|ies)-if$
    syntax: '^description '
    maps: {interface.description: *desc}
  - view: ^(vprn|ies)-if$
    syntax: '^shutdown$'
    maps: {interface.shutdown: flag}
  - view: ^(vprn|ies)-if$
    syntax: '^loopback$'
    maps: {interface.loopback: flag}
  - view: ^(vprn|ies)-if$
    syntax: '^sap <sap-id> \[ create \]$'
    maps:
      interface.bind_port: "sap:port:$sap-id"
      interface.dot1q_termination: "sap:vlan:$sap-id"
