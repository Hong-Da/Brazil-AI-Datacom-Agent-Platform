# Cisco IOS-XE 命令卡 → 统一 Schema 的映射规则（语义归并）。写法同 huawei-vrp8.yaml。
family: cisco-iosxe

_peer: &peer "$ip-address||$ipv6-address||$peer-group-name"

rules:
  # ---------- 接口 ----------
  - view: ^system$
    syntax: '^interface <interface>$'
    maps: {interface: $interface}
  - view: ^interface$
    syntax: '^description '
    maps: {interface.description: "$string||$text"}
  - view: ^interface$
    syntax: '^ip address <ip-address> <mask>'
    maps:
      interface.ipv4: $ip-address
      interface.ipv4.address: $ip-address
      interface.ipv4.prefix_length: $mask
      interface.ipv4.secondary: "kw:secondary=true:false"
  - view: ^interface$
    syntax: '^mtu <bytes>$'
    maps: {interface.mtu: $bytes}
  - view: ^interface$
    syntax: '^shutdown$'
    maps: {interface.shutdown: flag}
  - view: ^interface$
    syntax: '^vrf forwarding <vrf-name>'
    maps: {interface.vrf: $vrf-name}
  - view: ^interface$
    syntax: '^channel-group <channel-group-number>'
    maps:
      interface.lag: $channel-group-number
      interface.lag_mode: "kw:active|passive|on"
  - view: ^interface$
    syntax: '^duplex '
    maps: {interface.duplex: "kw:full|half|auto"}
  - view: ^interface$
    syntax: '^negotiation \{ forced \| auto \}$'
    maps: {interface.negotiation: "kw:auto=true|forced=false"}
  - view: ^interface$
    syntax: '^encapsulation dot1q <vlan-id>'
    maps: {interface.dot1q_termination: $vlan-id}
  # ASR 920 业务实例：service instance <编号> ethernet 是一个业务接入点
  - view: ^interface$
    syntax: '^service instance '
    maps: {interface.access: "$id||$instance-id"}
  - view: ^service-instance$
    syntax: '^encapsulation dot1q <vlan-id>'
    maps:
      interface.access.encapsulation: dot1q
      interface.access.vlan: $vlan-id
  - view: ^service-instance$
    syntax: '^encapsulation \{ default \| dot1q \| priority-tagged \| untagged \}$'
    maps: {interface.access.encapsulation: "kw:default|dot1q|priority-tagged|untagged"}
  - view: ^service-instance$
    syntax: '^encapsulation untagged$'
    maps: {interface.access.encapsulation: untagged}
  - view: ^service-instance$
    syntax: '^rewrite ingress tag '
    maps: {interface.access.rewrite: "kw:2=pop 2|1=pop 1"}
  - view: ^service-instance$
    syntax: '^bridge-domain <bridge-id>'
    maps: {interface.access.bridge_domain: $bridge-id}
  - view: ^service-instance$
    syntax: '^description <text>$'
    maps: {interface.access.description: $text}

  # ---------- VRF ----------
  - view: ^system$
    syntax: '^vrf definition <vrf-name>$'
    maps: {vrf.instance: $vrf-name}
  - view: ^vrf$
    syntax: '^description '
    maps: {vrf.instance.description: "$string||$text"}
  - view: ^vrf$
    syntax: '^rd <route-distinguisher>$'
    maps: {"vrf.instance.af{afi=ipv4}.rd": $route-distinguisher}
  - view: ^vrf$
    syntax: '^address-family \{ ipv4 \| ipv6 \}'
    maps: {vrf.instance.af: "kw:ipv4|ipv6"}
  - view: ^vrf(-af)?$
    syntax: '^route-target '
    maps:
      vrf.instance.af.rt: {value: $route-target-ext-community, direction: "kw:import|export|both:both"}
      vrf.instance.af.rt.value: $route-target-ext-community
      vrf.instance.af.rt.direction: "kw:import|export|both:both"
  - view: ^vrf-af$
    syntax: '^export map <map-name>$'
    maps: {vrf.instance.af.export_policy: $map-name}
  - view: ^vrf-af$
    syntax: '^import .*map <map-name>$'
    maps: {vrf.instance.af.import_policy: $map-name}

  # ---------- 静态路由 ----------
  - view: ^system$
    syntax: '^ip route vrf <vrf-name> <prefix> <mask>'
    maps:
      static.route: {vrf: $vrf-name, prefix: "fmt:{prefix}/{mask}", nexthop: "$next-hop-address||"}
      static.route.vrf: $vrf-name
      static.route.prefix: "fmt:{prefix}/{mask}"
      static.route.nexthop: $next-hop-address
      static.route.interface: $interface
      static.route.preference: $distance
      static.route.tag: $tag
  - view: ^system$
    syntax: '^ip route \[ vrf <vrf-name> \] <prefix> <mask>'
    maps:
      static.route: {vrf: "$vrf-name||", prefix: "fmt:{prefix}/{mask}", nexthop: "$ip-address||"}
      static.route.vrf: $vrf-name
      static.route.prefix: "fmt:{prefix}/{mask}"
      static.route.nexthop: $ip-address
      static.route.interface: $interface
      static.route.preference: $distance
      static.route.tag: $tag

  # ---------- BGP ----------
  - view: ^system$
    syntax: '^router bgp <autonomous-system-number>$'
    maps: {bgp.instance: $autonomous-system-number}
  - view: ^router-bgp$
    syntax: '^bgp router-id '
    maps: {bgp.instance.router_id: $ip-address}
  - view: ^router-bgp$
    syntax: '^bgp log-neighbor-changes'
    maps: {bgp.instance.log_neighbor_changes: flag}
  - view: ^router-bgp$
    syntax: '^timers bgp <keepalive> <holdtime>'
    maps:
      bgp.instance.keepalive: $keepalive
      bgp.instance.hold: $holdtime
  - view: ^router-bgp$
    # 早先抽取的 cisco-iosxe.neighbor-timers 仍是原文排版（<p> <eer-group-name>），只取地址
    syntax: '^neighbor (\{ <ip-address> \| <peer-group-name> \}|\[ <ip-address> \| <p> <eer-group-name> \]) timers <keepalive> <holdtime>'
    maps:
      bgp.peer | bgp.peer_group: *peer
      bgp.peer.keepalive | bgp.peer_group.keepalive: $keepalive
      bgp.peer.hold | bgp.peer_group.hold: $holdtime
  - view: ^router-bgp$
    syntax: '^neighbor <peer-group-name> peer-group$'
    maps: {bgp.peer_group: $peer-group-name}
  - view: ^router-bgp$
    syntax: 'remote-as <autonomous-system-number>'
    maps:
      bgp.peer | bgp.peer_group: *peer
      bgp.peer.remote_as | bgp.peer_group.remote_as: $autonomous-system-number
  - view: ^router-bgp$
    syntax: '^neighbor \{ <ip-address> \| <ipv6-address> \} peer-group <peer-group-name>$'
    maps:
      bgp.peer: "$ip-address||$ipv6-address"
      bgp.peer.group: $peer-group-name
  - view: ^router-bgp$
    syntax: 'update-source <interface>$'
    maps:
      bgp.peer | bgp.peer_group: *peer
      bgp.peer.update_source | bgp.peer_group.update_source: $interface
  - view: ^router-bgp$
    syntax: '^neighbor .* password '
    maps:
      bgp.peer | bgp.peer_group: *peer
      bgp.peer.password | bgp.peer_group.password: $string
  - view: ^router-bgp$
    syntax: '^neighbor .* description <text>$'
    maps:
      bgp.peer | bgp.peer_group: *peer
      bgp.peer.description | bgp.peer_group.description: $text
  - view: ^router-bgp$
    syntax: '^address-family ipv4 '
    maps: {bgp.af: {afi: ipv4, vrf: "$vrf-name||"}}
  - view: ^router-bgp$
    syntax: '^address-family vpnv4'
    maps: {bgp.af: {afi: vpnv4, vrf: ""}}
  # 地址族内
  # M4-2：address-family ipv4 vrf 下的邻居（PE–CE）：属性挂在地址族对等体上
  - view: ^bgp-af$
    syntax: 'remote-as <autonomous-system-number>'
    maps:
      bgp.af.peer: *peer
      bgp.af.peer.remote_as: $autonomous-system-number
  - view: ^bgp-af$
    syntax: '^neighbor .* description <text>$'
    maps:
      bgp.af.peer: *peer
      bgp.af.peer.description: $text
  - view: ^bgp-af$
    syntax: '^neighbor .* password '
    maps:
      bgp.af.peer: *peer
      bgp.af.peer.password: $string
  - view: ^bgp-af$
    syntax: 'update-source <interface>$'
    maps:
      bgp.af.peer: *peer
      bgp.af.peer.update_source: $interface
  - view: ^bgp-af$
    syntax: '^neighbor .* activate$'
    maps:
      bgp.af.peer: *peer
      bgp.af.peer.enabled: flag
  - view: ^bgp-af$
    syntax: '^neighbor .* route-map <map-name> \{ in \| out \}$'
    maps:
      bgp.af.peer: *peer
      bgp.af.peer.import_policy: "if:in:$map-name"
      bgp.af.peer.export_policy: "if:out:$map-name"
  - view: ^bgp-af$
    syntax: '^neighbor .* next-hop-self'
    maps:
      bgp.af.peer: *peer
      bgp.af.peer.next_hop_self: flag
  - view: ^bgp-af$
    syntax: '^neighbor .* send-community '
    maps:
      bgp.af.peer: *peer
      bgp.af.peer.send_community: "kw:both|standard|extended:standard"
  - view: ^bgp-af$
    syntax: '^neighbor .* route-reflector-client$'
    maps:
      bgp.af.peer: *peer
      bgp.af.peer.rr_client: flag
  - view: ^bgp-af$
    syntax: '^network \{ <network-number>'
    maps:
      bgp.af.network: "fmt:{network-number}/{network-mask}"
      bgp.af.network.prefix: "fmt:{network-number}/{network-mask}"
      bgp.af.network.policy: $map-tag
  - view: ^bgp-af$
    syntax: '^redistribute \{ connected'
    maps:
      bgp.af.redistribute: "kw:connected|static|ospf|eigrp|isis"
      bgp.af.redistribute.policy: $map-tag
      bgp.af.redistribute.metric: $metric-value

  # ---------- 路由策略 ----------
  - view: ^system$
    syntax: '^route-map <map-tag> \[ permit \| deny \] \[ <sequence-number> \]$'
    maps:
      rp.policy: $map-tag
      rp.policy.node: "$sequence-number||10"
      rp.policy.node.action: "kw:permit|deny:permit"
  - view: ^route-map$
    syntax: '^match ip address \{ prefix-list'
    maps: {rp.policy.node.match_prefix_list: $prefix-list-name, rp.policy.node.match_acl: $access-list}
  - view: ^route-map$
    syntax: '^match community '
    maps: {rp.policy.node.match_community: "$community-list-name||$standard-list-number||$expanded-list-number"}
  - view: ^route-map$
    syntax: '^set local-preference <number>$'
    maps: {rp.policy.node.set_local_preference: $number}
  - view: ^route-map$
    syntax: '^set metric <metric-value>'
    maps: {rp.policy.node.set_metric: $metric-value}
  - view: ^route-map$
    syntax: '^set community \{'
    maps:
      rp.policy.node.set_community: $community-number
      rp.policy.node.set_community_additive: "kw:additive=true:false"
  - view: ^system$
    syntax: '^ip prefix-list \{ <list-name>'
    maps:
      rp.prefix_list: $list-name
      rp.prefix_list.entry: "$number||auto"
      rp.prefix_list.entry.action: "kw:permit|deny"
      rp.prefix_list.entry.prefix: $prefix
      rp.prefix_list.entry.ge: $ge-length
      rp.prefix_list.entry.le: $le-length
  - view: ^system$
    syntax: '^ip community-list \{ <(standard|expanded)> \| (standard|expanded) <list-name> \}'
    maps:
      rp.community_list: "$list-name||$standard||$expanded"
      rp.community_list.entry: auto
      rp.community_list.entry.action: "kw:permit|deny"
      rp.community_list.entry.match: "$regexp||$community-number"

  # ================= 0.2.0：OSPF =================
  - view: ^system$
    syntax: '^router ospf <process-id>'
    maps:
      ospf.process: $process-id
      ospf.process.vrf: $vrf-name
  - view: ^router-ospf$
    syntax: '^router-id <ip-address>$'
    maps: {ospf.process.router_id: $ip-address}
  - view: ^router-ospf$
    syntax: '^auto-cost reference-bandwidth <mbps>$'
    maps: {ospf.process.bandwidth_reference: $mbps}
  - view: ^router-ospf$
    syntax: '^passive-interface \{ default \| <interface> \}$'
    maps:
      ospf.process.passive_default: "if:default:flag"
      ospf.process.passive: $interface
      ospf.process.passive.enabled: flag
  # M4-2：IS-IS 进程下的 passive-interface（与 OSPF 相同的写法；拓扑按进程缺省 + 接口例外计算静默）
  - view: ^router-isis$
    syntax: '^passive-interface \{ default \| <interface> \}$'
    maps:
      isis.process.passive_default: "if:default:flag"
      isis.process.passive: $interface
      isis.process.passive.enabled: flag
  - view: ^router-ospf$
    syntax: '^bfd all-interfaces$'
    maps: {ospf.process.bfd_all: flag}
  - view: ^router-ospf$
    syntax: '^log-adjacency-changes'
    maps: {ospf.process.log_adjacency: flag}
  - view: ^router-ospf$
    syntax: '^default-information originate'
    maps: {ospf.process.default_originate: flag}
  - view: ^router-ospf$
    syntax: '^fast-reroute per-prefix enable'
    maps: {ospf.process.frr: flag}
  - view: ^router-ospf$
    syntax: '^network <ip-address> <wildcard-mask> area <area-id>$'
    maps:
      ospf.process.area: $area-id
      ospf.process.area.network: "fmt:{ip-address} {wildcard-mask}"
  - view: ^router-ospf$
    syntax: '^area <area-id> stub'
    maps:
      ospf.process.area: $area-id
      ospf.process.area.type: stub
  - view: ^router-ospf$
    syntax: '^area <area-id> nssa'
    maps:
      ospf.process.area: $area-id
      ospf.process.area.type: nssa
  - view: ^router-ospf$
    syntax: '^area <area-id> authentication'
    maps:
      ospf.process.area: $area-id
      ospf.process.area.authentication: "kw:message-digest=md5:simple"
  - view: ^interface$
    syntax: '^ip ospf <process-id> area <area-id>'
    maps:
      interface.ospf: "_"
      interface.ospf.process: $process-id
      interface.ospf.area: $area-id
  - view: ^interface$
    syntax: '^ip ospf cost <interface-cost>$'
    maps:
      interface.ospf: "_"
      interface.ospf.cost: $interface-cost
  - view: ^interface$
    syntax: '^ip ospf network '
    maps:
      interface.ospf: "_"
      interface.ospf.network_type: "kw:point-to-point=p2p|point-to-multipoint=p2mp|non-broadcast=nbma|broadcast"
  - view: ^interface$
    syntax: '^ip ospf authentication \['
    maps:
      interface.ospf: "_"
      interface.ospf.authentication: "kw:message-digest=md5|key-chain=keychain|null=none:simple"
  - view: ^interface$
    syntax: '^ip ospf hello-interval <seconds>$'
    maps:
      interface.ospf: "_"
      interface.ospf.hello: $seconds
  - view: ^interface$
    syntax: '^ip ospf dead-interval '
    maps:
      interface.ospf: "_"
      interface.ospf.dead: $seconds
  - view: ^interface$
    syntax: '^ip ospf priority <number-value>$'
    maps:
      interface.ospf: "_"
      interface.ospf.priority: $number-value
  - view: ^interface$
    syntax: '^ip ospf bfd \['
    maps:
      interface.ospf: "_"
      interface.ospf.bfd: "if:disable:false||flag"

  # ================= 0.2.0：IS-IS =================
  - view: ^system$
    syntax: '^router isis \[ <area-tag> \]$'
    maps: {isis.process: "$area-tag||_"}
  - view: ^router-isis$
    syntax: '^net <network-entity-title>$'
    maps: {isis.process.net: $network-entity-title}
  - view: ^router-isis$
    syntax: '^is-type '
    maps: {isis.process.level: "kw:level-1-2|level-2-only=level-2|level-1"}
  - view: ^router-isis$
    syntax: '^metric-style (wide|narrow|transition)'
    maps: {isis.process.metric_style: "kw:wide|narrow|transition"}
  - view: ^router-isis$
    syntax: '^log-adjacency-changes'
    maps: {isis.process.log_adjacency: flag}
  - view: ^router-isis$
    syntax: '^bfd all-interfaces$'
    maps: {isis.process.bfd_all: flag}
  - view: ^router-isis$
    syntax: '^fast-reroute per-prefix'
    maps: {isis.process.frr: flag}
  - view: ^interface$
    syntax: '^ip router isis \[ <area-tag> \]$'
    maps:
      interface.isis: "_"
      interface.isis.process: "$area-tag||_"
  - view: ^interface$
    syntax: '^isis metric '
    maps:
      interface.isis: "_"
      interface.isis.metric: $metric-value
  - view: ^interface$
    syntax: '^isis network point-to-point$'
    maps:
      interface.isis: "_"
      interface.isis.p2p: flag
  - view: ^interface$
    syntax: '^isis circuit-type '
    maps:
      interface.isis: "_"
      interface.isis.circuit_type: "kw:level-1-2|level-2-only=level-2|level-1"
  - view: ^interface$
    syntax: '^isis bfd \['
    maps:
      interface.isis: "_"
      interface.isis.bfd: "if:disable:false||flag"

  # ================= 0.2.0：BFD =================
  - view: ^interface$
    syntax: '^bfd interval <milliseconds> min_rx'
    maps:
      interface.bfd: "_"
      interface.bfd.min_tx: $milliseconds
      interface.bfd.min_rx: $min-rx
      interface.bfd.multiplier: $multiplier-value

  # ================= 0.2.0：管理面 =================
  # NTP
  - view: ^system$
    syntax: '^ntp server \['
    maps:
      mgmt.ntp: "_"
      mgmt.ntp.server: "$ip-address||$hostname"
      mgmt.ntp.server.vrf: $vrf-name
      mgmt.ntp.server.key: $key-id
      mgmt.ntp.server.prefer: "if:prefer:flag"
      mgmt.ntp.server.source_interface: $interface
  - view: ^system$
    syntax: '^ntp authenticate$'
    maps:
      mgmt.ntp: "_"
      mgmt.ntp.authentication: flag
  - view: ^system$
    syntax: '^ntp source <interface>$'
    maps:
      mgmt.ntp: "_"
      mgmt.ntp.source_interface: $interface
  # SNMP
  - view: ^system$
    syntax: '^snmp-server community <string>'
    maps:
      mgmt.snmp: "_"
      mgmt.snmp.community: $string
      mgmt.snmp.community.access: "kw:rw=write|ro=read:read"
      mgmt.snmp.community.acl: "$access-list-number||$access-list-name"
  - view: ^system$
    syntax: '^snmp-server location <text>$'
    maps:
      mgmt.snmp: "_"
      mgmt.snmp.location: $text
  - view: ^system$
    syntax: '^snmp-server contact <text>$'
    maps:
      mgmt.snmp: "_"
      mgmt.snmp.contact: $text
  - view: ^system$
    syntax: '^snmp-server trap-source <interface>$'
    maps:
      mgmt.snmp: "_"
      mgmt.snmp.trap_source: $interface
  - view: ^system$
    syntax: '^snmp-server enable traps'
    maps:
      mgmt.snmp: "_"
      mgmt.snmp.trap_enable: flag
  - view: ^system$
    syntax: '^snmp-server host \{ <hostname> \| <ip-address> \}'
    maps:
      mgmt.snmp: "_"
      mgmt.snmp.host: "$ip-address||$hostname"
      mgmt.snmp.host.version: "kw:3=v3|2c=v2c|1=v1"
  # Syslog
  - view: ^system$
    syntax: '^logging host <host>'
    maps:
      mgmt.syslog: "_"
      mgmt.syslog.host: $host
      mgmt.syslog.host.vrf: $vrf-name
  - view: ^system$
    syntax: '^logging source-interface <interface>'
    maps:
      mgmt.syslog: "_"
      mgmt.syslog.source_interface: $interface
  - view: ^system$
    syntax: '^logging trap <level>$'
    maps:
      mgmt.syslog: "_"
      mgmt.syslog.level: $level
  - view: ^system$
    syntax: '^logging buffered \['
    maps:
      mgmt.syslog: "_"
      mgmt.syslog.buffered: flag
  # SSH
  - view: ^system$
    syntax: '^ip ssh version '
    maps:
      mgmt.ssh: "_"
      mgmt.ssh.version: "kw:2|1"
  - view: ^system$
    syntax: '^ip ssh \{ time-out'
    maps:
      mgmt.ssh: "_"
      mgmt.ssh.timeout: $seconds
      mgmt.ssh.retries: $retries
  # AAA
  # M4-2：SSH 服务端算法、RSA 密钥对
  - view: ^system$
    syntax: '^ip ssh server algorithm encryption '
    maps:
      mgmt.ssh: "_"
      mgmt.ssh.ciphers: "tail:encryption"
  - view: ^system$
    syntax: '^ip ssh server algorithm mac '
    maps:
      mgmt.ssh: "_"
      mgmt.ssh.hmacs: "tail:mac"
  - view: ^system$
    syntax: '^ip ssh server algorithm kex '
    maps:
      mgmt.ssh: "_"
      mgmt.ssh.kex: "tail:kex"
  - view: ^system$
    syntax: '^ip ssh rsa keypair-name <keypair-name>$'
    maps:
      mgmt.ssh: "_"
      mgmt.ssh.rsa_keypair: $keypair-name
  # M4-2：SNMPv3 组与用户
  - view: ^system$
    syntax: '^snmp-server group <group-name> '
    maps:
      mgmt.snmp: "_"
      mgmt.snmp.group: $group-name
      mgmt.snmp.group.version: "kw:v3|v2c|v1"
      mgmt.snmp.group.security_level: "kw:noauth|auth|priv"
      mgmt.snmp.group.read_view: $read-view
      mgmt.snmp.group.write_view: $write-view
      mgmt.snmp.group.notify_view: $notify-view
      mgmt.snmp.group.acl: "$acl-number||$acl-name"
  - view: ^system$
    syntax: '^snmp-server user <username> <groupname> '
    maps:
      mgmt.snmp: "_"
      mgmt.snmp.user: $username
      mgmt.snmp.user.group: $groupname
      mgmt.snmp.user.version: "kw:v3|v2c|v1"
      mgmt.snmp.user.auth_protocol: "if:auth:kw:md5|sha-2|sha"
      mgmt.snmp.user.priv_protocol: "if:priv:kw:3des|des|aes"
      mgmt.snmp.user.acl: "$aclnumber||$aclname"
  # M4-2：RADIUS 服务器（radius server <名称> 模式；旧写法 radius-server host 归到 "_"）
  - view: ^system$
    syntax: '^radius server <name>$'
    maps: {mgmt.radius: $name}
  - view: ^radius-server$
    syntax: '^address ipv4 '
    maps:
      mgmt.radius.server: {role: all, address: "$ipv4address||$hostname"}
      mgmt.radius.server.port: $auth-port
  - view: ^radius-server$
    syntax: '^key '
    maps: {mgmt.radius.key_set: flag}
  - view: ^system$
    syntax: '^radius-server host '
    maps:
      mgmt.radius: "_"
      mgmt.radius.server: {role: all, address: "$ip-address||$hostname"}
      mgmt.radius.server.port: $auth-port
      mgmt.radius.key_set: "if:key:flag"
      mgmt.radius.timeout: $seconds
      mgmt.radius.retransmit: $retries
  # M4-2：no aaa new-model 记为 enabled = false（原来只建了 mgmt.aaa 对象，看不出是否开启）
  - view: ^system$
    syntax: '^aaa new-model$'
    maps: {mgmt.aaa: "_", mgmt.aaa.enabled: flag}
  - view: ^system$
    syntax: '^aaa authentication login \{ default'
    maps:
      mgmt.aaa: "_"
      mgmt.aaa.scheme: "kw:default=authentication default||fmt:authentication {list-name}"
      mgmt.aaa.scheme.methods: "fmt:{method1} {method2} {method3} {method4}"
  - view: ^system$
    syntax: '^aaa authorization '
    maps:
      mgmt.aaa: "_"
      mgmt.aaa.scheme: "kw:default=authorization default||fmt:authorization {list-name}"
      mgmt.aaa.scheme.methods: "fmt:{method1} {method2} {method3} {method4}"
  - view: ^system$
    syntax: '^username <name> \[ privilege <level> \] \{ secret'
    maps:
      mgmt.aaa: "_"
      mgmt.aaa.user: $name
      mgmt.aaa.user.level: $level
      mgmt.aaa.user.password_set: flag
  - view: ^system$
    syntax: '^username <name> privilege <level>$'
    maps:
      mgmt.aaa: "_"
      mgmt.aaa.user: $name
      mgmt.aaa.user.level: $level
  - view: ^system$
    syntax: '^tacacs server <name>$'
    maps: {mgmt.tacacs: $name}
  - view: ^tacacs-server$
    syntax: '^address ipv6 <ipv6-address>$'
    maps: {mgmt.tacacs.server: "fmt:all {ipv6-address}"}
  - view: ^tacacs-server$
    syntax: '^key \['
    maps: {mgmt.tacacs.key_set: flag}
  # 登录线路
  - view: ^system$
    syntax: '^line \[ aux \| console \| tty \| vty \]'
    maps: {mgmt.line: "tail:line"}
  - view: ^line$
    syntax: '^access-class <access-list-number>'
    maps: {mgmt.line.acl_in: "if:in:$access-list-number"}
  - view: ^line$
    syntax: '^login authentication '
    maps: {mgmt.line.auth: aaa, mgmt.line.auth_list: "$list-name||default"}
  - view: ^line$
    syntax: '^login \[ local \| tacacs \]$'
    maps: {mgmt.line.auth: "kw:local|tacacs:password"}
  - view: ^line$
    syntax: '^privilege level <level>$'
    maps: {mgmt.line.privilege: $level}
  - view: ^line$
    syntax: '^exec-timeout <minutes>'
    maps: {mgmt.line.idle_timeout: "fmt:{minutes} {seconds}"}
  - view: ^line$
    syntax: '^transport input '
    maps: {mgmt.line.protocols: "tail:input"}

  # ==================== 0.3.0（M3-2）：MPLS LDP、L3VPN 完善、L2VPN、ACL ====================
  # ---------- MPLS 全局与 LDP（Cisco 全局 MPLS 缺省开启；LDP 参数是全局 mpls ldp … 命令） ----------
  - view: ^system$
    syntax: '^mpls ip$'
    maps: {mpls.global: "_"}
  - view: ^system$
    syntax: '^mpls label protocol \{ ldp \| tdp \}$'
    maps: {"mpls.global{id=_}.label_protocol": "kw:ldp|tdp"}
  - view: ^system$
    syntax: '^mpls ldp router-id \[ vrf'
    maps:
      "mpls.ldp{id=_}.router_id_interface": $interface
      "mpls.ldp{id=_}.router_id_force": "if:force:true"
  - view: ^system$
    syntax: '^mpls ldp graceful-restart$'
    maps: {"mpls.ldp{id=_}.graceful_restart": flag}
  - view: ^system$
    syntax: '^mpls ldp session protection'
    maps: {"mpls.ldp{id=_}.session_protection": flag}
  - view: ^system$
    syntax: '^mpls ldp discovery \{'
    maps: {"mpls.ldp{id=_}.accept_target_hello": "if:accept:$acl||if:accept:all"}
  - view: ^system$
    syntax: '^mpls ldp igp sync holddown <milliseconds>$'
    maps: {"mpls.ldp{id=_}.igp_sync_holddown": $milliseconds}
  - view: ^system$
    syntax: '^mpls ldp holdtime <seconds>$'
    maps: {"mpls.ldp{id=_}.holdtime": $seconds}
  - view: ^system$
    syntax: '^mpls ldp logging neighbor-changes$'
    maps: {"mpls.ldp{id=_}.log_neighbor_changes": flag}
  - view: ^system$
    syntax: '^mpls ldp neighbor \[ vrf <vpn-name> \] <ip-address> password'
    maps:
      "mpls.ldp{id=_}.auth": $ip-address
      "mpls.ldp{id=_}.auth.password": $password
  - view: ^system$
    syntax: '^mpls ldp neighbor \[ vrf <vpn-name> \] <ip-addr> targeted'
    maps:
      "mpls.ldp{id=_}.remote_peer": $ip-addr
      "mpls.ldp{id=_}.remote_peer.remote_ip": $ip-addr
  # 接口 mpls ip = 华为接口 mpls + mpls ldp
  - view: ^interface$
    syntax: '^mpls ip$'
    maps:
      interface.mpls: "_"
      interface.mpls.ldp: flag
  - view: ^interface$
    syntax: '^mpls mtu \[ override \] <bytes>$'
    maps: {"interface.mpls{id=_}.mtu": $bytes}
  - view: ^interface$
    syntax: '^mpls label protocol \{ ldp \| tdp \| both \}$'
    maps: {"interface.mpls{id=_}.label_protocol": "kw:ldp|tdp|both"}
  - view: ^interface$
    syntax: '^mpls ldp discovery transport-address'
    maps: {"interface.mpls{id=_}.ldp_transport_address": "$IP-address||interface"}
  - view: ^interface$
    syntax: '^mpls ldp igp sync'
    maps:
      "interface.mpls{id=_}.ldp_igp_sync": flag
      "interface.mpls{id=_}.ldp_igp_sync_delay": $seconds

  # ---------- L3VPN 完善：标签分配方式、路由数量限制 ----------
  # mpls label mode vrf X protocol bgp-vpnv4 per-vrf：per-prefix 对应华为 per-route，per-vrf 对应 per-instance，per-ce 对应 per-nexthop
  - view: ^system$
    syntax: '^mpls label mode \{ vrf <vrf-name>'
    maps:
      vrf.instance: $vrf-name
      "vrf.instance.af{afi=ipv4}.label_mode": "if:$vrf-name:kw:per-prefix=per-route|per-vrf=per-instance|per-ce=per-nexthop|vrf-conn-aggr"
  - view: ^vrf(-af)?$
    syntax: '^maximum routes <limit>'
    maps:
      "vrf.instance.af{afi=ipv4}.prefix_limit": $limit
      "vrf.instance.af{afi=ipv4}.prefix_limit_threshold": $warn-threshold
      "vrf.instance.af{afi=ipv4}.prefix_limit_warn_only": "if:warning-only:true"

  # ---------- L2VPN：伪线类与 VPWS ----------
  - view: ^system$
    syntax: '^l2vpn$'
    maps: {l2vpn.global: "_"}
  - view: ^system$
    syntax: '^pseudowire-class <pw-class-name>$'
    maps: {l2vpn.pw_class: $pw-class-name}
  - view: ^pseudowire-class$
    syntax: '^encapsulation \{ mpls'
    maps: {l2vpn.pw_class.encapsulation: "kw:mpls|udp|l2tpv2|l2tpv3"}
  - view: ^pseudowire-class$
    syntax: '^control-word$'
    maps: {l2vpn.pw_class.control_word: flag}
  - view: ^pseudowire-class$
    syntax: '^preferred-path '
    maps: {l2vpn.pw_class.preferred_path: "tail:preferred-path"}
  # 接口（端口模式或子接口）或业务实例下的 xconnect：伪线挂在接入点下。业务实例下接入点就是该实例；
  # 接口下的接入点编号为子接口编号（Gi0/0/1.100 → 100，主接口为 "_"），与华为子接口上的 mpls l2vc 对应
  - view: ^service-instance$
    syntax: '^xconnect <peer-ip-address> <vc-id>'
    maps:
      interface.access.pw: primary
      interface.access.pw.peer: $peer-ip-address
      interface.access.pw.vc_id: $vc-id
      interface.access.pw.pw_class: $pw-class-name
      interface.access.pw.transport: "kw:mpls|l2tpv3"
  - view: ^interface$
    syntax: '^xconnect <peer-ip-address> <vc-id>'
    maps:
      interface.access: ctx:subif
      interface.access.pw: primary
      interface.access.pw.peer: $peer-ip-address
      interface.access.pw.vc_id: $vc-id
      interface.access.pw.pw_class: $pw-class-name
      interface.access.pw.transport: "kw:mpls|l2tpv3"
  - view: ^xconnect$
    syntax: '^backup peer <peer-router-ip-addr> <vcid>'
    maps:
      interface.access.pw: backup
      interface.access.pw.peer: $peer-router-ip-addr
      interface.access.pw.vc_id: $vcid
      interface.access.pw.pw_class: $pw-class-name
  - view: ^interface$
    syntax: '^backup peer <peer-router-ip-addr> <vcid>'
    maps:
      interface.access: ctx:subif
      interface.access.pw: backup
      interface.access.pw.peer: $peer-router-ip-addr
      interface.access.pw.vc_id: $vcid
      interface.access.pw.pw_class: $pw-class-name
  - view: ^system$
    syntax: '^l2vpn xconnect context <context-name>$'
    maps: {l2vpn.xconnect: $context-name}
  - view: ^l2vpn-xconnect$
    syntax: '^member <ip-address> <vc-id>'
    maps:
      l2vpn.xconnect.pw: {peer: $ip-address, vc_id: $vc-id}
      l2vpn.xconnect.pw.pw_class: $template-name
  - view: ^l2vpn-xconnect$
    syntax: '^member <interface>'
    maps:
      l2vpn.xconnect.ac: {interface: $interface, instance: $id}

  # ---------- L2VPN：VPLS（VFI 与桥域） ----------
  - view: ^system$
    syntax: '^l2vpn vfi context <name>$'
    maps: {l2vpn.vsi: $name}
  - view: ^system$
    syntax: '^l2 vfi <name> manual$'
    maps:
      l2vpn.vsi: $name
      l2vpn.vsi.mode: static
  - view: ^vfi$
    syntax: '^vpn id <vpn-id>$'
    maps: {l2vpn.vsi.vsi_id: $vpn-id}
  - view: ^vfi$
    syntax: '^description <string>$'
    maps: {l2vpn.vsi.description: $string}
  - view: ^vfi$
    syntax: '^member \{ <ip-address>'
    maps:
      l2vpn.vsi.peer: $ip-address
      l2vpn.vsi.peer.vc_id: $vc-id
      l2vpn.vsi.peer.pw_class: $name
      l2vpn.vsi.peer.encapsulation: "if:encapsulation:mpls"
  - view: ^vfi$
    syntax: '^neighbor <remote-router-id> <vc-id>'
    maps:
      l2vpn.vsi.peer: $remote-router-id
      l2vpn.vsi.peer.vc_id: $vc-id
      l2vpn.vsi.peer.pw_class: $pw-name
      l2vpn.vsi.peer.encapsulation: $encapsulation-type
  - view: ^system$
    syntax: '^bridge-domain \{ <bridge-id>'
    maps: {bridge_domain: $bridge-id}
  - view: ^bridge-domain$
    syntax: '^member vfi <vfi-name>$'
    maps: {bridge_domain.vsi: $vfi-name}
  - view: ^bridge-domain$
    syntax: '^member <interface-type-number> service-instance <service-id>'
    maps:
      bridge_domain.member: {interface: $interface-type-number, instance: $service-id}

  # ---------- ACL ----------
  - view: ^system$
    syntax: '^ip access-list \{'
    maps:
      acl.instance: "$access-list-name||$access-list-number"
      acl.instance.type: "kw:standard=basic|extended=advanced"
  # 只写名称的命名 ACL（不带 standard / extended）按扩展 ACL 处理
  - view: ^system$
    syntax: '^ip access-list <access-list-name>$'
    maps:
      acl.instance: $access-list-name
      acl.instance.type: advanced
  - view: ^interface$
    syntax: '^ip access-group \{'
    maps:
      interface.acl_in: "if:in:$access-list-name||if:in:$access-list-number"
      interface.acl_out: "if:out:$access-list-name||if:out:$access-list-number"
  # 编号 ACL（全局 access-list 编号 …）：规则没有序号，按出现顺序编为 10、20…
  - view: ^system$
    syntax: '^access-list <access-list-number> remark'
    maps: {acl.instance: $access-list-number}
  - view: ^system$
    syntax: '^access-list <access-list-number> \{ deny \| permit \} \{ <source>'
    maps:
      acl.instance: $access-list-number
      acl.instance.type: basic
      acl.instance.rule: auto
      acl.instance.rule.action: "kw:permit|deny"
      acl.instance.rule.source_ip: "$source||$source-host||any"
      acl.instance.rule.source_wildcard: "$source-wildcard||if:$source-host:0.0.0.0||if:$source:0.0.0.0"
      acl.instance.rule.log: "if:log:true"
  - view: ^system$
    syntax: '^access-list <access-list-number> \{ deny \| permit \} <protocol> '
    maps:
      acl.instance: $access-list-number
      acl.instance.type: advanced
      acl.instance.rule: auto
      acl.instance.rule.action: "kw:permit|deny"
      acl.instance.rule.protocol: $protocol
      acl.instance.rule.source_ip: "$source||$source-host||any"
      acl.instance.rule.source_wildcard: "$source-wildcard||if:$source-host:0.0.0.0"
      acl.instance.rule.destination_ip: "$destination||$destination-host||any"
      acl.instance.rule.destination_wildcard: "$destination-wildcard||if:$destination-host:0.0.0.0"
      acl.instance.rule.log: "if:log:true"
  - view: ^system$
    syntax: '^access-list <access-list-number> \{ deny \| permit \} \{ tcp \| udp \} '
    maps:
      acl.instance: $access-list-number
      acl.instance.type: advanced
      acl.instance.rule: auto
      acl.instance.rule.action: "kw:permit|deny"
      acl.instance.rule.protocol: "kw:tcp|udp"
      acl.instance.rule.source_ip: "$source||$source-host||any"
      acl.instance.rule.source_wildcard: "$source-wildcard||if:$source-host:0.0.0.0"
      acl.instance.rule.destination_ip: "$destination||$destination-host||any"
      acl.instance.rule.destination_wildcard: "$destination-wildcard||if:$destination-host:0.0.0.0"
      acl.instance.rule.source_port: "fmt:{source-port-op} {source-port} {source-port-end}"
      acl.instance.rule.destination_port: "fmt:{destination-port-op} {destination-port} {destination-port-end}"
      acl.instance.rule.log: "if:log:true"
  - view: ^system$
    syntax: '^access-list <access-list-number> \{ deny \| permit \} icmp '
    maps:
      acl.instance: $access-list-number
      acl.instance.type: advanced
      acl.instance.rule: auto
      acl.instance.rule.action: "kw:permit|deny"
      acl.instance.rule.protocol: icmp
      acl.instance.rule.source_ip: "$source||$source-host||any"
      acl.instance.rule.source_wildcard: "$source-wildcard||if:$source-host:0.0.0.0"
      acl.instance.rule.destination_ip: "$destination||$destination-host||any"
      acl.instance.rule.destination_wildcard: "$destination-wildcard||if:$destination-host:0.0.0.0"
      acl.instance.rule.log: "if:log:true"
  # 命名 ACL 的条目：有序号用序号，没有时按出现顺序编号
  - view: ^acl$
    syntax: '^\[ <sequence-number> \] (permit|deny) \{ <source> \['
    maps:
      acl.instance.rule: "$sequence-number||auto"
      acl.instance.rule.action: "kw:permit|deny"
      acl.instance.rule.source_ip: "$source||$source-host||any"
      acl.instance.rule.source_wildcard: "$source-wildcard||if:$source-host:0.0.0.0||if:$source:0.0.0.0"
      acl.instance.rule.log: "if:log:true"
  - view: ^acl$
    syntax: '^\[ <sequence-number> \] (permit|deny) <protocol> '
    maps:
      acl.instance.rule: "$sequence-number||auto"
      acl.instance.rule.action: "kw:permit|deny"
      acl.instance.rule.protocol: $protocol
      acl.instance.rule.source_ip: "$source||$source-host||any"
      acl.instance.rule.source_wildcard: "$source-wildcard||if:$source-host:0.0.0.0"
      acl.instance.rule.destination_ip: "$destination||$destination-host||any"
      acl.instance.rule.destination_wildcard: "$destination-wildcard||if:$destination-host:0.0.0.0"
      acl.instance.rule.log: "if:log:true"
  - view: ^acl$
    syntax: '^\[ <sequence-number> \] (permit|deny) \{ tcp \| udp \} '
    maps:
      acl.instance.rule: "$sequence-number||auto"
      acl.instance.rule.action: "kw:permit|deny"
      acl.instance.rule.protocol: "kw:tcp|udp"
      acl.instance.rule.source_ip: "$source||$source-host||any"
      acl.instance.rule.source_wildcard: "$source-wildcard||if:$source-host:0.0.0.0"
      acl.instance.rule.destination_ip: "$destination||$destination-host||any"
      acl.instance.rule.destination_wildcard: "$destination-wildcard||if:$destination-host:0.0.0.0"
      acl.instance.rule.source_port: "fmt:{source-port-op} {source-port} {source-port-end}"
      acl.instance.rule.destination_port: "fmt:{destination-port-op} {destination-port} {destination-port-end}"
      acl.instance.rule.log: "if:log:true"
  - view: ^acl$
    syntax: '^\[ <sequence-number> \] remark <remark>$'
    maps:
      acl.instance.rule: $sequence-number
      acl.instance.rule.description: $remark

  # ==================== 0.4.0（M4-2）：VRRP（VRRPv2 接口写法 + VRRPv3 子模式） ====================
  - view: ^system$
    syntax: '^fhrp version vrrp v3$'
    maps: {"vrrp.global{id=_}.version": "v3"}
  - view: ^interface$
    syntax: '^vrrp <group> ip <ip-address> \[ secondary \]$'
    maps:
      interface.vrrp: $group
      interface.vrrp.virtual_ip: $ip-address
      interface.vrrp.virtual_ip.secondary: "kw:secondary=true:false"
  - view: ^interface$
    syntax: '^vrrp <group> priority <level>$'
    maps:
      interface.vrrp: $group
      interface.vrrp.priority: $level
  - view: ^interface$
    syntax: '^vrrp <group> preempt '
    maps:
      interface.vrrp: $group
      interface.vrrp.preempt: flag
      interface.vrrp.preempt_delay: $seconds
  - view: ^interface$
    syntax: '^vrrp <group> timers advertise '
    maps:
      interface.vrrp: $group
      interface.vrrp.advertise_interval: "unless:msec:$interval"
      interface.vrrp.advertise_msec: "if:msec:$interval"
  - view: ^interface$
    syntax: '^vrrp <group> authentication '
    maps:
      interface.vrrp: $group
      interface.vrrp.auth_mode: "kw:md5|text=simple:simple"
  - view: ^interface$
    syntax: '^vrrp <group> description <text>$'
    maps:
      interface.vrrp: $group
      interface.vrrp.description: $text
  - view: ^interface$
    syntax: '^vrrp <group-number> shutdown$'
    maps:
      interface.vrrp: $group-number
      interface.vrrp.shutdown: flag
  - view: ^interface$
    syntax: '^vrrp <group> track <object-number>'
    maps:
      interface.vrrp: $group
      interface.vrrp.track: $object-number
      interface.vrrp.track.reduce: $priority
  # VRRPv3：vrrp <组号> address-family ipv4 进入子模式
  - view: ^interface$
    syntax: '^vrrp <group-id> address-family '
    maps: {interface.vrrp: $group-id}
  - view: ^vrrp$
    syntax: '^address <ip-address> '
    maps:
      interface.vrrp.virtual_ip: $ip-address
      interface.vrrp.virtual_ip.secondary: "kw:secondary=true:false"
  - view: ^vrrp$
    syntax: '^priority <level>$'
    maps: {interface.vrrp.priority: $level}
  - view: ^vrrp$
    syntax: '^preempt '
    maps:
      interface.vrrp.preempt: flag
      interface.vrrp.preempt_delay: $seconds
  - view: ^vrrp$
    syntax: '^timers advertise '
    maps:
      interface.vrrp.advertise_interval: "unless:msec:$interval"
      interface.vrrp.advertise_msec: "if:msec:$interval"
  - view: ^vrrp$
    syntax: '^description <text>$'
    maps: {interface.vrrp.description: $text}
  - view: ^vrrp$
    syntax: '^track <object-number> '
    maps:
      interface.vrrp.track: $object-number
      interface.vrrp.track.reduce: $priority

  # ==================== 0.4.0（M4-2）：QoS（MQC） ====================
  - view: ^system$
    syntax: '^class-map \[ match-all \| match-any \] <class-map-name>$'
    maps:
      qos.classifier: $class-map-name
      qos.classifier.operator: "kw:match-all=and|match-any=or"
  - view: ^class-map$
    syntax: '^match \[ ip \] dscp '
    maps: {qos.classifier.match: {field: dscp, value: $dscp-value}}
  - view: ^class-map$
    syntax: '^match mpls experimental topmost '
    maps: {qos.classifier.match: {field: mpls-exp, value: $number}}
  - view: ^class-map$
    syntax: '^match cos '
    maps: {qos.classifier.match: {field: 8021p, value: $cos-value}}
  - view: ^class-map$
    syntax: '^match \[ ip \] precedence '
    maps: {qos.classifier.match: {field: ip-precedence, value: $precedence}}
  - view: ^class-map$
    syntax: '^match qos-group <qos-group-value>$'
    maps: {qos.classifier.match: {field: qos-group, value: $qos-group-value}}
  - view: ^class-map$
    syntax: '^match any$'
    maps: {qos.classifier.match: {field: any, value: ""}}
  - view: ^class-map$
    syntax: '^match access-group '
    maps:
      qos.classifier.match: {field: acl, value: "$access-group||$access-group-name"}
      qos.classifier.match.acl: "$access-group||$access-group-name"
  - view: ^system$
    syntax: '^policy-map \[ type '
    maps: {qos.policy: $policy-map-name}
  - view: ^policy-map$
    syntax: '^class \{ class-default \| <class-name> \}$'
    maps:
      qos.policy.rule: "$class-name||kw:class-default"
      qos.policy.rule.classifier: $class-name
  - view: ^policy-map-class$
    syntax: '^set dscp '
    maps: {qos.policy.rule.remark_dscp: $dscp-value}
  - view: ^policy-map-class$
    syntax: '^set mpls experimental (imposition|topmost) '
    maps: {qos.policy.rule.remark_mpls_exp: $mpls-exp-value}
  - view: ^policy-map-class$
    syntax: '^set cos '
    maps: {qos.policy.rule.remark_8021p: $cos-value}
  - view: ^policy-map-class$
    syntax: '^set qos-group '
    maps: {qos.policy.rule.qos_group: $group-id}
  - view: ^policy-map-class$
    syntax: '^police cir '
    maps:
      qos.policy.rule.police_cir: $cir
      qos.policy.rule.police_pir: $pir
  - view: ^policy-map-class$
    syntax: '^police <bps> '
    maps: {qos.policy.rule.police_cir: $bps}
  - view: ^policy-map-class$
    syntax: '^shape \{ average \| peak \} \{'
    maps:
      qos.policy.rule.shape_rate: $mean-rate
      qos.policy.rule.shape_pct: $percentage
  - view: ^policy-map-class$
    syntax: '^bandwidth \{ <kbps> \| \[ remaining \] percent <percentage> \} \[ account'
    maps:
      qos.policy.rule.bandwidth_pct: "unless:remaining:$percentage"
      qos.policy.rule.bandwidth_remaining_pct: "if:remaining:$percentage"
  - view: ^policy-map-class$
    syntax: '^priority \[ level'
    maps:
      qos.policy.rule.priority: flag
      qos.policy.rule.priority_level: $level
  - view: ^policy-map-class$
    syntax: '^queue-limit <queue-limit-size> \[ bytes \| ms \| us \| packets \]$'
    maps: {qos.policy.rule.queue_limit: "tail:queue-limit"}
  - view: ^policy-map-class$
    syntax: '^random-detect '
    maps: {qos.policy.rule.wred: flag}
  - view: ^policy-map-class$
    syntax: '^service-policy <policy-map-name>$'
    maps: {qos.policy.rule.child_policy: $policy-map-name}
  - view: ^interface$
    syntax: '^service-policy \[ type access-control \] \{ input \| output \} <policy-map-name>$'
    maps:
      interface.qos_policy: "kw:input=inbound|output=outbound"
      interface.qos_policy.policy: $policy-map-name

  # ==================== 0.4.0（M4-2）：SR-MPLS ====================
  - view: ^system$
    syntax: '^segment-routing mpls$'
    maps: {sr.global: "_"}
  - view: ^sr-mpls$
    syntax: '^global-block <begin> <end>$'
    maps:
      sr.global.srgb_begin: $begin
      sr.global.srgb_end: $end
  - view: ^sr-mpls$
    syntax: '^local-block <begin> <end>$'
    maps:
      sr.global.srlb_begin: $begin
      sr.global.srlb_end: $end
  - view: ^sr-mpls$
    syntax: '^connected-prefix-sid-map$'
    maps: {sr.global.conn_map: "_"}
  - view: ^sr-conn$
    syntax: '^address-family ipv4$'
    maps: {sr.global.conn_map.af: ipv4}
  - view: ^sr-conn-af$
    syntax: '^<prefix> '
    maps:
      sr.global.conn_map.af.prefix: $prefix
      sr.global.conn_map.af.prefix.index: $index
      sr.global.conn_map.af.prefix.absolute: $label
      sr.global.conn_map.af.prefix.range: $range
  - view: ^router-isis$
    syntax: '^segment-routing mpls$'
    maps: {isis.process.sr_mpls: flag}
  - view: ^router-isis$
    syntax: '^fast-reroute ti-lfa '
    maps: {isis.process.ti_lfa: flag}
  - view: ^router-isis$
    syntax: '^microloop avoidance segment-routing$'
    maps: {isis.process.microloop_avoidance: flag}
  - view: ^router-ospf$
    syntax: '^segment-routing \[ area <area-id> \] \{ mpls \| disable \}$'
    maps: {ospf.process.sr_mpls: "kw:mpls=true|disable=false"}
  - view: ^router-ospf$
    syntax: '^fast-reroute per-prefix ti-lfa'
    maps: {ospf.process.ti_lfa: flag}
  - view: ^router-ospf$
    syntax: '^microloop avoidance segment-routing$'
    maps: {ospf.process.microloop_avoidance: flag}

  # ==================== 0.4.0（M4-2）：EVPN ====================
  - view: ^system$
    syntax: '^l2vpn evpn$'
    maps: {evpn.global: "_"}
  - view: ^l2vpn-evpn$
    syntax: '^replication-type '
    maps: {evpn.global.replication_type: "kw:ingress|static"}
  - view: ^l2vpn-evpn$
    syntax: '^router-id <interface>$'
    maps: {evpn.global.router_id: $interface}
  - view: ^system$
    syntax: '^l2vpn evpn instance <evi> '
    maps:
      evpn.instance: $evi
      evpn.instance.evi: $evi
      evpn.instance.mode: "kw:vlan-based=bd-mode|point-to-point=vpws|vlan-bundle|vlan-aware"
  - view: ^evpn-instance$
    syntax: '^\{ rd \| route-distinguisher \} '
    maps: {evpn.instance.rd: $route-distinguisher}
  - view: ^evpn-instance$
    syntax: '^route-target '
    maps:
      evpn.instance.rt: {value: $rt-value, direction: "kw:import|export|both:both"}
      evpn.instance.rt.value: $rt-value
      evpn.instance.rt.direction: "kw:import|export|both:both"
  - view: ^evpn-instance$
    syntax: '^auto-route-target$'
    maps: {evpn.instance.auto_rt: flag}
  - view: ^evpn-instance$
    syntax: '^description <text>$'
    maps: {evpn.instance.description: $text}
  - view: ^bridge-domain$
    syntax: '^member evpn-instance <evi>'
    maps: {bridge_domain.evpn_instance: $evi}
  - view: ^router-bgp$
    syntax: '^address-family l2vpn '
    maps: {bgp.af: {afi: "kw:evpn|vpls", vrf: ""}}

  # ==================== 0.4.0（M4-2）：时钟同步 ====================
  - view: ^system$
    syntax: '^ptp clock \{ ordinary \| boundary \| e2e-transparent \} domain <domain>'
    maps:
      clock.ptp: "_"
      clock.ptp.device_type: "kw:ordinary=oc|boundary=bc|e2e-transparent=e2etc"
      clock.ptp.domain: $domain
      clock.ptp.hybrid: "kw:hybrid=true:false"
  - view: ^ptp-clock$
    syntax: '^priority1 <priorityvalue>$'
    maps: {clock.ptp.priority1: $priorityvalue}
  - view: ^ptp-clock$
    syntax: '^priority2 <priorityvalue>$'
    maps: {clock.ptp.priority2: $priorityvalue}
  - view: ^ptp-clock$
    syntax: '^clock-port <name> '
    maps:
      clock.ptp.port: $name
      clock.ptp.port.role: "kw:master|slave"
      clock.ptp.profile: "kw:g8275.1|g8275.2|g8265.1"
  - view: ^ptp-port$
    syntax: '^transport ipv4 '
    maps: {clock.ptp.port.transport_interface: $interface}
  - view: ^ptp-port$
    syntax: '^clock source <source-address>$'
    maps: {clock.ptp.port.clock_source: $source-address}
  - view: ^ptp-port$
    syntax: '^clock destination <destination-address>$'
    maps: {clock.ptp.port.clock_destination: $destination-address}
  - view: ^system$
    syntax: '^network-clock synchronization automatic$'
    maps: {"clock.sync{id=_}.automatic": flag}
  - view: ^system$
    syntax: '^network-clock synchronization mode QL-enabled$'
    maps: {"clock.sync{id=_}.ssm_control": flag}
  - view: ^system$
    syntax: '^esmc process$'
    maps: {"clock.sync{id=_}.esmc": flag}
  - view: ^system$
    syntax: '^network-clock wait-to-restore <seconds>'
    maps: {"clock.sync{id=_}.wtr": $seconds}
  - view: ^system$
    syntax: '^network-clock input-source <priority> \{ interface'
    maps:
      clock.sync: "_"
      clock.sync.source: "$interface||if:ptp:ptp||fmt:external {slot-port}"
      clock.sync.source.priority: $priority
  - view: ^interface$
    syntax: '^synchronous mode$'
    maps: {interface.clock: "_", interface.clock.synchronization: flag}
