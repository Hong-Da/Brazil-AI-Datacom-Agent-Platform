# 华为 VRP8 命令卡 → 统一 Schema 的映射规则（语义归并）。lmesh kb map 把规则写进命令卡的 maps。
# 每条规则：view（视图正则，可省）、syntax（命令卡语法正则，第一条命中生效）、maps（目标: 表达式，写法见 lmesh/core/kb/mapping.py）。
# 跨厂商对应关系见 docs/project-spec.md；所有映射在审核通过前都是 draft。
family: huawei-vrp8

# 对等体可以用地址也可以用组名指定，不同命令变体的参数名不同，统一用这一串回退
_peer: &peer "$ipv4-address||$ipv6-address||$peerIpv4Addr||$peerIpv6Addr||$group-name||$groupName||$peerGroupName"

rules:
  # ---------- 接口 ----------
  - view: ^system$
    syntax: '^interface \{ <interface-name> \| <interface-type> <interface-number> \} mode l2$'
    maps:
      interface: "$interface-name||fmt:{interface-type}{interface-number}"
      interface.l2: "true"
  - view: ^system$
    syntax: '^interface \{ <interface-name> \| <interface-type> <interface-number> \}'
    maps:
      interface: "$interface-name||fmt:{interface-type}{interface-number}"
  - view: ^interface$
    syntax: '^description <description>$'
    maps: {interface.description: $description}
  - view: ^interface$
    syntax: '^ip address <ip-address> \{ <mask> \| <mask-length> \}'
    maps:
      interface.ipv4: $ip-address
      interface.ipv4.address: $ip-address
      interface.ipv4.prefix_length: "$mask||$mask-length"
      interface.ipv4.secondary: "kw:sub=true:false"
  - view: ^interface$
    syntax: '^mtu <mtu>$'
    maps: {interface.mtu: $mtu}
  - view: ^interface$
    syntax: '^shutdown$'
    maps: {interface.shutdown: flag}
  - view: ^interface$
    syntax: '^portswitch$'
    maps: {interface.l2: flag}
  - view: ^interface$
    syntax: '^vlan-type dot1q <vlan-id>'
    maps: {interface.dot1q_termination: $vlan-id}
  - view: ^interface$
    syntax: '^ip binding vpn-instance <vpn-instance-name>$'
    maps: {interface.vrf: $vpn-instance-name}
  - view: ^interface$
    syntax: '^eth-trunk <trunk-id>'
    maps:
      interface.lag: $trunk-id
      interface.lag_mode: "kw:active|passive"
  - view: ^interface$
    syntax: '^mode \{ lacp-static \| manual'
    maps: {interface.lag_mode: "kw:lacp-static|manual"}
  - view: ^interface$
    syntax: '^speed '
    maps: {interface.speed: "kw:10|100|1000|10000"}
  - view: ^interface$
    syntax: '^duplex '
    maps: {interface.duplex: "kw:full|half|auto"}
  - view: ^interface$
    syntax: '^negotiation auto$'
    maps: {interface.negotiation: flag}
  # 二层子接口上的业务接入点：接入点就是子接口本身，编号为子接口编号（GE0/2/1.101 → 101，主接口为 "_"），
  # 与 Cisco service instance 的编号对应（knowledge/render 的 access_form 说明两种形态，翻译时换结构）
  - view: ^interface$
    syntax: '^encapsulation dot1q '
    maps:
      interface.access: ctx:subif
      interface.access.encapsulation: dot1q
      interface.access.vlan: $low-pe-vid
  - view: ^interface$
    syntax: '^encapsulation untag$'
    maps:
      interface.access: ctx:subif
      interface.access.encapsulation: untagged
  - view: ^interface$
    syntax: '^rewrite pop \{ single \| double \}$'
    maps:
      interface.access: ctx:subif
      interface.access.rewrite: "kw:single=pop 1|double=pop 2"
  - view: ^interface$
    syntax: '^bridge-domain <bd-id>$'
    maps:
      interface.access: ctx:subif
      interface.access.bridge_domain: $bd-id
  - view: ^system$
    syntax: '^bridge-domain <bd-id>$'
    maps: {bridge_domain: $bd-id}

  # ---------- VRF ----------
  - view: ^system$
    syntax: '^ip vpn-instance <vpn-instance-name>$'
    maps: {vrf.instance: $vpn-instance-name}
  - view: ^vpn-instance$
    syntax: '^description '
    maps: {vrf.instance.description: "$description||$description-information"}
  - view: ^vpn-instance$
    syntax: '^ipv4-family'
    maps: {vrf.instance.af: ipv4}
  - view: ^vpn-instance-af-ipv4$
    syntax: '^route-distinguisher <route-distinguisher>$'
    maps: {vrf.instance.af.rd: $route-distinguisher}
  - view: ^vpn-instance(-af-ipv4)?$
    syntax: '^vpn-target '
    maps:
      vrf.instance.af{afi=ipv4}.rt: {value: $vpn-target, direction: "kw:export-extcommunity=export|import-extcommunity=import|both=both:both"}
      vrf.instance.af{afi=ipv4}.rt.value: $vpn-target
      vrf.instance.af{afi=ipv4}.rt.direction: "kw:export-extcommunity=export|import-extcommunity=import|both=both:both"
  - view: ^vpn-instance-af-ipv4$
    syntax: '^apply-label '
    maps: {vrf.instance.af.label_mode: "kw:per-instance|per-nexthop|per-route"}

  # ---------- 静态路由 ----------
  - view: ^system$
    syntax: '^ip route-static vpn-instance <vpn-source-name> <destination-address>'
    maps:
      static.route: {vrf: $vpn-source-name, prefix: "fmt:{destination-address}/{mask|mask-length}", nexthop: "$nexthop-address||"}
      static.route.vrf: $vpn-source-name
      static.route.prefix: "fmt:{destination-address}/{mask|mask-length}"
      static.route.nexthop: $nexthop-address
      static.route.interface: "$interface-name||fmt:{interface-type}{interface-number}"
      static.route.preference: $preference
      static.route.tag: $tag
      static.route.description: $text
  - view: ^system$
    syntax: '^ip route-static <ip-address> \{ <mask> \| <mask-length> \}'
    maps:
      static.route: {vrf: "", prefix: "fmt:{ip-address}/{mask|mask-length}", nexthop: "$nexthop-address||"}
      static.route.prefix: "fmt:{ip-address}/{mask|mask-length}"
      static.route.nexthop: $nexthop-address
      static.route.interface: "$interface-name||fmt:{interface-type}{interface-number}"
      static.route.preference: $preference
      static.route.tag: $tag
      static.route.description: $text

  # ---------- BGP 实例、对等体、对等体组 ----------
  - view: ^system$
    syntax: '^bgp <as-number>$'
    maps: {bgp.instance: $as-number}
  - view: ^bgp$
    syntax: '^router-id <ipv4-address>$'
    maps: {bgp.instance.router_id: $ipv4-address}
  - view: ^bgp$
    syntax: '^group <group-name> \{ internal \| external \}'
    maps:
      bgp.peer_group: $group-name
      bgp.peer_group.type: "kw:internal|external"
  - view: ^bgp$
    syntax: '^peer <[\w-]+> as-number <as-number>$'
    maps:
      bgp.peer | bgp.peer_group: *peer
      bgp.peer.remote_as | bgp.peer_group.remote_as: $as-number
  - view: ^bgp$
    syntax: '^peer <[\w-]+> group <[\w-]+>$'
    maps:
      bgp.peer: "$ipv4-address||$ipv6-address||$peerIpv4Addr||$peerIpv6Addr"
      bgp.peer.group: "$group-name||$peerGroupName"
  - view: ^bgp$
    syntax: '^peer <[\w-]+> connect-interface '
    maps:
      bgp.peer | bgp.peer_group: *peer
      bgp.peer.update_source | bgp.peer_group.update_source: "$interface-name||fmt:{interface-type}{interface-number}"
  - view: ^bgp$
    syntax: '^peer <[\w-]+> password cipher '
    maps:
      bgp.peer | bgp.peer_group: *peer
      bgp.peer.password | bgp.peer_group.password: $cipher-password
  - view: ^bgp$
    syntax: '^timer keepalive <keepalive-time> hold <hold-time>'
    maps:
      bgp.instance.keepalive: $keepalive-time
      bgp.instance.hold: $hold-time
  - view: ^bgp$
    syntax: '^peer <[\w-]+> timer keepalive <keepalive-time> hold <hold-time>'
    maps:
      bgp.peer | bgp.peer_group: *peer
      bgp.peer.keepalive | bgp.peer_group.keepalive: $keepalive-time
      bgp.peer.hold | bgp.peer_group.hold: $hold-time
  - view: ^bgp$
    syntax: '^peer <[\w-]+> description '
    maps:
      bgp.peer: *peer
      bgp.peer.description: "$description-text||$description"

  # ---------- BGP 地址族 ----------
  - view: ^bgp$
    syntax: '^ipv4-family unicast$'
    maps: {bgp.af: {afi: ipv4, vrf: ""}}
  - view: ^bgp$
    syntax: '^ipv4-family vpnv4( unicast)?$'
    maps: {bgp.af: {afi: vpnv4, vrf: ""}}
  - view: ^bgp$
    syntax: '^ipv4-family vpn-instance <vpn-instance-name>$'
    maps: {bgp.af: {afi: ipv4, vrf: $vpn-instance-name}}
  - view: ^bgp$
    syntax: '^vpn-instance <vpn-instance-name>$'
    maps: {bgp.af: {afi: ipv4, vrf: $vpn-instance-name}}
  - view: ^(bgp-af-|bgp-vpn-instance)
    syntax: '^peer <[\w-]+> enable$'
    maps:
      bgp.af.peer: *peer
      bgp.af.peer.enabled: flag
  - view: ^bgp$
    syntax: '^peer <[\w-]+> enable$'
    maps:
      bgp.af{afi=ipv4,vrf=}.peer: *peer
      bgp.af{afi=ipv4,vrf=}.peer.enabled: flag
  - view: ^(bgp-af-|bgp-vpn-instance)
    syntax: '^peer <[\w-]+> group <[\w-]+>$'
    maps:
      bgp.af.peer: "$ipv4-address||$ipv6-address||$peerIpv4Addr||$peerIpv6Addr"
      bgp.af.peer.group: "$group-name||$peerGroupName"
  - view: ^(bgp-af-|bgp-vpn-instance)
    syntax: '^peer <[\w-]+> route-policy <route-policy-name> import$'
    maps:
      bgp.af.peer: *peer
      bgp.af.peer.import_policy: $route-policy-name
  - view: ^(bgp-af-|bgp-vpn-instance)
    syntax: '^peer <[\w-]+> route-policy <route-policy-name> export$'
    maps:
      bgp.af.peer: *peer
      bgp.af.peer.export_policy: $route-policy-name
  - view: ^(bgp-af-|bgp-vpn-instance)
    syntax: '^peer <[\w-]+> next-hop-local'
    maps:
      bgp.af.peer: *peer
      bgp.af.peer.next_hop_self: flag
  - view: ^(bgp-af-|bgp-vpn-instance)
    syntax: '^peer <[\w-]+> advertise-community$'
    maps:
      bgp.af.peer: *peer
      bgp.af.peer.send_community: standard
  - view: ^(bgp-af-|bgp-vpn-instance)
    syntax: '^peer <[\w-]+> reflect-client$'
    maps:
      bgp.af.peer: *peer
      bgp.af.peer.rr_client: flag
  - view: ^bgp-af-
    syntax: '^network \{ <ipv4-address>'
    maps:
      bgp.af.network: "fmt:{ipv4-address}/{mask|mask-length}"
      bgp.af.network.prefix: "fmt:{ipv4-address}/{mask|mask-length}"
      bgp.af.network.policy: $route-policy-name
  - view: ^bgp-af-
    syntax: '^import-route \{ direct \| static'
    maps:
      bgp.af.redistribute: "kw:direct=connected|static|unr"
      bgp.af.redistribute.policy: $route-policy-name
      bgp.af.redistribute.metric: $med
  - view: ^bgp-af-
    syntax: '^import-route \{ static \| direct'
    maps:
      bgp.af.redistribute: "kw:direct=connected|static|unr"
      bgp.af.redistribute.policy: $route-policy-name
      bgp.af.redistribute.metric: $med

  # ---------- 路由策略 ----------
  - view: ^system$
    syntax: '^route-policy <route-policy-name> <matchMode> node <node>$'
    maps:
      rp.policy: $route-policy-name
      rp.policy.node: $node
      rp.policy.node.action: $matchMode
  - view: ^route-policy$
    syntax: '^if-match ip-prefix <ip-prefix-name>$'
    maps: {rp.policy.node.match_prefix_list: $ip-prefix-name}
  - view: ^route-policy$
    syntax: '^if-match community-filter '
    maps: {rp.policy.node.match_community: "$cfName||$basic-comm-filter-num||$adv-comm-filter-num"}
  - view: ^route-policy$
    syntax: '^apply local-preference '
    maps: {rp.policy.node.set_local_preference: $preference}
  - view: ^route-policy$
    syntax: '^apply cost '
    maps: {rp.policy.node.set_metric: "$cost||$cost-value"}
  - view: ^route-policy$
    syntax: '^apply community \{'
    maps:
      rp.policy.node.set_community: "$cmntyValue||$cmntyNum"
      rp.policy.node.set_community_additive: "kw:additive=true:false"
  - view: ^system$
    syntax: '^ip ip-prefix <ip-prefix-name> \[ index <index-number> \] <matchMode> <ipv4-address> <masklen>'
    maps:
      rp.prefix_list: $ip-prefix-name
      rp.prefix_list.entry: "$index-number||auto"
      rp.prefix_list.entry.action: $matchMode
      rp.prefix_list.entry.prefix: "fmt:{ipv4-address}/{masklen}"
      rp.prefix_list.entry.ge: $greater-equal-value
      rp.prefix_list.entry.le: $less-equal-value
  - view: ^system$
    syntax: '^ip community-filter (advanced|basic) '
    maps:
      rp.community_list: "$comm-filter-name||$basic-comm-filter-name"
      rp.community_list.entry: "$index-number||auto"
      rp.community_list.entry.action: $matchMode
      rp.community_list.entry.match: "$regular-expression||$cmntyValue"

  # ================= 0.2.0：OSPF =================
  - view: ^system$
    syntax: '^ospf <process-id> \['
    maps:
      ospf.process: $process-id
      ospf.process.router_id: $route-id
      ospf.process.vrf: $vpname
  - view: ^system$
    syntax: '^ospf \[ router-id'
    maps:
      ospf.process: "1"
      ospf.process.router_id: $route-id
      ospf.process.vrf: $vpname
  - view: ^ospf$
    syntax: '^bandwidth-reference <value>$'
    maps: {ospf.process.bandwidth_reference: $value}
  - view: ^ospf$
    syntax: '^silent-interface \{ all'
    maps:
      ospf.process.passive_default: "if:all:flag"
      ospf.process.passive: "$interface-name||fmt:{interface-type}{interface-number}"
      ospf.process.passive.enabled: flag
  - view: ^ospf$
    syntax: '^bfd all-interfaces enable$'
    maps: {ospf.process.bfd_all: flag}
  - view: ^ospf$
    syntax: '^bfd all-interfaces \{ min-tx-interval'
    maps:
      ospf.process.bfd_min_tx: $transmit-interval
      ospf.process.bfd_min_rx: $receive-interval
  - view: ^ospf$
    syntax: '^frr$'
    maps: {ospf.process.frr: flag}
  - view: ^ospf$
    syntax: '^import-route \{ direct \| static \| bgp'
    maps:
      ospf.process.redistribute: "kw:direct|static|bgp"
      ospf.process.redistribute.policy: $route-policy-name
  - view: ^ospf$
    syntax: '^import-route \{ ospf \| isis \| rip \}'
    maps:
      ospf.process.redistribute: "kw:ospf|isis|rip"
      ospf.process.redistribute.policy: $route-policy-name
  - view: ^ospf$
    syntax: '^default-route-advertise \[ \[ always'
    maps: {ospf.process.default_originate: flag}
  - view: ^ospf$
    syntax: '^area \{ <area-id> \| <area-idipv4> \}$'
    maps: {ospf.process.area: "$area-idipv4||$area-id"}
  - view: ^ospf-area$
    syntax: '^network <address> <wildcard-mask>$'
    maps:
      ospf.process.area.network: "fmt:{address} {wildcard-mask}"
  - view: ^ospf-area$
    syntax: '^network <address> <wildcard-mask> description <text>$'
    maps:
      ospf.process.area.network: "fmt:{address} {wildcard-mask}"
      ospf.process.area.network.description: $text
  - view: ^ospf-area$
    syntax: '^stub '
    maps: {ospf.process.area.type: stub}
  - view: ^ospf-area$
    syntax: '^nssa '
    maps: {ospf.process.area.type: nssa}
  - view: ^ospf-area$
    syntax: '^authentication-mode simple'
    maps: {ospf.process.area.authentication: simple}
  - view: ^ospf-area$
    syntax: '^authentication-mode \{ md5'
    maps: {ospf.process.area.authentication: "kw:md5|hmac-md5=md5|hmac-sha256"}
  - view: ^ospf-area$
    syntax: '^authentication-mode keychain'
    maps: {ospf.process.area.authentication: keychain}
  # 接口上的 OSPF 参数：华为不写进程号，对象编号固定为 "_"
  - view: ^interface$
    syntax: '^ospf enable \[ <process-id> \] area'
    maps:
      interface.ospf: "_"
      interface.ospf.process: "$process-id||1"
      interface.ospf.area: "$areaidipv4||$area-id"
  - view: ^interface$
    syntax: '^ospf cost <value>$'
    maps:
      interface.ospf: "_"
      interface.ospf.cost: $value
  - view: ^interface$
    syntax: '^ospf network-type '
    maps:
      interface.ospf: "_"
      interface.ospf.network_type: "kw:broadcast|p2p|p2mp|nbma"
  - view: ^interface$
    syntax: '^ospf authentication-mode simple \['
    maps:
      interface.ospf: "_"
      interface.ospf.authentication: simple
  - view: ^interface$
    syntax: '^ospf authentication-mode \{ md5'
    maps:
      interface.ospf: "_"
      interface.ospf.authentication: "kw:md5|hmac-md5=md5|hmac-sha256"
  - view: ^interface$
    syntax: '^ospf authentication-mode keychain <keychain-name>$'
    maps:
      interface.ospf: "_"
      interface.ospf.authentication: keychain
  - view: ^interface$
    syntax: '^ospf authentication-mode null$'
    maps:
      interface.ospf: "_"
      interface.ospf.authentication: none
  - view: ^interface$
    syntax: '^ospf timer hello <interval>'
    maps:
      interface.ospf: "_"
      interface.ospf.hello: $interval
  - view: ^interface$
    syntax: '^ospf timer dead <interval>$'
    maps:
      interface.ospf: "_"
      interface.ospf.dead: $interval
  - view: ^interface$
    syntax: '^ospf dr-priority <priovalue>$'
    maps:
      interface.ospf: "_"
      interface.ospf.priority: $priovalue
  - view: ^interface$
    syntax: '^ospf ldp-sync$'
    maps:
      interface.ospf: "_"
      interface.ospf.ldp_sync: flag
  - view: ^interface$
    syntax: '^ospf bfd enable$'
    maps:
      interface.ospf: "_"
      interface.ospf.bfd: flag

  # ================= 0.2.0：IS-IS =================
  - view: ^system$
    syntax: '^isis <process-id> \['
    maps:
      isis.process: $process-id
      isis.process.vrf: $vpn-instance-name
  - view: ^system$
    syntax: '^isis \[ vpn-instance'
    maps:
      isis.process: "1"
      isis.process.vrf: $vpn-instance-name
  - view: ^isis$
    syntax: '^network-entity <net-addr>$'
    maps: {isis.process.net: $net-addr}
  - view: ^isis$
    syntax: '^is-level '
    maps: {isis.process.level: "kw:level-1-2|level-1|level-2"}
  - view: ^isis$
    syntax: '^cost-style '
    maps: {isis.process.metric_style: "kw:wide-compatible=compatible|narrow-compatible=compatible|compatible|wide|narrow"}
  - view: ^isis$
    syntax: '^bfd all-interfaces enable$'
    maps: {isis.process.bfd_all: flag}
  - view: ^isis$
    syntax: '^frr$'
    maps: {isis.process.frr: flag}
  - view: ^interface$
    syntax: '^isis enable <process-id>'
    maps:
      interface.isis: "_"
      interface.isis.process: $process-id
  - view: ^interface$
    syntax: '^isis enable \[ auto-adj-disable \]$'
    maps:
      interface.isis: "_"
      interface.isis.process: "1"
  - view: ^interface$
    syntax: '^isis cost <cost> \['
    maps:
      interface.isis: "_"
      interface.isis.metric: $cost
  - view: ^interface$
    syntax: '^isis circuit-type p2p'
    maps:
      interface.isis: "_"
      interface.isis.p2p: flag
  - view: ^interface$
    syntax: '^isis circuit-level '
    maps:
      interface.isis: "_"
      interface.isis.circuit_type: "kw:level-1-2|level-1|level-2"
  - view: ^interface$
    syntax: '^isis silent$'
    maps:
      interface.isis: "_"
      interface.isis.passive: flag
  - view: ^interface$
    syntax: '^isis bfd enable$'
    maps:
      interface.isis: "_"
      interface.isis.bfd: flag

  # ================= 0.2.0：BFD =================
  - view: ^system$
    syntax: '^bfd$'
    maps: {bfd.global: "_"}
  - view: ^system$
    syntax: '^bfd <session-name> bind peer-ip <peer-ip> \[ vpn-instance <vpn-name> \] \[ interface'
    maps:
      bfd.session: $session-name
      bfd.session.peer: $peer-ip
      bfd.session.interface: "$interface-name||fmt:{interface-type}{interface-number}"
  - view: ^bfd-session$
    syntax: '^discriminator local <discr-value>$'
    maps: {bfd.session.local_discriminator: $discr-value}
  - view: ^bfd-session$
    syntax: '^discriminator remote <discr-value>$'
    maps: {bfd.session.remote_discriminator: $discr-value}
  - view: ^bfd-session$
    syntax: '^min-tx-interval <tx-interval>$'
    maps: {bfd.session.min_tx: $tx-interval}
  - view: ^bfd-session$
    syntax: '^min-rx-interval <rx-interval>$'
    maps: {bfd.session.min_rx: $rx-interval}
  - view: ^bfd-session$
    syntax: '^detect-multiplier <multiplier>$'
    maps: {bfd.session.multiplier: $multiplier}

  # ================= 0.2.0：管理面 =================
  # NTP
  - view: ^system$
    syntax: '^ntp-service unicast-server \{ <ipv4Addr>'
    maps:
      mgmt.ntp: "_"
      mgmt.ntp.server: $ipv4Addr
      mgmt.ntp.server.source_interface: "$ifName||fmt:{interface_type}{interface_num}"
      mgmt.ntp.server.vrf: $vpnName
      mgmt.ntp.server.prefer: "if:preference:flag"
      mgmt.ntp.server.key: $authkeyid
  - view: ^system$
    syntax: '^ntp-service authentication enable$'
    maps:
      mgmt.ntp: "_"
      mgmt.ntp.authentication: flag
  - view: ^system$
    syntax: '^ntp-service \[ ipv6 \] server disable$'
    maps:
      mgmt.ntp: "_"
      mgmt.ntp.server_disabled: "if:server:flag"
  - view: ^system$
    syntax: '^ntp-service access '
    maps:
      mgmt.ntp: "_"
      mgmt.ntp.access: "kw:peer|query|server|synchronization|limited"
      mgmt.ntp.access.acl: "$aclname||$acl-number"
  # SNMP
  - view: ^system$
    syntax: '^snmp-agent$'
    maps:
      mgmt.snmp: "_"
      mgmt.snmp.enabled: flag
  - view: ^system$
    syntax: '^snmp-agent community \{ read \| write \} cipher'
    maps:
      mgmt.snmp: "_"
      mgmt.snmp.community: "$alias-name||$host-string"
      mgmt.snmp.community.access: "kw:read|write"
      mgmt.snmp.community.acl: "$acl-number||$acl-name"
  - view: ^system$
    syntax: '^snmp-agent sys-info \{ contact'
    maps:
      mgmt.snmp: "_"
      mgmt.snmp.contact: $contact
      mgmt.snmp.location: $location
  - view: ^system$
    syntax: '^snmp-agent sys-info version '
    maps:
      mgmt.snmp: "_"
      mgmt.snmp.versions: "tail:version"
  - view: ^system$
    syntax: '^snmp-agent trap enable$'
    maps:
      mgmt.snmp: "_"
      mgmt.snmp.trap_enable: flag
  - view: ^system$
    syntax: '^snmp-agent trap source '
    maps:
      mgmt.snmp: "_"
      mgmt.snmp.trap_source: "$interface-name||fmt:{interface-type}{interface-number}"
  - view: ^system$
    syntax: '^snmp-agent target-host \[ host-name <host-name> \] trap address udp-domain <ip-address>'
    maps:
      mgmt.snmp: "_"
      mgmt.snmp.host: $ip-address
      mgmt.snmp.host.version: "kw:v1|v2c|v3"
      mgmt.snmp.host.source_interface: "$interface-name||fmt:{interface-type}{interface-number}"
  # Syslog
  - view: ^system$
    syntax: '^info-center loghost <ipv4-address>'
    maps:
      mgmt.syslog: "_"
      mgmt.syslog.host: $ipv4-address
      mgmt.syslog.host.vrf: $vpn-instance-name
  - view: ^system$
    syntax: '^info-center loghost source \{'
    maps:
      mgmt.syslog: "_"
      mgmt.syslog.source_interface: "$interface-name||fmt:{interface-type}{interface-number}"
  # SSH / Telnet / FTP
  - view: ^system$
    syntax: '^stelnet server enable$'
    maps:
      mgmt.ssh: "_"
      mgmt.ssh.enabled: flag
  - view: ^system$
    syntax: '^ssh server authentication-retries <times>$'
    maps:
      mgmt.ssh: "_"
      mgmt.ssh.retries: $times
  - view: ^system$
    syntax: '^ssh server timeout <seconds>$'
    maps:
      mgmt.ssh: "_"
      mgmt.ssh.timeout: $seconds
  - view: ^system$
    syntax: '^ssh server-source all-interface$'
    maps:
      mgmt.ssh: "_"
      mgmt.ssh.source_all: flag
  - view: ^system$
    syntax: '^sftp server enable$'
    maps:
      mgmt.ssh: "_"
      mgmt.ssh.sftp: flag
  - view: ^system$
    syntax: '^ssh user <user-name>$'
    maps:
      mgmt.ssh: "_"
      mgmt.ssh.user: $user-name
  - view: ^system$
    syntax: '^ssh user <user-name> authentication-type '
    maps:
      mgmt.ssh: "_"
      mgmt.ssh.user: $user-name
      mgmt.ssh.user.auth_type: "kw:password-rsa|password-dsa|password-ecc|password-sm2|password|rsa|dsa|all|ecc|sm2"
  - view: ^system$
    syntax: '^ssh user <user-name> service-type \{ sftp'
    maps:
      mgmt.ssh: "_"
      mgmt.ssh.user: $user-name
      mgmt.ssh.user.service_type: "tail:service-type"
  - view: ^system$
    syntax: '^ssh user <user-name> service-type all$'
    maps:
      mgmt.ssh: "_"
      mgmt.ssh.user: $user-name
      mgmt.ssh.user.service_type: all
  - view: ^system$
    syntax: '^telnet server enable$'
    maps:
      mgmt.telnet: "_"
      mgmt.telnet.enabled: flag
  - view: ^system$
    syntax: '^telnet server-source all-interface$'
    maps:
      mgmt.telnet: "_"
      mgmt.telnet.source_all: flag
  - view: ^system$
    syntax: '^ftp server-source all-interface$'
    maps:
      mgmt.ftp: "_"
      mgmt.ftp.source_all: flag
  - view: ^system$
    syntax: '^ftp \[ ipv6 \] server enable$'
    maps:
      mgmt.ftp: "_"
      mgmt.ftp.enabled: flag
  # AAA
  - view: ^system$
    syntax: '^aaa$'
    maps: {mgmt.aaa: "_"}
  - view: ^aaa$
    syntax: '^local-user <user-name> password '
    maps:
      mgmt.aaa.user: $user-name
      mgmt.aaa.user.password_set: flag
  - view: ^aaa$
    syntax: '^local-user <user-name> level <level>$'
    maps:
      mgmt.aaa.user: $user-name
      mgmt.aaa.user.level: $level
  - view: ^aaa$
    syntax: '^local-user <user-name> service-type \{ terminal'
    maps:
      mgmt.aaa.user: $user-name
      mgmt.aaa.user.service_type: "tail:service-type"
  - view: ^aaa$
    syntax: '^local-user <user-name> state '
    maps:
      mgmt.aaa.user: $user-name
      mgmt.aaa.user.state: "kw:active|block"
  - view: ^aaa$
    syntax: '^authentication-scheme <scheme-name>$'
    maps: {mgmt.aaa.scheme: "fmt:authentication {scheme-name}"}
  - view: ^aaa$
    syntax: '^authorization-scheme <authorization-scheme-name>$'
    maps: {mgmt.aaa.scheme: "fmt:authorization {authorization-scheme-name}"}
  - view: ^aaa$
    syntax: '^accounting-scheme <acct-scheme-name>$'
    maps: {mgmt.aaa.scheme: "fmt:accounting {acct-scheme-name}"}
  - view: ^aaa-authentication$
    syntax: '^authentication-mode \{ local \| hwtacacs \| radius \}'
    maps: {mgmt.aaa.scheme.methods: "tail:authentication-mode"}
  - view: ^aaa-authorization$
    syntax: '^authorization-mode <authorization-mode1>'
    maps: {mgmt.aaa.scheme.methods: "tail:authorization-mode"}
  - view: ^aaa-accounting$
    syntax: '^accounting-mode '
    maps: {mgmt.aaa.scheme.methods: "tail:accounting-mode"}
  - view: ^aaa$
    syntax: '^domain <domain-name>$'
    maps: {mgmt.aaa.domain: $domain-name}
  - view: ^aaa-domain$
    syntax: '^authentication-scheme <scheme-name>$'
    maps: {mgmt.aaa.domain.authentication: $scheme-name}
  - view: ^aaa-domain$
    syntax: '^authorization-scheme <authorization-scheme-name>$'
    maps: {mgmt.aaa.domain.authorization: $authorization-scheme-name}
  - view: ^aaa-domain$
    syntax: '^accounting-scheme <accounting-scheme-name>$'
    maps: {mgmt.aaa.domain.accounting: $accounting-scheme-name}
  - view: ^aaa-domain$
    syntax: '^hwtacacs-server <template-name>$'
    maps: {mgmt.aaa.domain.tacacs: $template-name}
  # HWTACACS
  - view: ^system$
    syntax: '^hwtacacs-server template <template-name>$'
    maps: {mgmt.tacacs: $template-name}
  - view: ^hwtacacs$
    syntax: '^hwtacacs-server authentication <ipv6-address>( secondary)?$'
    maps:
      mgmt.tacacs.server: "fmt:authentication {ipv6-address}"
      mgmt.tacacs.server.secondary: "if:secondary:flag"
  - view: ^hwtacacs$
    syntax: '^hwtacacs-server authorization <ip-address> \[ vpn-instance <vpn-name-val> \]'
    maps:
      mgmt.tacacs.server: "fmt:authorization {ip-address}"
      mgmt.tacacs.server.secondary: "if:secondary:flag"
  - view: ^hwtacacs$
    syntax: '^hwtacacs-server accounting <ip-address> \[ vpn-instance <vpn-name-val> \]'
    maps:
      mgmt.tacacs.server: "fmt:accounting {ip-address}"
      mgmt.tacacs.server.secondary: "if:secondary:flag"
  - view: ^hwtacacs$
    syntax: '^hwtacacs-server source-ip <ip-address>$'
    maps: {mgmt.tacacs.source: $ip-address}
  - view: ^hwtacacs$
    syntax: '^hwtacacs-server shared-key cipher'
    maps: {mgmt.tacacs.key_set: flag}
  - view: ^hwtacacs$
    syntax: '^hwtacacs-server timer response-timeout <value>$'
    maps: {mgmt.tacacs.timeout: $value}
  # 登录线路
  - view: ^system$
    syntax: '^user-interface vty <first-ui-number> \[ <last-ui-number> \]$'
    maps: {mgmt.line: "tail:user-interface"}
  - view: ^system$
    syntax: '^user-interface \{ con \| console \} <first-ui-number>$'
    maps: {mgmt.line: "tail:user-interface"}
  - view: ^user-interface-(vty|con)$
    syntax: '^acl \{ <acl4name> \| <acl4num> \} \{ inbound \| outbound \}$'
    maps: {mgmt.line.acl_in: "if:inbound:$acl4name||if:inbound:$acl4num"}
  - view: ^user-interface-(vty|con)$
    syntax: '^authentication-mode '
    maps: {mgmt.line.auth: "kw:aaa|password|none"}
  - view: ^user-interface-(vty|con)$
    syntax: '^user privilege level <level>$'
    maps: {mgmt.line.privilege: $level}
  - view: ^user-interface-(vty|con)$
    syntax: '^idle-timeout <minutes>'
    maps: {mgmt.line.idle_timeout: "fmt:{minutes} {seconds}"}
  - view: ^user-interface-(vty|con)$
    syntax: '^protocol inbound '
    maps: {mgmt.line.protocols: "tail:inbound"}
  # BGP 地址族：下一跳迭代策略（引用路由策略，配置检查判断策略是否被使用要用到）
  - view: ^bgp-af-
    syntax: '^nexthop recursive-lookup route-policy <route-policy-name>'
    maps: {bgp.af.nexthop_policy: $route-policy-name}

  # ==================== 0.3.0（M3-2）：MPLS LDP、L3VPN 完善、L2VPN、ACL ====================
  # ---------- MPLS 全局与 LDP ----------
  - view: ^system$
    syntax: '^mpls lsr-id <lsr-id>$'
    maps: {"mpls.global{id=_}.lsr_id": $lsr-id}
  - view: ^system$
    syntax: '^mpls$'
    maps: {mpls.global: "_"}
  - view: ^system$
    syntax: '^mpls ldp$'
    maps: {mpls.ldp: "_"}
  - view: ^mpls-ldp$
    syntax: '^lsr-id <lsr-id>$'
    maps: {mpls.ldp.lsr_id: $lsr-id}
  - view: ^mpls-ldp$
    syntax: '^graceful-restart$'
    maps: {mpls.ldp.graceful_restart: flag}
  - view: ^mpls-ldp$
    syntax: '^session protection'
    maps: {mpls.ldp.session_protection: flag}
  - view: ^mpls-ldp$
    syntax: '^accept target-hello all'
    maps: {mpls.ldp.accept_target_hello: all}
  - view: ^mpls-ldp$
    syntax: '^accept target-hello peer-group'
    maps: {mpls.ldp.accept_target_hello: $ip-prefix-name}
  - view: ^mpls-ldp$
    syntax: '^send-message address all-loopback$'
    maps: {mpls.ldp.send_all_loopback: flag}
  - view: ^mpls-ldp$
    syntax: '^mldp p2mp$'
    maps: {mpls.ldp.mldp_p2mp: flag}
  - view: ^mpls-ldp$
    syntax: '^igp-sync-delay timer <value>$'
    maps: {mpls.ldp.igp_sync_delay: $value}
  - view: ^mpls-ldp$
    syntax: '^md5-password (plain|cipher) <peer-lsr-id>'
    maps:
      mpls.ldp.auth: $peer-lsr-id
      mpls.ldp.auth.password: "$password-plain||$password-cipher"
  - view: ^system$
    syntax: '^mpls ldp remote-peer <remote-peer-name>$'
    maps: {"mpls.ldp{id=_}.remote_peer": $remote-peer-name}
  - view: ^mpls-ldp-remote-peer$
    syntax: '^remote-ip <ip-address>$'
    maps: {mpls.ldp.remote_peer.remote_ip: $ip-address}
  - view: ^mpls-ldp-remote-peer$
    syntax: '^description <description-value>$'
    maps: {mpls.ldp.remote_peer.description: $description-value}
  # 接口：mpls → mpls ldp → LDP 参数，都写到接口 MPLS 对象（编号 "_"）
  - view: ^interface$
    syntax: '^mpls$'
    maps: {interface.mpls: "_"}
  - view: ^interface$
    syntax: '^mpls ldp$'
    maps: {"interface.mpls{id=_}.ldp": flag}
  - view: ^interface$
    syntax: '^mpls mtu <mtu>$'
    maps: {"interface.mpls{id=_}.mtu": $mtu}
  - view: ^interface$
    syntax: '^mpls ldp transport-address interface$'
    maps: {"interface.mpls{id=_}.ldp_transport_address": interface}
  - view: ^interface$
    syntax: '^mpls ldp transport-address \{'
    maps: {"interface.mpls{id=_}.ldp_transport_address": "$interface-name||fmt:{interface-type}{interface-number}"}
  - view: ^interface$
    syntax: '^mpls ldp local-lsr-id interface$'
    maps: {"interface.mpls{id=_}.ldp_local_lsr_id": interface}
  - view: ^interface$
    syntax: '^mpls ldp local-lsr-id \{'
    maps: {"interface.mpls{id=_}.ldp_local_lsr_id": "$interface-name||fmt:{interface-type}{interface-number}"}
  - view: ^interface$
    syntax: '^mpls ldp timer igp-sync-delay <value>$'
    maps: {"interface.mpls{id=_}.ldp_igp_sync_delay": $value}

  # ---------- L3VPN 完善：VPN 实例的路由策略、隧道策略、路由数量限制、VPN FRR、IPv6 地址族 ----------
  - view: ^vpn-instance$
    syntax: '^ipv6-family'
    maps: {vrf.instance.af: ipv6}
  - view: ^vpn-instance(-af-ipv4)?$
    syntax: '^import route-policy <policy-name>$'
    maps: {"vrf.instance.af{afi=ipv4}.import_policy": $policy-name}
  - view: ^vpn-instance(-af-ipv4)?$
    syntax: '^export route-policy <policy-name>'
    maps: {"vrf.instance.af{afi=ipv4}.export_policy": $policy-name}
  - view: ^vpn-instance(-af-ipv4)?$
    syntax: '^tnl-policy <policy-name>$'
    maps: {"vrf.instance.af{afi=ipv4}.tunnel_policy": $policy-name}
  - view: ^vpn-instance(-af-ipv4)?$
    syntax: '^prefix limit <number>'
    maps:
      "vrf.instance.af{afi=ipv4}.prefix_limit": $number
      "vrf.instance.af{afi=ipv4}.prefix_limit_threshold": $alert-percent
      "vrf.instance.af{afi=ipv4}.prefix_limit_warn_only": "if:simply-alert:true"
  - view: ^vpn-instance(-af-ipv4)?$
    syntax: '^vpn frr$'
    maps: {"vrf.instance.af{afi=ipv4}.vpn_frr": flag}
  - view: ^system$
    syntax: '^tunnel-policy <policy-name>$'
    maps: {tunnel_policy: $policy-name}
  - view: ^tunnel-policy$
    syntax: '^description <description-text>$'
    maps: {tunnel_policy.description: $description-text}
  - view: ^tunnel-policy$
    syntax: '^tunnel select-seq \{'
    maps:
      tunnel_policy.select_seq: "tail:select-seq:load-balance-number"
      tunnel_policy.load_balance: $load-balance-number

  # ---------- L2VPN：VPWS ----------
  - view: ^system$
    syntax: '^mpls l2vpn$'
    maps: {l2vpn.global: "_"}
  - view: ^system$
    syntax: '^pw-template <pwname>$'
    maps: {l2vpn.pw_class: $pwname}
  - view: ^pw-template$
    syntax: '^control-word$'
    maps: {l2vpn.pw_class.control_word: flag}
  - view: ^pw-template$
    syntax: '^peer-address <ip-address>$'
    maps: {l2vpn.pw_class.peer: $ip-address}
  - view: ^pw-template$
    syntax: '^tnl-policy <tnlPolicyName>$'
    maps: {l2vpn.pw_class.tunnel_policy: $tnlPolicyName}
  - view: ^pw-template$
    syntax: '^mtu <mtu>$'
    maps: {l2vpn.pw_class.mtu: $mtu}
  # 接口（子接口即接入点，编号为子接口编号，主接口为 "_"）上的 LDP 伪线：主用 / secondary 备用 / bypass
  - view: ^interface$
    syntax: '^mpls l2vc (instance-name <instance-name> )?\{ <ip-address> \| pw-template <[\w-]+> \} &<1-9> <vc-id>'
    maps:
      interface.access: ctx:subif
      interface.access.pw: "kw:secondary=backup|bypass=bypass:primary"
      interface.access.pw.peer: $ip-address
      interface.access.pw.vc_id: $vc-id
      interface.access.pw.pw_class: "$pw-template-name||$template-name"
      interface.access.pw.tunnel_policy: "$policy-name||$tnl-policy-name"
      interface.access.pw.control_word: "kw:control-word=true|no-control-word=false"
      interface.access.pw.encapsulation: "kw:raw|tagged|ip-interworking|ip-layer2"
  # ---------- L2VPN：VPLS ----------
  - view: ^system$
    syntax: '^vsi <vsi-name>'
    maps:
      l2vpn.vsi: $vsi-name
      l2vpn.vsi.mode: "kw:static|auto"
      l2vpn.vsi.bd_mode: "if:bd-mode:true"
  - view: ^vsi$
    syntax: '^description <description>$'
    maps: {l2vpn.vsi.description: $description}
  - view: ^vsi$
    syntax: '^mtu <mtu>$'
    maps: {l2vpn.vsi.mtu: $mtu}
  - view: ^vsi$
    syntax: '^encapsulation (vlan|ethernet)$'
    maps: {l2vpn.vsi.encapsulation: "kw:vlan|ethernet"}
  - view: ^vsi$
    syntax: '^tnl-policy <policy-name>$'
    maps: {l2vpn.vsi.tunnel_policy: $policy-name}
  - view: ^vsi$
    syntax: '^pwsignal (ldp|bgp)$'
    maps: {l2vpn.vsi.signaling: "kw:ldp|bgp"}
  - view: ^vsi-ldp$
    syntax: '^vsi-id <vsi-id>$'
    maps: {l2vpn.vsi.vsi_id: $vsi-id}
  - view: ^vsi-ldp$
    syntax: '^peer <peer-address> \[ negotiation-vc-id'
    maps:
      l2vpn.vsi.peer: $peer-address
      l2vpn.vsi.peer.vc_id: "$vc-id||$pwIdValue"
      l2vpn.vsi.peer.tunnel_policy: $policy-name
      l2vpn.vsi.peer.encapsulation: "kw:vlan|ethernet"
  - view: ^interface$
    syntax: '^l2 binding vsi <vsi-name>'
    maps: {interface.vsi: $vsi-name}
  - view: ^bridge-domain$
    syntax: '^l2 binding vsi <vsi-name>'
    maps: {bridge_domain.vsi: $vsi-name}
  - view: ^bridge-domain$
    syntax: '^description <description>$'
    maps: {bridge_domain.description: $description}

  # ---------- ACL ----------
  # 编号 ACL：编号范围决定类型（2000–2999 基本、3000–3999 高级……），命中的是参数范围对应的那张卡
  - view: ^system$
    syntax: '^acl \[ number \] <basic-acl-number>'
    maps: {acl.instance: $basic-acl-number, acl.instance.type: basic, acl.instance.match_order: "kw:config|auto"}
  - view: ^system$
    syntax: '^acl \[ number \] <advance-acl-number>'
    maps: {acl.instance: $advance-acl-number, acl.instance.type: advanced, acl.instance.match_order: "kw:config|auto"}
  - view: ^system$
    syntax: '^acl \[ number \] <interface-based-acl-number>'
    maps: {acl.instance: $interface-based-acl-number, acl.instance.type: interface, acl.instance.match_order: "kw:config|auto"}
  - view: ^system$
    syntax: '^acl \[ number \] <link-acl-number>'
    maps: {acl.instance: $link-acl-number, acl.instance.type: link, acl.instance.match_order: "kw:config|auto"}
  - view: ^system$
    syntax: '^acl \[ number \] <mpls-acl-number>'
    maps: {acl.instance: $mpls-acl-number, acl.instance.type: mpls}
  # 命名 ACL：acl name 名称 basic|advance [ number 编号 ]；只写名称时是高级 ACL
  - view: ^system$
    syntax: '^acl name <basic-acl-name>'
    maps: {acl.instance: $basic-acl-name, acl.instance.type: basic, acl.instance.number: $basic-acl-number, acl.instance.match_order: "kw:config|auto"}
  - view: ^system$
    syntax: '^acl name <advance-acl-name>'
    maps: {acl.instance: $advance-acl-name, acl.instance.type: advanced, acl.instance.number: $advance-acl-number, acl.instance.match_order: "kw:config|auto"}
  - view: ^system$
    syntax: '^acl name <interface-based-acl-name>'
    maps: {acl.instance: $interface-based-acl-name, acl.instance.type: interface, acl.instance.number: $interface-based-acl-number, acl.instance.match_order: "kw:config|auto"}
  - view: ^system$
    syntax: '^acl name <link-acl-name>'
    maps: {acl.instance: $link-acl-name, acl.instance.type: link, acl.instance.number: $link-acl-number, acl.instance.match_order: "kw:config|auto"}
  - view: ^system$
    syntax: '^acl name <mpls-acl-name>'
    maps: {acl.instance: $mpls-acl-name, acl.instance.type: mpls, acl.instance.number: $mpls-acl-number}
  - view: ^acl$
    syntax: '^description <text>$'
    maps: {acl.instance.description: $text}
  - view: ^acl$
    syntax: '^step <step-value>$'
    maps: {acl.instance.step: $step-value}
  - view: ^acl$
    syntax: '^rule <rule-id> description <destext>$'
    maps: {acl.instance.rule: $rule-id, acl.instance.rule.description: $destext}
  # 基本 ACL 规则：源地址 + 反掩码（0 记为 0.0.0.0；不写源地址即 any）
  - view: ^acl$
    syntax: '^rule \[ <rule-id> \] \[ name <rule-name> \] \{ permit \| deny \} \[ \[ fragment-type'
    maps:
      acl.instance.rule: $rule-id
      acl.instance.rule.action: "kw:permit|deny"
      acl.instance.rule.name: $rule-name
      acl.instance.rule.source_ip: "$source-ip-address||any"
      acl.instance.rule.source_wildcard: "$source-wildcard||$src-netmask||if:$source-ip-address:0.0.0.0"
      acl.instance.rule.vrf: $vpn-instance-name
  # 高级 ACL 规则（IP / ICMP / TCP / UDP 各一张卡）：协议、源、目的、端口条件（修正文件把源 / 目的端口拆成各自的参数，
  # 写法与 Cisco 一致：eq 22、range 1000 2000）
  - view: ^acl$
    syntax: '^rule \[ <rule-id> \] \[ name <rule-name> \] \{ permit \| deny \} \{ '
    maps:
      acl.instance.rule: $rule-id
      acl.instance.rule.action: "kw:permit|deny"
      acl.instance.rule.name: $rule-name
      acl.instance.rule.protocol: "kw:zero|gre|igmp|ip|ipinip|ospf|icmp|tcp|udp||$protocol||$7-16||$18-255||$1||$6||$17"
      acl.instance.rule.source_ip: "$source-ip-address||any"
      acl.instance.rule.source_wildcard: "$source-wildcard||$src-netmask||if:$source-ip-address:0.0.0.0"
      acl.instance.rule.destination_ip: "$destination-ip-address||any"
      acl.instance.rule.destination_wildcard: "$destination-wildcard||$des-netmask||if:$destination-ip-address:0.0.0.0"
      acl.instance.rule.source_port: "fmt:{src-port-op} {src-port}||if:$src-port-begin:fmt:range {src-port-begin} {src-port-end}"
      acl.instance.rule.destination_port: "fmt:{dst-port-op} {dst-port}||if:$dst-port-begin:fmt:range {dst-port-begin} {dst-port-end}"
      acl.instance.rule.vrf: $vpn-instance-name
  - view: ^route-policy$
    syntax: '^if-match acl \{ <acl-number> \| <acl-name> \}$'
    maps: {rp.policy.node.match_acl: "$acl-number||$acl-name"}
