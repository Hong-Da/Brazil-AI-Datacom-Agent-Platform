version 17.15
hostname PE-CS
!
vrf definition RAN
 rd 65000:10
 address-family ipv4
  route-target both 65000:10
 exit-address-family
!
interface GigabitEthernet0/0/1
 description UPLINK
 mtu 9000
 vrf forwarding RAN
 ip address 10.0.0.1 255.255.255.252
!
interface Loopback0
 ip address 10.255.0.1 255.255.255.255
!
ip route vrf RAN 172.20.0.0 255.255.0.0 10.0.0.2
!
end
