hostname PE-ASR920-12
!
vrf definition RAN-3G
 rd 64512:103
 !
 address-family ipv4
  route-target export 64512:103
  route-target import 64512:103
 exit-address-family
!
vrf definition MGMT
 rd 64512:10
 !
 address-family ipv4
  route-target export 64512:10
  route-target import 64512:10
 exit-address-family
!
interface Loopback0
 ip address 10.255.0.32 255.255.255.255
!
interface GigabitEthernet0/0/0
 mtu 9216
 ip address 10.1.0.26 255.255.255.252
 mpls ip
!
interface GigabitEthernet0/0/1
 description RAN-SITE-012
 no ip address
 service instance 201 ethernet
  encapsulation dot1q 201
  rewrite ingress tag pop 1 symmetric
  bridge-domain 201
 !
 service instance 202 ethernet
  encapsulation dot1q 202
  rewrite ingress tag pop 1 symmetric
  bridge-domain 202
 !
!
interface BDI201
 description X
 vrf forwarding RAN-3G
 ip address 172.16.12.1 255.255.255.0
!
interface BDI202
 description Y
 vrf forwarding MGMT
 ip address 172.17.12.1 255.255.255.240
!
router bgp 64512
 bgp router-id 10.255.0.32
 bgp log-neighbor-changes
 neighbor RR peer-group
 neighbor RR remote-as 64512
 neighbor RR update-source Loopback0
 neighbor 10.255.0.1 peer-group RR
 neighbor 10.255.0.2 peer-group RR
 !
 address-family vpnv4
  neighbor RR send-community extended
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.2 activate
 exit-address-family
 !
 address-family ipv4 vrf RAN-3G
  redistribute connected
 exit-address-family
 !
 address-family ipv4 vrf MGMT
  redistribute connected
 exit-address-family
!
end
