!
version 17.15
hostname PE-CHECK-02
!
vrf definition NO-RT
 rd 64512:1
 !
 address-family ipv4
 exit-address-family
!
vrf definition UNUSED-VRF
 rd 64512:3
 !
 address-family ipv4
  route-target export 64512:3
 exit-address-family
!
interface GigabitEthernet0/0/1
 vrf forwarding NO-RT
!
interface GigabitEthernet0/0/2
 channel-group 1 mode active
 ip address 192.0.2.9 255.255.255.252
!
router bgp 64512
 neighbor EXT peer-group
 neighbor SPARE peer-group
 neighbor SPARE remote-as 64512
 neighbor 192.0.2.2 peer-group EXT
 neighbor 192.0.2.6 remote-as 64513
 !
 address-family ipv4
  neighbor 192.0.2.6 activate
  neighbor 192.0.2.6 route-map MISSING-MAP in
  neighbor 192.0.2.6 route-map USED-MAP out
 exit-address-family
!
ip prefix-list ONLY-UNUSED seq 5 permit 10.0.0.0/8
ip prefix-list SHARED seq 5 permit 10.1.0.0/16
ip prefix-list EMPTY description placeholder
ip community-list standard UNUSED-COMM permit 64512:100
!
route-map UNUSED-MAP permit 10
 match ip address prefix-list ONLY-UNUSED
!
route-map UNUSED-MAP deny 20
 match ip address prefix-list SHARED
!
route-map USED-MAP permit 10
 match ip address prefix-list SHARED
!
route-map USED-MAP permit 20
 match ip address prefix-list EMPTY
!
end
