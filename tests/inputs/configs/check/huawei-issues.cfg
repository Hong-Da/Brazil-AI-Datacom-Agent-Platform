!Software Version V800R023C00SPC500
#
sysname PE-CHECK-01
#
ip vpn-instance NO-RT
 ipv4-family
  route-distinguisher 65000:1
#
ip vpn-instance NO-RD
 ipv4-family
  vpn-target 65000:2 export-extcommunity
#
ip vpn-instance UNUSED-VRF
 ipv4-family
  route-distinguisher 65000:3
  vpn-target 65000:3 export-extcommunity
#
ip vpn-instance BGP-ONLY
 ipv4-family
  route-distinguisher 65000:4
  vpn-target 65000:4 export-extcommunity
#
bridge-domain 300
#
bridge-domain 400
#
interface GigabitEthernet0/2/1
 portswitch
 ip address 192.0.2.1 255.255.255.0
#
interface GigabitEthernet0/2/2
 ip binding vpn-instance NO-RT
#
interface GigabitEthernet0/2/3
 eth-trunk 1
 ip address 192.0.2.9 255.255.255.252
#
interface GigabitEthernet0/2/4
 ip binding vpn-instance NO-RD
 ip address 192.0.2.13 255.255.255.252
#
interface Vbdif400
 ip address 192.0.2.17 255.255.255.252
#
bgp 65000
 group EXT external
 group SPARE internal
 peer 192.0.2.2 group EXT
 peer 192.0.2.6 as-number 65001
 #
 ipv4-family unicast
  peer 192.0.2.6 route-policy MISSING-POLICY import
  peer 192.0.2.6 route-policy USED-POLICY export
  ingress-lsp trigger route-policy NH-POLICY
 #
 ipv4-family vpn-instance BGP-ONLY
  import-route direct
#
ip ip-prefix ONLY-UNUSED index 10 permit 10.0.0.0 8
ip ip-prefix SHARED index 10 permit 10.1.0.0 16
ip ip-prefix USED-LIST index 10 permit 10.2.0.0 16
#
route-policy UNUSED-POLICY permit node 10
 if-match ip-prefix ONLY-UNUSED
#
route-policy UNUSED-POLICY permit node 20
 if-match ip-prefix SHARED
#
route-policy USED-POLICY permit node 10
 if-match ip-prefix SHARED
#
route-policy USED-POLICY permit node 20
 if-match ip-prefix USED-LIST
#
route-policy NH-POLICY permit node 10
#
return
