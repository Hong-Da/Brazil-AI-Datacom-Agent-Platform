auth = true
body = { text = "sysname R1\n#\nbgp 65000\n peer 10.0.0.1 as-number 65001\n#\nreturn" }
expect_status = 200
expect_json = { "code" = 0, "data.text" = "sysname R1\n#\nbgp 65000\n peer 10.0.0.1 as-number 65001\n#\nreturn" }
