[[case]]
id = "parse-text"
title = { zh-CN = "解析配置文本", en = "Parse config text", pt-BR = "Analisar texto de configuração" }
method = "POST"
path = "/api/v1/parse"
setup = "configured-fullkb"
auth = true
body = { text = "hostname R1\n!\nrouter bgp 65000\n neighbor 10.0.0.2 remote-as 65001\n!\nend" }
expect_status = 200
expect_json = { "code" = 0, "data.profile" = "cisco-iosxe-asr920-17.15", "data.counts.command" = 2, "data.counts.raw" = 1 }
in_docs = true

