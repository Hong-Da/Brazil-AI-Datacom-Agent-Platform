[[case]]
id = "roundtrip-text"
title = { zh-CN = "往返测试一段配置", en = "Round-trip config text", pt-BR = "Ida e volta de um texto" }
method = "POST"
path = "/api/v1/roundtrip"
setup = "configured-fullkb"
auth = true
body = { text = "sysname R1\n#\nip vpn-instance RAN\n ipv4-family\n  route-distinguisher 65000:1\n#\nreturn" }
expect_status = 200
expect_json = { "code" = 0, "data.ok" = true, "data.unknown" = 0 }
in_docs = true

