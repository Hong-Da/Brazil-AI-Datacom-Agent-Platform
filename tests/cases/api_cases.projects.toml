[[case]]
id = "projects-get-owner-ref"
title = { zh-CN = "写成 属主/标识（路径里编码为 %2F）访问别人的同名项目", en = "owner/slug (encoded as %2F in the path) reaches the other owner's project", pt-BR = "dono/identificador (codificado como %2F no caminho) acessa o projeto do outro dono" }
method = "GET"
path = "/api/v1/projects/carol%2Flab"
setup = "configured-samename"
login = ["bob", "Bob-pass-12"]
expect_status = 200
expect_json = { "code" = 0, "data.owner" = "carol", "data.ref" = "carol/lab", "data.role" = "read" }
in_docs = true

[[case]]
id = "projects-get-ambiguous"
title = { zh-CN = "只写标识而能访问的同名项目有多个：409，列出候选", en = "Bare slug matching several accessible projects: 409 with candidates", pt-BR = "Identificador ambíguo: 409 com os candidatos" }
method = "GET"
path = "/api/v1/projects/lab/devices"
setup = "configured-samename"
login = ["bob", "Bob-pass-12"]
expect_status = 409
expect_json = { "code" = 1003, "data.candidates.0" = "alice/lab", "data.candidates.1" = "carol/lab" }
in_docs = true
