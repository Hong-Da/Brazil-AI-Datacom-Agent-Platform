[[case]]
id = "projects-create-same-slug-other-owner"
title = { zh-CN = "别人已有同名项目也可以新建（标识按属主唯一）", en = "Another owner's project may use the same slug (slugs are unique per owner)", pt-BR = "Outro dono pode usar o mesmo identificador (único por dono)" }
