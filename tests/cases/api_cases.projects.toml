# 用户工作空间与项目、权限、个人令牌（M6，REQ-035 / REQ-036）的 API 用例（加载器与主文件 api_cases.toml 合并）。
# 准备方式 configured-projects：管理员 admin / Admin-pass-1；alice / Alice-pass-1 是项目 lab 的属主（导入了 ATN-CHANGE-01，
# 引用公共设备 PE-CHANGE-01 并跟随最新版本）；bob / Bob-pass-12 是 lab 的只读成员；carol / Carol-pass-1 不是任何项目的成员。

[[case]]
id = "projects-list"
title = { zh-CN = "我的项目与共享给我的（属主的视角）", en = "My projects and those shared with me (owner view)", pt-BR = "Meus projetos e os compartilhados comigo (visão do dono)" }
method = "GET"
path = "/api/v1/projects"
setup = "configured-projects"
login = ["alice", "Alice-pass-1"]
expect_status = 200
expect_json = { "code" = 0, "data.mine.0.slug" = "lab", "data.mine.0.role" = "owner", "data.mine.0.counts.devices" = 2, "data.mine.0.counts.private" = 1, "data.mine.0.counts.refs" = 1, "data.default_project" = "lab" }
in_docs = true

[[case]]
id = "projects-list-shared"
title = { zh-CN = "只读成员看到共享给自己的项目", en = "A read-only member sees the shared project", pt-BR = "Um membro somente leitura vê o projeto compartilhado" }
