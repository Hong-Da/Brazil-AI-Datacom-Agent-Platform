# 割接迁移 lmesh migrate 的 CLI 用例（加载器与主文件 cli_cases.toml 合并）。

[[case]]
id = "migrate-to-dir"
title = { zh-CN = "ASR 920 迁移到 ATN（新设备有出厂配置），输出目录里放新配置、增量配置、映射表、告警与步骤", en = "Migrate an ASR 920 to an ATN with an existing configuration, writing the output directory", pt-BR = "Migrar um ASR 920 para um ATN com configuração existente, gravando o diretório de saída" }
args = ["--output", "json", "migrate", "{samples}/cisco-iosxe-asr920-synthetic/pe-asr920-01.cfg", "--to", "huawei-atn-v800r025", "--target-config", "{samples}/migration/atn-factory.cfg", "-o", "{out}/mig"]
setup = "fresh-fullkb"
expect_exit = 0
expect_json = { "ok" = true, "data.source.profile" = "cisco-iosxe-asr920-17.15", "data.target.existing" = true, "data.inventory.source" = "target_config", "data.verify.unexplained" = 0, "data.interface_map.0.source" = "BDI101", "data.interface_map.0.target" = "Vbdif101", "data.interface_map.0.basis" = "logical", "data.steps.0.key" = "migrate.step.precheck", "data.files.0" = "delta.cfg", "data.files.1" = "interface-map.csv" }
in_docs = true

[[case]]
id = "migrate-text"
title = { zh-CN = "新配置写到标准输出，摘要、映射表、告警与割接步骤写到标准错误（部分映射表，其余自动建议）", en = "New configuration on stdout; summary, map, warnings and steps on stderr", pt-BR = "Nova configuração na saída padrão; resumo, tabela, avisos e passos no erro padrão" }
args = ["--lang", "zh-CN", "migrate", "{samples}/huawei-atn-v800r023/atn-access-01.cfg", "--to", "cisco-iosxe-asr920-17.15", "--model", "ASR-920-24SZ-M", "--interface-map", "{samples}/migration/atn-to-asr920.partial.yaml"]
setup = "fresh-fullkb"
expect_exit = 0
expect_stdout = ["interface Port-channel1", "interface GigabitEthernet0/0/0", "end"]
expect_stderr = ["校验通过", "同速率、同端口号", "管理口，不迁移", "速率不一致", "按接口映射表迁移"]
in_docs = true

[[case]]
id = "migrate-suggest-only"
title = { zh-CN = "只给接口映射建议", en = "Interface map suggestion only", pt-BR = "Somente sugestão de tabela de interfaces" }
args = ["--output", "json", "migrate", "{samples}/huawei-atn-v800r025-synthetic/atn-mpls-l2vpn-acl-01.cfg", "--to", "huawei-atn-v800r025", "--target-config", "{samples}/migration/atn-other-model.cfg", "--suggest-only"]
setup = "fresh-fullkb"
expect_exit = 0
expect_json = { "ok" = true, "data.map.0.source" = "GigabitEthernet0/2/1", "data.map.0.target" = "GigabitEthernet0/1/1", "data.map.0.basis" = "same_index", "data.map.0.confidence" = 0.8, "data.unmapped" = [] }
in_docs = true

[[case]]
id = "migrate-bad-model"
title = { zh-CN = "型号不在端口清单中", en = "Unknown model", pt-BR = "Modelo desconhecido" }
args = ["migrate", "{samples}/cisco-iosxe-asr920-synthetic/pe-asr920-01.cfg", "--to", "cisco-iosxe-asr920-17.15", "--model", "NOPE"]
setup = "fresh-fullkb"
expect_exit = 2

[[case]]
id = "migrate-target-missing"
title = { zh-CN = "新设备现有配置文件不存在", en = "Existing configuration file not found", pt-BR = "Arquivo de configuração existente não encontrado" }
args = ["migrate", "{samples}/cisco-iosxe-asr920-synthetic/pe-asr920-01.cfg", "--to", "huawei-atn-v800r025", "--target-config", "{out}/nope.cfg"]
setup = "fresh-fullkb"
expect_exit = 4
