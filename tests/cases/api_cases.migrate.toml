# 割接迁移接口的 API 用例（加载器与主文件 api_cases.toml 合并）。

[[case]]
id = "migrate-text"
title = { zh-CN = "Cisco 设备迁移到华为（新设备已有管理口与端口，只生成增量；端口冲突以旧设备为准）", en = "Migrate a Cisco device to Huawei with an existing configuration", pt-BR = "Migrar um equipamento Cisco para Huawei com configuração existente" }
method = "POST"
path = "/api/v1/migrate"
setup = "configured-fullkb"
auth = true
body = { text = "hostname R1\n!\ninterface GigabitEthernet0/0/1\n description UPLINK\n mtu 9000\n ip address 10.0.0.1 255.255.255.252\n!\ninterface Port-channel1\n ip address 10.0.1.1 255.255.255.252\n!\nip route 0.0.0.0 0.0.0.0 10.0.0.2\n!\nend", to = "huawei-atn-v800r025", target_text = "#\nsysname NEW-01\n#\ninterface Ethernet0/0/0\n ip address 192.168.1.10 255.255.255.0\n#\ninterface GigabitEthernet0/2/1\n shutdown\n#\nreturn" }
expect_status = 200
expect_json = { "code" = 0, "data.target.existing" = true, "data.inventory.source" = "target_config", "data.interface_map.0.source" = "GigabitEthernet0/0/1", "data.interface_map.0.target" = "GigabitEthernet0/2/1", "data.interface_map.0.basis" = "same_index", "data.interface_map.1.target" = "Eth-Trunk1", "data.verify.checked" = true, "data.verify.unexplained" = 0, "data.merge.conflicts" = 1, "data.steps.1.key" = "migrate.step.load_delta" }
in_docs = true

[[case]]
id = "migrate-suggest-map"
title = { zh-CN = "接口映射建议（按知识库的端口清单，附依据与置信度）", en = "Interface map suggestion from the port inventory", pt-BR = "Sugestão de tabela de interfaces pelo inventário de portas" }
method = "POST"
path = "/api/v1/migrate/suggest-map"
setup = "configured-fullkb"
auth = true
body = { text = "#\nsysname OLD\n#\ninterface GigabitEthernet0/2/1\n ip address 10.0.0.1 255.255.255.252\n#\ninterface Ethernet0/0/0\n ip address 192.168.1.2 255.255.255.0\n#\nreturn", to = "cisco-iosxe-asr920-17.15", model = "ASR-920-12CZ-A" }
expect_status = 200
expect_json = { "code" = 0, "data.inventory.model" = "ASR-920-12CZ-A", "data.map.0.target" = "GigabitEthernet0/0/1", "data.map.0.basis" = "same_index", "data.map.0.confidence" = 0.8, "data.unmapped.0.source" = "Ethernet0/0/0", "data.unmapped.0.reason" = "management" }
in_docs = true

[[case]]
id = "migrate-no-source"
title = { zh-CN = "没有给出旧设备配置", en = "No source", pt-BR = "Sem origem" }
method = "POST"
path = "/api/v1/migrate"
setup = "configured"
auth = true
body = { to = "huawei-atn-v800r025" }
expect_status = 422
expect_json = { "code" = 1001 }

[[case]]
id = "migrate-bad-conflict"
title = { zh-CN = "冲突处理方式无效", en = "Invalid conflict handling", pt-BR = "Tratamento de conflito inválido" }
method = "POST"
path = "/api/v1/migrate"
setup = "configured-fullkb"
auth = true
body = { text = "hostname R1\n!\nend", to = "huawei-atn-v800r025", on_conflict = "bad" }
expect_status = 422
expect_json = { "code" = 1001 }

[[case]]
id = "migrate-no-token"
title = { zh-CN = "没有令牌", en = "No token", pt-BR = "Sem token" }
method = "POST"
path = "/api/v1/migrate/suggest-map"
setup = "configured"
auth = false
body = { text = "hostname R1", to = "huawei-atn-v800r025" }
expect_status = 401
