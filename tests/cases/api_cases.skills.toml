[[case]]
id = "skills-evolve-forbidden"
title = { zh-CN = "普通账号不能发起进化（403）", en = "Ordinary accounts cannot start an evolution (403)", pt-BR = "Contas comuns não iniciam evolução (403)" }
method = "POST"
path = "/api/v1/ai/skills/ask-query/evolve"
setup = "configured-users"
login = ["alice", "Alice-pass-1"]
body = {}
expect_status = 403
expect_json = { "code" = 1006 }

[[case]]
id = "skills-approve-missing"
title = { zh-CN = "批准不存在的进化", en = "Approve a missing evolution", pt-BR = "Aprovar evolução inexistente" }
method = "POST"
path = "/api/v1/ai/skills/ask-query/evolutions/1/approve"
setup = "configured"
auth = true
body = {}
expect_status = 404
expect_json = { "code" = 1004 }

[[case]]
id = "skills-feedback-user"
title = { zh-CN = "反馈对普通账号开放：调用记录不存在时 404", en = "Feedback is open to ordinary accounts: 404 for an unknown call", pt-BR = "Avaliação aberta a contas comuns: 404 para chamada desconhecida" }
method = "POST"
path = "/api/v1/ai/skills/feedback"
setup = "configured-users"
login = ["alice", "Alice-pass-1"]
body = { run_id = 999, rating = "up" }
expect_status = 404
expect_json = { "code" = 1004 }
