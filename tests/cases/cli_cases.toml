# CLI 用例：测试读取并执行；in_docs = true 的用例同时生成 docs/cli.md 的示例。
# setup：fresh = 未配置的新目录；configured = 已完成首次配置（SQLite、固定令牌）。
# expect_json 按字段路径检查 --output json 的结果；expect_stdout / expect_stderr 检查包含的文字。

[[case]]
id = "version"
title = { zh-CN = "查看版本", en = "Show the version", pt-BR = "Mostrar a versão" }
args = ["--version"]
setup = "fresh"
expect_exit = 0
expect_stdout = ["lmesh "]
in_docs = true

[[case]]
id = "status-json"
title = { zh-CN = "查看运行状态（JSON）", en = "Show status (JSON)", pt-BR = "Mostrar o status (JSON)" }
args = ["--output", "json", "status"]
setup = "configured"
expect_exit = 0
expect_json = { "ok" = true, "data.configured" = true, "data.database.backend" = "sqlite", "data.database.ok" = true }
in_docs = true

[[case]]
id = "status-text-zh"
title = { zh-CN = "查看运行状态（中文）", en = "Show status (Chinese)", pt-BR = "Mostrar o status (chinês)" }
args = ["--lang", "zh-CN", "status"]
setup = "configured"
expect_exit = 0
expect_stdout = ["版本", "数据库"]

[[case]]
id = "status-text-en"
title = { zh-CN = "查看运行状态（英文）", en = "Show status (English)", pt-BR = "Mostrar o status (inglês)" }
args = ["--lang", "en", "status"]
setup = "configured"
expect_exit = 0
expect_stdout = ["Version", "Database"]

[[case]]
id = "status-text-pt"
title = { zh-CN = "查看运行状态（葡萄牙语）", en = "Show status (Portuguese)", pt-BR = "Mostrar o status (português)" }
args = ["--lang", "pt-BR", "status"]
setup = "configured"
expect_exit = 0
expect_stdout = ["Versão", "não configurada"]

[[case]]
id = "bad-output"
title = { zh-CN = "错误的输出格式", en = "Invalid output format", pt-BR = "Formato de saída inválido" }
args = ["--output", "xml", "status"]
setup = "fresh"
expect_exit = 2
expect_stderr = ["--output"]
in_docs = true

[[case]]
id = "setup-defaults"
title = { zh-CN = "非交互地完成首次配置（采用默认值与环境变量）", en = "Non-interactive setup with defaults and env vars", pt-BR = "Configuração não interativa com padrões e variáveis de ambiente" }
args = ["--output", "json", "setup", "--defaults"]
setup = "fresh"
env = { LMESH_SERVER__PORT = "9123" }
expect_exit = 0
expect_json = { "ok" = true, "data.token_generated" = true }
in_docs = true

[[case]]
id = "setup-again"
title = { zh-CN = "已配置时再次运行向导", en = "Run setup when already configured", pt-BR = "Executar a configuração já configurada" }
args = ["setup", "--defaults"]
setup = "configured"
expect_exit = 3
expect_stderr = ["--force"]
in_docs = true

[[case]]
id = "config-show"
title = { zh-CN = "查看生效的配置（敏感值只显示是否已设置）", en = "Show the effective configuration", pt-BR = "Mostrar a configuração efetiva" }
args = ["--output", "json", "config", "show"]
setup = "configured"
expect_exit = 0
expect_json = { "data.values.security.api_token" = true, "data.sources.server.port" = "file" }
in_docs = true

[[case]]
id = "db-upgrade"
title = { zh-CN = "升级数据库结构", en = "Migrate the database", pt-BR = "Migrar o banco de dados" }
args = ["--output", "json", "db", "upgrade"]
setup = "configured"
expect_exit = 0
expect_json = { "data.backend" = "sqlite" }
in_docs = true

[[case]]
id = "sanitize-file"
title = { zh-CN = "脱敏单个配置文件（严格模式）", en = "Sanitize one config (strict)", pt-BR = "Anonimizar uma configuração (estrito)" }
args = ["--output", "json", "sanitize", "{inputs}/configs/huawei/basic.cfg", "-o", "{out}/basic.cfg", "--level", "strict"]
setup = "configured"
expect_exit = 0
expect_json = { "data.files.0.vendor" = "huawei", "data.files.0.ok" = true }
in_docs = true

[[case]]
id = "sanitize-missing"
title = { zh-CN = "输入文件不存在", en = "Input file not found", pt-BR = "Arquivo de entrada inexistente" }
args = ["sanitize", "{inputs}/configs/no-such.cfg", "-o", "{out}/x.cfg"]
setup = "configured"
expect_exit = 4
expect_stderr = ["no-such.cfg"]
in_docs = true

[[case]]
id = "sanitize-bad-level"
title = { zh-CN = "错误的脱敏强度", en = "Invalid sanitize level", pt-BR = "Nível de anonimização inválido" }
args = ["sanitize", "{inputs}/configs/huawei/basic.cfg", "-o", "{out}/x.cfg", "--level", "max"]
setup = "configured"
expect_exit = 2
expect_stderr = ["basic"]

[[case]]
id = "import-dir"
title = { zh-CN = "导入整个目录（无法识别的文件单独报告）", en = "Import a folder (unrecognized files reported)", pt-BR = "Importar uma pasta (arquivos não reconhecidos são relatados)" }
args = ["--output", "json", "config", "import", "{inputs}/configs"]
setup = "configured"
expect_exit = 0
expect_json = { "data.files.0.ok" = false, "data.files.2.vendor" = "cisco", "data.files.3.profile" = "huawei-atn-v800r023" }
in_docs = true

[[case]]
id = "import-not-configured"
title = { zh-CN = "未配置时导入", en = "Import before setup", pt-BR = "Importar antes da configuração" }
args = ["config", "import", "{inputs}/configs/huawei/basic.cfg"]
setup = "fresh"
expect_exit = 3
expect_stderr = ["setup"]

[[case]]
id = "config-list-empty"
title = { zh-CN = "还没有导入时列出设备", en = "List devices when nothing is imported", pt-BR = "Listar dispositivos sem importações" }
args = ["--lang", "pt-BR", "config", "list"]
setup = "configured"
expect_exit = 0
expect_stdout = ["Nenhuma configuração ainda"]

[[case]]
id = "kb-validate"
title = { zh-CN = "校验知识库", en = "Validate the knowledge base", pt-BR = "Validar a base de conhecimento" }
args = ["--output", "json", "kb", "validate"]
setup = "configured"
expect_exit = 0
expect_json = { "data.errors" = 0, "data.counts.profiles" = 3 }
in_docs = true

[[case]]
id = "kb-release"
title = { zh-CN = "发布知识库版本（版本号按差异自动建议）", en = "Publish a knowledge base release", pt-BR = "Publicar uma versão da base" }
args = ["--output", "json", "kb", "release", "-m", "primeira versão"]
setup = "configured"
expect_exit = 0
expect_json = { "data.version" = "0.1.0", "data.tag" = "kb-v0.1.0" }
in_docs = true

[[case]]
id = "kb-coverage"
title = { zh-CN = "查看覆盖矩阵", en = "Show the coverage matrix", pt-BR = "Mostrar a matriz de cobertura" }
args = ["--output", "json", "kb", "coverage", "--profile", "huawei-atn-v800r023"]
setup = "configured"
expect_exit = 0
expect_json = { "data.profiles" = ["huawei-atn-v800r023"] }
in_docs = true

[[case]]
id = "kb-coverage-unknown"
title = { zh-CN = "不存在的 Profile", en = "Unknown profile", pt-BR = "Profile inexistente" }
args = ["kb", "coverage", "--profile", "nope"]
setup = "configured"
expect_exit = 4
expect_stderr = ["nope"]

[[case]]
id = "kb-diff-unknown"
title = { zh-CN = "对比不存在的版本", en = "Diff an unknown version", pt-BR = "Comparar versão inexistente" }
args = ["kb", "diff", "9.9.9"]
setup = "configured"
expect_exit = 4
expect_stderr = ["9.9.9"]
in_docs = true

[[case]]
id = "kb-import-missing"
title = { zh-CN = "导入不存在的知识库包", en = "Import a missing package", pt-BR = "Importar pacote inexistente" }
args = ["kb", "import", "{out}/nope.zip"]
setup = "configured"
expect_exit = 4
expect_stderr = ["nope.zip"]

[[case]]
id = "review-list-empty"
title = { zh-CN = "列出审核队列", en = "List the review queue", pt-BR = "Listar a fila de revisão" }
args = ["--output", "json", "review", "list"]
setup = "configured"
expect_exit = 0
expect_json = { "data.total" = 0 }
in_docs = true

[[case]]
id = "review-approve-missing"
title = { zh-CN = "通过不存在的审核条目", en = "Approve a missing item", pt-BR = "Aprovar item inexistente" }
args = ["--lang", "en", "review", "approve", "999"]
setup = "configured"
expect_exit = 1
expect_stderr = ["Review item not found"]

[[case]]
id = "kb-ingest"
title = { zh-CN = "导入产品文档并抽取命令卡", en = "Ingest product docs into command cards", pt-BR = "Importar documentação e extrair fichas de comando" }
args = ["--output", "json", "kb", "ingest", "{inputs}/docs/huawei", "--rules", "{inputs}/docs/rules-huawei-test.yaml", "--version", "V800R025C00SPC500"]
setup = "configured"
expect_exit = 0
expect_json = { "data.merge.new" = 4, "data.review_items" = 4, "data.skipped.excluded" = 1 }
in_docs = true

[[case]]
id = "kb-ingest-bad-rules"
title = { zh-CN = "抽取规则不存在", en = "Unknown extraction rules", pt-BR = "Regras de extração inexistentes" }
args = ["kb", "ingest", "{inputs}/docs/huawei", "--rules", "no-such-rules"]
setup = "configured"
expect_exit = 4
expect_stderr = ["no-such-rules"]
in_docs = true

[[case]]
id = "kb-ingest-ai-not-configured"
title = { zh-CN = "未配置 AI 时要求 AI 通道", en = "AI channel without AI configured", pt-BR = "Canal de IA sem IA configurada" }
