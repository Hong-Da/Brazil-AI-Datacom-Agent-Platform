setup = "configured"
expect_exit = 3
expect_stderr = ["IA"]

[[case]]
id = "review-approve-all"
title = { zh-CN = "批量通过命令卡（无可通过的条目时）", en = "Batch approve cards (nothing pending)", pt-BR = "Aprovar fichas em lote (nada pendente)" }
args = ["--output", "json", "--yes", "review", "approve-all", "--kind", "card"]
setup = "configured"
expect_exit = 0
expect_json = { "data.approved" = 0 }
in_docs = true

[[case]]
id = "ai-test-not-configured"
title = { zh-CN = "测试 AI 接口（未配置）", en = "Test AI (not configured)", pt-BR = "Testar IA (não configurada)" }
args = ["ai", "test"]
setup = "configured"
expect_exit = 3
expect_stderr = ["AI"]
in_docs = true

[[case]]
id = "ai-calls-empty"
title = { zh-CN = "AI 调用记录", en = "AI call log", pt-BR = "Registro de chamadas de IA" }
args = ["--output", "json", "ai", "calls"]
setup = "configured"
