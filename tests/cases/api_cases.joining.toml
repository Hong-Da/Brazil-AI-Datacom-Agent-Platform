setup = "configured-joining"
login = ["carol", "Carol-pass-1"]
body = { reason = "负责 IP RAN 扩容" }
expect_status = 200
expect_json = { "code" = 0, "data.status" = "pending", "data.username" = "carol" }
in_docs = true

[[case]]
id = "joining-admin-create-requests"
