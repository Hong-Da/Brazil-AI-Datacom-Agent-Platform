# 创建项目的权限与加入项目（M9-8，REQ-050）的 API 用例（加载器与主文件 api_cases.toml 合并）。
# 准备方式 configured-joining：在 configured-projects 之上关闭“普通用户可以创建项目”；alice 的 lab 可被搜索；
# erin / Erin-pass-12 是 lab 的“管理”成员，bob / Bob-pass-12 是只读成员；carol / Carol-pass-1 已申请加入 lab（申请 1）；
# dave / Dave-pass-12 没有任何项目，已申请创建权限（申请 1）；lab 有两个邀请链接：
# lmi_test-invite-token-0001（只读，直接加入）与 lmi_test-invite-token-0002（可编辑，仍需审批）。
# 路径里“属主/标识”写成 属主~标识（或 属主%2F标识）。

[[case]]
id = "joining-create-forbidden"
title = { zh-CN = "没有创建权限时新建项目：403", en = "Creating a project without permission: 403", pt-BR = "Criar projeto sem permissão: 403" }
method = "POST"
path = "/api/v1/projects"
setup = "configured-joining"
login = ["dave", "Dave-pass-12"]
body = { name = "新园区" }
expect_status = 403
expect_json = { "code" = 1006 }
in_docs = true

[[case]]
id = "joining-workspace-no-project"
title = { zh-CN = "没有项目也不能创建：默认项目为 null", en = "No project and can’t create: default project is null", pt-BR = "Sem projeto e sem permissão: projeto padrão nulo" }
method = "GET"
path = "/api/v1/workspace"
setup = "configured-joining"
login = ["dave", "Dave-pass-12"]
expect_status = 200
expect_json = { "code" = 0, "data.can_create" = false }

[[case]]
id = "joining-legacy-no-project"
title = { zh-CN = "没有项目的账号调用旧的无项目接口：409", en = "Legacy endpoint for an account without projects: 409", pt-BR = "Endpoint legado para conta sem projetos: 409" }
method = "GET"
path = "/api/v1/devices"
setup = "configured-joining"
login = ["dave", "Dave-pass-12"]
expect_status = 409
expect_json = { "code" = 1003 }

[[case]]
id = "joining-create-permission"
title = { zh-CN = "我能否新建项目与我的创建权限申请", en = "Whether I can create projects, and my permission request", pt-BR = "Se posso criar projetos e meu pedido de permissão" }
method = "GET"
path = "/api/v1/me/create-permission"
setup = "configured-joining"
login = ["dave", "Dave-pass-12"]
expect_status = 200
expect_json = { "code" = 0, "data.can_create" = false, "data.open" = false, "data.request.status" = "pending" }
in_docs = true

[[case]]
id = "joining-create-request-duplicate"
