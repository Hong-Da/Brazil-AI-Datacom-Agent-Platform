path = "/api/v1/me/create-permission/request"
setup = "configured-joining"
login = ["dave", "Dave-pass-12"]
body = { reason = "再申请一次" }
expect_status = 409
expect_json = { "code" = 1003 }

[[case]]
id = "joining-create-request"
title = { zh-CN = "申请创建项目的权限（通知管理员）", en = "Ask for permission to create projects (notifies admins)", pt-BR = "Pedir permissão para criar projetos (avisa os administradores)" }
