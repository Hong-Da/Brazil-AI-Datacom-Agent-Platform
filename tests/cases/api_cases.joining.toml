in_docs = true

[[case]]
id = "joining-discover"
title = { zh-CN = "发现项目：只有名称、简介、属主、设备数与我的状态", en = "Discover projects: name, description, owner, device count and my status", pt-BR = "Descobrir projetos: nome, descrição, dono, nº de dispositivos e meu estado" }
