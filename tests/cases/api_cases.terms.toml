[[case]]
id = "kb-terms"
title = { zh-CN = "显示风格的术语表（华为 / Cisco）", en = "Display-style terms (Huawei / Cisco)", pt-BR = "Termos dos estilos de exibição (Huawei / Cisco)" }
method = "GET"
path = "/api/v1/kb/terms"
setup = "configured"
auth = true
expect_status = 200
expect_json = { "code" = 0, "data.default" = "huawei", "data.objects.vrf.instance.huawei.label.0" = "ip vpn-instance {name}", "data.objects.vrf.instance.cisco.label.0" = "vrf definition {name}" }
in_docs = true
