[[case]]
id = "ai-suggest-adopt-batch"
title = { zh-CN = "按类别批量采纳：只采纳校验通过的", en = "Adopt in bulk by category: only those that passed", pt-BR = "Adotar em lote por categoria: só as aprovadas" }
method = "POST"
path = "/api/v1/projects/alice~lab/ai/suggestions/adopt-batch"
setup = "configured-fullkb-suggest"
login = ["alice", "Alice-pass-1"]
body = { category = "view_hint", skill = "topology-roles" }
expect_status = 200
expect_json = { "code" = 0, "data.adopted" = [1, 2], "data.skipped.0.id" = 3, "data.skipped.0.check_status" = "reject" }
in_docs = true

