[[case]]
id = "cleanup-selected"
title = { zh-CN = "只清理选中的对象", en = "Clean up only the selected objects", pt-BR = "Limpar só os objetos selecionados" }
method = "POST"
path = "/api/v1/cleanup"
setup = "configured-fullkb"
auth = true
body = { text = "sysname R1\n#\nip vpn-instance RAN\n ipv4-family\n  route-distinguisher 65000:1\n#\nroute-policy UNUSED permit node 10\n#\nreturn", objects = ["rp.policy[UNUSED]", "vrf.instance[NOPE]"] }
expect_status = 200
expect_json = { "code" = 0, "data.selected" = true, "data.objects.0.node" = "rp.policy[UNUSED]", "data.commands.0.text" = "undo route-policy UNUSED node 10", "data.commands.0.fallback" = false, "data.skipped.0.node" = "vrf.instance[NOPE]", "data.skipped.0.reason" = "not_orphan", "data.verify.ok" = true }
in_docs = true

