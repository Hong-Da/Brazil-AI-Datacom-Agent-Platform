# M2-5：隐藏身份差异、检查规则的开关与级别、忽略检查发现、报告导出、按对象清理的 API 用例。
# 返回文件的报告接口与需要先导入设备的流程写在 tests/api/test_report_api.py（这里只放返回 JSON 的用例）。

[[case]]
id = "compare-hide-identity"
title = { zh-CN = "对比时隐藏设备身份差异（Router ID 不同不算差异）", en = "Hide identity differences (a different router ID is not a difference)", pt-BR = "Ocultar diferenças de identidade (router ID diferente não conta)" }
method = "POST"
path = "/api/v1/compare"
setup = "configured-fullkb"
auth = true
body = { a = { text = "hostname R1\nrouter bgp 64512\n bgp router-id 10.0.0.1\n neighbor 10.0.0.9 remote-as 64512\n", profile = "cisco-iosxe-asr920-17.15" }, b = { text = "hostname R2\nrouter bgp 64512\n bgp router-id 10.0.0.2\n neighbor 10.0.0.9 remote-as 64512\n", profile = "cisco-iosxe-asr920-17.15" }, hide_identity = true }
expect_status = 200
expect_json = { "code" = 0, "data.equal" = true, "data.summary.total" = 0, "data.summary.hidden_identity" = 1, "data.hidden_diffs.0.node" = "bgp.instance[64512]/router_id", "data.options.hide_identity" = true }
in_docs = true

[[case]]
id = "kb-rules-source"
title = { zh-CN = "规则列表带来源、开关与级别", en = "Rule list with source, switch and severity", pt-BR = "Lista de regras com origem, ativação e severidade" }
method = "GET"
path = "/api/v1/kb/rules"
setup = "configured"
auth = true
expect_status = 200
expect_json = { "code" = 0, "data.rules.0.id" = "ref.dangling", "data.rules.0.source" = "builtin", "data.rules.0.enabled" = true, "data.rules.0.severity" = "error", "data.rules.6.source" = "common.yaml" }

[[case]]
id = "rule-put-builtin"
title = { zh-CN = "停用一条内置检查并调整级别", en = "Disable a built-in check and change its severity", pt-BR = "Desativar uma verificação embutida e mudar a severidade" }
method = "PUT"
path = "/api/v1/kb/rules/ref.orphan"
setup = "configured"
auth = true
body = { enabled = false, severity = "info" }
expect_status = 200
expect_json = { "code" = 0, "data.id" = "ref.orphan", "data.enabled" = false, "data.severity" = "info", "data.default_severity" = "warning", "data.source" = "builtin" }
in_docs = true

[[case]]
id = "rule-put-custom"
title = { zh-CN = "调整知识库规则的级别（写回规则文件）", en = "Change a knowledge base rule's severity (written back to its file)", pt-BR = "Alterar a severidade de uma regra da base (gravada no arquivo)" }
method = "PUT"
path = "/api/v1/kb/rules/vrf.rd_without_rt"
setup = "configured"
auth = true
body = { severity = "error" }
expect_status = 200
expect_json = { "code" = 0, "data.severity" = "error", "data.enabled" = true, "data.source" = "common.yaml" }

[[case]]
id = "rule-put-missing"
